<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="app.name">途候 WayScope</title>

  <!-- PWA 元数据：全部内联，无任何外链资源 -->
  <meta name="description" content="" data-i18n-attr="content" data-i18n-key="app.description" />
  <meta name="theme-color" content="#1E9C8C" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="途候" data-i18n-attr="content" data-i18n-key="app.shortName" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='96'%20fill='%231E9C8C'/%3E%3Ccircle%20cx='256'%20cy='256'%20r='120'%20fill='none'%20stroke='%23ffffff'%20stroke-width='24'/%3E%3Cpath%20d='M256%2096v320M96%20256h320'%20stroke='%23ffffff'%20stroke-width='16'%20opacity='.85'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />

  <!-- 无障碍字号档位预置（防跳档）
       ES module 是 defer 的：等 src/ui/*.js 跑起来才去写 <html data-fs>，浏览器很可能
       已经按默认字号画过一帧 —— 用户会看到整页文字「先小后大」地跳一下。这段同步脚本在
       <head> 里直接读本机偏好把属性设上，比模块早那么一瞬间。
       ★键 'gs:v1:store:prefs' = core/cache.js 的 NS('gs:v1:') + store 的 prefs 键，
         tools/check.mjs 第 13 节会断言它与源码一致 —— 改命名空间必须连这里一起改。
       读不到 / 解析失败 / 值非法就**什么都不做**（模块顶层还会再应用一次），绝不抛异常。
       放大乘数全在 styles/tokens.css，这里不存任何数字。 -->
  <script>
    try {
      var gsPrefs = JSON.parse(localStorage.getItem('gs:v1:store:prefs') || '{}');
      var gsFs = gsPrefs && gsPrefs.v && gsPrefs.v.fontScale;
      if (gsFs === 'large' || gsFs === 'xlarge') document.documentElement.setAttribute('data-fs', gsFs);
    } catch (gsErr) { /* 读不到就交给模块顶层，不抛 */ }
  </script>
</head>
<body data-page="now">
  <!-- 顶部降级横幅：由 ui/now.js 填充，无降级时隐藏 -->
  <div id="banner" class="banner" hidden></div>

  <main id="app" class="app" aria-live="polite">
    <!-- 骨架屏在 app.js 挂载前由内联样式占位，避免白屏 -->
    <div class="skeleton-note" data-i18n="app.loading">正在装载…</div>
  </main>

  <!-- 关于与边界：文案全部来自 i18n，由 ui/app.js 的 applyI18n() 填充 -->
  <footer id="about" class="about">
    <h2 class="about-title" data-i18n="about.title">关于与边界</h2>
    <ul class="about-list">
      <!-- data-i18n 由 app.js 填充；这里保留中文兜底，保证无 JS 环境下列表不是空白 -->
      <li data-i18n="about.noCommercial">不商业化：自用工具，无广告、无第三方统计、无账号登录、无后端。</li>
      <li data-i18n="about.noE2ee">不做端到端加密同步：数据只存本机 localStorage，搬家靠导出 JSON。</li>
      <li data-i18n="about.noAlert">预警不采购数据源：本阶段不实现预警推送。</li>
    </ul>
    <p class="about-note" data-i18n="about.privacy">除六路数据源之外，本应用不向任何域名发起请求；你的坐标不会被上传到数据源以外的地方。</p>
  </footer>

  <!-- 底部自绘玻璃胶囊 Tab：选中态实心青 -->
  <nav class="tabbar" aria-label="主导航" data-i18n-aria="a11y.mainNav">
    <a class="tab" href="compass.html" data-i18n="tab.geo">地理</a>
    <a class="tab tab--active" href="index.html" aria-current="page" data-i18n="tab.climate">气候</a>
    <a class="tab" href="settings.html" data-i18n="tab.settings">我的</a>
  </nav>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
