<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="" data-i18n-attr="content" data-i18n-key="desc.selfcheck" />
  <title data-i18n="sc.title">数据源自检</title>

  <meta name="theme-color" content="#1E9C8C" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="地候" data-i18n-attr="content" data-i18n-key="app.shortName" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='96'%20fill='%231E9C8C'/%3E%3Ccircle%20cx='256'%20cy='256'%20r='120'%20fill='none'%20stroke='%23ffffff'%20stroke-width='24'/%3E%3Cpath%20d='M256%2096v320M96%20256h320'%20stroke='%23ffffff'%20stroke-width='16'%20opacity='.85'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />

  <!-- 无障碍字号档位预置（防跳档）
       ES module 是 defer 的：等 src/ui/*.js 跑起来才去写 <html data-fs>，浏览器很可能
       已经按默认字号画过一帧 —— 用户会看到整页文字「先小后大」地跳一下。这段同步脚本在
       <head> 里直接读本机偏好把属性设上，比模块早那么一瞬间。
       ★键 'gs:v1:store:prefs' = core/cache.js 的 NS('gs:v1:') + store 的 prefs 键，
         tools/check.mjs 第 13 节会断言它与源码一致 —— 改命名空间必须连这里一起改。
       读不到 / 解析失败 / 值非法就**什么都不做**（模块顶层还会再应用一次），绝不抛异常。
       放大乘数全在 styles/tokens.css，这里不存任何数字。 -->
  <script>
    try {
      var gsPrefs = JSON.parse(localStorage.getItem('gs:v1:store:prefs') || '{}');
      var gsFs = gsPrefs && gsPrefs.v && gsPrefs.v.fontScale;
      if (gsFs === 'large' || gsFs === 'xlarge') document.documentElement.setAttribute('data-fs', gsFs);
    } catch (gsErr) { /* 读不到就交给模块顶层，不抛 */ }
  </script>
</head>
<body data-page="selfcheck">
  <!-- 以下文案全部由 src/i18n/zh.js 提供，selfcheck.js 的 applyI18n() 在启动时填充 -->
  <header class="sc-head">
    <h1 class="sc-title" data-i18n="sc.title">数据源自检</h1>
    <p class="sc-sub" data-i18n="sc.subtitle">真机复验：逐源串行取样，瓦片做指纹去重判定</p>
  </header>

  <!-- 控制面板：网络类型手动点选 + 取样次数可调 -->
  <section class="panel" aria-label="自检参数" data-i18n-aria="a11y.checkParams">
    <div class="field">
      <span class="field-label" data-i18n="sc.networkType">网络类型</span>
      <div class="seg" id="network-type" role="group">
        <button type="button" class="seg-btn" data-value="wifi" data-i18n="sc.net.wifi">WiFi</button>
        <button type="button" class="seg-btn" data-value="cellular" data-i18n="sc.net.cellular">蜂窝</button>
        <button type="button" class="seg-btn seg-btn--active" data-value="unknown" data-i18n="sc.net.unknown">未知</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label" data-i18n="sc.samples">取样次数</span>
      <div class="seg" id="sample-count" role="group">
        <button type="button" class="seg-btn" data-value="1">1</button>
        <button type="button" class="seg-btn seg-btn--active" data-value="3">3</button>
        <button type="button" class="seg-btn" data-value="5">5</button>
      </div>
    </div>
    <div class="field field--row">
      <button type="button" class="btn btn--primary" id="btn-run" data-i18n="sc.run">开始自检</button>
      <button type="button" class="btn" id="btn-copy-compact" disabled data-i18n="sc.copyCompact">复制精简版</button>
      <button type="button" class="btn" id="btn-copy" disabled data-i18n="sc.copy">复制结果</button>
      <button type="button" class="btn" id="btn-export" disabled data-i18n="sc.export">导出 JSON</button>
    </div>
  </section>

  <!-- 汇总条 -->
  <section id="summary" class="sc-summary" hidden></section>

  <!-- 六路数据源结果表 -->
  <section class="sc-section">
    <h2 class="sc-h2" data-i18n="sc.sources">数据源</h2>
    <div id="src-list" class="sc-list"></div>
  </section>

  <!-- 瓦片指纹（3 样式 × 3 坐标） -->
  <section class="sc-section">
    <h2 class="sc-h2" data-i18n="sc.tiles">瓦片指纹</h2>
    <div id="tile-list" class="sc-list"></div>
    <div id="tile-dedupe" class="sc-dedupe"></div>
  </section>

  <!-- 运行日志 -->
  <section class="sc-section">
    <h2 class="sc-h2" data-i18n="sc.log">日志</h2>
    <pre id="log" class="sc-log"></pre>
  </section>

  <nav class="tabbar" aria-label="主导航" data-i18n-aria="a11y.mainNav">
    <a class="tab" href="index.html" data-i18n="tab.now">此刻</a>
    <a class="tab tab--active" href="selfcheck.html" aria-current="page" data-i18n="tab.selfcheck">自检</a>
    <a class="tab" href="compass.html" data-i18n="tab.compass">方位</a>
    <a class="tab" href="settings.html" data-i18n="tab.settings">我的</a>
  </nav>

  <script type="module" src="src/ui/selfcheck.js"></script>
</body>
</html>
