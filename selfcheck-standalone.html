 if (k === 'text') el.textContent = String(v);\n    else if (v === true) el.setAttribute(k, '');\n    else el.setAttribute(k, String(v));\n  });\n  const list = typeof children === 'string' ? [children] : children || [];\n  list.forEach((c) => {\n    if (c === null || c === undefined || c === false) return;\n    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);\n  });\n  return el;\n}\n\n/**\n * 清空并写入容器。\n *\n * @param {HTMLElement} box 容器。\n * @param {Array<Node>} nodes 子节点。\n * @returns {void}\n */\nfunction _fill(box, nodes) {\n  if (!box) return;\n  box.textContent = '';\n  nodes.forEach((n) => n && box.appendChild(n));\n}\n\n/**\n * 阈值数字的原样呈现（去掉浮点尾巴：8.0 → '8'，保留 0.3 / 10.8）。\n *\n * @param {number} v 数值。\n * @returns {string} 文本。\n */\nfunction _num(v) {\n  return String(Number(v));\n}\n\n/* ------------------------------------------------------------------ */\n/* 档位表（全部读自 core/wmo.js，本文件不写死任何阈值）                  */\n/* ------------------------------------------------------------------ */\n\n/**\n * 蒲福风级档位行。\n *\n * 第 i 级的区间是 [上一级的 maxMs, 本级 maxMs)；最高级没有上限，用「≥」表述。\n *\n * @returns {string[]} 13 行文案。\n */\nfunction _beaufortRows() {\n  const scale = beaufortScale();\n  return scale.map((r, i) => {\n    if (i === scale.length - 1) {\n      return t('legend.beaufort.rowLast', { level: r.level, zh: r.zh, min: _num(scale[i - 1].maxMs) });\n    }\n    return t('legend.beaufort.row', { level: r.level, zh: r.zh, max: _num(r.maxMs) });\n  });\n}\n\n/**\n * 欧洲 AQI 档位行。\n *\n * 下界 = 上一档 max + 1，最高档不设上界。\n *\n * @returns {string[]} 6 行文案。\n */\nfunction _aqiRows() {\n  const scale = aqiScale();\n  return scale.map((r, i) => {\n    const min = i === 0 ? 0 : scale[i - 1].max + 1;\n    if (i === scale.length - 1) {\n      return t('legend.aqi.rowLast', { min, zh: r.zh, advice: r.advice });\n    }\n    return t('legend.aqi.row', { min, max: r.max, zh: r.zh, advice: r.advice });\n  });\n}\n\n/**\n * UV 档位行（与 AQI 同构：下界 = 上一档 max + 1）。\n *\n * @returns {string[]} 5 行文案。\n */\nfunction _uvRows() {\n  const scale = uvScale();\n  return scale.map((r, i) => {\n    const min = i === 0 ? 0 : scale[i - 1].max + 1;\n    if (i === scale.length - 1) {\n      return t('legend.uv.rowLast', { min, zh: r.zh, advice: r.advice });\n    }\n    return t('legend.uv.row', { min, max: r.max, zh: r.zh, advice: r.advice });\n  });\n}\n\n/**\n * 风向 16 方位（名称直接读自换算表，不含角度 —— 角度是换算表的实现细节，\n * 抄进文案等于又写死一个数）。\n *\n * @returns {string[]} 16 个方位名。\n */\nfunction _windDirRows() {\n  return windRose16().map((zh) => t('legend.winddir.row', { zh }));\n}\n\n/**\n * 释义条目模型。\n *\n * 每项：`rows` 为空表示「本应用没有对这项设分档」；`wrap` 为 true 时档位横向\n * 排布（风向 16 方位那一项，竖排会拉出一长条）。\n *\n * @returns {Array<{title:string, items:Array<Object>}>} 分组模型。\n */\nexport function legendModel() {\n  return [\n    {\n      title: t('legend.group.weather'),\n      items: [\n        {\n          id: 'temp',\n          title: t('legend.temp.title'),\n          unit: t('legend.temp.unit'),\n          body: t('legend.temp.body'),\n          rows: [],\n        },\n        {\n          id: 'feels',\n          title: t('legend.feels.title'),\n          unit: t('legend.feels.unit'),\n          body: t('legend.feels.body'),\n          rows: [],\n        },\n        {\n          id: 'humidity',\n          title: t('legend.humidity.title'),\n          unit: t('legend.humidity.unit'),\n          body: t('legend.humidity.body'),\n          rows: [],\n          noScale: true,\n        },\n        {\n          id: 'precip',\n          title: t('legend.precip.title'),\n          unit: t('legend.precip.unit'),\n          body: t('legend.precip.body'),\n          rows: [],\n        },\n        {\n          id: 'wind',\n          title: t('legend.wind.title'),\n          unit: t('legend.wind.unit'),\n          body: t('legend.wind.body'),\n          rows: [],\n        },\n        {\n          id: 'beaufort',\n          title: t('legend.beaufort.title'),\n          unit: t('legend.beaufort.unit'),\n          body: t('legend.beaufort.body'),\n          rows: _beaufortRows(),\n        },\n        {\n          id: 'winddir',\n          title: t('legend.winddir.title'),\n          unit: t('legend.winddir.unit'),\n          body: t('legend.winddir.body'),\n          rows: _windDirRows(),\n          wrap: true,\n        },\n        {\n          id: 'pressure',\n          title: t('legend.pressure.title'),\n          unit: t('legend.pressure.unit'),\n          body: t('legend.pressure.body'),\n          rows: [],\n          noScale: true,\n        },\n        {\n          id: 'visibility',\n          title: t('legend.visibility.title'),\n          unit: t('legend.visibility.unit'),\n          body: t('legend.visibility.body'),\n          rows: [],\n          noScale: true,\n        },\n        {\n          id: 'uv',\n          title: t('legend.uv.title'),\n          unit: t('legend.uv.unit'),\n          body: t('legend.uv.body'),\n          rows: _uvRows(),\n        },\n        {\n          id: 'sun',\n          title: t('legend.sun.title'),\n          unit: t('legend.sun.unit'),\n          body: t('legend.sun.body'),\n          rows: [],\n        },\n        {\n          id: 'dayLength',\n          title: t('legend.dayLength.title'),\n          unit: t('legend.dayLength.unit'),\n          body: t('legend.dayLength.body'),\n          rows: [],\n        },\n        {\n          id: 'today',\n          title: t('legend.today.title'),\n          unit: t('legend.today.unit'),\n          body: t('legend.today.body'),\n          rows: [],\n        },\n        {\n          id: 'wmo',\n          title: t('legend.wmo.title'),\n          unit: t('legend.wmo.unit'),\n          body: t('legend.wmo.body'),\n          rows: [],\n        },\n        {\n          id: 'observedAt',\n          title: t('legend.observedAt.title'),\n          unit: t('legend.observedAt.unit'),\n          body: t('legend.observedAt.body'),\n          rows: [],\n        },\n      ],\n    },\n    {\n      title: t('legend.group.air'),\n      items: [\n        {\n          id: 'aqi',\n          title: t('legend.aqi.title'),\n          unit: t('legend.aqi.unit'),\n          body: t('legend.aqi.body'),\n          rows: _aqiRows(),\n        },\n        {\n          id: 'pollutants',\n          title: t('legend.pollutants.title'),\n          unit: t('legend.pollutants.unit'),\n          body: t('legend.pollutants.body'),\n          rows: [],\n          noScale: true,\n        },\n      ],\n    },\n    {\n      title: t('legend.group.place'),\n      items: [\n        {\n          id: 'elevation',\n          title: t('legend.elevation.title'),\n          unit: t('legend.elevation.unit'),\n          body: t('legend.elevation.body'),\n          rows: [],\n        },\n        {\n          id: 'coord',\n          title: t('legend.coord.title'),\n          unit: t('legend.coord.unit'),\n          body: t('legend.coord.body'),\n          rows: [],\n        },\n        {\n          id: 'tz',\n          title: t('legend.tz.title'),\n          unit: t('legend.tz.unit'),\n          body: t('legend.tz.body'),\n          rows: [],\n        },\n      ],\n    },\n  ];\n}\n\n/* ------------------------------------------------------------------ */\n/* 渲染                                                                 */\n/* ------------------------------------------------------------------ */\n\n/**\n * 单条释义。\n *\n * @param {Object} item 条目模型。\n * @returns {HTMLElement} 条目节点。\n */\nfunction _itemNode(item) {\n  const nodes = [\n    _el('div', { class: 'legend-item-head' }, [\n      _el('span', { class: 'legend-item-name', text: item.title }),\n      _el('span', { class: 'legend-item-unit', text: item.unit }),\n    ]),\n    _el('p', { class: 'legend-item-body', text: item.body }),\n  ];\n\n  if (item.rows.length > 0) {\n    const cls = item.wrap ? 'legend-scale legend-scale--wrap' : 'legend-scale';\n    nodes.push(_el('ul', { class: cls }, item.rows.map((r) => _el('li', { class: 'legend-scale-row', text: r }))));\n  } else if (item.noScale) {\n    nodes.push(_el('p', { class: 'legend-none', text: t('legend.noScale') }));\n  }\n\n  return _el('div', { class: 'legend-item', 'data-legend': item.id }, nodes);\n}\n\n/**\n * 面板内容（展开时才有）。\n *\n * @returns {HTMLElement} 面板节点。\n */\nfunction _panelNode() {\n  const groups = legendModel().map((g) =>\n    _el('div', { class: 'legend-group' }, [\n      _el('h3', { class: 'legend-group-title', text: g.title }),\n      _el('div', { class: 'legend-list' }, g.items.map(_itemNode)),\n    ])\n  );\n  return _el('div', { class: 'legend-panel' }, [\n    _el('p', { class: 'legend-note', text: t('legend.note') }),\n    ...groups,\n  ]);\n}\n\n/**\n * 渲染（或收起）指标释义面板。\n *\n * 整槽替换，与 now.js 的其它卡片同一套节奏：每次渲染都是一颗新按钮，\n * 展开与否从模块级 `_open` 读，不靠 DOM 记忆。\n *\n * @param {HTMLElement} root 根容器（#app）。\n * @returns {HTMLElement|null} 槽位节点；无根容器时 null。\n */\nexport function renderLegend(root) {\n  if (!root) return null;\n  const box = _slot(root);\n\n  const toggle = _el('button', {\n    type: 'button',\n    class: 'btn legend-toggle',\n    'aria-expanded': _open ? 'true' : 'false',\n  });\n  toggle.textContent = _open ? t('legend.close') : t('legend.open');\n  toggle.addEventListener('click', () => {\n    _open = !_open;\n    renderLegend(root);\n  });\n\n  const nodes = [toggle];\n  if (_open) nodes.push(_panelNode());\n  _fill(box, nodes);\n  return box;\n}\n\n/**\n * 面板当前是否展开（测试与调试用）。\n *\n * @returns {boolean} 是否展开。\n */\nexport function isLegendOpen() {\n  return _open;\n}\n",
  "src/ui/now.js": "/**\r\n * 此刻屏渲染（纯渲染层）\r\n *\r\n * 职责：把 NowSnapshot 转成 DOM。网络、缓存、健康判定全部在上游完成，本模块只做\r\n * 「数据 → 节点」，不发起任何请求，保证可离线单测。\r\n *\r\n * 渲染策略：骨架先上屏（不转圈等待网络），随后按 [weather → air → elevation] 顺序\r\n * 逐卡增量替换；reverse（地名）与瓦片探测在首屏渲染完成后后台补齐。\r\n * 降级原则：有任何陈旧数据就上屏并标注陈旧时长，**绝不显示空白**。\r\n */\r\n\r\nimport { t } from '../i18n/zh.js';\r\nimport * as fmt from '../core/format.js';\r\nimport { wmo, aqi, uv, windDir16, beaufort } from '../core/wmo.js';\r\nimport { isDaylight } from '../core/sun.js';\r\n// 收藏状态读写走 store（唯一真相源）。依赖方向 ui → core，与 settings.js 一致。\r\nimport { isFavorite, addFavorite, removeFavorite } from '../core/store.js';\r\n// 地点搜索：状态机在 placesearch.js（纯逻辑），这里只负责把 state 画成 DOM。\r\nimport {\r\n  createPlaceSearch,\r\n  placeHref,\r\n  SEARCH_MIN_CHARS,\r\n  SEARCH_STATUS,\r\n} from './placesearch.js';\r\n// 指标释义（图例）：静态内容，不依赖任何数据源，所以骨架期就建槽上屏 ——\r\n// 离线 / 取数失败时它也必须在，释义不是「有数据才配看」的东西。\r\nimport { renderLegend } from './legend.js';\r\n\r\n/** 收藏反馈文案的停留时长（毫秒）：给一眼就够，不长驻、不挡内容。 */\r\nconst FAV_HINT_MS = 2000;\r\n\r\n/**\r\n * 把静态 HTML 里带 data-i18n 的占位节点替换成真实文案。\r\n *\r\n * 目的：HTML 外壳不硬编码任何中文，文案统一由 i18n/zh.js 提供（架构约定第 11 条）。\r\n *\r\n * @param {ParentNode} [root] 根节点，默认 document。\r\n * @returns {void}\r\n */\r\nexport function applyI18n(root) {\r\n  const scope = root || (typeof document !== 'undefined' ? document : null);\r\n  if (!scope || typeof scope.querySelectorAll !== 'function') return;\r\n  scope.querySelectorAll('[data-i18n]').forEach((el) => {\r\n    const key = el.getAttribute('data-i18n');\r\n    if (key) el.textContent = t(key);\r\n  });\r\n}\r\n\r\n/**\r\n * 极简 DOM 构造器（零依赖替代 JSX / 模板引擎）。\r\n *\r\n * @param {string} tag 标签名。\r\n * @param {Object} [props] 属性表；class / text 有专门处理。\r\n * @param {Array<Node|string>|string} [children] 子节点。\r\n * @returns {HTMLElement} 元素。\r\n */\r\nexport function h(tag, props = {}, children = []) {\r\n  const el = document.createElement(tag);\r\n  Object.keys(props || {}).forEach((k) => {\r\n    const v = props[k];\r\n    if (v === null || v === undefined || v === false) return;\r\n    if (k === 'class') el.className = String(v);\r\n    else if (k === 'text') el.textContent = String(v);\r\n    else if (v === true) el.setAttribute(k, '');\r\n    else el.setAttribute(k, String(v));\r\n  });\r\n  const list = typeof children === 'string' ? [children] : children || [];\r\n  list.forEach((c) => {\r\n    if (c === null || c === undefined || c === false) return;\r\n    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);\r\n  });\r\n  return el;\r\n}\r\n\r\n/**\r\n * 清空并写入容器。\r\n *\r\n * @param {HTMLElement} box 容器。\r\n * @param {Array<Node>} nodes 子节点。\r\n * @returns {void}\r\n */\r\nfunction _fill(box, nodes) {\r\n  if (!box) return;\r\n  box.textContent = '';\r\n  nodes.forEach((n) => n && box.appendChild(n));\r\n}\r\n\r\n/**\r\n * 取（或创建）卡片容器，保证增量渲染时位置稳定。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {string} id 卡片 id（不含 'card-' 前缀）。\r\n * @returns {HTMLElement} 容器元素。\r\n */\r\nfunction _slot(root, id) {\r\n  const domId = `card-${id}`;\r\n  let box = root.querySelector(`#${domId}`);\r\n  if (!box) {\r\n    box = h('div', { class: 'card-slot', id: domId });\r\n    root.appendChild(box);\r\n  }\r\n  return box;\r\n}\r\n\r\n/**\r\n * 键值项。\r\n *\r\n * @param {string} key 标签文案。\r\n * @param {string} value 值文案。\r\n * @param {string} [mod] 修饰类：'hot' | 'cold' | 'alert' | ''。\r\n * @returns {HTMLElement} kv-item。\r\n */\r\nfunction _kv(key, value, mod = '') {\r\n  return h('div', { class: 'kv-item' }, [\r\n    h('span', { class: 'kv-k', text: key }),\r\n    h('span', { class: mod ? `kv-v kv-v--${mod}` : 'kv-v', text: value }),\r\n  ]);\r\n}\r\n\r\n/**\r\n * 状态徽标。\r\n *\r\n * @param {string} status 状态词：ok | stale | degraded | failed | offline | idle。\r\n * @returns {HTMLElement} chip。\r\n */\r\nfunction _chip(status) {\r\n  return h('span', { class: `chip chip--${status}` }, [\r\n    h('span', { class: `badge badge--${status}` }),\r\n    t(`status.${status}`),\r\n  ]);\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 骨架屏                                                               */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/**\r\n * 渲染骨架屏（立即出，不转圈等待网络）。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @returns {void}\r\n */\r\nexport function renderSkeleton(root) {\r\n  if (!root) return;\r\n  root.textContent = '';\r\n\r\n  root.appendChild(\r\n    h('div', { class: 'hd' }, [\r\n      h('div', {}, [h('h1', { class: 'hd-place', text: t('app.tagline') })]),\r\n      h('div', { class: 'hd-time', text: t('app.loading') }),\r\n    ])\r\n  );\r\n  // ★搜索槽必须在 weather / air / place / map / prov **之前**建：槽位顺序由首次创建\r\n  //   那一刻决定（appendChild 的先后），建晚了搜索面板会掉到页面最底下。\r\n  root.appendChild(_slot(root, 'search'));\r\n  root.appendChild(_slot(root, 'weather')).appendChild(h('div', { class: 'sk' }));\r\n  root.appendChild(_slot(root, 'air')).appendChild(h('div', { class: 'sk' }));\r\n  root.appendChild(_slot(root, 'place')).appendChild(h('div', { class: 'sk' }));\r\n  // 底图槽：这里**只建槽不填内容**，由 ui/map.js 的 renderMapSkeleton / renderMapCard 填充\r\n  // （now.js 不 import map.js —— map.js 要用 now.js 的 h()，反方向依赖会成环）。\r\n  // ★顺序必须在 prov 之前建：槽位顺序由首次创建那一刻决定，建错位置就再也挪不回去。\r\n  root.appendChild(_slot(root, 'map'));\r\n  root.appendChild(_slot(root, 'prov'));\r\n  // 指标释义入口放**最后**（页面底部）：它是查阅物，不该插在数据卡之间把首屏撑长。\r\n  // 槽位顺序由首次创建那一刻决定，建在 prov 之后就再也挪不回去了。\r\n  renderLegend(root);\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 降级横幅                                                             */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/**\r\n * 渲染顶部降级横幅。\r\n *\r\n * @param {HTMLElement} bannerEl 横幅容器。\r\n * @param {'live'|'stale'|'partial'|'grid'|'offline'|'no-map'|'empty'} mode 整体降级态。\r\n * @param {{staleAgeMs?:number}} [extra] 附加信息。\r\n * @returns {void}\r\n */\r\nexport function renderBanner(bannerEl, mode, extra = {}) {\r\n  if (!bannerEl) return;\r\n  if (!mode || mode === 'live') {\r\n    bannerEl.hidden = true;\r\n    bannerEl.textContent = '';\r\n    return;\r\n  }\r\n  bannerEl.hidden = false;\r\n  // 变体名直接由 mode 拼出：grid → .banner--grid，因此 app.css 必须为\r\n  // renderBanner 能拿到的每个 mode 都备一条 .banner--* 规则，否则样式会静默退回基础横幅。\r\n  bannerEl.className = `banner banner--${mode}`;\r\n  // 徽点只有 offline / stale 两色。grid 与 partial 都复用琥珀点（--c-state-stale）：\r\n  // 三者同属「降级」语义，不必为每种降级配一个色值；真正区分它们的是横幅底色与文案。\r\n  const nodes = [h('span', { class: `badge badge--${mode === 'offline' ? 'offline' : 'stale'}` })];\r\n  nodes.push(h('span', { text: t(`mode.${mode}`) }));\r\n  if (extra.staleAgeMs && extra.staleAgeMs > 0) {\r\n    nodes.push(h('span', { class: 'num', text: `（${fmt.staleFor(extra.staleAgeMs)}）` }));\r\n  }\r\n  _fill(bannerEl, nodes);\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 顶部标题                                                             */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/**\r\n * 取「此刻该收藏的地点」——**点击时现算**，不在构造按钮时抓快照。\r\n *\r\n * 为什么必须现算：GPS 定位成功后、逆地理（Photon）还没回来的那一秒多里，\r\n * `snapshot.placeName` 与 `coord.name` 都是 null —— 那是**常态**，用户加载完顺手点 ☆\r\n * 比等一个网络往返快得多。若在按钮构造那一刻把地名抓进闭包，存进去的就是\r\n * `{lat, lon, name: ''}`，在「我的」页显示成「未命名地点」，跳回去只剩坐标。\r\n *\r\n * 兜底：名字为空（反查未回 / 反查失败 / 默认地点没名字）时用**坐标串**兜底，\r\n * 复用 core/format.js 的 coord()（'22.5431°N, 114.0579°E'），不另造一套格式化。\r\n * 理由：空串在列表里是「未命名」，坐标至少能让人认出是哪儿、跳回去也显示得出来。\r\n *\r\n * ★反过来**绝不**为了拿地名去等逆地理返回 —— 那会让收藏按钮卡住或延迟。\r\n * 宁可先存坐标串。\r\n *\r\n * @param {Object} snapshot NowSnapshot。\r\n * @returns {{lat:number, lon:number, name:string}|null} 可收藏的地点；\r\n *   无坐标或坐标非有限数字时返回 null（存不出能跳回去的收藏）。\r\n */\r\nfunction _favPlaceOf(snapshot) {\r\n  const c = snapshot && snapshot.coord ? snapshot.coord : null;\r\n  if (!c) return null;\r\n  const lat = Number(c.lat);\r\n  const lon = Number(c.lon);\r\n  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;\r\n  const raw = snapshot.placeName || c.name || '';\r\n  const name = String(raw).trim();\r\n  return { lat, lon, name: name || fmt.coord(lat, lon) };\r\n}\r\n\r\n/**\r\n * 收藏按钮（toggle：已收藏再点一次就是取消）。\r\n *\r\n * 三件事必须同时成立，缺一个这颗按钮就是死的：\r\n *   1) **状态从 store 读**（isFavorite），不是从上次渲染的记忆里读 —— 标题区会被\r\n *      renderHeader 整槽重建多次，靠记忆会与 store 漂移；\r\n *   2) **点了就地翻转**（改文案 / 改配色 / 改 aria-pressed），用户立刻看得见；\r\n *   3) **aria-pressed** 跟着状态走，读屏软件才知道这是开关而不是普通按钮。\r\n *\r\n * ★第四条（缺陷 A 回改后固化，勿回退）：**名字在 click 那一刻才读**，不在构造时抓\r\n * 闭包 —— 这颗按钮出生时逆地理往往还没回来，抓闭包就会把「未命名地点」存进收藏。\r\n * 坐标（lat/lon）可以在构造时定下来：renderHeader 整槽重建就是换一颗新按钮，\r\n * 而同一颗按钮活着期间坐标不会变。\r\n *\r\n * 关于「反查到地名后把已存进来的坐标串补写回真实地名」：本轮**明确不做**，理由见\r\n * _favPlaceOf() 上方与 renderHeader() 的注释 —— 那需要「删旧条再插新条」以维持\r\n * store 的 lat+lon 去重口径（条目会被挪到列表末尾），还要靠正则去猜「这条 name 是\r\n * 不是坐标兜底串」，并且会让纯渲染层反过来写 store。收益只是把可读的坐标串换成\r\n * 更好看的真名，不值得付这个代价。\r\n *\r\n * 配色两态复用既有的 `.btn`（未收藏）与 `.btn--primary`（已收藏）—— 这两条规则的\r\n * 白字/实心底组合已经过 tools/contrast-audit.mjs，不新增任何 color 声明。\r\n *\r\n * @param {Object} snapshot NowSnapshot（持有**活跃引用**：后台反查把 placeName 改写\r\n *   之后，下一次点击读到的就是新值）。\r\n * @returns {HTMLElement|null} 按钮容器（按钮 + 行内反馈）；无可用坐标时 null。\r\n */\r\nfunction _favButton(snapshot) {\r\n  const place = _favPlaceOf(snapshot);\r\n  if (!place) return null;\r\n  const lat = place.lat;\r\n  const lon = place.lon;\r\n\r\n  const btn = h('button', { type: 'button', class: 'btn fav-btn' });\r\n  // 反馈位用「有没有字」表示显隐，不用 hidden 属性：整槽重建后属性容易被落下，\r\n  // 空 span 本来就不占版面，比一个可能卡住的 hidden 更省心。\r\n  const hint = h('span', { class: 'hd-hint' });\r\n  /** @type {any} 反馈计时器（浏览器给 number，Node 给 Timeout 对象）。 */\r\n  let timer = null;\r\n\r\n  /** 把按钮刷成当前收藏态。 */\r\n  const sync = () => {\r\n    const on = isFavorite(lat, lon);\r\n    btn.className = on ? 'btn btn--primary fav-btn fav-btn--on' : 'btn fav-btn';\r\n    btn.setAttribute('aria-pressed', on ? 'true' : 'false');\r\n    btn.textContent = on ? `★ ${t('fav.added')}` : `☆ ${t('fav.add')}`;\r\n  };\r\n  sync();\r\n\r\n  btn.addEventListener('click', () => {\r\n    const was = isFavorite(lat, lon);\r\n    // toggle：已收藏 → 取消；未收藏 → 存进来。removeFavorite 的返回值区分\r\n    // 「删掉了」与「本来就没有」，但按钮只按**最新**状态刷新，所以两种情况\r\n    // 都会收敛到「未收藏」，不需要分支。\r\n    if (was) removeFavorite(lat, lon);\r\n    // ★现读：不复用构造时算好的 place.name —— 那一刻逆地理常常还没回来。\r\n    // 兜底逻辑（空名 → 坐标串）也在 _favPlaceOf 里，两处共用同一把尺子。\r\n    else addFavorite(_favPlaceOf(snapshot) || place);\r\n    sync();\r\n\r\n    hint.textContent = was ? t('fav.removedHint') : t('fav.addedHint');\r\n    if (timer) clearTimeout(timer);\r\n    // 用完就清成空串 —— 反馈不该常驻，它只是确认「这次点击生效了」\r\n    timer = setTimeout(() => {\r\n      hint.textContent = '';\r\n    }, FAV_HINT_MS);\r\n    // Node 侧（测试）挂着这个定时器会把进程多吊 2 s；浏览器返回的是数字，没有 unref。\r\n    if (timer && typeof timer.unref === 'function') timer.unref();\r\n  });\r\n\r\n  return h('div', { class: 'hd-fav' }, [btn, hint]);\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 地点搜索（放大镜入口 + 内联展开面板）                                 */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/** @type {Object|null} 搜索控制器单例（状态必须活过整槽重建）。 */\r\nlet _placeSearch = null;\r\n\r\n/** @type {HTMLElement|null} 当前面板里的「状态行 + 结果列表」容器。 */\r\nlet _searchBodyEl = null;\r\n\r\n/**\r\n * 搜索控制器单例（懒建）。\r\n *\r\n * 为什么必须是**模块级**：`renderHeader()` 每次都整槽 `_fill` 重建（一次 boot 至少三次：\r\n * 定位后 / weather 回来后 / reverse 回来后）。面板里的字与结果如果跟着 DOM 一起被重建，\r\n * 用户打了一半的关键词会被抹掉 —— 所以状态住在 `placesearch.js` 的控制器里，这里只是\r\n * 每次照着 `state` 重画一遍。\r\n *\r\n * @returns {Object} 控制器。\r\n */\r\nfunction _search() {\r\n  if (_placeSearch) return _placeSearch;\r\n  _placeSearch = createPlaceSearch({\r\n    onPick: (place) => {\r\n      // 跳回此刻页并带上坐标：app.js 的 parsePlaceParam 会解析它并**跳过定位**，\r\n      // 与收藏跳转走的是同一条通路（source 都是 'explicit'）。\r\n      const href = placeHref(place);\r\n      if (!href) return; // 坐标非法：宁可不跳，也不跳到一个会静默定位的页面\r\n      if (typeof location === 'undefined' || !location) return; // Node 侧无 location\r\n      location.href = href;\r\n    },\r\n    onChange: () => _renderSearchBody(),\r\n  });\r\n  return _placeSearch;\r\n}\r\n\r\n/**\r\n * 重画面板里的状态行与结果列表（**不动输入框**）。\r\n *\r\n * 为什么只画这一块：每敲一个字都会触发 `input()` → 状态变化 → 重画。若连输入框一起重画，\r\n * 每敲一下节点就被换掉，光标与焦点当场丢失，中文输入法的候选也会被打断。\r\n *\r\n * @returns {void}\r\n */\r\nfunction _renderSearchBody() {\r\n  if (!_searchBodyEl) return;\r\n  _fill(_searchBodyEl, _searchBodyNodes());\r\n}\r\n\r\n/**\r\n * 按当前状态生成「状态行 / 结果列表」节点。\r\n *\r\n * 五种状态各自的文案都走 i18n。**失败与无结果必须是两句不同的话**：合成一句「没找到」\r\n * 会把超时 / 断网伪装成「这地方不存在」。\r\n *\r\n * @returns {Array<HTMLElement>} 节点列表。\r\n */\r\nfunction _searchBodyNodes() {\r\n  const ps = _search();\r\n  const nodes = [];\r\n  const st = ps.status;\r\n  if (st === SEARCH_STATUS.SHORT) {\r\n    nodes.push(h('p', { class: 'search-status', text: t('search.minChars', { n: SEARCH_MIN_CHARS }) }));\r\n  } else if (st === SEARCH_STATUS.LOADING) {\r\n    nodes.push(h('p', { class: 'search-status', text: t('search.loading') }));\r\n  } else if (st === SEARCH_STATUS.EMPTY) {\r\n    nodes.push(h('p', { class: 'search-status', text: t('search.empty') }));\r\n  } else if (st === SEARCH_STATUS.ERROR) {\r\n    nodes.push(h('p', { class: 'search-status', text: t('search.failed') }));\r\n    // 第二行是 http.js 已经本地化好的具体原因（「请求超时（6000 ms 内未响应）」之类）\r\n    if (ps.errorMessage) {\r\n      nodes.push(h('p', { class: 'search-status', text: ps.errorMessage }));\r\n    }\r\n  } else if (st === SEARCH_STATUS.OK) {\r\n    nodes.push(h('div', { class: 'search-list' }, ps.results.map((p) => _searchItem(p))));\r\n  }\r\n  return nodes;\r\n}\r\n\r\n/**\r\n * 渲染一条搜索结果。\r\n *\r\n * 次行的 `admin1 · country` 是**同名多地消歧的唯一凭据** —— 「北京 · 北京市 · 中国」\r\n * 与别处的同名地全靠它分开。两者都可能为 null（Open-Meteo 对小地方经常只给一半），\r\n * 那种情况整行不渲染，绝不能拼出 \"null\" 或孤零零的 \" · \"。\r\n *\r\n * @param {Object} place 地点（name/lat/lon/admin1/country）。\r\n * @returns {HTMLElement} 可点击的结果项。\r\n */\r\nfunction _searchItem(place) {\r\n  const p = place && typeof place === 'object' ? place : {};\r\n  const name = String(p.name || '').trim();\r\n  const sub = [p.admin1, p.country].filter(Boolean).join(' · ');\r\n  const btn = h('button', { type: 'button', class: 'search-item' }, [\r\n    h('span', { class: 'search-item-name', text: name || t('search.unnamed') }),\r\n  ]);\r\n  if (sub) btn.appendChild(h('span', { class: 'search-item-sub', text: sub }));\r\n  btn.addEventListener('click', () => _search().pick(p));\r\n  return btn;\r\n}\r\n\r\n/**\r\n * 渲染（或收起）搜索面板。\r\n *\r\n * 面板挂在**独立槽位** `#card-search` 上，不在 `.hd` 里 —— `.hd` 会被 renderHeader\r\n * 整槽重建，放进去等于每次重画都把面板连根拔掉。槽位由 renderSkeleton 在 `.hd` 之后\r\n * 建好（顺序由首次创建那一刻决定，见 renderSkeleton 的注释）。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @returns {void}\r\n */\r\nfunction _renderSearchPanel(root) {\r\n  const ps = _search();\r\n  const slot = _slot(root, 'search');\r\n  if (!ps.isOpen) {\r\n    _searchBodyEl = null;\r\n    slot.textContent = '';\r\n    slot.hidden = true;\r\n    return;\r\n  }\r\n  slot.hidden = false;\r\n\r\n  const input = h('input', {\r\n    class: 'search-input',\r\n    type: 'search',\r\n    placeholder: t('search.placeholder'),\r\n    'aria-label': t('search.open'),\r\n  });\r\n  // value 是**属性**不是特性：h() 只管 setAttribute，值必须单独写进去\r\n  input.value = ps.text;\r\n  input.addEventListener('input', () => {\r\n    const raw = input.value === null || input.value === undefined ? '' : input.value;\r\n    ps.input(String(raw));\r\n  });\r\n\r\n  const body = h('div', { class: 'search-body' });\r\n  _searchBodyEl = body;\r\n  _fill(slot, [\r\n    h('div', { class: 'search-panel' }, [\r\n      h('div', { class: 'search-field' }, [input]),\r\n      body,\r\n    ]),\r\n  ]);\r\n  _renderSearchBody();\r\n  if (typeof input.focus === 'function') input.focus();\r\n}\r\n\r\n/**\r\n * 放大镜入口按钮（点击才展开面板）。\r\n *\r\n * 不把搜索框常驻在标题那一排：那一排已经有地名 + 坐标 + 观测时刻 + 收藏按钮，\r\n * 再塞一个输入框会挤到断行。默认收起，用户想搜再点。\r\n *\r\n * @param {HTMLElement} root 根容器（展开后面板要挂到它的槽位上）。\r\n * @returns {HTMLElement} 按钮。\r\n */\r\nfunction _searchButton(root) {\r\n  const ps = _search();\r\n  const label = ps.isOpen ? t('search.close') : t('search.open');\r\n  const btn = h('button', {\r\n    type: 'button',\r\n    class: 'btn hd-search-btn',\r\n    'aria-expanded': ps.isOpen ? 'true' : 'false',\r\n    'aria-label': label,\r\n    title: label,\r\n  }, ['🔍']);\r\n  btn.addEventListener('click', () => {\r\n    ps.toggle();\r\n    const next = ps.isOpen ? t('search.close') : t('search.open');\r\n    btn.setAttribute('aria-expanded', ps.isOpen ? 'true' : 'false');\r\n    btn.setAttribute('aria-label', next);\r\n    btn.setAttribute('title', next);\r\n    _renderSearchPanel(root);\r\n  });\r\n  return btn;\r\n}\r\n\r\n/**\r\n * 渲染标题区（地点名 + 坐标 + 观测时刻 + 收藏按钮 + 搜索入口）。\r\n *\r\n * 整槽替换（_fill）会重建 .hd 里的全部节点，所以按钮上的 click 监听不会重复绑定 ——\r\n * 每次渲染都是一颗新按钮，状态也顺带从 store 重新读一遍。\r\n *\r\n * 无坐标（或坐标不是有限数字）时不给收藏按钮：store 的收藏以 lat+lon 为身份，\r\n * 没有坐标就存不出一条能跳回去的收藏，放一颗点了没反应的按钮比不放更糟。\r\n *\r\n * 为什么不做「反查到地名后回写已存条目的名字」：那要先把旧条目删掉再插新的\r\n * （store 以 lat+lon 去重，没有就地改名的 API），条目会因此被挪到列表末尾 ——\r\n * 一次后台网络回调悄悄改掉用户的列表顺序，是新的不可预期行为；判据又只能靠正则\r\n * 去猜「这条 name 是不是坐标兜底串」。纯渲染层也不该反过来写 store（见本文件头）。\r\n * 缺陷 A 的核心伤害（空串 → 「未命名地点」）已由 _favPlaceOf 的坐标兜底消除。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {Object} snapshot NowSnapshot。\r\n * @param {{isDefaultPlace?:boolean}} [opts] 选项。\r\n * @returns {void}\r\n */\r\nexport function renderHeader(root, snapshot, opts = {}) {\r\n  const hd = root.querySelector('.hd');\r\n  if (!hd) return;\r\n  const placeName = snapshot.placeName || (snapshot.coord ? fmt.coord(snapshot.coord.lat, snapshot.coord.lon) : t('app.unknown'));\r\n  const right = snapshot.atMs ? t('now.observeAt', { time: fmt.hhmm(snapshot.atMs, snapshot.weather && snapshot.weather.tzOffsetSec ? snapshot.weather.tzOffsetSec : 0) }) : t('app.loading');\r\n\r\n  _fill(hd, [\r\n    h('div', {}, [\r\n      // 地名与搜索入口同一行：地名本身的位置与层级不变，只是在它右侧多一颗按钮\r\n      h('div', { class: 'hd-place-row' }, [\r\n        h('h1', { class: 'hd-place', text: placeName }),\r\n        _searchButton(root),\r\n      ]),\r\n      h('p', { class: 'hd-coord num', text: snapshot.coord ? fmt.coord(snapshot.coord.lat, snapshot.coord.lon) : t('app.dash') }),\r\n      opts.isDefaultPlace ? h('p', { class: 'hd-coord', text: t('now.defaultPlaceNotice') }) : null,\r\n      // 收藏的是**当前显示的地点**：坐标取 snapshot.coord，名字优先用反查出来的地名\r\n      // （coord 自带的 name 只在收藏跳转 / 默认地点这类已知名字的场景下存在）。\r\n      // 传整个 snapshot 而不是算好的 place —— 名字要留到 click 那一刻才读。\r\n      _favButton(snapshot),\r\n    ]),\r\n    h('div', { class: 'hd-time', text: right }),\r\n  ]);\r\n  // 搜索面板不在 .hd 里：整槽重建会把它连根拔掉，所以挂到独立槽位上重画一次\r\n  _renderSearchPanel(root);\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 天气卡                                                               */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/**\r\n * 渲染天气卡（首屏第一张，出数即上屏）。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {Object} snapshot NowSnapshot。\r\n * @returns {void}\r\n */\r\nexport function renderWeatherCard(root, snapshot) {\r\n  const w = snapshot.weather;\r\n  const box = _slot(root, 'weather');\r\n  if (!w) {\r\n    _fill(box, [_emptyCard(t('mode.empty'))]);\r\n    return;\r\n  }\r\n\r\n  const tzOffset = Number(w.tzOffsetSec) || 0;\r\n  const day = snapshot.atMs\r\n    ? isDaylight(snapshot.atMs, snapshot.coord || { lat: 0, lon: 0 })\r\n    : true;\r\n  const desc = wmo(w.wmoCode, day);\r\n  const wind = windDir16(w.windDeg);\r\n  const bf = beaufort(w.windMs);\r\n  const uvInfo = uv(w.uvMax);\r\n\r\n  // 大数字走等宽数字，单位单独小字，避免「23°°C」重复单位\r\n  const tempNode = h('div', { class: 'hero-temp' }, [\r\n    fmt.num(w.tempC, 0),\r\n    h('span', { class: 'unit', text: t('w.unitC') }),\r\n  ]);\r\n\r\n  const kvGrid = h('div', { class: 'kv' }, [\r\n    _kv(t('w.feels'), fmt.tempC(w.feelsC)),\r\n    _kv(t('w.humidity'), fmt.humidity(w.humidityPct)),\r\n    _kv(t('w.precip'), fmt.precipMm(w.precipMm)),\r\n    _kv(t('w.wind'), `${fmt.num(w.windMs, 1, 'm/s')} · ${wind.zh}`),\r\n    _kv(t('w.pressure'), fmt.pressure(w.pressureHpa)),\r\n    _kv(t('w.visibility'), fmt.visibility(w.visibilityM)),\r\n    _kv(t('w.sunrise'), fmt.hhmm(w.sunriseAt, tzOffset)),\r\n    _kv(t('w.sunset'), fmt.hhmm(w.sunsetAt, tzOffset)),\r\n    _kv(t('w.dayLength'), w.sunriseAt && w.sunsetAt ? fmt.duration(w.sunsetAt - w.sunriseAt) : t('app.dash')),\r\n    // UV：缺失仍显示占位符「—」；有值时用 displayValue（钳制负值，避免显示「低 · -3」）\r\n    _kv(\r\n      t('w.uv'),\r\n      w.uvMax === null || w.uvMax === undefined\r\n        ? fmt.num(w.uvMax, 0)\r\n        : `${fmt.num(uvInfo.displayValue, 0)}（${uvInfo.zh}）`\r\n    ),\r\n    _kv(t('w.todayMax'), fmt.tempC(w.todayMaxC)),\r\n    _kv(t('w.todayMin'), fmt.tempC(w.todayMinC)),\r\n  ]);\r\n\r\n  _fill(box, [\r\n    h('div', { class: 'card card--hero' }, [\r\n      h('p', { class: 'card-title', text: t('card.weather') }),\r\n      h('div', { class: 'hero' }, [\r\n        tempNode,\r\n        h('div', { class: 'hero-desc' }, [\r\n          h('span', { class: 'hero-wmo', text: `${desc.icon} ${desc.zh}` }),\r\n          h('span', { class: 'hero-sub', text: `${t('w.feels')} ${fmt.tempC(w.feelsC)} · ${t('w.beaufortLevel', { zh: bf.zh, level: bf.level })}` }),\r\n          h('span', { class: 'hero-sub', text: uvInfo.advice }),\r\n        ]),\r\n      ]),\r\n      kvGrid,\r\n    ]),\r\n  ]);\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 空气卡                                                               */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/**\r\n * 渲染空气质量卡。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {Object} snapshot NowSnapshot。\r\n * @returns {void}\r\n */\r\nexport function renderAirCard(root, snapshot) {\r\n  const a = snapshot.air;\r\n  const box = _slot(root, 'air');\r\n  if (!a || a.europeanAqi === null) {\r\n    _fill(box, [_emptyCard(t('app.na'))]);\r\n    return;\r\n  }\r\n  const info = aqi(a.europeanAqi);\r\n  _fill(box, [\r\n    h('div', { class: 'card' }, [\r\n      h('div', { class: 'card--row' }, [\r\n        h('p', { class: 'card-title', text: t('card.air') }),\r\n        // AQI 用 displayValue（钳制负值），避免出现「优 · AQI -10」这类自相矛盾文案\r\n        h('span', { class: `chip chip--${info.level === 'good' || info.level === 'fair' ? 'ok' : info.level === 'extreme' ? 'failed' : 'stale'}`, text: `${info.zh} · AQI ${info.displayValue}` }),\r\n      ]),\r\n      h('div', { class: 'kv' }, [\r\n        _kv(t('w.pm10'), fmt.pollutant(a.pm10)),\r\n        _kv(t('w.pm25'), fmt.pollutant(a.pm25)),\r\n        _kv(t('w.ozone'), fmt.pollutant(a.ozone)),\r\n        _kv(t('w.no2'), fmt.pollutant(a.no2)),\r\n      ]),\r\n      h('p', { class: 'card-title', text: info.advice }),\r\n    ]),\r\n  ]);\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 位置卡                                                               */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/**\r\n * 渲染位置卡（海拔 / 坐标 / 地名）。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {Object} snapshot NowSnapshot。\r\n * @returns {void}\r\n */\r\nexport function renderPlaceCard(root, snapshot) {\r\n  const box = _slot(root, 'place');\r\n  const hasAny = snapshot.elevationM !== null || snapshot.placeName || snapshot.coord;\r\n  if (!hasAny) {\r\n    _fill(box, [_emptyCard(t('app.na'))]);\r\n    return;\r\n  }\r\n  _fill(box, [\r\n    h('div', { class: 'card' }, [\r\n      h('p', { class: 'card-title', text: t('card.place') }),\r\n      h('div', { class: 'kv' }, [\r\n        _kv(t('w.elevation'), fmt.elevationM(snapshot.elevationM)),\r\n        _kv(t('w.coord'), snapshot.coord ? fmt.coord(snapshot.coord.lat, snapshot.coord.lon) : t('app.dash')),\r\n        snapshot.placeName ? _kv(t('card.place'), snapshot.placeName) : null,\r\n      ].filter(Boolean)),\r\n    ]),\r\n  ]);\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 溯源气泡                                                             */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/**\r\n * 渲染溯源气泡（每条来源一个胶囊：源名 / 时延 / URL）。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {Object} snapshot NowSnapshot。\r\n * @returns {void}\r\n */\r\nexport function renderProvenance(root, snapshot) {\r\n  const box = _slot(root, 'prov');\r\n  const list = Array.isArray(snapshot.provenance) ? snapshot.provenance : [];\r\n  if (list.length === 0) {\r\n    box.textContent = '';\r\n    return;\r\n  }\r\n  const chips = list.map((p) =>\r\n    h('span', { class: 'prov-item', title: `${p.label} · ${p.attribution}` }, [\r\n      h('span', { class: `badge badge--${p.state === 'stale' ? 'stale' : 'ok'}` }),\r\n      h('span', { text: p.label }),\r\n      h('span', { class: 'num', text: fmt.latency(p.latencyMs) }),\r\n      h('span', { class: 'prov-url', text: _shortUrl(p.url) }),\r\n    ])\r\n  );\r\n  _fill(box, [h('p', { class: 'card-title', text: t('card.provenance') }), h('div', { class: 'prov' }, chips)]);\r\n}\r\n\r\n/**\r\n * URL 缩短（只保留协议+宿主+路径首段，避免溯源气泡撑破布局）。\r\n *\r\n * @param {string} url 完整 URL。\r\n * @returns {string} 短 URL。\r\n */\r\nfunction _shortUrl(url) {\r\n  try {\r\n    const u = new URL(String(url));\r\n    const seg = u.pathname.split('/').filter(Boolean).slice(0, 2).join('/');\r\n    return `${u.host}/${seg}`;\r\n  } catch (err) {\r\n    return String(url || '').slice(0, 48);\r\n  }\r\n}\r\n\r\n/* ------------------------------------------------------------------ */\r\n/* 空态 / 离线态                                                        */\r\n/* ------------------------------------------------------------------ */\r\n\r\n/**\r\n * 空态卡（文案 + 重试按钮，**不转圈**）。\r\n *\r\n * @param {string} text 提示文案。\r\n * @param {() => void} [onRetry] 重试回调。\r\n * @returns {HTMLElement} 空态节点。\r\n */\r\nfunction _emptyCard(text, onRetry) {\r\n  const nodes = [h('span', { text })];\r\n  if (typeof onRetry === 'function') {\r\n    const btn = h('button', { class: 'btn btn--primary', type: 'button', text: t('app.retry') });\r\n    btn.addEventListener('click', onRetry);\r\n    nodes.push(btn);\r\n  }\r\n  return h('div', { class: 'empty' }, nodes);\r\n}\r\n\r\n/**\r\n * 渲染整屏空态（离线且无缓存时）。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {string} text 文案。\r\n * @param {() => void} [onRetry] 重试回调。\r\n * @returns {void}\r\n */\r\nexport function renderEmptyState(root, text, onRetry) {\r\n  if (!root) return;\r\n  root.textContent = '';\r\n  root.appendChild(_emptyCard(text, onRetry));\r\n}\r\n\r\n/**\r\n * 把指定卡片槽位渲染成「失败 / 空 + 重试」态。\r\n *\r\n * 用途：单路源抛异常时只废掉这一张卡，其余卡片继续渲染，用户不会看到永久骨架屏。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {string} slotId 槽位 id（'weather' | 'air' | 'place'）。\r\n * @param {string} text 提示文案。\r\n * @param {() => void} [onRetry] 重试回调。\r\n * @returns {void}\r\n */\r\nexport function renderSlotEmpty(root, slotId, text, onRetry) {\r\n  const box = _slot(root, slotId);\r\n  _fill(box, [_emptyCard(text, onRetry)]);\r\n}\r\n\r\n/**\r\n * 一次性完整渲染（离线读缓存快照时走此路径）。\r\n *\r\n * @param {HTMLElement} root 根容器。\r\n * @param {Object} snapshot NowSnapshot。\r\n * @param {{isDefaultPlace?:boolean, staleAgeMs?:number}} [opts] 选项。\r\n * @returns {void}\r\n */\r\nexport function renderSnapshot(root, snapshot, opts = {}) {\r\n  renderSkeleton(root);\r\n  renderHeader(root, snapshot, opts);\r\n  renderWeatherCard(root, snapshot);\r\n  renderAirCard(root, snapshot);\r\n  renderPlaceCard(root, snapshot);\r\n  renderProvenance(root, snapshot);\r\n}\r\n",
  "src/ui/map.js": "/**\n * 底图渲染（S57 街道样式 / S58 GRID 降级）\n *\n * 职责：把瓦片拼成一张地图卡。网络、探测、指纹、授信、三态裁决全在 `src/data/tiles.js`\n * 完成，本模块只做「瓦片号 + 字节 → 节点」，不自己发请求、不自己判降级。\n *\n * 四条不变量（勿回退）：\n *   1) **瓦片 URL 顺序是 `{z}/{y}/{x}`**（Esri，不是常见的 `{z}/{x}/{y}`）。本模块只调\n *      `tileUrl()`，绝不自己拼 URL —— 顺序写反不会报错，只会静默拉到地球另一侧的瓦片，\n *      而且「看起来像地图」，是最难发现的一类错。\n *   2) **内部坐标是 WGS84，不做 GCJ-02 纠偏**：三个服务的 `spatialReference` 实测为\n *      102100/3857（WGS84 Web Mercator），先转 GCJ-02 反而与瓦片错位。\n *      「中国境内要素是否按 GCJ-02 生产」是**未确认点**，登记在 tiles.js 文件头与\n *      docs/stage1-architecture.md，本阶段不实现纠偏。\n *   3) **署名必须显示且随样式切换**：`tileAttribution(styleId)` 返回该样式的实测\n *      `copyrightText` + \"Powered by Esri\"。这是 Esri 条款硬要求，不是可选项；\n *      设计稿里没画这一行，是设计稿漏了，代码必须补。\n *   4) **Blob URL 必须回收**：缓存命中走 `createObjectURL`，不 `revokeObjectURL` 会在\n *      96 块 LRU 之外再漏一份内存（每块约 20 KB，翻几次样式就上百块）。\n *\n * 另两条条款（写在这里是因为只有渲染侧会想做它们）：\n *   - 不得用 robots / 自动批量拉取 ArcGIS Online 地图。本模块的按需拉瓦片（视口内\n *     3×3 起）属正常浏览，合规；不得改成批量爬取。\n *   - 三个服务 `exportTilesAllowed` 均为 false，故**不做离线批量导出 / MBTiles**。\n *\n * 依赖方向：ui ← data（`tiles.js`）/ core（`format.js`）/ i18n。`h()` 复用 `now.js` 的实现。\n */\n\nimport { t } from '../i18n/zh.js';\nimport * as fmt from '../core/format.js';\nimport { h } from './now.js';\nimport {\n  TILE_STYLES,\n  TILE_SIZE,\n  MIN_ZOOM,\n  MAX_ZOOM,\n  DEFAULT_ZOOM,\n  MAP_MODE,\n  lonLatToTile,\n  tileUrl,\n  tileAttribution,\n  tileCachedBytes,\n  mapMode,\n  isStyleTrusted,\n} from '../data/tiles.js';\n\n/**\n * 视口基准尺寸（px），取自 S57 设计稿的「地图」帧（`17:9`，350×260）。\n *\n * 用它而不是 `clientWidth`：渲染发生在布局之前，假 DOM 里更是恒为 0。\n * 350 / 256 → ceil = 2，+1 = 3；260 / 256 同理 —— 所以「3×3 起步」是按容器算出来的\n * 自然结果，不是拍脑袋写的常数。\n */\nconst VIEW_W = 350;\nconst VIEW_H = 260;\n\n/**\n * 视图状态（模块级：样式与缩放是 UI 局部状态，跨重渲染存活）。\n *\n * 与 `tiles.js` 的 `_mapMode` 同款做法 —— 同一份状态只在一处存，编排层不缓存第二份。\n *\n * @type {{styleId:string, zoom:number, coord:{lat:number, lon:number}|null}}\n */\nconst _view = { styleId: 'street', zoom: DEFAULT_ZOOM, coord: null };\n\n/**\n * 已创建但尚未回收的 Blob URL。\n *\n * 每次重渲染先把上一批全部 revoke（那时对应的 img 早已解码完），img 自己的 onload\n * 里再 revoke 自己一次（幂等，重复 revoke 同一个 URL 不会抛）。双向兜底，避免漏。\n *\n * @type {Set<string>}\n */\nconst _blobUrls = new Set();\n\n/* ------------------------------------------------------------------ */\n/* 基础工具                                                             */\n/* ------------------------------------------------------------------ */\n\n/**\n * 清空并写入容器。\n *\n * @param {HTMLElement} box 容器。\n * @param {Array<Node>} nodes 子节点。\n * @returns {void}\n */\nfunction _fill(box, nodes) {\n  if (!box) return;\n  box.textContent = '';\n  nodes.forEach((n) => n && box.appendChild(n));\n}\n\n/**\n * 取（或创建）卡片槽位，保证增量渲染时位置稳定（与 now.js / compass.js 的 `_slot` 同款）。\n *\n * @param {HTMLElement} root 根容器。\n * @param {string} id 槽位 id（不含 'card-' 前缀）。\n * @returns {HTMLElement} 容器元素。\n */\nfunction _slot(root, id) {\n  const domId = `card-${id}`;\n  let box = root.querySelector(`#${domId}`);\n  if (!box) {\n    box = h('div', { class: 'card-slot', id: domId });\n    root.appendChild(box);\n  }\n  return box;\n}\n\n/**\n * 回收所有已创建的 Blob URL。\n *\n * @returns {void}\n */\nfunction _revokeBlobs() {\n  if (typeof URL === 'undefined' || typeof URL.revokeObjectURL !== 'function') return;\n  _blobUrls.forEach((u) => URL.revokeObjectURL(u));\n  _blobUrls.clear();\n}\n\n/**\n * 设定视图状态（样式 / 缩放 / 坐标）。\n *\n * @param {{styleId?:string, zoom?:number, coord?:{lat:number, lon:number}|null}} patch 增量。\n * @returns {{styleId:string, zoom:number, coord:{lat:number, lon:number}|null}} 合并后的视图。\n */\nexport function setMapView(patch = {}) {\n  if (typeof patch.styleId === 'string' && TILE_STYLES[patch.styleId]) {\n    _view.styleId = patch.styleId;\n  }\n  const z = Number(patch.zoom);\n  if (Number.isFinite(z)) {\n    _view.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, Math.round(z)));\n  }\n  if (patch.coord && Number.isFinite(Number(patch.coord.lat)) && Number.isFinite(Number(patch.coord.lon))) {\n    _view.coord = { lat: Number(patch.coord.lat), lon: Number(patch.coord.lon) };\n  }\n  return { ..._view };\n}\n\n/**\n * 取当前视图状态（测试与编排层读它做断言）。\n *\n * @returns {{styleId:string, zoom:number, coord:{lat:number, lon:number}|null}} 视图状态。\n */\nexport function mapView() {\n  return { ..._view };\n}\n\n/* ------------------------------------------------------------------ */\n/* 瓦片网格                                                             */\n/* ------------------------------------------------------------------ */\n\n/**\n * 视口需要几行几列瓦片（3×3 起步）。\n *\n * @returns {{cols:number, rows:number}} 列数与行数。\n */\nfunction _gridSize() {\n  return {\n    cols: Math.max(3, Math.ceil(VIEW_W / TILE_SIZE) + 1),\n    rows: Math.max(3, Math.ceil(VIEW_H / TILE_SIZE) + 1),\n  };\n}\n\n/**\n * 铺一层瓦片，并统计成败 / 缓存命中 / 耗时。\n *\n * 统计是**异步**收敛的：img 的 load / error 每到一个就刷新一次明细行，\n * 不等全部结束才上屏 —— 与自检页「每次完成即增量上屏」同一条原则。\n *\n * @param {string} styleId 样式 id。\n * @param {number} z 缩放层级。\n * @param {{z:number, x:number, y:number, fx:number, fy:number}} center 中心瓦片（含瓦片内偏移）。\n * @param {{node:HTMLElement, onDone:(stats:Object)=>void}} io 视口节点与统计回调。\n * @returns {{total:number}} 参与渲染的块数（越界块也计入 total，它们注定失败）。\n */\nfunction _layTiles(styleId, z, center, io) {\n  const { cols, rows } = _gridSize();\n  const n = 2 ** z;\n  // 让落点正好落在视口正中：中心瓦片左边缘 = 视口中点 − 落点在瓦片内的偏移\n  const left0 = VIEW_W / 2 - center.fx * TILE_SIZE;\n  const top0 = VIEW_H / 2 - center.fy * TILE_SIZE;\n  const startX = center.x - Math.floor(cols / 2);\n  const startY = center.y - Math.floor(rows / 2);\n\n  const stats = { total: 0, ok: 0, fail: 0, cacheHit: 0, startedAt: Date.now(), elapsedMs: 0 };\n  const cells = [];\n\n  for (let gy = 0; gy < rows; gy += 1) {\n    for (let gx = 0; gx < cols; gx += 1) {\n      const tx = startX + gx;\n      const ty = startY + gy;\n      const pos = {\n        left: left0 + (tx - center.x) * TILE_SIZE,\n        top: top0 + (ty - center.y) * TILE_SIZE,\n      };\n      stats.total += 1;\n      // 越界块（跨过反子午线 / 越过极区）不配拥有 URL：直接判失败，避免把\n      // `tile/12/-1/4096` 这种脏串发出去（与 probeTile 的 PARSE 分支同一条纪律）。\n      if (tx < 0 || ty < 0 || tx >= n || ty >= n) {\n        cells.push(_failedCell(pos));\n        stats.fail += 1;\n        continue;\n      }\n      cells.push(_tileCell(styleId, z, tx, ty, pos, stats, io));\n    }\n  }\n\n  cells.forEach((c) => io.node.appendChild(c));\n  return { total: stats.total };\n}\n\n/**\n * 单块瓦片：先出骨架，字节到了再换成 img。\n *\n * @param {string} styleId 样式 id。\n * @param {number} z 层级。\n * @param {number} tx 列号。\n * @param {number} ty 行号。\n * @param {{left:number, top:number}} pos 视口内像素位置。\n * @param {Object} stats 统计对象（原地累加）。\n * @param {{node:HTMLElement, onDone:(stats:Object)=>void}} io 视口节点与统计回调。\n * @returns {HTMLElement} 瓦片节点。\n */\nfunction _tileCell(styleId, z, tx, ty, pos, stats, io) {\n  const url = tileUrl(styleId, z, tx, ty);\n  const cell = h('div', {\n    class: 'map-cell map-cell--loading',\n    style: `left:${pos.left}px;top:${pos.top}px;width:${TILE_SIZE}px;height:${TILE_SIZE}px`,\n  });\n\n  /**\n   * 落定：成败计数 + 换 class（骨架 → 成/败）+ 刷新明细行。\n   * 每块各自落定、各自刷新，不等整批结束 —— 与自检页「完成一块上一块」同一条原则。\n   */\n  const settle = (ok) => {\n    cell.className = ok ? 'map-cell' : 'map-cell map-cell--fail';\n    if (ok) {\n      stats.ok += 1;\n    } else {\n      stats.fail += 1;\n      cell.appendChild(h('span', { class: 'map-cell-x', 'aria-hidden': 'true', text: '×' }));\n    }\n    stats.elapsedMs = Date.now() - stats.startedAt;\n    io.onDone(stats);\n  };\n\n  const cached = tileCachedBytes(url);\n  const canBlob =\n    typeof URL !== 'undefined' &&\n    typeof URL.createObjectURL === 'function' &&\n    typeof Blob !== 'undefined';\n\n  if (cached && cached.bytes && canBlob) {\n    // 命中缓存：走 Blob URL，省一次网络往返，也不必再等 6 s 超时。\n    // ★必须 revoke：见文件头第 4 条不变量。\n    const blobUrl = URL.createObjectURL(\n      new Blob([cached.bytes], { type: cached.contentType || 'image/jpeg' })\n    );\n    _blobUrls.add(blobUrl);\n    stats.cacheHit += 1;\n    const blobImg = h('img', {\n      class: 'map-cell-img',\n      src: blobUrl,\n      alt: '',\n      decoding: 'async',\n      'aria-hidden': 'true',\n    });\n    blobImg.addEventListener('load', () => {\n      if (typeof URL.revokeObjectURL === 'function') URL.revokeObjectURL(blobUrl);\n      _blobUrls.delete(blobUrl);\n      settle(true);\n    });\n    blobImg.addEventListener('error', () => {\n      if (typeof URL.revokeObjectURL === 'function') URL.revokeObjectURL(blobUrl);\n      _blobUrls.delete(blobUrl);\n      settle(false);\n    });\n    cell.appendChild(blobImg);\n    return cell;\n  }\n\n  // 未命中（或本环境没有 Blob）：直接指向瓦片 URL，让浏览器自己取。\n  // 注意这里**不写缓存** —— 写缓存的唯一入口是 probeTile()，它带指纹与授信门；\n  // 渲染侧绕过它写缓存等于把「占位图不得进缓存」这道门拆了。\n  const img = h('img', {\n    class: 'map-cell-img',\n    src: url,\n    alt: '',\n    decoding: 'async',\n    'aria-hidden': 'true',\n  });\n  img.addEventListener('load', () => settle(true));\n  img.addEventListener('error', () => settle(false));\n  cell.appendChild(img);\n  return cell;\n}\n\n/**\n * 注定失败的块（越界）：直接留白 + ×，不发请求。\n *\n * @param {{left:number, top:number}} pos 视口内像素位置。\n * @returns {HTMLElement} 瓦片节点。\n */\nfunction _failedCell(pos) {\n  return h('div', {\n    class: 'map-cell map-cell--fail',\n    style: `left:${pos.left}px;top:${pos.top}px;width:${TILE_SIZE}px;height:${TILE_SIZE}px`,\n  }, [h('span', { class: 'map-cell-x', 'aria-hidden': 'true', text: '×' })]);\n}\n\n/* ------------------------------------------------------------------ */\n/* 覆盖物                                                               */\n/* ------------------------------------------------------------------ */\n\n/**\n * 落点标记（S57 `17:29`–`17:34`）：光环 + 实心点 + 四向准星。\n *\n * 位置恒在视口正中 —— 网格是按落点对齐铺的（见 `_layTiles()` 的 left0/top0），\n * 不做拖拽平移，所以落点不需要再算一次像素坐标。\n *\n * @returns {HTMLElement} 落点节点。\n */\nfunction _pinNode() {\n  return h('div', { class: 'map-pin', 'aria-hidden': 'true' }, [\n    h('span', { class: 'map-pin-halo' }),\n    h('span', { class: 'map-pin-dot' }),\n    h('span', { class: 'map-pin-tick map-pin-tick--up' }),\n    h('span', { class: 'map-pin-tick map-pin-tick--down' }),\n    h('span', { class: 'map-pin-tick map-pin-tick--left' }),\n    h('span', { class: 'map-pin-tick map-pin-tick--right' }),\n  ]);\n}\n\n/**\n * 缩放控件（S57 `17:45`）：放大 / 缩小两个按钮，边界处禁用。\n *\n * @param {() => void} onChange 变化后重渲染。\n * @returns {HTMLElement} 缩放控件节点。\n */\nfunction _zoomNode(onChange) {\n  const mk = (labelKey, delta, disabled) => {\n    const btn = h('button', {\n      class: 'map-zoom-btn',\n      type: 'button',\n      'aria-label': t(labelKey),\n      title: t(labelKey),\n      disabled: disabled || null,\n      text: delta > 0 ? '+' : '−',\n    });\n    if (!disabled) {\n      btn.addEventListener('click', () => {\n        setMapView({ zoom: _view.zoom + delta });\n        onChange();\n      });\n    }\n    return btn;\n  };\n  return h('div', { class: 'map-zoom' }, [\n    mk('map.zoomIn', 1, _view.zoom >= MAX_ZOOM),\n    h('span', { class: 'map-zoom-sep' }),\n    mk('map.zoomOut', -1, _view.zoom <= MIN_ZOOM),\n  ]);\n}\n\n/**\n * 样式切换三个 chip（S57 `17:36` / `17:38` / `17:40`）。\n *\n * @param {() => void} onChange 变化后重渲染。\n * @returns {HTMLElement} chip 行节点。\n */\nfunction _styleChips(onChange) {\n  const chips = Object.keys(TILE_STYLES).map((id) => {\n    const active = id === _view.styleId;\n    const btn = h('button', {\n      class: active ? 'map-chip map-chip--active' : 'map-chip',\n      type: 'button',\n      'aria-pressed': active ? 'true' : 'false',\n      text: t(TILE_STYLES[id].labelKey),\n    });\n    btn.addEventListener('click', () => {\n      setMapView({ styleId: id });\n      onChange();\n    });\n    return btn;\n  });\n  return h('div', { class: 'map-chips', role: 'group', 'aria-label': t('card.map') }, chips);\n}\n\n/* ------------------------------------------------------------------ */\n/* 文本行                                                               */\n/* ------------------------------------------------------------------ */\n\n/**\n * 状态标记（S57 `17:4`）：「z12 · 已授信 · 缓存命中」。\n *\n * @param {Object} stats 瓦片统计。\n * @returns {string} 状态串。\n */\nfunction _statusText(stats) {\n  const trust = isStyleTrusted(_view.styleId) ? t('map.trusted') : t('map.untrusted');\n  let tail;\n  if (stats.total === 0) tail = t('map.loading');\n  else if (stats.fail > 0) tail = t('map.tailFailed', { n: stats.fail });\n  else if (stats.ok === 0) tail = t('map.loading');\n  else tail = stats.cacheHit > 0 ? t('map.cacheHit') : t('map.loading');\n  return `${t('map.zoom', { zoom: _view.zoom })} · ${trust} · ${tail}`;\n}\n\n/**\n * 坐标行（S57 `17:42`–`17:44`）：坐标（等宽字体）+ 瓦片明细。\n *\n * @param {{lat:number, lon:number}|null} coord 坐标。\n * @param {Object} stats 瓦片统计。\n * @returns {HTMLElement} 坐标行节点。\n */\nfunction _coordRow(coord, stats) {\n  const blocks = t('map.blocks', { ok: stats.ok, total: stats.total });\n  const tail =\n    stats.fail > 0\n      ? t('map.tailBlank', { n: stats.fail })\n      : stats.cacheHit > 0\n        ? t('map.cacheHit')\n        : t('map.loading');\n  return h('div', { class: 'map-coord' }, [\n    h('span', {\n      class: 'map-coord-v',\n      text: coord ? fmt.coord(coord.lat, coord.lon) : t('app.dash'),\n    }),\n    h('span', {\n      class: 'map-coord-d',\n      text: t('map.detail', { blocks, elapsed: fmt.latency(stats.elapsedMs), tail }),\n    }),\n  ]);\n}\n\n/**\n * 署名行（**条款硬要求**，设计稿漏画的一行）。\n *\n * 随样式切换：影像与街道的数据提供方不同，署名串也不同。\n *\n * @returns {HTMLElement} 署名节点。\n */\nfunction _creditRow() {\n  return h('p', { class: 'map-credit' }, [\n    h('span', { class: 'map-credit-k', text: `${t('map.credit')}：` }),\n    h('span', { class: 'map-credit-v', text: tileAttribution(_view.styleId) }),\n  ]);\n}\n\n/* ------------------------------------------------------------------ */\n/* 主入口                                                               */\n/* ------------------------------------------------------------------ */\n\n/**\n * 渲染底图卡（整槽替换）。\n *\n * 三态呈现：\n * - `map`：正常铺瓦片；\n * - `grid`：照样铺，但失败的块留白 + ×（S58），**不宣布无地图**；\n * - `no-map`：一块都不请求，视口内给纯坐标提示（S58 的 no-map 语义）。\n *\n * 纯坐标模式不重试、不转圈 —— 与 tiles.js 的「不重试、不转圈」同一条纪律。\n *\n * @param {HTMLElement} root 根容器。\n * @param {{coord?:{lat:number, lon:number}|null, styleId?:string, zoom?:number,\n *          onStats?:(stats:Object)=>void}} [opts] 选项。\n * @returns {HTMLElement} 卡片槽位节点。\n */\nexport function renderMapCard(root, opts = {}) {\n  if (!root) return null;\n  setMapView({\n    styleId: opts.styleId,\n    zoom: opts.zoom,\n    coord: opts.coord || null,\n  });\n\n  const box = _slot(root, 'map');\n  const rerender = () => renderMapCard(root, { onStats: opts.onStats });\n\n  // 重渲染前先把上一批 Blob URL 收回（对应 img 早已解码完）\n  _revokeBlobs();\n\n  const coord = _view.coord;\n  const mode = mapMode();\n  const stats = { total: 0, ok: 0, fail: 0, cacheHit: 0, startedAt: Date.now(), elapsedMs: 0 };\n\n  // 明细行的刷新：只改文本，不重建网格（否则每块瓦片都会重新解码一次）\n  const detailBox = h('div', { class: 'map-coord' });\n  const statusBox = h('span', { class: 'map-status', text: _statusText(stats) });\n  const onDone = (s) => {\n    statusBox.textContent = _statusText(s);\n    _fill(detailBox, Array.from(_coordRow(coord, s).children));\n    if (typeof opts.onStats === 'function') opts.onStats(s);\n  };\n\n  const viewport = h('div', {\n    class: 'map-viewport',\n    style: `width:${VIEW_W}px;height:${VIEW_H}px`,\n    role: 'img',\n    'aria-label': coord ? `${t('card.map')} · ${fmt.coord(coord.lat, coord.lon)}` : t('card.map'),\n  });\n\n  if (mode === MAP_MODE.NO_MAP || !coord) {\n    // 纯坐标模式：一块都不请求。坐标与数值不受影响，这句话要对用户说清楚。\n    viewport.className = 'map-viewport map-viewport--nomap';\n    viewport.appendChild(\n      h('div', { class: 'map-nomap' }, [\n        h('span', { class: 'map-nomap-t', text: t('map.noMap') }),\n        h('span', { class: 'map-nomap-d', text: t('map.noMapNote') }),\n      ])\n    );\n  } else {\n    const center = lonLatToTile(coord.lat, coord.lon, _view.zoom);\n    _layTiles(_view.styleId, _view.zoom, center, { node: viewport, onDone });\n    viewport.appendChild(_pinNode());\n    viewport.appendChild(_zoomNode(rerender));\n    _fill(detailBox, Array.from(_coordRow(coord, stats).children));\n  }\n\n  const footKey = mode === MAP_MODE.GRID ? 'map.gridFootnote' : 'map.footnote';\n\n  _fill(box, [\n    h('div', { class: 'card' }, [\n      h('p', { class: 'card-title', text: t('card.map') }),\n      h('div', { class: 'map-sub' }, [\n        h('span', { class: 'map-sub-t', text: t('map.subtitle') }),\n        statusBox,\n      ]),\n      _styleChips(rerender),\n      viewport,\n      detailBox,\n      _creditRow(),\n      h('p', { class: 'map-foot', text: t(footKey) }),\n    ]),\n  ]);\n\n  return box;\n}\n\n/**\n * 渲染底图骨架（瓦片未到先占位，不转圈）。\n *\n * @param {HTMLElement} root 根容器。\n * @returns {void}\n */\nexport function renderMapSkeleton(root) {\n  if (!root) return;\n  const box = _slot(root, 'map');\n  _fill(box, [\n    h('div', { class: 'card' }, [\n      h('p', { class: 'card-title', text: t('card.map') }),\n      h('div', { class: 'map-viewport map-viewport--sk', style: `width:${VIEW_W}px;height:${VIEW_H}px` }, [\n        h('span', { class: 'map-sk-note', text: t('map.skeletonNote') }),\n      ]),\n      h('div', { class: 'sk' }),\n    ]),\n  ]);\n}\n",
  "src/ui/download.js": "/**\n * 本地文件下载（Blob + <a download>）\n *\n * 职责：把一段数据当成文件保存到用户设备上。项目里两处在用 —— 自检页导出报告 JSON、\n * 设置页导出备份 JSON —— 两处的下载手法必须完全一致，所以集中在这里，不再各自抄一份。\n *\n * ⚠️ 那个 `setTimeout(revoke, 2000)` 不是随手写的，删掉会让部分浏览器下载失败：\n *   `a.click()` 返回时，浏览器只是**接受了**下载任务，真正的读取（去 Blob URL 取字节）\n *   随后才由浏览器的下载线程做。此刻立刻 `URL.revokeObjectURL()` 等于把文件抽走 ——\n *   桌面上多数浏览器赶得及，移动端 WebView 与部分安卓浏览器会静默失败：不报错、不弹窗、\n *   下载列表里凭空少一个文件，用户只会以为「导出坏了」。\n *   延后 2000 ms 释放是给浏览器留出这段窗口，代价是一个 URL 对象多活两秒。\n *   将来若有人想把它改成「更干净的立即 revoke」，请先拿真机验一遍再动手。\n */\n\n/** Object URL 的释放延迟（毫秒）。理由见文件头注释，改这个值等于改下载成功率。 */\nconst REVOKE_DELAY_MS = 2000;\n\n/**\n * 把数据以 JSON 文件的形式下载到本地。\n *\n * 全程在本机完成：不联网、不上传、`objectURL` 用完即释放。调用方负责取好文件名。\n *\n * @param {string} name 文件名（含扩展名）。\n * @param {*} data 任意可 JSON 序列化的数据。\n * @returns {boolean} 是否成功触发下载（false 表示环境不支持 Blob / objectURL，需调用方提示）。\n */\nexport function downloadJson(name, data) {\n  if (typeof Blob === 'undefined' || typeof URL === 'undefined' || typeof document === 'undefined') return false;\n  try {\n    const json = JSON.stringify(data, null, 2);\n    const blob = new Blob([json], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = name;\n    a.rel = 'noopener';\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    // ★不要改成立即 revoke —— 理由见文件头（点完就释放会让移动端 WebView 静默下载失败）\n    setTimeout(() => URL.revokeObjectURL(url), REVOKE_DELAY_MS);\n    return true;\n  } catch (err) {\n    return false;\n  }\n}\n",
  "src/ui/selfcheck.js": "/**\n * 数据源自检页（真机复验）\n *\n * 职责：逐源串行取样并把结果实时增量上屏，输出可导出的 SelfCheckReport JSON。\n *\n * 关键口径（主理人拍板）：\n *   1) 网络类型：navigator.connection.type 在主流浏览器恒为 undefined，改为**页面上手动点选**\n *      （WiFi / 蜂窝 / 未知，默认未知），并自动附带记录 effectiveType 与 downlink 作为参考；\n *   2) 取样次数：页面可调 1 / 3 / 5，默认 3；先发 1 次预热（不计入统计）；\n *   3) 瓦片指纹：SHA-256 前 16 位 hex，界面统一称「指纹 fp」（不使用其它摘要命名）；\n *      dedupeTiles() 判定 real（各异）/ fake（全同，占位图）；\n *   4) 瓦片取样：3 种样式 × 3 个不同位置。\n *\n * 隐私红线：自检只请求六路数据源，不向任何第三方发请求；force=true 仅本页使用。\n */\n\nimport { t, APP_NAME, APP_VERSION } from '../i18n/zh.js';\nimport { request, makeError, isOnline, resetQueue } from '../core/http.js';\nimport { SOURCE_LIST, apiSources } from '../data/sources.js';\nimport { resetHealth, recordResult, addSample } from '../data/health.js';\nimport {\n  probeTile,\n  dedupeTiles,\n  sampleTiles,\n  TILE_STYLES,\n  styleLabel,\n  markStyleTrusted,\n  degradeMapMode,\n  mapMode,\n} from '../data/tiles.js';\nimport { getNetworkType, setNetworkType as storeSetNetworkType, getThemeMode, log } from '../core/store.js';\nimport { stamp, latency as fmtLatency, bytes as fmtBytes } from '../core/format.js';\nimport { h, applyI18n } from './now.js';\nimport { downloadJson } from './download.js';\nimport { applyThemeMode } from './theme.js';\n\n// ★主题引导（模块顶层）：本页是四个入口之一，必须在 module 求值那一刻就把 store 里的\n// themeMode 写到 <html data-theme> 上，不能等 init() —— 否则用户会先看到一帧系统色。\n// 实现与四组合语义见 ui/theme.js 文件头。\napplyThemeMode(getThemeMode());\n\n/** 每源正式取样次数默认值。 */\nexport const DEFAULT_SAMPLES = 3;\n\n/** 可选取样次数。 */\nexport const SAMPLE_OPTIONS = [1, 3, 5];\n\n/** 网络类型选项。 */\nexport const NETWORK_OPTIONS = ['wifi', 'cellular', 'unknown'];\n\n/** 自检探测用坐标（北京天安门，避免依赖定位权限）。 */\nexport const PROBE_COORD = { lat: 39.9087, lon: 116.3975 };\n\n/** 探测用地名关键词（geocode 需要）。 */\nexport const PROBE_KEYWORD = '北京';\n\n/** @type {number} 当前取样次数。 */\nlet _samples = DEFAULT_SAMPLES;\n\n/** @type {'wifi'|'cellular'|'unknown'} 当前网络类型。 */\nlet _networkType = 'unknown';\n\n/** @type {Object|null} 最近一份报告。 */\nlet _report = null;\n\n/** @type {boolean} 是否正在自检（防重复点击）。 */\nlet _running = false;\n\n/* ------------------------------------------------------------------ */\n/* 小工具                                                               */\n/* ------------------------------------------------------------------ */\n\n/**\n * 取 DOM 元素（缺失返回 null，不抛）。\n *\n * @param {string} id 元素 id。\n * @returns {HTMLElement|null} 元素。\n */\nfunction _el(id) {\n  return typeof document !== 'undefined' && document ? document.getElementById(id) : null;\n}\n\n/**\n * 取 effectiveType（浏览器不支持时 'unknown'）。\n *\n * @returns {string} effectiveType。\n */\nfunction _effectiveType() {\n  try {\n    const c = typeof navigator !== 'undefined' ? navigator.connection || navigator.mozConnection || navigator.webkitConnection : null;\n    return c && c.effectiveType ? String(c.effectiveType) : 'unknown';\n  } catch (err) {\n    return 'unknown';\n  }\n}\n\n/**\n * 取 downlink（Mb/s；不支持时 null）。\n *\n * @returns {number|null} downlink。\n */\nfunction _downlink() {\n  try {\n    const c = typeof navigator !== 'undefined' ? navigator.connection || navigator.mozConnection || navigator.webkitConnection : null;\n    const v = c && c.downlink !== undefined ? Number(c.downlink) : NaN;\n    return Number.isFinite(v) ? v : null;\n  } catch (err) {\n    return null;\n  }\n}\n\n/**\n * 取 User-Agent。\n *\n * @returns {string} UA 串。\n */\nfunction _userAgent() {\n  try {\n    return typeof navigator !== 'undefined' && navigator.userAgent ? String(navigator.userAgent) : 'unknown';\n  } catch (err) {\n    return 'unknown';\n  }\n}\n\n/**\n * 中位数。\n *\n * @param {number[]} arr 数值数组（升序或无序）。\n * @returns {number|null} 中位数或 null。\n */\nfunction _p50(arr) {\n  if (!Array.isArray(arr) || arr.length === 0) return null;\n  const s = [...arr].sort((a, b) => a - b);\n  const mid = Math.floor(s.length / 2);\n  return s.length % 2 === 1 ? s[mid] : (s[mid - 1] + s[mid]) / 2;\n}\n\n/**\n * 追加一行日志到页面（debug 与自检过程可见）。\n *\n * @param {string} line 日志行。\n * @returns {void}\n */\nfunction _pageLog(line) {\n  const box = _el('log');\n  if (!box) return;\n  box.textContent = `${box.textContent}${box.textContent ? '\\n' : ''}${line}`;\n  box.scrollTop = box.scrollHeight;\n  log(line);\n}\n\n/* ------------------------------------------------------------------ */\n/* 行渲染                                                               */\n/* ------------------------------------------------------------------ */\n\n/**\n * 渲染（或更新）一行数据源结果。\n *\n * @param {Object} item SelfCheckItem。\n * @param {{progress?:string}} [opts] 进度提示。\n * @returns {void}\n */\nfunction _renderItem(item, opts = {}) {\n  const list = _el('src-list');\n  if (!list) return;\n  const domId = `row-${item.sourceId}`;\n  let row = list.querySelector(`#${domId}`);\n\n  // 还没跑完（有进度提示且尚未取样）时显示「进行中」\n  const status = opts.progress && item.attemptCount === 0 ? 'running' : item.status;\n\n  const metrics = [];\n  if (item.samplesMs.length > 0) {\n    metrics.push(t('sc.latencyRange', { min: Math.round(Math.min(...item.samplesMs)), max: Math.round(Math.max(...item.samplesMs)) }));\n    const p50 = _p50(item.samplesMs);\n    if (p50 !== null) metrics.push(t('sc.latencyP50', { ms: Math.round(p50) }));\n    const avg = item.samplesMs.reduce((a, b) => a + b, 0) / item.samplesMs.length;\n    metrics.push(t('sc.latencyAvg', { ms: Math.round(avg) }));\n  }\n  if (item.httpStatus !== null) metrics.push(t('sc.httpStatus', { status: item.httpStatus }));\n  metrics.push(`${t('sc.samples')} ${item.successCount}/${item.attemptCount}`);\n  if (opts.progress) metrics.push(opts.progress);\n  if (item.error) metrics.push(`[${item.error.code}] ${item.error.message}`);\n\n  const nodes = [\n    h('div', { class: 'sc-row-head' }, [\n      h('span', { class: 'sc-row-name', text: item.label }),\n      h('span', { class: `chip chip--${status === 'running' ? 'idle' : status}`, text: t(`status.${status}`) }),\n    ]),\n    h('div', { class: 'sc-row-metrics' }, metrics.map((m) => h('span', { text: m }))),\n    h('div', { class: 'sc-row-url', text: item.url || t('app.dash') }),\n  ];\n\n  if (!row) {\n    row = h('div', { class: 'sc-row', id: domId });\n    list.appendChild(row);\n  }\n  row.textContent = '';\n  nodes.forEach((n) => row.appendChild(n));\n}\n\n/**\n * 渲染（或更新）一行瓦片探测结果。\n *\n * @param {Object} probe TileProbe。\n * @returns {void}\n */\nfunction _renderTile(probe) {\n  const list = _el('tile-list');\n  if (!list) return;\n  const domId = `tile-${probe.styleId}-${probe.z}-${probe.x}-${probe.y}`;\n  const nodes = [\n    h('div', { class: 'sc-row-head' }, [\n      h('span', { class: 'sc-row-name', text: `${probe.label} · z${probe.z}/${probe.x}/${probe.y}` }),\n      h('span', { class: `chip chip--${probe.ok ? 'ok' : 'failed'}`, text: probe.ok ? t('status.ok') : t('status.failed') }),\n    ]),\n    h('div', { class: 'sc-row-metrics' }, [\n      h('span', { text: fmtLatency(probe.latencyMs) }),\n      h('span', { text: fmtBytes(probe.bytes) }),\n      h('span', { text: probe.httpStatus !== null ? t('sc.httpStatus', { status: probe.httpStatus }) : t('app.dash') }),\n      h('span', { text: `${t('sc.fpShort')} ${probe.fp ? probe.fp.slice(0, 12) : t('app.dash')}` }),\n      h('span', { text: probe.fpAlgo ? t('sc.fpAlgo', { algo: probe.fpAlgo }) : t('app.dash') }),\n    ]),\n    // 非法坐标时 probe.url 为 null（tiles.js 刻意不给脏 URL），这里回落到占位符\n    h('div', { class: 'sc-row-url', text: probe.url || t('app.dash') }),\n  ];\n  let row = list.querySelector(`#${domId}`);\n  if (!row) {\n    row = h('div', { class: 'sc-row', id: domId });\n    list.appendChild(row);\n  }\n  row.textContent = '';\n  nodes.forEach((n) => row.appendChild(n));\n}\n\n/**\n * 把各样式的去重判定收敛成整轮结论。\n *\n * 为什么不能直接拿 9 块瓦片一起比：不同样式本来就是不同底图，跨样式比指纹没有意义 ——\n * 全相异只能证明「街道图和影像图不是同一张图」，证明不了「这是真瓦片」；\n * 反过来，若取样位置在三种样式下重合，跨样式的 unique 还会被人为压低。\n * 真正有效的证据是「同一样式、三个远离位置」内部的指纹关系，所以整轮结论取各样式的共识：\n * 全部 fake → fake；全部 real → real；只要有 unknown 或结论打架 → unknown（保守）。\n *\n * @param {Object<string, Object>} byStyle 样式 id → DedupeVerdict。\n * @returns {'real'|'fake'|'unknown'} 整轮去重结论。\n */\nfunction _dedupeOverall(byStyle) {\n  const ids = Object.keys(byStyle || {});\n  if (ids.length === 0) return 'unknown';\n  const verdicts = ids.map((id) => (byStyle[id] && byStyle[id].verdict) || 'unknown');\n  if (verdicts.every((v) => v === 'fake')) return 'fake';\n  if (verdicts.every((v) => v === 'real')) return 'real';\n  return 'unknown';\n}\n\n/**\n * 渲染去重判定汇总。\n *\n * @param {Object} dedupe DedupeVerdict（含 byStyle）。\n * @returns {void}\n */\nfunction _renderDedupe(dedupe) {\n  const box = _el('tile-dedupe');\n  if (!box || !dedupe) return;\n  const lines = [];\n  const key = dedupe.verdict === 'real' ? 'sc.dedupeReal' : dedupe.verdict === 'fake' ? 'sc.dedupeFake' : 'sc.dedupeUnknown';\n  const byStyle = dedupe.byStyle || {};\n  lines.push(t(key, { unique: dedupe.unique, total: dedupe.total, styles: Object.keys(byStyle).length }));\n  Object.keys(byStyle).forEach((styleId) => {\n    const d = byStyle[styleId];\n    lines.push(t('sc.dedupeByStyle', { label: styleLabel(styleId), unique: d.unique, total: d.total, verdict: d.verdict }));\n  });\n  box.textContent = lines.join('\\n');\n}\n\n/**\n * 渲染顶部汇总条。\n *\n * @param {Object} report SelfCheckReport。\n * @returns {void}\n */\nfunction _renderSummary(report) {\n  const box = _el('summary');\n  if (!box) return;\n  box.hidden = false;\n  const passCount = report.results.filter((r) => r.status === 'ok').length;\n  const tileOk = report.tiles.filter((x) => x.ok).length;\n  box.textContent = '';\n  box.appendChild(\n    h('span', { text: `${t('sc.summary.pass', { pass: passCount, total: report.results.length })} · ${t('sc.tiles')} ${tileOk}/${report.tiles.length}` })\n  );\n  box.appendChild(\n    h('span', { class: `chip chip--${report.verdict === 'all-ok' ? 'ok' : report.verdict === 'offline' ? 'offline' : 'stale'}`, text: t(`sc.verdict.${report.verdict}`) })\n  );\n  const btn = _el('btn-export');\n  if (btn) btn.disabled = false;\n  const copyBtn = _el('btn-copy');\n  if (copyBtn) copyBtn.disabled = false;\n  const slimBtn = _el('btn-copy-compact');\n  if (slimBtn) slimBtn.disabled = false;\n}\n\n/* ------------------------------------------------------------------ */\n/* 主流程                                                               */\n/* ------------------------------------------------------------------ */\n\n/**\n * 生成探测上下文。\n *\n * @returns {{lat:number, lon:number, keyword:string, lang:string}} 上下文。\n */\nfunction _probeCtx() {\n  return { lat: PROBE_COORD.lat, lon: PROBE_COORD.lon, keyword: PROBE_KEYWORD, lang: 'zh' };\n}\n\n/**\n * 运行一轮自检。\n *\n * @param {{samples?:number, networkType?:'wifi'|'cellular'|'unknown'}} [opts] 选项。\n * @returns {Promise<Object>} SelfCheckReport。\n */\nexport async function runSelfCheck(opts = {}) {\n  const samples = SAMPLE_OPTIONS.indexOf(Number(opts.samples)) !== -1 ? Number(opts.samples) : DEFAULT_SAMPLES;\n  const networkType = NETWORK_OPTIONS.indexOf(opts.networkType) !== -1 ? opts.networkType : _networkType;\n  _samples = samples;\n  _networkType = networkType;\n\n  resetQueue();\n  resetHealth();\n\n  const online = isOnline();\n  const ctx = _probeCtx();\n\n  const report = {\n    app: APP_NAME,\n    version: APP_VERSION,\n    generatedAt: Date.now(),\n    networkType,\n    effectiveType: _effectiveType(),\n    downlink: _downlink(),\n    online,\n    samples,\n    warmup: true,\n    userAgent: _userAgent(),\n    results: [],\n    tiles: [],\n    tileDedupe: null,\n    verdict: 'partial',\n  };\n\n  _pageLog(`${t('sc.networkType')}：${t(`sc.net.${networkType}`)} · ${t('sc.samples')} ${samples} · ${t('sc.warmup')}`);\n  _pageLog(t('sc.effectiveType', { value: report.effectiveType }));\n  _pageLog(t('sc.downlink', { value: report.downlink === null ? t('app.unknown') : report.downlink }));\n  _pageLog(t('sc.userAgent', { value: report.userAgent }));\n\n  // 【必修 1】取样分组必须用 kind 判定，不能用「源 id 不在样式 id 列表里」这种间接条件：\n  // TILE_STYLES 的键是 street/imagery/dark，源 id 是 'tile'，两者永远不相等 ——\n  // 旧写法等价于「不过滤」，于是 tile 被塞进 API 结果表，而 ctx 里没有 styleId/z/x/y，\n  // tileUrl 会把 undefined 拼进路径发出 `.../tile/undefined/undefined/undefined` 畸形请求。\n  const tileIds = Object.keys(TILE_STYLES);\n  const apiList = apiSources();\n\n  // ---- 五路 API 源：预热 1 次 + 正式取样 samples 次 ----\n  for (const spec of apiList) {\n    const item = {\n      sourceId: spec.id,\n      label: spec.label,\n      url: '',\n      status: 'failed',\n      latencyMin: null,\n      latencyMax: null,\n      latencyP50: null,\n      latencyAvg: null,\n      samplesMs: [],\n      successCount: 0,\n      attemptCount: 0,\n      httpStatus: null,\n      error: null,\n    };\n    _renderItem(item, { progress: t('app.loading') });\n\n    if (!online) {\n      // 离线：一律不发请求（隐私与性能硬约束）\n      item.status = 'offline';\n      item.error = makeError('OFFLINE', spec.id);\n      _renderItem(item);\n      report.results.push(item);\n      continue;\n    }\n\n    // 预热（结果丢弃，不计入统计）\n    const warm = await request(spec.id, ctx, { force: true });\n    item.url = warm.meta.requestUrl;\n    _pageLog(`warmup ${spec.id} → ${warm.ok ? 'ok' : warm.error.code} ${Math.round(warm.meta.latencyMs)} ms`);\n\n    for (let i = 0; i < samples; i += 1) {\n      const r = await request(spec.id, ctx, { force: true });\n      item.attemptCount += 1;\n      addSample(spec.id, r.meta.latencyMs);\n      recordResult(r);\n      if (r.ok) {\n        item.successCount += 1;\n        item.samplesMs.push(Math.round(r.meta.latencyMs));\n        item.httpStatus = r.meta.httpStatus;\n      } else {\n        item.error = r.error;\n        item.httpStatus = r.meta.httpStatus;\n      }\n      _renderItem(item, { progress: t('sc.sampleDone', { i: i + 1, n: samples }) });\n    }\n\n    if (item.samplesMs.length > 0) {\n      item.latencyMin = Math.round(Math.min(...item.samplesMs));\n      item.latencyMax = Math.round(Math.max(...item.samplesMs));\n      item.latencyP50 = _p50(item.samplesMs);\n      item.latencyAvg = Math.round(item.samplesMs.reduce((a, b) => a + b, 0) / item.samplesMs.length);\n    }\n    item.status = item.successCount > 0 ? 'ok' : 'failed';\n    _renderItem(item);\n    report.results.push(item);\n  }\n\n  // ---- 瓦片：3 样式 × 3 位置 ----\n  if (online) {\n    const tiles = sampleTiles(PROBE_COORD);\n    for (const styleId of tileIds) {\n      for (const tile of tiles) {\n        // ★必须 useCache:false：自检测的是真实链路质量，命中缓存会让这一轮数据全废\n        // （时延恒为 0、还测不出网络抖动）。写缓存与否另由「样式授信」决定，与这个开关无关。\n        const probe = await probeTile(styleId, tile, { useCache: false });\n        report.tiles.push(probe);\n        _renderTile(probe);\n      }\n    }\n    const byStyle = {};\n    for (const styleId of tileIds) {\n      byStyle[styleId] = dedupeTiles(report.tiles.filter((x) => x.styleId === styleId));\n    }\n    // unique/total 仍是 9 块瓦片的原始统计（便于人工核对），\n    // 但 verdict 一律走 byStyle 共识 —— 跨样式比指纹得不出可信结论，见 _dedupeOverall 注释。\n    const overall = dedupeTiles(report.tiles);\n    report.tileDedupe = { ...overall, verdict: _dedupeOverall(byStyle), byStyle };\n    _renderDedupe(report.tileDedupe);\n\n    // ---- 样式授信：自检页既是「体检」也是「授信」入口 ----\n    // 只有真机验明是真瓦片（同一样式多位置指纹各异 → real），日常使用（此刻屏）才允许走缓存；\n    // 判 fake 是「确诊占位图」的正面证据，必须立刻撤销授信并清空该样式的缓存。\n    // unknown 只是样本不足，不足以推翻既有结论，故不动。\n    for (const styleId of tileIds) {\n      const verdict = byStyle[styleId] && byStyle[styleId].verdict;\n      if (verdict === 'real') markStyleTrusted(styleId, true);\n      else if (verdict === 'fake') markStyleTrusted(styleId, false);\n    }\n\n    // ---- 整批裁决地图模式 ----\n    // 单块的成败不决定全局：9 块里坏 2 块不代表底图全废（真机瓦片时延波动 13 倍）。\n    // 全成 → map；全败 → no-map；部分失败 → grid（仅网格 + 坐标，先不宣布无地图）。\n    degradeMapMode(report.tiles);\n    _pageLog(t('sc.mapMode', { mode: t(`sc.mapMode.${mapMode()}`) }));\n  } else {\n    report.tileDedupe = { total: 0, unique: 0, fps: [], verdict: 'unknown', byStyle: {} };\n    _pageLog(t('sc.offlineSkip'));\n  }\n  report.mapMode = mapMode();\n\n  // ---- 汇总判定 ----\n  // verdict 回答「这一轮能不能放心用」：五路 API 全通 + 九块瓦片都拿到字节 + 瓦片不是占位图。\n  // 前两条只证明「可达」（200 也可能是占位图），第三条由 tileDedupe.verdict 兜住：\n  // 只要整轮去重判定为 fake，就不许判 all-ok —— 否则「假成功源」会被当成健康源放行。\n  // 口径细节与真机复验读法见 README「真机复验怎么读」。\n  if (!online) {\n    report.verdict = 'offline';\n  } else {\n    const allApiOk = report.results.length > 0 && report.results.every((r) => r.status === 'ok');\n    const allTilesOk = report.tiles.length > 0 && report.tiles.every((x) => x.ok);\n    const tilesNotFake = !report.tileDedupe || report.tileDedupe.verdict !== 'fake';\n    report.verdict = allApiOk && allTilesOk && tilesNotFake ? 'all-ok' : 'partial';\n  }\n  report.generatedAt = Date.now();\n  _renderSummary(report);\n  _report = report;\n  return report;\n}\n\n/**\n * 导出报告 JSON（文件名 geoscope-selfcheck-<YYYYMMDD-HHmm>.json）。\n *\n * @param {Object} [report] 报告；缺省用最近一份。\n * @returns {void}\n */\nexport function exportReport(report) {\n  const data = report || _report;\n  if (!data) return;\n  const name = t('sc.exportName', { stamp: stamp(data.generatedAt) });\n  // 下载手法统一走 ui/download.js（含「延后释放 objectURL」那条不可删的细节），\n  // 这里只负责取名与结果反馈，导出签名与产物格式均不变。\n  if (downloadJson(name, data)) {\n    _pageLog(`export → ${name}`);\n  } else {\n    _pageLog(t('sc.exportFail'));\n  }\n}\n\n/**\n * 把文本复制到剪贴板，三级降级。\n *\n * 三级降级：Clipboard API（需安全上下文，file:// 通常算）→ 隐藏 textarea +\n * execCommand → 把文本显示在页面上供长按选中。\n *\n * 抽出来给「复制结果」与「复制精简版」共用。\n *\n * @param {string} text 要复制的文本。\n * @param {string} [okKey] 成功提示的文案键。\n * @param {string} [failKey] 落到最后一级时的提示文案键。\n * @returns {void}\n */\nfunction _copyText(text, okKey, failKey) {\n  const ok = okKey || 'sc.copyOk';\n  const fallback = () => {\n    try {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      ta.setAttribute('readonly', '');\n      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';\n      document.body.appendChild(ta);\n      ta.select();\n      ta.setSelectionRange(0, text.length);\n      const done = document.execCommand('copy');\n      document.body.removeChild(ta);\n      if (done) {\n        _pageLog(t(ok));\n        return;\n      }\n    } catch (err) {\n      /* 落到最后一级 */\n    }\n    const pre = _el('log');\n    if (pre) {\n      pre.textContent = text;\n      _pageLog(t(failKey || 'sc.copyFail'));\n    }\n  };\n\n  try {\n    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {\n      navigator.clipboard.writeText(text).then(() => _pageLog(t(ok)), fallback);\n      return;\n    }\n  } catch (err) {\n    /* 落到下一级 */\n  }\n  fallback();\n}\n\n/**\n * 生成精简版报告：剔掉超长字段（各源 URL、UA、label），只留判定要用的数字。\n *\n * 存在意义：完整 JSON 约 4.5 KB —— 各源 URL 与 UA 就占去一大半。\n * 在微信里粘贴这种长度，会超出单条消息上限或被输入框截断\n * （真机两轮实测各被截断一次，两次都丢在瓦片区）。精简后约 1.5 KB。\n *\n * 注意：byStyle 里只保留体量统计与判定，不重复罗列 fps —— 指纹本身\n * 已经逐块记在 tiles 里，重复一遍纯属浪费通道。\n *\n * @param {Object} [data] 完整报告；缺省用最近一份。\n * @returns {Object|null} 精简报告；无报告时返回 null。\n */\nexport function compactReport(data) {\n  const d = data || _report;\n  if (!d) return null;\n  const src = (d.tileDedupe && d.tileDedupe.byStyle) || {};\n  const byStyle = {};\n  for (const key of Object.keys(src)) {\n    byStyle[key] = { total: src[key].total, unique: src[key].unique, verdict: src[key].verdict };\n  }\n  return {\n    app: d.app,\n    version: d.version,\n    generatedAt: d.generatedAt,\n    networkType: d.networkType,\n    effectiveType: d.effectiveType,\n    downlink: d.downlink,\n    online: d.online,\n    samples: d.samples,\n    warmup: d.warmup,\n    results: (d.results || []).map((r) => ({\n      sourceId: r.sourceId,\n      status: r.status,\n      latencyP50: r.latencyP50,\n      latencyMin: r.latencyMin,\n      latencyMax: r.latencyMax,\n      samplesMs: r.samplesMs,\n      successCount: r.successCount,\n      httpStatus: r.httpStatus,\n    })),\n    tiles: (d.tiles || []).map((x) => ({\n      styleId: x.styleId,\n      z: x.z,\n      x: x.x,\n      y: x.y,\n      ok: x.ok,\n      latencyMs: x.latencyMs,\n      bytes: x.bytes,\n      fp: x.fp,\n    })),\n    tileDedupe: d.tileDedupe\n      ? { total: d.tileDedupe.total, unique: d.tileDedupe.unique, verdict: d.tileDedupe.verdict, byStyle }\n      : null,\n    verdict: d.verdict,\n  };\n}\n\n/**\n * 把完整报告 JSON 复制到剪贴板。\n *\n * @param {Object} [report] 报告；缺省用最近一份。\n * @returns {void}\n */\nexport function copyReport(report) {\n  const data = report || _report;\n  if (!data) return;\n  _copyText(JSON.stringify(data, null, 2));\n}\n\n/**\n * 把精简版报告 JSON 复制到剪贴板（无缩进，约 1.5 KB）。\n *\n * 手机端取数首选这条路径：短到不会被任何输入框截断。\n *\n * @param {Object} [report] 报告；缺省用最近一份。\n * @returns {void}\n */\nexport function copyCompact(report) {\n  const data = report || _report;\n  if (!data) return;\n  const slim = compactReport(data);\n  if (!slim) return;\n  _copyText(JSON.stringify(slim), 'sc.copyCompactOk', 'sc.copyCompactFail');\n}\n\n/**\n * 设置网络类型（手动点选，写入 store）。\n *\n * @param {'wifi'|'cellular'|'unknown'} type 网络类型。\n * @returns {void}\n */\nexport function setNetworkType(type) {\n  _networkType = NETWORK_OPTIONS.indexOf(type) !== -1 ? type : 'unknown';\n  storeSetNetworkType(_networkType);\n  if (_report) _report.networkType = _networkType;\n}\n\n/**\n * 设置取样次数。\n *\n * @param {number} n 次数（1/3/5）。\n * @returns {void}\n */\nexport function setSamples(n) {\n  _samples = SAMPLE_OPTIONS.indexOf(Number(n)) !== -1 ? Number(n) : DEFAULT_SAMPLES;\n}\n\n/* ------------------------------------------------------------------ */\n/* 页面装配                                                             */\n/* ------------------------------------------------------------------ */\n\n/**\n * 绑定分段控件（网络类型 / 取样次数）。\n *\n * @param {string} id 容器 id。\n * @param {(value:string) => void} onPick 选中回调。\n * @returns {void}\n */\nfunction _bindSeg(id, onPick) {\n  const box = _el(id);\n  if (!box) return;\n  box.addEventListener('click', (ev) => {\n    const btn = ev.target && ev.target.closest ? ev.target.closest('.seg-btn') : null;\n    if (!btn) return;\n    Array.prototype.forEach.call(box.querySelectorAll('.seg-btn'), (b) => b.classList.remove('seg-btn--active'));\n    btn.classList.add('seg-btn--active');\n    onPick(btn.getAttribute('data-value'));\n  });\n}\n\n/**\n * 渲染六源占位行（未自检时先列出源名与宿主）。\n *\n * @returns {void}\n */\nfunction _renderPlaceholders() {\n  const list = _el('src-list');\n  if (!list) return;\n  list.textContent = '';\n  SOURCE_LIST.forEach((spec) => {\n    list.appendChild(\n      h('div', { class: 'sc-row' }, [\n        h('div', { class: 'sc-row-head' }, [\n          h('span', { class: 'sc-row-name', text: spec.label }),\n          h('span', { class: 'chip chip--idle', text: t('status.idle') }),\n        ]),\n        h('div', { class: 'sc-row-url', text: spec.host }),\n      ])\n    );\n  });\n}\n\n/**\n * 自检页初始化（DOM 就绪后调用）。\n *\n * @returns {void}\n */\nexport function init() {\n  // 静态 HTML 外壳的文案统一由 i18n 填充（HTML 内不硬编码中文）\n  applyI18n(document);\n  if (typeof document !== 'undefined' && document.title !== undefined) {\n    document.title = `${t('app.name')} · ${t('sc.title')}`;\n  }\n\n  _networkType = getNetworkType() || 'unknown';\n\n  // 同步分段控件初始选中态\n  const ntBox = _el('network-type');\n  if (ntBox) {\n    Array.prototype.forEach.call(ntBox.querySelectorAll('.seg-btn'), (b) => {\n      b.classList.toggle('seg-btn--active', b.getAttribute('data-value') === _networkType);\n    });\n  }\n\n  _bindSeg('network-type', (v) => {\n    setNetworkType(v);\n    _pageLog(`${t('sc.networkType')} → ${t(`sc.net.${v}`)}`);\n  });\n  _bindSeg('sample-count', (v) => {\n    setSamples(Number(v));\n    _pageLog(`${t('sc.samples')} → ${v}`);\n  });\n\n  const runBtn = _el('btn-run');\n  if (runBtn) {\n    runBtn.addEventListener('click', async () => {\n      if (_running) return;\n      _running = true;\n      runBtn.disabled = true;\n      runBtn.textContent = t('sc.running');\n      const list = _el('src-list');\n      if (list) list.textContent = '';\n      const tiles = _el('tile-list');\n      if (tiles) tiles.textContent = '';\n      try {\n        await runSelfCheck({ samples: _samples, networkType: _networkType });\n      } catch (err) {\n        _pageLog(`run failed: ${err && err.message}`);\n      } finally {\n        _running = false;\n        runBtn.disabled = false;\n        runBtn.textContent = t('sc.run');\n      }\n    });\n  }\n\n  const exportBtn = _el('btn-export');\n  if (exportBtn) {\n    exportBtn.addEventListener('click', () => exportReport(_report));\n  }\n\n  const copyBtn = _el('btn-copy');\n  if (copyBtn) {\n    copyBtn.addEventListener('click', () => copyReport(_report));\n  }\n\n  const slimBtn = _el('btn-copy-compact');\n  if (slimBtn) {\n    slimBtn.addEventListener('click', () => copyCompact(_report));\n  }\n\n  _renderPlaceholders();\n}\n\nif (typeof document !== 'undefined' && document !== null) {\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', init);\n  } else {\n    init();\n  }\n}\n",
  };
  var ORDER = [
    "src/i18n/zh.js",
    "src/core/cache.js",
    "src/core/geo.js",
    "src/core/format.js",
    "src/core/sun.js",
    "src/core/store.js",
    "src/core/wmo.js",
    "src/core/http.js",
    "src/data/tiles.js",
    "src/data/openmeteo.js",
    "src/data/photon.js",
    "src/data/sources.js",
    "src/data/health.js",
    "src/ui/theme.js",
    "src/ui/placesearch.js",
    "src/ui/legend.js",
    "src/ui/now.js",
    "src/ui/map.js",
    "src/ui/download.js",
    "src/ui/selfcheck.js"
  ];
  var ENTRY = "src/ui/selfcheck.js";

  function dirname(p) {
    var i = p.lastIndexOf('/');
    return i < 0 ? '' : p.slice(0, i);
  }
  function absPath(from, spec) {
    var parts = (dirname(from) + '/' + spec).split('/');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i];
      if (s === '' || s === '.') continue;
      if (s === '..') { out.pop(); continue; }
      out.push(s);
    }
    return out.join('/');
  }

  var urls = {};
  try {
    for (var i = 0; i < ORDER.length; i++) {
      var key = ORDER[i];
      var src = MODULES[key].replace(
        /(\bfrom\s*['"])(\.\.?\/[^'"]+?\.js)(['"])/g,
        function (m, a, spec, c) {
          var dep = absPath(key, spec);
          if (!urls[dep]) throw new Error('依赖缺失: ' + dep);
          return a + urls[dep] + c;
        }
      );
      urls[key] = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    }
  } catch (err) {
    var box = document.createElement('pre');
    box.style.cssText = 'padding:16px;color:#C0563C;font:13px/1.6 monospace;white-space:pre-wrap';
    box.textContent = '自检页装配失败：' + (err && err.message ? err.message : String(err));
    document.body.insertBefore(box, document.body.firstChild);
    return;
  }

  import(urls[ENTRY]).catch(function (err) {
    var box = document.createElement('pre');
    box.style.cssText = 'padding:16px;color:#C0563C;font:13px/1.6 monospace;white-space:pre-wrap';
    box.textContent = '自检页加载失败：' + (err && err.message ? err.message : String(err));
    document.body.insertBefore(box, document.body.firstChild);
  });
})();
</script>
