<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="sc.title">数据源自检</title>

  <meta name="theme-color" content="#1E9C8C" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="地候" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='96'%20fill='%231E9C8C'/%3E%3Ccircle%20cx='256'%20cy='256'%20r='120'%20fill='none'%20stroke='%23ffffff'%20stroke-width='24'/%3E%3Cpath%20d='M256%2096v320M96%20256h320'%20stroke='%23ffffff'%20stroke-width='16'%20opacity='.85'/%3E%3C/svg%3E" />
  <style>
/**
 * 设计令牌（Design Tokens）
 *
 * 职责：集中定义「地候 GeoScope」的视觉基线 —— 品牌色、屏渐变、文本层级、8pt 栅格、
 * 字号阶梯、圆角、阴影、玻璃材质。深浅双主题在此成对定义，业务样式一律只引用变量，
 * 不允许在 app.css 里再写死颜色。
 *
 * 命名：'--c-*' 颜色 / '--sp-*' 间距 / '--fs-*' 字号 / '--r-*' 圆角 / '--sh-*' 阴影。
 * 字体：只允许 font-family 声明，禁止任何字体外链（隐私红线：不向字体 CDN 发请求）。
 */

:root {
  /* ---------- 品牌 ---------- */
  --c-brand: #1e9c8c;          /* 晨曦青（亮态） */
  --c-brand-dark: #2bb6a3;     /* 晨曦青（暗态） */
  /* 实心填充专用：--c-brand 压白字只有 3.39:1（深浅同值，见 contrast-audit），撑不住
     「实心底 + 白字」的场景。--c-brand 本身不动（它还承担描边、图标、8% 浅填充），
     实心按钮/当前 Tab 一律改用这个更深的变体：白字实测 4.94:1。 */
  --c-brand-solid: #167e70;
  --c-hot: #e08a3c;            /* 温度高 */
  --c-cold: #4a93b8;           /* 温度低 */
  --c-alert: #c9584b;          /* 告警红 */
  --c-ok: var(--c-brand);
  --c-warn: #e0a13c;

  /* ---------- 字体 ---------- */
  --ff-sans: 'Noto Sans SC', 'Geist', system-ui, -apple-system, 'Segoe UI', 'PingFang SC',
    'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  --ff-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;

  /* ---------- 字号阶梯 ---------- */
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 20px;
  --fs-2xl: 26px;
  --fs-hero: 56px;   /* 此刻温度 */
  --fs-hero-sm: 40px;

  /* ---------- 8pt 栅格 ---------- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ---------- 圆角 ---------- */
  --r-card: 20px;    /* 卡片 18–20 */
  --r-card-sm: 18px;
  --r-pill: 36px;    /* 胶囊 */
  --r-chip: 12px;

  /* ---------- 触达 ---------- */
  --touch-min: 44px;

  /* ---------- 玻璃材质 ---------- */
  --glass-fill: rgba(255, 255, 255, 0.07);
  --glass-stroke: rgba(255, 255, 255, 0.1);

  /* ---------- 深色屏（默认） ---------- */
  --c-screen-a: #0a0f17;
  --c-screen-b: #0f262e;
  --c-text-1: #ffffff;   /* 标题 */
  --c-text-2: #e6edf0;   /* 正文 */
  --c-text-3: #a5b3bb;   /* 次要（旧值 #8a9aa3 在 11–12px 下只有 4.41/3.51，见 contrast-audit） */
  --c-card-fill: rgba(255, 255, 255, 0.07);
  --c-card-stroke: rgba(255, 255, 255, 0.1);
  --c-divider: rgba(255, 255, 255, 0.08);

  --sh-card: 0 8px 28px rgba(0, 0, 0, 0.32);
  --sh-pill: 0 6px 20px rgba(0, 0, 0, 0.36);

  color-scheme: dark light;
}

/* ---------- 浅色屏 ---------- */
:root[data-theme='light'],
body[data-theme='light'] {
  --c-screen-a: #f7fafa;
  --c-screen-b: #e3eff2;
  --c-text-1: #0f181d;   /* 标题 */
  /* 正文 / 次要：#5a6b74 + #7c8b94 在浅色屏渐变暗端（#e3eff2）只有 4.72 / 2.99，
     且两档之间塞不进「第三级」—— 见 §9 v13 的死结推导。压深两档后：
     屏暗端 7.44 / 4.57、纯白卡 8.74 / 5.37，三档梯度 2.057 / 1.628（更均匀）。
     次要色特意多压一档（#5e6e77 → #5d6d76）：前者在屏暗端实测 4.504，只高出 4.5
     线 0.004，是全清单唯一贴线项，将来任何微调（哪怕只动一下屏渐变）都会把它挤下
     线。多压一档换 0.073 余量，代价只是梯度少 0.025 —— 划算。 */
  --c-text-2: #3f4d55;   /* 正文 */
  --c-text-3: #5d6d76;   /* 次要 */
  --c-card-fill: #ffffff;
  --c-card-stroke: rgba(15, 24, 29, 0.09);
  --c-divider: rgba(15, 24, 29, 0.08);

  /* 状态色解耦后的浅色值（见文末注释：字面色必须在两个浅色块里各写一遍） */
  --c-state-offline: #7c8b94;
  --c-state-idle: #7c8b94;

  --glass-fill: #ffffff;
  --glass-stroke: rgba(15, 24, 29, 0.09);

  --sh-card: 0 6px 20px rgba(15, 24, 29, 0.08);
  --sh-pill: 0 4px 16px rgba(15, 24, 29, 0.12);
}

/* 系统浅色偏好时同步切换（可在设置里被 data-theme 覆盖） */
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --c-screen-a: #f7fafa;
    --c-screen-b: #e3eff2;
    --c-text-1: #0f181d;
    --c-text-2: #3f4d55;   /* 与上面 [data-theme='light'] 块同值，改一处必须改两处 */
    --c-text-3: #5d6d76;
    --c-card-fill: #ffffff;
    --c-card-stroke: rgba(15, 24, 29, 0.09);
    --c-divider: rgba(15, 24, 29, 0.08);
    /* 状态色解耦后的浅色值（字面色必须在两个浅色块里各写一遍，漏一处只在一半路径生效） */
    --c-state-offline: #7c8b94;
    --c-state-idle: #7c8b94;
    --glass-fill: #ffffff;
    --glass-stroke: rgba(15, 24, 29, 0.09);
    --sh-card: 0 6px 20px rgba(15, 24, 29, 0.08);
    --sh-pill: 0 4px 16px rgba(15, 24, 29, 0.12);
  }
}

/* ---------- 状态色 ---------- */
/* offline / idle 原先是 `var(--c-text-3)` 的别名 —— 状态色复用文字层级色是偷懒：
   chip 的填充会跟着「次要文字」的调整一起动，而这两件事的诉求完全不同
   （文字要的是**与底色的对比度**，chip 填充要的是**与基础 chip 底的区分度**）。
   v14 起写死为字面色值，chip 填充从此脱离 --c-text-3 独立演化。
   数值取解耦那一刻的实际取值（深色 #8a9aa3 / 浅色 #7c8b94），画面零变化。
   注意：因为是字面色，浅色值必须在下面两个浅色块里各写一遍
   （[data-theme='light'] 与 prefers-color-scheme 媒体块），漏一处就只在半条路径上生效。 */
:root {
  --c-state-ok: var(--c-brand);
  --c-state-stale: var(--c-warn);
  --c-state-failed: var(--c-alert);
  --c-state-offline: #8a9aa3;
  --c-state-idle: #8a9aa3;
}

/**
 * 全局与组件样式
 *
 * 职责：把 tokens.css 的令牌落成真实组件 —— 屏渐变背景、玻璃卡、胶囊 Tab、状态徽标、
 * 溯源气泡、降级横幅、自检页表格与分段控件。所有颜色/间距/圆角均取自 CSS 变量。
 *
 * 约束：
 *   - 交互元素最小 44×44（--touch-min）；
 *   - 手机 390 宽为基准，容器最大 640 居中；
 *   - 无任何外链资源（字体/图标/背景图一律不用 URL）。
 */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: var(--ff-sans);
  font-size: var(--fs-md);
  color: var(--c-text-2);
  background:
    radial-gradient(120% 80% at 50% 0%, var(--c-screen-b) 0%, var(--c-screen-a) 62%) fixed,
    var(--c-screen-a);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* 底部 Tab 高度 + 安全区 */
  padding-bottom: calc(var(--sp-12) + var(--sp-6) + env(safe-area-inset-bottom, 0px));
}

/* 数字与拉丁走 Geist，等宽数字走 Geist Mono（缺失时回退系统字体，不外链） */
.num { font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }

/* ---------------- 布局容器 ---------------- */

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-4) var(--sp-6);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.skeleton-note {
  color: var(--c-text-3);
  font-size: var(--fs-sm);
  padding: var(--sp-6) 0;
  text-align: center;
}

/* ---------------- 顶部标题 ---------------- */

.hd {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-1) var(--sp-1);
}

.hd-place {
  font-size: var(--fs-lg);
  color: var(--c-text-1);
  font-weight: 600;
  margin: 0;
  line-height: 1.3;
}

.hd-coord {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  margin: var(--sp-1) 0 0;
}

.hd-time {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  text-align: right;
  white-space: nowrap;
}

/* 收藏按钮：两态的**配色**复用既有 .btn（未收藏）与 .btn--primary（已收藏），
   这两条规则的底色/文字组合已经过 tools/contrast-audit.mjs；这里只补排版，
   不新增任何 color: 声明 —— 新增色值等于新增一笔要审计的债。 */
.hd-fav {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
  flex-wrap: wrap;
}

.hd-fav .btn {
  min-height: 36px;
  min-width: 0;
  padding: 0 var(--sp-3);
  font-size: var(--fs-sm);
}

.hd-hint {
  font-size: var(--fs-xs);
}

/* ---------------- 地点搜索（此刻页） ---------------- */
/* 入口是一颗放大镜按钮，点开才内联展开面板 —— 标题那一排已经有地名 / 坐标 / 观测时刻 /
   收藏按钮，把输入框常驻进去会挤到断行。
   配色全部复用既有 token，不新增任何色值：每一条 `color:` 都会自动进入
   tools/contrast-audit.mjs 的全量扫描（深浅两套主题、门槛 4.5:1），新色值等于新债。 */

.hd-place-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* 不写 color：继承 .btn 的 --c-text-1（已过审计）；这里只把它压成一颗图标按钮的尺寸 */
.hd-search-btn {
  min-height: 36px;
  min-width: 36px;
  padding: 0 var(--sp-2);
  font-size: var(--fs-md);
  line-height: 1;
}

.search-panel {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
}

.search-field {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.search-input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--touch-min);
  padding: 0 var(--sp-3);
  border-radius: var(--r-chip);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-family: inherit;
  font-size: var(--fs-md);
}

.search-status {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

.search-list {
  display: flex;
  flex-direction: column;
}

/* 结果项：主行地名，次行 `admin1 · country`（同名多地全靠次行分开） */
.search-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--sp-2) 0;
  border: none;
  border-top: 1px solid var(--c-divider);
  /* 用 --c-card-fill 而不是 transparent / none：按钮的 UA 底色（buttonface）要盖掉，
     而 contrast-audit 的取色器不认 `none` / `transparent` 这两个关键字（会直接抛错）。
     与面板同色，视觉上就是一条分隔线下的纯文字行。 */
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.search-item:first-child {
  border-top: none;
}

.search-item-name {
  font-size: var(--fs-md);
  color: var(--c-text-1);
}

.search-item-sub {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

/* ---------------- 收藏列表（我的页） ---------------- */

.fav-list {
  display: flex;
  flex-direction: column;
  margin: var(--sp-2) 0 0;
}

.fav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-top: 1px solid var(--c-divider);
}

.fav-item:first-child { border-top: none; }

.fav-link {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1 1 auto;
  min-width: 0;
  text-decoration: none;
  color: var(--c-text-2);
}

.fav-name {
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--c-text-1);
}

.fav-coord {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.fav-item .btn {
  min-height: 36px;
  min-width: 0;
  padding: 0 var(--sp-3);
  font-size: var(--fs-sm);
  flex: 0 0 auto;
}

/* ---------------- 卡片 ---------------- */

.card {
  background: var(--c-card-fill);
  border: 1px solid var(--c-card-stroke);
  border-radius: var(--r-card);
  box-shadow: var(--sh-card);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.card--hero {
  padding: var(--sp-5);
  gap: var(--sp-3);
}

.card-title {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  margin: 0;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.card--row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}

/* 天气英雄区 */
.hero {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
}

.hero-temp {
  font-family: var(--ff-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-hero);
  line-height: 1;
  color: var(--c-text-1);
  font-weight: 500;
}

.hero-temp .unit {
  font-size: var(--fs-xl);
  color: var(--c-text-3);
  margin-left: 2px;
}

.hero-desc {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.hero-wmo {
  font-size: var(--fs-lg);
  color: var(--c-text-1);
  font-weight: 500;
}

.hero-sub {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

/* 键值网格 */
.kv {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-2) var(--sp-3);
}

.kv-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.kv-k {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.kv-v {
  font-family: var(--ff-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-md);
  color: var(--c-text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 冷热色同样不作文字色（与上面 .kv-v--alert 同一条规矩：数据色只走填充与边框）。
   旧写法 --c-hot 浅色 2.67:1、--c-cold 深浅双破 3.75/3.41，均低于 4.5:1。
   文字统一 --c-text-1（深色 12.80:1 / 浅色 17.97:1），冷热语义改由**值下方那条
   2px 色线**承载 —— 区分度不丢，且不靠文字颜色差。
   注：本条当前同样无调用方（_kv() 的 mod 参数全项目无人传），改它不影响任何画面；
   将来若接上，请沿用「色线/底纹承载语义」这条路，不要改回彩色文字。 */
.kv-v--hot { color: var(--c-text-1); border-bottom: 2px solid var(--c-hot); }
.kv-v--cold { color: var(--c-text-1); border-bottom: 2px solid var(--c-cold); }
/* 告警红不作文字色，只作底纹与边框：红字压深底实测仅 3.04:1（浅色 4.22:1），
   双双低于 WCAG 4.5:1 小字门槛 —— 越需要被看见的颜色越看不清，传达效果是负的。
   改走 --c-text-1（随主题翻转）后：深色 12.80:1 / 浅色 17.97:1。
   注：本条当前无调用方（_kv() 从未传过 'alert'），改它不影响任何画面；
   将来若接上，告警语义请用红色底纹承载，不要改回红字。 */
.kv-v--alert { color: var(--c-text-1); }

/* ---------------- 徽标 / 胶囊 ---------------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  min-height: 24px;
  padding: 2px var(--sp-2);
  border-radius: var(--r-chip);
  background: var(--c-card-stroke);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
  white-space: nowrap;
}

/* 状态色只做填充与徽点，**不做文字色**。
   旧写法把状态色同时当文字色，实测（基底口径：chip 坐在**卡片表面**上，不是直接叠在屏渐变上）
   全部低于 WCAG 4.5:1 小字门槛 —— ok 2.82/2.65、stale 3.86/1.90、degraded 3.86/1.90、
   offline 3.14/2.79、failed 2.50/3.18（深色/浅色）。
   文字统一改 --c-text-1（随主题翻转）后最低 7.06:1（.chip--idle），且不新增 token、
   不需要按主题分别取值。
   注：v14 起 --c-state-offline / --c-state-idle 已不再复用 --c-text-3（改写字面色值），
   chip 填充从此不随文字层级调整而变 —— 这两个数值是解耦后的稳定值。
   告警语义不丢：填充仍是 22% 状态色，此刻屏的 chip 内还有一颗同色徽点。 */
.chip--ok { background: color-mix(in srgb, var(--c-state-ok) 22%, transparent); color: var(--c-text-1); }
.chip--stale { background: color-mix(in srgb, var(--c-state-stale) 22%, transparent); color: var(--c-text-1); }
/* 告警红不作文字色，只留在填充上：红字压 22% 红纹实测仅 2.50:1（浅色 3.18:1），
   远低于 4.5:1。文字改走 --c-text-1 后：深色 10.55:1 / 浅色 13.57:1。
   告警语义不丢 —— 填充仍是 22% 告警红，chip 内还有一颗 --c-state-failed 的徽点。 */
.chip--failed { background: color-mix(in srgb, var(--c-state-failed) 22%, transparent); color: var(--c-text-1); }
.chip--offline { background: color-mix(in srgb, var(--c-state-offline) 22%, transparent); color: var(--c-text-1); }
.chip--degraded { background: color-mix(in srgb, var(--c-warn) 22%, transparent); color: var(--c-text-1); }

/* .chip--idle：**先补信号，再改文字色**（顺序不能反，反过来会把语义抹掉）。
   旧状态的病根：填充 --c-card-stroke 与基础 .chip 的底色完全同色（实测两底只差 1.03:1、
   通道差 3，肉眼分不开），而自检页渲染 chip 时根本不插徽点 —— 于是文字色是它唯一的语义信号。
   第一步补信号：填充换成 38% 的 --c-state-idle（**v14 起是字面色值，不再复用 --c-text-3**），
   与基础 chip 底拉开到 1.33:1（通道差 19，浅色 Δ28），视觉上分得开。
   第二步才改文字：--c-text-1，实测深色 7.06:1 / 浅色 11.88:1（旧值 3.23:1 / 2.92:1）。
   不补 .badge--idle：自检页那四处根本不插徽点，补了是死规则。
   基础 .chip 没有 border，所以不涉及「边框同步加深」。 */
.chip--idle { background: color-mix(in srgb, var(--c-state-idle) 38%, transparent); color: var(--c-text-1); }

.badge {
  display: inline-block;
  min-width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--c-state-idle);
}
.badge--ok { background: var(--c-state-ok); }
.badge--stale { background: var(--c-state-stale); }
.badge--failed { background: var(--c-state-failed); }
.badge--offline { background: var(--c-state-offline); }
.badge--degraded { background: var(--c-state-stale); }

/* ---------------- 降级横幅 ---------------- */

.banner {
  max-width: 640px;
  margin: var(--sp-3) auto 0;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-2);
  font-size: var(--fs-sm);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.banner--stale { border-color: color-mix(in srgb, var(--c-warn) 40%, transparent); }
.banner--offline { border-color: color-mix(in srgb, var(--c-text-3) 40%, transparent); }
.banner--failed { border-color: color-mix(in srgb, var(--c-alert) 45%, transparent); }
.banner--no-map { border-color: color-mix(in srgb, var(--c-text-3) 30%, transparent); }

/* grid：底图半残（部分瓦片没取到，已降为网格）——琥珀色，与徽点 --c-state-stale 同源。
   不能只描一圈边框：底色也要带一点琥珀，否则和「数据源失败」的 partial 撞脸。
   填充比例压得很低（14%），是为了不抢五张数据卡的视觉权重 —— 底图只是少了瓦片。 */
.banner--grid {
  border-color: color-mix(in srgb, var(--c-warn) 55%, transparent);
  background: color-mix(in srgb, var(--c-warn) 14%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* partial：非关键 API 源失败（数据本身缺一块）。
   比 grid 轻（填充 7%）、比基础横幅强（正文升到 --c-text-1），边框偏中性带一点琥珀：
   它说的是「数据不全」，不是「底图不全」，不该和 grid 用同一个色阶。 */
.banner--partial {
  border-color: color-mix(in srgb, var(--c-warn) 28%, var(--c-card-stroke));
  background: color-mix(in srgb, var(--c-warn) 7%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* empty：关键源全部彻底失败且无缓存 —— 一个数据都没有，是最重的一档。
   红系告警色 --c-alert（#c9584b，深浅同值），填充 20% 压过 grid 的 14% 与 partial 的 7%。
   文字一律用 --c-text-1：它本身随主题翻转（深色 #fff / 浅色 #0f181d），
   告警红只做低透明度底纹，绝不当文字色 —— 否则深色屏下红字压深底会掉到 4.5:1 以下。
   实测对比度：深色屏最差 10.76:1、浅色屏 13.93:1（fill 20%，叠在屏渐变两端各算一次）。 */
.banner--empty {
  border-color: color-mix(in srgb, var(--c-alert) 60%, transparent);
  background: color-mix(in srgb, var(--c-alert) 20%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* ---------------- 溯源气泡 ---------------- */

.prov {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
}

.prov-item {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);

}

.prov-item:hover .prov-url,
.prov-item:focus-within .prov-url { color: var(--c-text-2); }

.prov-url {

}

/* ---------------- 关于 ---------------- */

.about {
  max-width: 640px;
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-5) var(--sp-6);
  color: var(--c-text-3);
  font-size: var(--fs-sm);
}

.about-title {
  font-size: var(--fs-md);
  color: var(--c-text-2);
  margin: 0 0 var(--sp-2);
  font-weight: 600;
}

.about-list {
  margin: 0;
  padding-left: var(--sp-4);

  flex-direction: column;
  gap: var(--sp-1);
}

.about-list strong { color: var(--c-text-2); }

.about-note {
  margin: var(--sp-3) 0 0;

}

/* ---------------- 底部胶囊 Tab ---------------- */

.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--sp-3) + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: var(--sp-1);
  padding: var(--sp-1);
  border-radius: var(--r-pill);
  border: 1px solid var(--glass-stroke);
  background: var(--glass-fill);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--sh-pill);
  z-index: 20;
}

/* 四个 Tab 一行排布。下面是这一组属性被反复改动的历史与最终定案，**改前请读**。
   ── 真机截图暴露的 bug：四个 tab 文字全断成两行（「此/刻」「自/检」「方/位」「我/的」）。
      引入于 a0dde93（加第 4 个 tab 时把 `.tab` 从 `min-width: 88px` 改成 `flex: 1 1 0`
      + `min-width: 64px`）。当时的纸面推算是「4×68 + 3×4 + 2×4 = 294px < 320px，不溢出」
      —— 算错了，而且**算的不是换行这件事**。

   ── 根因：`.tabbar` 是 `position: fixed` 且**没有设 `width`**。
      fixed + 无 width → 宽度是 shrink-to-fit，即**由内容决定**，不是占满 390px。
      于是 `flex: 1 1 0` 里的 `flex-basis: 0` 在一个 shrink-to-fit 容器里分不到「剩余空间」
      （本来就没有剩余空间可分），每个 tab 实际拿到 ≈ (max-content 总宽) / 4 ≈ 70px。
      再减去 `padding: 0 var(--sp-5)` 的左右共 40px，**内容区只剩约 30px** ——
      而「此刻」两个汉字在 `--fs-md`(14px) 下正好约 28–30px。**卡在临界点**，
      真机字体渲染与桌面稍有差异就换行。

   ── 定案（三条，各管一件事）：
      1. `padding: 0 var(--sp-3)`（12px，原 `--sp-5` 20px）：内容区从 ~30px 提到 46px，
         留出明显余量，不再贴着两字临界点。
      2. `white-space: nowrap`：即使将来再挤，也宁可横向挤压也**不断行**。
         断行会让 tab 变高、把上方内容顶掉，危害远大于横向挤一点。
      3. `flex: 0 0 auto`（原 `1 1 0`）：`tabbar` 是 shrink-to-fit 容器，`flex-basis: 0`
         在这里的行为难以预测（正是踩的坑）；改成按内容宽度排布，配合 `min-width: 64px`
         完全可预测。四个 tab 文字都是两字，宽度天然相同，观感与「均分」一致。

   ── 保留：`min-width: 64px`（宽度下限，窄屏）、`min-height: var(--touch-min)`（触控下限）。
   ── 不要把 `--sp-*` 或 `--fs-*` 改成别的值来「腾空间」：那是全局栅格/字号阶梯，一动影响全站。
      宽度够不够现在由 `tools/check.mjs` 第 12 节机器计算，不再靠纸面估算。 */
.tab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  min-width: 64px;
  min-height: var(--touch-min);
  padding: 0 var(--sp-3);
  border-radius: var(--r-pill);
  color: var(--c-text-3);
  font-size: var(--fs-md);
  text-decoration: none;
  white-space: nowrap;
}

/* 实心底改用 --c-brand-solid：白字压 --c-brand 实测只有 3.39:1（深浅同值），
   压 --c-brand-solid #167e70 为 4.94:1。--c-brand 本身不动，仍用于描边与浅填充。 */
.tab--active {
  background: var(--c-brand-solid);
  color: #ffffff;
  font-weight: 600;
}

/* ---------------- 按钮 / 分段控件 ---------------- */

.btn {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 0 var(--sp-5);
  border-radius: var(--r-pill);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-family: inherit;
  font-size: var(--fs-md);
  cursor: pointer;

.btn:disabled { opacity: 0.45; cursor: default; }

/* 同 .tab--active：实心底走 --c-brand-solid，白字 4.94:1（--c-brand 仅 3.39:1） */
.btn--primary {
  background: var(--c-brand-solid);
  border-color: transparent;
  color: #ffffff;

}

.seg {
  display: inline-flex;

.seg-btn {

  min-width: var(--touch-min);
  padding: 0 var(--sp-3);
  border: none;
  border-radius: var(--r-pill);

  color: var(--c-text-3);
  font-family: inherit;
  font-size: var(--fs-sm);
  cursor: pointer;
}

/* 同 .tab--active：实心底走 --c-brand-solid，白字 4.94:1（--c-brand 仅 3.39:1） */
.seg-btn--active {
  background: var(--c-brand-solid);
  color: #ffffff;
  font-weight: 600;
}

/* ---------------- 自检页 ---------------- */

.sc-head {
  max-width: 640px;
  margin: 0 auto;
  padding: var(--sp-6) var(--sp-5) var(--sp-2);
}

.sc-title {
  margin: 0;
  font-size: var(--fs-xl);
  color: var(--c-text-1);
  font-weight: 600;
}

.sc-sub {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  line-height: 1.6;
}

.panel {
  max-width: 640px;
  margin: 0 auto var(--sp-4);
  padding: var(--sp-4);
  border-radius: var(--r-card);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  flex-wrap: wrap;
}

.field--row { gap: var(--sp-2); }

.field-label {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

.sc-section {
  max-width: 640px;
  margin: 0 auto var(--sp-5);
  padding: 0 var(--sp-4);
}

.sc-h2 {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-md);
  color: var(--c-text-2);

}

.sc-list {
  display: flex;
  flex-direction: column;

}

.sc-row {
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.sc-row-head {
  display: flex;
  align-items: center;

}

}

.sc-row-url {
  font-family: var(--ff-mono);

}

.sc-summary {
  max-width: 640px;

  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-card-sm);

.sc-dedupe {

.sc-log {

  font-family: var(--ff-mono);

  color: var(--c-text-3);

  word-break: break-all;
  max-height: 260px;

}

/* ---------------- 空态 / 骨架 ---------------- */

.empty {
  border-radius: var(--r-card);
  border: 1px dashed var(--c-card-stroke);
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--c-text-3);
  font-size: var(--fs-sm);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  align-items: center;
}

.sk {
  border-radius: var(--r-card);
  border: 1px solid var(--c-card-stroke);
  background: linear-gradient(90deg, var(--c-card-fill) 25%, var(--c-divider) 50%, var(--c-card-fill) 75%);
  background-size: 200% 100%;
  animation: sk-sweep 1.4s ease-in-out infinite;
  height: 96px;
}

@keyframes sk-sweep {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@media (prefers-reduced-motion: reduce) {
  .sk { animation: none; }
}

/* ---------------- 方位屏（磁偏角 / 罗盘） ---------------- */

/* 卡内补充说明：与 .card-title 同级（次一级文字），不抢数值的视觉权重 */
.card-note {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  margin: 0;
  line-height: 1.5;
}

/* 超期/告警态：数值**照常显示**（用户仍需要一个近似值），只把信任等级降下来。
   红只描边框、不进文字也不铺底 —— 状态色作文字色会掉到 4.5:1 以下（见 chip 那条注释），
   铺底又会盖住卡片本身，这里一层红边框 + 卡内那枚 .chip--failed 已足够传达。 */
.card--alert {
  border-color: color-mix(in srgb, var(--c-alert) 45%, transparent);
  color: var(--c-text-1);
}

/* 磁偏角读法：大号是「西偏 7.49°」，小号跟一个原始有符号值，方向信息不丢 */
.compass-hero {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.compass-hero-num {
  font-size: var(--fs-2xl);
  font-weight: 600;
  color: var(--c-text-1);
  line-height: 1.2;
}
.compass-hero-signed {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

.compass-heading {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  margin: 0;
}

/* 罗盘盘面：盘面整体转 −heading，真北针再相对磁北针转一个磁偏角 */
.compass-dial {
  position: relative;
  width: 176px;
  height: 176px;
  margin: var(--sp-2) auto;
  border-radius: 999px;
  border: 1px solid var(--c-card-stroke);
  background: color-mix(in srgb, var(--c-brand) 8%, var(--c-card-fill));
}

/* N/E/S/W 是罗盘唯一的方位锚点，不能按装饰处理；它压在盘面（8% 品牌色 + 卡片填色）上，
   比同色文字在纯卡片表面上还低一档 —— --c-text-3 实测仅 3.26/3.22，是全局最差的一处。
   这里单独升到 --c-text-2：深色 8.00:1 / 浅色 5.07:1。 */
.compass-mark {
  position: absolute;
  font-size: var(--fs-xs);
  color: var(--c-text-2);
}
.compass-mark--n { top: 8px; left: 50%; transform: translateX(-50%); }
.compass-mark--s { bottom: 8px; left: 50%; transform: translateX(-50%); }
.compass-mark--w { left: 8px; top: 50%; transform: translateY(-50%); }
.compass-mark--e { right: 8px; top: 50%; transform: translateY(-50%); }

.compass-rose {
  position: absolute;
  inset: 0;
  transition: transform 120ms linear;
}

.compass-needle {
  position: absolute;
  left: 50%;
  bottom: 50%;
  width: 3px;
  height: 40%;
  margin-left: -1.5px;
  border-radius: 2px;
  transform-origin: 50% 100%;
}
/* 磁北针红、真北针青：两支针都在盘面上，颜色差是唯一的区分手段。
   红只作填充（不是文字色），符合「状态色只做填充与徽点」的红线。 */
.compass-needle--mag { background: var(--c-state-failed); }
.compass-needle--true { background: var(--c-brand); }

/* 真/磁方位换算：手动输入，双向，不依赖传感器 */
.compass-row {
  gap: var(--sp-2);
  align-items: center;
}

.compass-input {
  min-height: var(--touch-min);
  width: 128px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-chip);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-size: var(--fs-md);
}

.compass-out {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  min-width: 64px;
}

.compass-arrow {
  color: var(--c-text-3);
}

@media (prefers-reduced-motion: reduce) {
  .compass-rose { transition: none; }
}

/* ---------------- 底图卡（S57 街道样式 / S58 GRID 降级） ---------------- */

/* 副标题 + 状态标记（S57 `17:7` / `17:4`）：同一行，状态右对齐 */
.map-sub {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.map-sub-t { font-size: var(--fs-sm); color: var(--c-text-3); }
.map-status {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* 样式切换 chip（S57 `17:36/38/40`）—— 状态色只做填充，文字一律 --c-text-1 */
.map-chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.map-chip {
  min-height: 32px;
  padding: 0 var(--sp-4);
  border-radius: var(--r-pill);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.map-chip--active {
  background: color-mix(in srgb, var(--c-brand) 18%, transparent);
  border-color: color-mix(in srgb, var(--c-brand) 45%, transparent);
}

/* 视口：瓦片在此绝对定位叠放，落点恒在正中。
   max-width:100% 而不是写死宽度 —— 窄屏靠它收缩，瓦片按设计基准裁切（本阶段不做重排）。 */
.map-viewport {
  position: relative;
  overflow: hidden;
  margin-inline: auto;
  max-width: 100%;
  border-radius: var(--r-card-sm);
  background: color-mix(in srgb, var(--c-text-3) 12%, transparent);
}

/* 单块瓦片：骨架 → 字节 → 或失败留白（S58 的「空洞瓦片」） */
.map-cell { position: absolute; overflow: hidden; }
.map-cell--loading { background: var(--c-card-fill); }
.map-cell--fail {
  background: var(--c-card-fill);
  box-shadow: inset 0 0 0 1px var(--c-divider);
}
.map-cell-img { display: block; width: 100%; height: 100%; }
.map-cell-x {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  line-height: 1;
  color: var(--c-text-3);
}

/* 落点（S57 `17:29`–`17:34`）：光环 48×48（品牌青 18% 填充 + 50% 描边）、
   实心点 8×8、四向准星。位置恒在视口正中 —— 网格按落点对齐铺，不做平移。 */
.map-pin {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48px;
  height: 48px;
  margin: -24px 0 0 -24px;
  pointer-events: none;
}
.map-pin-halo {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: color-mix(in srgb, var(--c-brand) 18%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-brand) 50%, transparent);
}
.map-pin-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--c-brand);
}
.map-pin-tick { position: absolute; background: var(--c-brand); }
.map-pin-tick--up { left: 23px; top: -14px; width: 2px; height: 14px; }
.map-pin-tick--down { left: 23px; bottom: -14px; width: 2px; height: 14px; }
.map-pin-tick--left { top: 23px; left: -14px; width: 14px; height: 2px; }
.map-pin-tick--right { top: 23px; right: -14px; width: 14px; height: 2px; }

/* 缩放控件（S57 `17:45`，48×64，视口右下） */
.map-zoom {
  position: absolute;
  right: var(--sp-3);
  bottom: var(--sp-3);
  width: 48px;
  border-radius: 14px;
  overflow: hidden;
  background: var(--c-card-fill);
  box-shadow: inset 0 0 0 1px var(--c-card-stroke);
}
.map-zoom-btn {
  display: block;
  width: 100%;
  height: 32px;
  border: 0;
  background: transparent;
  color: var(--c-text-1);
  font-size: var(--fs-lg);
  line-height: 1;
  cursor: pointer;
}
.map-zoom-btn:disabled { color: var(--c-text-3); cursor: default; }
.map-zoom-sep { display: block; height: 1px; background: var(--c-divider); }

/* 纯坐标模式（S58 的 no-map 语义）：一块都不请求，明确告诉用户数值不受影响 */
.map-viewport--nomap {
  display: flex;
  align-items: center;
  justify-content: center;
}
.map-nomap { display: flex; flex-direction: column; gap: var(--sp-1); text-align: center; padding: var(--sp-4); }
.map-nomap-t { font-size: var(--fs-md); color: var(--c-text-1); }
.map-nomap-d { font-size: var(--fs-xs); color: var(--c-text-3); }

/* 骨架视口 */
.map-viewport--sk { display: flex; align-items: center; justify-content: center; }
.map-sk-note { font-size: var(--fs-sm); color: var(--c-text-3); }

/* 坐标行（S57 `17:42`–`17:44`）：坐标用等宽字体，明细次要色 */
.map-coord {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.map-coord-v {
  font-family: var(--ff-mono);
  font-size: var(--fs-sm);
  color: var(--c-text-1);
  font-variant-numeric: tabular-nums;
}
.map-coord-d { font-size: var(--fs-xs); color: var(--c-text-3); }

/* 署名（Esri 条款硬要求，设计稿漏画的一行）—— 必须始终可见、不被遮挡 */
.map-credit {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  line-height: 1.5;
}

.map-foot {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

@media (prefers-reduced-motion: reduce) {
  .map-chip { transition: none; }
}

/* ---------------- 小屏微调 ---------------- */

@media (max-width: 360px) {
  .hero-temp { font-size: var(--fs-hero-sm); }
  .kv { grid-template-columns: 1fr; }
}

/* ---------------- 指标释义（图例） ---------------- */

/* 类名一律 .legend- 前缀，与上面任何既有规则零重叠、零覆盖。
   颜色只取 --c-text-1 / -2 / -3 三档，全部已经过 tools/contrast-audit.mjs 的
   深浅双主题全量扫描；这里**不新增任何色值** —— 每多一条 color: 就多一笔要审计的债。
   唯一带底色的那条（风向胶囊 .legend-scale--wrap .legend-scale-row）用 --c-text-2 而不是
   --c-text-3：胶囊底是 --c-card-stroke，浅色屏下 --c-text-3 压它实测 4.46:1（差 0.04 不达标），
   --c-text-2 是 7.26:1（深色 7.93:1）。 */

.legend-panel {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.legend-note {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  line-height: 1.6;
}

.legend-group {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.legend-group-title {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-2);
  font-weight: 600;
}

.legend-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

/* 条目分隔线画在**顶部**而不是底部：最后一条下面不该拖一条多余的线 */
.legend-item {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  padding-top: var(--sp-2);
  border-top: 1px solid var(--c-divider);
}

.legend-item:first-child {
  border-top: none;
  padding-top: 0;
}

.legend-item-head {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  flex-wrap: wrap;
}

.legend-item-name {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  font-weight: 600;
}

.legend-item-unit {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.legend-item-body {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-2);
  line-height: 1.6;
}

/* 档位表：竖排（蒲福 / AQI / UV） */
.legend-scale {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.legend-scale-row {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

/* 档位表：横排换行（风向 16 方位，竖排会拉出一条 16 行的长条） */
.legend-scale--wrap {
  flex-direction: row;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-2);
}

/* 方位胶囊：底色 --c-card-stroke，文字 --c-text-2（取值理由见本节开头注释） */
.legend-scale--wrap .legend-scale-row {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-chip);
  background: var(--c-card-stroke);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
}

.legend-none {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

/* ==========================================================================
   Pad 横屏（≥ 768px）
   --------------------------------------------------------------------------
   纯 CSS：这一个媒体块是**追加**在文件末尾的，上面任何一条既有规则都没被改动；
   不新增 JS、不改 HTML 结构、不改 tokens.css 的色值、不改 --sp-* / --fs-*
   （那是全局栅格与字号阶梯，一动影响全站）。需要放大字号时这里一律给具体 px 值。

   改了什么（逐条理由）：
     1) .app → 两列栅格 + 960 上限居中：横屏下原来 390 的单列会被拉成一条很窄的长条，
        两列才用得上横向空间；上限 960 是为了不让正文拉成 1000px 一行的长句。
     2) 天气卡 / 空气卡并排（原先上下堆叠）；底图卡独占一行以便放大。
        行号写死而不是靠自动排布：DOM 顺序是固定的（search → weather → air →
        place → map → prov → legend），显式给 grid-row 比依赖自动排布可预测。
     3) .map-viewport → zoom 1.8：底图 350×260 → 630×468（★为什么是 zoom 而不是
        width/height，见下面该条注释 —— 直接改宽高会把地图搞歪）。
     4) .tab 放大到 96px / 15px：平板该有的触控尺寸。**不动 .tabbar 的居中方式**。
   ========================================================================== */

@media (min-width: 768px) {
  /* 1) 内容区：两列栅格 + 上限居中 */
  .app {
    max-width: 960px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: var(--sp-4);
  }

  /* 行位显式给定：DOM 顺序固定，写死比自动排布可预测（见本节开头） */
  .app > .hd { grid-column: 1 / -1; grid-row: 1; }
  #card-search { grid-column: 1 / -1; grid-row: 2; }
  #card-weather { grid-column: 1 / 2; grid-row: 3; }
  #card-air { grid-column: 2 / 3; grid-row: 3; }
  #card-place { grid-column: 1 / -1; grid-row: 4; }
  #card-map { grid-column: 1 / -1; grid-row: 5; }
  #card-prov { grid-column: 1 / -1; grid-row: 6; }
  #card-legend { grid-column: 1 / -1; grid-row: 7; }

  /* 并排的这两张卡等高：让卡填满它那一格（只针对这一对，不波及其它槽位 ——
     #card-prov 里是「标题 + 气泡」两个兄弟，套同样的规则会把它们拉成左右两半） */
  #card-weather, #card-air { display: flex; }
  #card-weather > .card, #card-air > .card { flex: 1 1 auto; min-width: 0; }

  /* 2) 顶部横幅与内容区同宽（原本 640，横屏下比内容区窄一截，看着像没对齐） */
  .banner { max-width: 960px; }

  /* 3) 英雄温度放大：--fs-hero 是 56px，横屏下 64px（给具体值，不改变量） */
  .hero-temp { font-size: 64px; }

  /* 4) 底图：350×260 → 630×468
     ★为什么用 zoom 而不是 width/height：视口宽高是 JS 写在 inline style 上的
       （src/ui/map.js 的 VIEW_W / VIEW_H），而瓦片是**按这两个常量算出来的像素坐标**
       绝对定位的（_layTiles 的 left0/top0 = VIEW_W/2 − …），落点又是 50%/50%。
       若只把容器改成 520×390，瓦片仍按 350×260 的中心铺，落点却跑到新中心 ——
       地图整体偏移、右下留白，落点和地图对不上。
       zoom 是**整体缩放**：瓦片、落点、缩放控件一起放大，相对关系原样保留，
       不需要任何补偿数字，也不会因为将来改 VIEW_W 而失配。
       不支持 zoom 的浏览器（Firefox 126 之前）就保持 350×260 —— 优雅降级，不会裂。 */
  .map-viewport { zoom: 1.8; }

  /* 5) 底部 tab：只放大 tab 本身，**不改 .tabbar 的居中方式**
       —— .tabbar 是 position: fixed 且**没有设 width**（shrink-to-fit，宽度由内容决定）。
       给它加 width 或改成靠边，会重演真机上「四个 tab 文字断成两行」那个 bug
       （commit fa1ec49，根因见上面 .tab 那一大段注释）。横屏左右余量充足，
       把 tab 放大到 96px 也不会挤压：4×96 + 3×4 + 2×4 = 404px，远小于 768px。 */
  .tab { min-width: 96px; padding: 0 var(--sp-4); font-size: 15px; }

  /* 6) 图例：横屏下两列排布 —— 单列会变成又窄又长的两三条，短行更好读。
       两列时每行的第一条不该带分隔线，所以把 :first-child 的例外扩到 :nth-child(2)。 */
  .legend-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--sp-3) var(--sp-4);
  }
  .legend-list > .legend-item:nth-child(2) { border-top: none; padding-top: 0; }
}

</style>
</head>

<script>

WMO 码',\r\n  'legend.wmo.body': '图标与描述由 WMO 天气码翻译而来（0–99，例如 0 是晴、61 是小雨）。取不到码、或码非法时显示「未知天气」—— 不会把「没数据」误报成晴天。',\r\n\r\n  'legend.observedAt.title': '观测时刻',\r\n  'legend.observedAt.unit': '本地时刻',\r\n  'legend.observedAt.body': '数据源给出的当前数据时次，已按当地时间偏移换算成本地时间显示。',\r\n\r\n  'legend.aqi.title': '欧洲 AQI',\r\n  'legend.aqi.unit': '无量纲',\r\n  'legend.aqi.body': '数据源直接给出的欧洲 AQI（european_aqi）：把多种污染物折算成一个数，越小越好。本应用只负责把它分成六档，档位与建议如下：',\r\n  'legend.aqi.row': '{min}–{max} · {zh} · {advice}',\r\n  'legend.aqi.rowLast': '{min} 及以上 · {zh} · {advice}',\r\n\r\n  'legend.pollutants.title': 'PM2.5 / PM10 / O₃ / NO₂',\r\n  'legend.pollutants.unit': 'µg/m³',\r\n  'legend.pollutants.body': '四种污染物浓度，单位微克每立方米。本应用不对单项污染物分级 —— 分级只针对上面那个欧洲 AQI，这四项只是构成它的原料，所以这里也就不给档位。',\r\n\r\n  'legend.elevation.title': '海拔',\r\n  'legend.elevation.unit': 'm',\r\n  'legend.elevation.body': '所在地点的海拔（Open-Meteo Elevation），单位米。取不到时显示占位符「—」。',\r\n\r\n  'legend.coord.title': '坐标',\r\n  'legend.coord.unit': '度（WGS84）',\r\n  'legend.coord.body': 'WGS84 经纬度，保留四位小数（约 11 米精度）。收藏与跨页跳转都以这两个数作为地点的身份。',\r\n\r\n  'legend.tz.title': '时区偏移',\r\n  'legend.tz.unit': '秒',\r\n  'legend.tz.body': '数据源返回的「当地时区相对 UTC 的偏移」（utc_offset_seconds）。日出日落与观测时刻都是按它换算的 —— 它一变，这几个时刻会跟着变。',\r\n};\r\n\r\n/**\r\n * 取文案。\r\n *\r\n * @param {string} key 文案键，如 'status.ok'\r\n * @param {Object<string, string|number>} [params] 占位符替换表，如 { ms: 123 }\r\n * @returns {string} 替换后的文案；键缺失时返回 key 本身。\r\n */\r\nexport function t(key, params = {}) {\r\n  const tpl = ZH[key];\r\n  if (tpl === undefined) {\r\n    // 缺失键：静默返回 key；调试模式下由调用方（store.log）另行告警，此处不打日志以避免循环依赖\r\n    return key;\r\n  }\r\n  return String(tpl).replace(/\\{(\\w+)\\}/g, (m, name) => {\r\n    const v = params[name];\r\n    return v === undefined || v === null ? m : String(v);\r\n  });\r\n}\r\n\r\n/**\r\n * 判断文案键是否存在（debug 自检用）。\r\n *\r\n * @param {string} key 文案键。\r\n * @returns {boolean} 是否存在。\r\n */\r\nexport function hasKey(key) {\r\n  return Object.prototype.hasOwnProperty.call(ZH, key);\r\n}\r\n\r\n/** 导出全部键（供冒烟脚本检查完整性）。 */\r\nexport function allKeys() {\r\n  return Object.keys(ZH);\r\n}\r\n",
  "src/core/cache.js": "/**\n * 缓存层（localStorage 封装）\n *\n * 职责：统一读写本机缓存，提供 TTL 与 fresh / stale / miss 三态判定，并作为降级底座 ——\n * 只要存在陈旧数据就绝不显示空白。全应用**唯一**允许直接触碰 localStorage 的模块。\n *\n * 约定：\n *   - 命名空间固定 'gs:v1:'，键格式 'gs:v1:<sourceId>:<参数>'；坐标一律 toFixed(4)，关键词 encodeURIComponent；\n *   - 值序列化为 { v, t, ttl, stale }，其中 t = storedAt（ms epoch）；\n *   - 配额超限先淘汰最旧条目再重试一次，仍失败返回 false 且不抛异常；\n *   - Node / 非浏览器环境下降级为内存 Map（供 tools/smoke.mjs 无网冒烟使用）。\n */\n\n/** 缓存键命名空间（版本号变更即整体失效）。 */\nexport const NS = 'gs:v1:';\n\n/** 默认容量上限（字节，按 JSON 字符串长度估算）。 */\nexport const DEFAULT_MAX_BYTES = 4_500_000;\n\n/** @type {Map<string, string>} 无 localStorage 时的内存兜底。 */\nconst _memory = new Map();\n\n/** @type {boolean} 是否已确认使用内存兜底。 */\nlet _useMemory = !(typeof localStorage !== 'undefined' && localStorage !== null);\n\n/**\n * 内存版存储适配器（接口与 Storage 对齐的最小子集）。\n */\nconst memoryStorage = {\n  getItem: (k) => (_memory.has(k) ? _memory.get(k) : null),\n  setItem: (k, v) => { _memory.set(k, String(v)); },\n  removeItem: (k) => { _memory.delete(k); },\n  keys: () => Array.from(_memory.keys()),\n};\n\n/**\n * 取当前可用存储。\n *\n * @returns {{getItem:Function, setItem:Function, removeItem:Function, keys:Function}} 存储适配器。\n */\nfunction _store() {\n  if (_useMemory) return memoryStorage;\n  try {\n    // 探测真实可用性（隐私模式 / 被禁用时会抛）\n    const probeKey = `${NS}__probe__`;\n    localStorage.setItem(probeKey, '1');\n    localStorage.removeItem(probeKey);\n    return {\n      getItem: (k) => localStorage.getItem(k),\n      setItem: (k, v) => localStorage.setItem(k, v),\n      removeItem: (k) => localStorage.removeItem(k),\n      keys: () => {\n        const out = [];\n        for (let i = 0; i < localStorage.length; i += 1) {\n          const k = localStorage.key(i);\n          if (k !== null) out.push(k);\n        }\n        return out;\n      },\n    };\n  } catch (err) {\n    _useMemory = true;\n    return memoryStorage;\n  }\n}\n\n/**\n * 构造缓存键。\n *\n * @param {string} sourceId 源 id（或 'store' 等伪源）。\n * @param {...(string|number)} parts 参数片段。\n * @returns {string} 'gs:v1:<sourceId>:<p1>:<p2>'。\n */\nexport function makeKey(sourceId, ...parts) {\n  return `${NS}${sourceId}:${parts.join(':')}`;\n}\n\n/**\n * 读取条目（不做 TTL 判定）。\n *\n * @param {string} key 缓存键。\n * @returns {{value: *, storedAt: number, ttlMs: number}|null} 条目或 null。\n */\nexport function get(key) {\n  const store = _store();\n  const raw = store.getItem(key);\n  if (raw === null || raw === undefined) return null;\n  try {\n    const parsed = JSON.parse(raw);\n    if (!parsed || typeof parsed !== 'object') return null;\n    return {\n      value: parsed.v,\n      storedAt: Number(parsed.t) || 0,\n      ttlMs: Number(parsed.ttl) || 0,\n    };\n  } catch (err) {\n    // 坏数据直接丢弃，避免污染后续判定\n    store.removeItem(key);\n    return null;\n  }\n}\n\n/**\n * 写入条目。\n *\n * @param {string} key 缓存键。\n * @param {*} value 任意可 JSON 序列化的值。\n * @param {number} ttlMs TTL 毫秒（0 = 不缓存语义，由调用方决定是否调用）。\n * @returns {boolean} 写入是否成功。\n */\nexport function set(key, value, ttlMs = 0) {\n  const store = _store();\n  const payload = JSON.stringify({ v: value, t: Date.now(), ttl: Number(ttlMs) || 0, stale: false });\n  try {\n    store.setItem(key, payload);\n    return true;\n  } catch (err) {\n    // 配额满：淘汰最旧的一半后重试一次\n    try {\n      evictOldest(0.5);\n      store.setItem(key, payload);\n      return true;\n    } catch (err2) {\n      return false;\n    }\n  }\n}\n\n/**\n * 带三态判定读取。\n *\n * @param {string} key 缓存键。\n * @returns {{state:'fresh'|'stale'|'miss', value:*, ageMs:number, staleForMs:number}} 三态结果。\n */\nexport function getWithState(key) {\n  const entry = get(key);\n  if (entry === null) {\n    return { state: 'miss', value: null, ageMs: 0, staleForMs: 0 };\n  }\n  const now = Date.now();\n  const ageMs = Math.max(0, now - entry.storedAt);\n  if (ageMs < entry.ttlMs) {\n    return { state: 'fresh', value: entry.value, ageMs, staleForMs: 0 };\n  }\n  return { state: 'stale', value: entry.value, ageMs, staleForMs: ageMs - entry.ttlMs };\n}\n\n/**\n * 标记为陈旧：上游失败但存在旧数据时，保留值只改标记（ageMs 继续增长）。\n *\n * @param {string} key 缓存键。\n * @returns {void}\n */\nexport function markStale(key) {\n  const entry = get(key);\n  if (entry === null) return;\n  const store = _store();\n  try {\n    store.setItem(key, JSON.stringify({ v: entry.value, t: entry.storedAt, ttl: entry.ttlMs, stale: true }));\n  } catch (err) {\n    /* 配额异常时静默：标记失败不影响主流程 */\n  }\n}\n\n/**\n * 按前缀清理。\n *\n * @param {string} prefix 键前缀（通常传 NS 或 makeKey('weather')）。\n * @returns {number} 清除条数。\n */\nexport function clearPrefix(prefix) {\n  const store = _store();\n  let count = 0;\n  for (const k of store.keys()) {\n    if (k.startsWith(prefix)) {\n      store.removeItem(k);\n      count += 1;\n    }\n  }\n  return count;\n}\n\n/**\n * 估算字符串占用字节数（UTF-8 近似：非 ASCII 按 3 字节计）。\n *\n * @param {string} s 字符串。\n * @returns {number} 估算字节数。\n */\nexport function byteSize(s) {\n  let n = 0;\n  for (let i = 0; i < s.length; i += 1) {\n    const code = s.charCodeAt(i);\n    n += code < 0x80 ? 1 : code < 0x800 ? 2 : 3;\n  }\n  return n;\n}\n\n/**\n * 淘汰最旧条目。\n *\n * @param {number} [ratio=0.25] 淘汰比例（按条目数计）。\n * @returns {number} 实际淘汰条数。\n */\nexport function evictOldest(ratio = 0.25) {\n  const store = _store();\n  const items = [];\n  for (const k of store.keys()) {\n    if (!k.startsWith(NS)) continue;\n    const raw = store.getItem(k);\n    let t = 0;\n    try {\n      t = Number(JSON.parse(raw).t) || 0;\n    } catch (err) {\n      t = 0;\n    }\n    items.push({ k, t });\n  }\n  items.sort((a, b) => a.t - b.t);\n  const drop = Math.max(1, Math.floor(items.length * ratio));\n  let n = 0;\n  for (let i = 0; i < drop && i < items.length; i += 1) {\n    store.removeItem(items[i].k);\n    n += 1;\n  }\n  return n;\n}\n\n/**\n * 容量回收：总字节超限时按 storedAt 升序淘汰，直到降到阈值以下。\n *\n * @param {number} [maxBytes=4500000] 容量上限（字节）。\n * @returns {number} 释放的条目数。\n */\nexport function prune(maxBytes = DEFAULT_MAX_BYTES) {\n  const store = _store();\n  let items = [];\n  let total = 0;\n  for (const k of store.keys()) {\n    if (!k.startsWith(NS)) continue;\n    const raw = store.getItem(k) || '';\n    let t = 0;\n    try {\n      t = Number(JSON.parse(raw).t) || 0;\n    } catch (err) {\n      t = 0;\n    }\n    total += byteSize(raw);\n    items.push({ k, t });\n  }\n  if (total <= maxBytes) return 0;\n  items.sort((a, b) => a.t - b.t);\n  let freed = 0;\n  for (const item of items) {\n    if (total <= maxBytes) break;\n    const raw = store.getItem(item.k) || '';\n    total -= byteSize(raw);\n    store.removeItem(item.k);\n    freed += 1;\n  }\n  return freed;\n}\n\n/**\n * 清空全部本应用缓存（设置项与快照一并清除，供「重置」使用）。\n *\n * @returns {number} 清除条数。\n */\nexport function clearAll() {\n  return clearPrefix(NS);\n}\n\n/**\n * 测试用：切换为内存存储并清空（仅供 tools/smoke.mjs 使用）。\n *\n * @returns {void}\n */\nexport function __useMemory() {\n  _memory.clear();\n  _useMemory = true;\n}\n",
  "src/core/geo.js": "/**\n * 定位与坐标工具\n *\n * 职责：封装浏览器定位（WGS84）、坐标四舍五入（toFixed(4) ≈ 11 m）、缓存键片段生成，\n * 并提供 GCJ-02 纠偏的**占位**实现（阶段二实现，业务层本阶段禁止调用）。\n *\n * 红线：内部坐标一律 WGS84；绝不上传用户坐标到数据源以外的任何地方。\n */\n\n/** 定位超时（毫秒）：超时即降级为默认地点，不阻塞首屏。 */\nexport const GEO_TIMEOUT_MS = 8000;\n\n/** 定位被拒 / 超时 / 无权限时的默认地点：北京天安门（WGS84）。 */\nexport const DEFAULT_PLACE = { lat: 39.9087, lon: 116.3975, name: '北京 · 天安门' };\n\n/**\n * 四位小数取整（≈11 m），用于缓存键与对外传参。\n *\n * @param {number|string} n 数值。\n * @returns {number} 四位小数数字。\n */\nexport function round4(n) {\n  const v = Number(n);\n  if (!Number.isFinite(v)) return 0;\n  return Math.round(v * 1e4) / 1e4;\n}\n\n/**\n * 坐标整体四位小数归一。\n *\n * @param {{lat:number, lon:number}} c 坐标。\n * @returns {{lat:number, lon:number}} 归一后的坐标。\n */\nexport function roundCoord(c) {\n  return { lat: round4(c.lat), lon: round4(c.lon) };\n}\n\n/**\n * 生成缓存键坐标片段 '39.9087:116.3975'。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {string} 键片段。\n */\nexport function coordKey(lat, lon) {\n  return `${round4(lat).toFixed(4)}:${round4(lon).toFixed(4)}`;\n}\n\n/**\n * 取当前位置。\n *\n * 行为：优先 navigator.geolocation（超时 8 s）；无权限 / 拒绝 / 超时 / 环境不支持时，\n * 一律降级为 DEFAULT_PLACE，并标记 source='default'，保证此刻屏始终可渲染。\n *\n * 附带海拔：`coords.altitude` 是**高于 WGS84 椭球面的高度（米）**，正好是 WMM 需要的\n * 那个「椭球高」定义（不是海拔高，两者可差几十米；磁偏角对这个量不敏感，够用）。\n * 拿不到就是 null，消费侧必须能接受缺失（方位屏按 0 参与计算）。\n *\n * @param {{timeoutMs?:number, enableHighAccuracy?:boolean}} [opts] 定位参数。\n * @returns {Promise<{lat:number, lon:number, source:'gps'|'default', accuracyM:number|null, altitudeM:number|null, name:string|null}>} 坐标结果。\n */\nexport function getCurrentPosition(opts = {}) {\n  const timeoutMs = Number(opts.timeoutMs) || GEO_TIMEOUT_MS;\n  const enableHighAccuracy = opts.enableHighAccuracy !== false;\n\n  const fallback = () => ({\n    lat: DEFAULT_PLACE.lat,\n    lon: DEFAULT_PLACE.lon,\n    source: 'default',\n    accuracyM: null,\n    altitudeM: null,\n    name: DEFAULT_PLACE.name,\n  });\n\n  if (typeof navigator === 'undefined' || !navigator.geolocation) {\n    return Promise.resolve(fallback());\n  }\n\n  return new Promise((resolve) => {\n    let settled = false;\n    const finish = (value) => {\n      if (settled) return;\n      settled = true;\n      resolve(value);\n    };\n\n    // 硬超时：定位回调迟迟不返回时也要放行首屏\n    const timer = setTimeout(() => finish(fallback()), timeoutMs);\n\n    try {\n      navigator.geolocation.getCurrentPosition(\n        (pos) => {\n          clearTimeout(timer);\n          const coords = pos && pos.coords ? pos.coords : null;\n          if (!coords || !Number.isFinite(coords.latitude) || !Number.isFinite(coords.longitude)) {\n            finish(fallback());\n            return;\n          }\n          finish({\n            lat: round4(coords.latitude),\n            lon: round4(coords.longitude),\n            source: 'gps',\n            accuracyM: Number.isFinite(coords.accuracy) ? Math.round(coords.accuracy) : null,\n            altitudeM: Number.isFinite(coords.altitude) ? Math.round(coords.altitude) : null,\n            name: null,\n          });\n        },\n        () => {\n          // 拒绝 / 不可用 / 位置信息缺失：统一降级\n          clearTimeout(timer);\n          finish(fallback());\n        },\n        {\n          enableHighAccuracy,\n          timeout: timeoutMs,\n          maximumAge: 600000, // 10 分钟内复用系统缓存，减少定位耗电\n        }\n      );\n    } catch (err) {\n      clearTimeout(timer);\n      finish(fallback());\n    }\n  });\n}\n\n/**\n * 两点球面距离（Haversine），单位 km（阶段二「附近」能力预留）。\n *\n * @param {{lat:number, lon:number}} a 起点。\n * @param {{lat:number, lon:number}} b 终点。\n * @returns {number} 距离 km。\n */\nexport function distanceKm(a, b) {\n  const R = 6371;\n  const toRad = (d) => (d * Math.PI) / 180;\n  const dLat = toRad(b.lat - a.lat);\n  const dLon = toRad(b.lon - a.lon);\n  const lat1 = toRad(a.lat);\n  const lat2 = toRad(b.lat);\n  const h =\n    Math.sin(dLat / 2) * Math.sin(dLat / 2) +\n    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);\n  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));\n}\n\n/**\n * WGS84 → GCJ-02 纠偏。\n *\n * 阶段二实现。当前为**空实现（原值返回）**，并明确注释：本阶段业务层禁止调用本函数，\n * 显示层不做任何坐标变换，界面坐标即数据源返回的 WGS84 原值。\n *\n * @param {number} lat WGS84 纬度。\n * @param {number} lon WGS84 经度。\n * @returns {{lat:number, lon:number}} GCJ-02 坐标（当前等于入参）。\n */\nexport function wgs84ToGcj02(lat, lon) {\n  // 阶段二实现：需引入加密纠偏算法（含中国境外不纠偏的边界判断）。\n  // 本阶段保持恒等返回，避免误以为已纠偏。\n  return { lat: Number(lat), lon: Number(lon) };\n}\n\n/**\n * GCJ-02 → WGS84 逆变换。\n *\n * 阶段二实现；当前为空实现（原值返回）。\n *\n * @param {number} lat GCJ-02 纬度。\n * @param {number} lon GCJ-02 经度。\n * @returns {{lat:number, lon:number}} WGS84 坐标（当前等于入参）。\n */\nexport function gcj02ToWgs84(lat, lon) {\n  // 阶段二实现。\n  return { lat: Number(lat), lon: Number(lon) };\n}\n",
  "src/core/format.js": "/**\n * 格式化工具（纯函数，无副作用、无网络）\n *\n * 职责：把「存储层的原始数值」转成「上屏的人类可读字符串」。单位换算只发生在展示层，\n * 存储与接口层固定使用：温度 °C / 风速 m·s⁻¹ / 风向 deg / 气压 hPa / 能见度 m /\n * 降水量 mm / 海拔 m / 污染物 µg·m⁻³ / 时延 ms / 字节 byte。\n *\n * 约束：所有函数对 null / undefined / NaN 一律返回占位符（'—'），绝不抛异常。\n */\n\n/** 占位符：数值缺失时统一展示。 */\nexport const DASH = '—';\n\n/**\n * 安全取数：非有限数字返回 null，便于上层决定显示占位符。\n *\n * @param {*} v 任意值。\n * @returns {number|null} 有限数字或 null。\n */\nfunction _num(v) {\n  // 硬规则：缺失绝不显示成 0。必须显式拦截的几类「看起来有值其实是空」的入参：\n  //   - null / undefined：Number(null) === 0，不拦截就会把「没数据」渲染成 0°；\n  //   - 布尔：true → 1、false → 0，同样是伪装成数值的空值；\n  //   - 纯空白串 '' / ' ' / '\\t' / '\\n'：Number('') 与 Number(' ') 都是 0，必须先 trim 再判空；\n  //   - 数组（含 [] 与 [0]）：Number([]) === 0、Number([0]) === 0，而数组从来不是标量温度。\n  // 数字字符串（'23'）走正常解析，不能被误判成缺失。\n  if (v === null || v === undefined) return null;\n  if (typeof v === 'boolean') return null;\n  if (Array.isArray(v)) return null;\n  if (typeof v === 'string' && v.trim() === '') return null;\n  const n = typeof v === 'number' ? v : Number(v);\n  return Number.isFinite(n) ? n : null;\n}\n\n/**\n * 固定小数位格式化。\n *\n * @param {*} v 数值。\n * @param {number} [digits=0] 小数位数。\n * @param {string} [unit=''] 追加单位。\n * @returns {string} 形如 '23.4 °C'；缺失时返回 '—'。\n */\nexport function num(v, digits = 0, unit = '') {\n  const n = _num(v);\n  if (n === null) return DASH;\n  const s = n.toFixed(digits);\n  return unit ? `${s} ${unit}` : s;\n}\n\n/** 温度：'23°'（展示层可不带 °C，单位另由标签给出）。 */\nexport function tempC(v, digits = 0) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(digits)}°`;\n}\n\n/** 体感温度：'体感 26°' 里的数值部分。 */\nexport function feelsC(v, digits = 0) {\n  return tempC(v, digits);\n}\n\n/** 湿度：'48%'。 */\nexport function humidity(pct) {\n  const n = _num(pct);\n  if (n === null) return DASH;\n  return `${Math.round(n)}%`;\n}\n\n/** 降水：'0.4 mm'；0 显示为 '0 mm'。 */\nexport function precipMm(v) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(1)} mm`;\n}\n\n/** 风：'3.2 m/s · 11.5 km/h'。 */\nexport function wind(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  const kmh = n * 3.6;\n  return `${n.toFixed(1)} m/s · ${kmh.toFixed(1)} km/h`;\n}\n\n/** 气压：'1013 hPa'。 */\nexport function pressure(hpa) {\n  const n = _num(hpa);\n  if (n === null) return DASH;\n  return `${Math.round(n)} hPa`;\n}\n\n/** 能见度：≥1000 m 转 km，否则保留 m。 */\nexport function visibility(m) {\n  const n = _num(m);\n  if (n === null) return DASH;\n  if (n >= 1000) return `${(n / 1000).toFixed(1)} km`;\n  return `${Math.round(n)} m`;\n}\n\n/** 海拔：'43 m'。 */\nexport function elevationM(m) {\n  const n = _num(m);\n  if (n === null) return DASH;\n  return `${Math.round(n)} m`;\n}\n\n/** 污染物浓度：'12.3 µg/m³'。 */\nexport function pollutant(v) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(1)} µg/m³`;\n}\n\n/** 时延：'123 ms'；≥1000 时保留整数毫秒。 */\nexport function latency(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  return `${Math.round(n)} ms`;\n}\n\n/** 字节：'12.3 KB'。 */\nexport function bytes(n) {\n  const v = _num(n);\n  if (v === null) return DASH;\n  if (v < 1024) return `${v} B`;\n  if (v < 1024 * 1024) return `${(v / 1024).toFixed(1)} KB`;\n  return `${(v / 1024 / 1024).toFixed(2)} MB`;\n}\n\n/** 补零两位。 */\nexport function pad2(n) {\n  const v = _num(n);\n  if (v === null) return '00';\n  return String(Math.floor(v)).padStart(2, '0');\n}\n\n/**\n * 毫秒 epoch → 'HH:MM'（按给定时区偏移）。\n *\n * @param {number|null} atMs 毫秒 epoch。\n * @param {number} [offsetSec=0] 目标时区相对 UTC 的偏移秒数（东为正）。\n * @returns {string} '07:12' 或 '—'。\n */\nexport function hhmm(atMs, offsetSec = 0) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  const d = new Date(n + offsetSec * 1000);\n  return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;\n}\n\n/**\n * 毫秒 epoch → 'MM-DD HH:MM'。\n *\n * @param {number|null} atMs 毫秒 epoch。\n * @param {number} [offsetSec=0] 时区偏移秒数。\n * @returns {string} '01-05 07:12' 或 '—'。\n */\nexport function mdHm(atMs, offsetSec = 0) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  const d = new Date(n + offsetSec * 1000);\n  return `${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;\n}\n\n/** 昼长毫秒 → '10 小时 32 分'。 */\nexport function duration(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  const totalMin = Math.round(n / 60000);\n  const h = Math.floor(totalMin / 60);\n  const m = totalMin % 60;\n  if (h <= 0) return `${m} 分`;\n  return `${h} 小时 ${m} 分`;\n}\n\n/**\n * 坐标 → '39.9087°N, 116.3975°E'（WGS84，四位小数 ≈ 11 m）。\n *\n * @param {number|null} lat 纬度。\n * @param {number|null} lon 经度。\n * @returns {string} 坐标文本或 '—'。\n */\nexport function coord(lat, lon) {\n  const la = _num(lat);\n  const lo = _num(lon);\n  if (la === null || lo === null) return DASH;\n  const ns = la >= 0 ? 'N' : 'S';\n  const ew = lo >= 0 ? 'E' : 'W';\n  return `${Math.abs(la).toFixed(4)}°${ns}, ${Math.abs(lo).toFixed(4)}°${ew}`;\n}\n\n/**\n * 相对时间：'刚刚' / '3 分钟前' / '2 小时前' / '3 天前'。\n *\n * @param {number|null} atMs 过去时刻（ms epoch）。\n * @param {number} [nowMs=Date.now()] 参照时刻。\n * @returns {string} 相对时间文本或 '—'。\n */\nexport function relativeTime(atMs, nowMs = Date.now()) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  // 未来时刻（时钟漂移 / 服务端时间偏快）也按「刚刚」处理，避免出现「-3 分钟前」\n  const diff = nowMs - n;\n  if (diff < 60000) return '刚刚';\n  const min = Math.floor(diff / 60000);\n  if (min < 60) return `${min} 分钟前`;\n  const hour = Math.floor(min / 60);\n  if (hour < 24) return `${hour} 小时前`;\n  const day = Math.floor(hour / 24);\n  if (day < 30) return `${day} 天前`;\n  const month = Math.floor(day / 30);\n  return `${month} 个月前`;\n}\n\n/**\n * 陈旧时长：供降级提示使用，与 relativeTime 同义但语义更明确。\n *\n * @param {number} staleMs 陈旧毫秒数。\n * @returns {string} '3 分钟' / '2 小时' 等。\n */\nexport function staleFor(staleMs) {\n  const n = _num(staleMs);\n  if (n === null) return DASH;\n  if (n < 60000) return `${Math.max(1, Math.round(n / 1000))} 秒`;\n  const min = Math.floor(n / 60000);\n  if (min < 60) return `${min} 分钟`;\n  const hour = Math.floor(min / 60);\n  if (hour < 24) return `${hour} 小时`;\n  return `${Math.floor(hour / 24)} 天`;\n}\n\n/**\n * 生成导出文件名时间戳 'YYYYMMDD-HHmm'（本地时区）。\n *\n * @param {number} [atMs=Date.now()] 时刻。\n * @returns {string} 形如 '20250105-1423'。\n */\nexport function stamp(atMs = Date.now()) {\n  const d = new Date(atMs);\n  const y = d.getFullYear();\n  const mo = pad2(d.getMonth() + 1);\n  const da = pad2(d.getDate());\n  const h = pad2(d.getHours());\n  const mi = pad2(d.getMinutes());\n  return `${y}${mo}${da}-${h}${mi}`;\n}\n",
  "src/core/sun.js": "/**\n * 日出日落本地算法（NOAA 近似，纯函数、离线可用）\n *\n * 职责：在无网络或上游 daily 缺失时兜底计算 sunrise / sunset / solarNoon / dayLength。\n * 纯函数、零依赖、零网络：不读时钟以外任何全局（Date.now() 仅由调用方传入 dateUTC 决定）。\n *\n * 算法：NOAA Solar Calculator（太阳天顶角 90.833°，含大气折射与日面半径修正）。\n * 返回均为 **ms epoch（UTC 语义）**；显示层按 utc_offset_seconds 转本地时间。\n * 极区可能出现 cosH 越界：cosH > 1 → 极夜，cosH < -1 → 极昼，此时 sunrise/sunset 为 null。\n */\n\nconst RAD = Math.PI / 180;\nconst DEG = 180 / Math.PI;\nconst DAY_MS = 86400000;\n\n/**\n * 归一化到 [0, 360)。\n *\n * @param {number} deg 角度。\n * @returns {number} 归一化角度。\n */\nfunction _norm360(deg) {\n  let d = deg % 360;\n  if (d < 0) d += 360;\n  return d;\n}\n\n/**\n * 归一化到 [0, 24)。\n *\n * @param {number} h 小时。\n * @returns {number} 归一化小时。\n */\nfunction _norm24(h) {\n  let v = h % 24;\n  if (v < 0) v += 24;\n  return v;\n}\n\n/**\n * 把 dateUTC 入参归一化成 ms epoch。\n *\n * 接受三种形态：ms epoch 数字、Date 实例、可被 Date.parse 解析的字符串（如 ISO 8601）。\n * 直接 Number('2025-06-21T00:00:00Z') 会得到 NaN，从而把「格式不同」误判成「算不出来」，\n * 所以字符串必须走 Date.parse；解析失败返回 NaN，由调用方的有限性校验统一降级为 null。\n *\n * @param {*} v 入参。\n * @returns {number} ms epoch；无法解析时为 NaN。\n */\nfunction _toMs(v) {\n  if (v === null || v === undefined || v === '') return NaN;\n  if (v instanceof Date) return v.getTime();\n  if (typeof v === 'number') return v;\n  if (typeof v === 'string') return Date.parse(v);\n  return NaN;\n}\n\n/**\n * 取 UTC 年内的第几天（1 月 1 日 = 1）。\n *\n * @param {Date} d UTC 日期对象。\n * @returns {number} 天序号。\n */\nfunction _dayOfYear(d) {\n  const start = Date.UTC(d.getUTCFullYear(), 0, 1);\n  const today = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());\n  return Math.floor((today - start) / DAY_MS) + 1;\n}\n\n/**\n * 计算日出日落。\n *\n * @param {{lat:number, lon:number, dateUTC:number, zenith?:number}} args 入参。\n *   lat 纬度（-90..90）；lon 经度（-180..180）；\n *   dateUTC 基准时刻，支持 ms epoch / Date / ISO 字符串三种形态（无法解析则整体降级为 null）；\n *   zenith 太阳天顶角（默认 90.833，注意显式传 0 会被 `||` 当成未提供 —— 见函数内注释）。\n * @returns {{sunriseAt:number|null, sunsetAt:number|null, solarNoonAt:number, dayLengthMs:number|null,\n *            polar:'none'|'polar-day'|'polar-night'}} 结果（ms epoch，UTC 语义）。\n */\nexport function sunriseSunset(args) {\n  const lat = Number(args && args.lat);\n  const lon = Number(args && args.lon);\n  // 已知边界（QA 已固化为回归用例，保留现状）：`|| 90.833` 会让显式传入的 zenith=0\n  // 被当成「未提供」而回落默认值（理想写法是 ??，但改了会破坏既有断言，等 QA 同步改用例）。\n  const zenith = Number(args && args.zenith) || 90.833;\n  // dateUTC 三种形态一视同仁：ms epoch / Date / ISO 字符串；解析不出时间就降级为 NaN，\n  // 由下面的有限性校验统一返回 null（绝不抛异常，调用方是首屏渲染路径）。\n  const dateUTC = _toMs(args && args.dateUTC);\n\n  if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(dateUTC)) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: NaN, dayLengthMs: null, polar: 'none' };\n  }\n\n  const d = new Date(dateUTC);\n  const N = _dayOfYear(d);\n  const midnightUtc = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());\n  const lngHour = lon / 15;\n\n  // 太阳平近点角与时间角参数（日出用 6h、日落用 18h）\n  const tRise = N + (6 - lngHour) / 24;\n  const tSet = N + (18 - lngHour) / 24;\n\n  const M = (0.9856 * tRise) - 3.289;\n\n  // 太阳真黄经\n  let L = M + (1.916 * Math.sin(M * RAD)) + (0.020 * Math.sin(2 * M * RAD)) + 282.634;\n  L = _norm360(L);\n\n  // 太阳赤经（与 L 同象限）后折算为小时\n  let RA = Math.atan(0.91764 * Math.tan(L * RAD)) * DEG;\n  RA = _norm360(RA);\n  const LQ = Math.floor(L / 90) * 90;\n  const RAQ = Math.floor(RA / 90) * 90;\n  RA = (RA + (LQ - RAQ)) / 15;\n\n  // 太阳赤纬\n  const sinDec = 0.39782 * Math.sin(L * RAD);\n  const cosDec = Math.cos(Math.asin(sinDec));\n\n  // 时角余弦\n  const cosH =\n    (Math.cos(zenith * RAD) - sinDec * Math.sin(lat * RAD)) / (cosDec * Math.cos(lat * RAD));\n\n  // 极昼 / 极夜\n  if (cosH > 1) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: midnightUtc + 12 * 3600000, dayLengthMs: 0, polar: 'polar-night' };\n  }\n  if (cosH < -1) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: midnightUtc + 12 * 3600000, dayLengthMs: DAY_MS, polar: 'polar-day' };\n  }\n\n  const H = Math.acos(cosH) * DEG;\n  const hRise = (360 - H) / 15;\n  const hSet = H / 15;\n\n  const tRiseUtc = _norm24(hRise + RA - 0.06571 * tRise - 6.622 - lngHour);\n  const tSetUtc = _norm24(hSet + RA - 0.06571 * tSet - 6.622 - lngHour);\n\n  const sunriseAt = midnightUtc + tRiseUtc * 3600000;\n  const sunsetAt = midnightUtc + tSetUtc * 3600000;\n  let dayLengthMs = sunsetAt - sunriseAt;\n  if (dayLengthMs < 0) dayLengthMs += DAY_MS;\n  const solarNoonAt = sunriseAt + dayLengthMs / 2;\n\n  return { sunriseAt, sunsetAt, solarNoonAt, dayLengthMs, polar: 'none' };\n}\n\n/**\n * 正午（太阳中天）时刻。\n *\n * @param {{lat:number, lon:number, dateUTC:number}} args 入参。\n * @returns {number} ms epoch。\n */\nexport function solarNoon(args) {\n  const r = sunriseSunset(args);\n  return Number.isFinite(r.solarNoonAt) ? r.solarNoonAt : Number(args && args.dateUTC);\n}\n\n/**\n * 指定时刻是否白昼。\n *\n * @param {number} atMs 待判时刻（ms epoch）。\n * @param {{lat:number, lon:number}} pos 位置。\n * @returns {boolean} true = 白昼。\n */\nexport function isDaylight(atMs, pos) {\n  const r = sunriseSunset({ lat: pos.lat, lon: pos.lon, dateUTC: Number(atMs) });\n  if (r.polar === 'polar-day') return true;\n  if (r.polar === 'polar-night') return false;\n  if (r.sunriseAt === null || r.sunsetAt === null) return true;\n  if (r.sunsetAt >= r.sunriseAt) {\n    return atMs >= r.sunriseAt && atMs < r.sunsetAt;\n  }\n  // 跨日情况（高纬）：日落时刻在次日\n  return atMs >= r.sunriseAt || atMs < r.sunsetAt;\n}\n",
  "src/core/store.js": "/**\n * 本机状态（Store）\n *\n * 职责：保存本机偏好与最近状态 —— 默认地点、单位制、最近一次快照、debug 开关、\n * 网络类型标记、收藏（阶段二启用，本阶段仅占位 schema）。所有持久化**必须**经 core/cache.js，\n * 本模块不直接触碰 localStorage。\n *\n * 设计：内存态 + 持久化双写；读优先内存，冷启动从缓存反序列化。\n * 日志：对外只暴露 log()，debug 关闭时完全静默，禁止 elsewhere 直写 console.log。\n */\n\nimport { get, set, makeKey } from './cache.js';\n\n/** 持久化键（store 视作一个伪 sourceId）。 */\nconst KEY_PREFS = makeKey('store', 'prefs');\nconst KEY_SNAPSHOT = makeKey('store', 'snapshot');\n\n/** store 条目 TTL：十年（等同长期有效；读用 get() 不做三态判定，故 TTL 无实际影响）。 */\nconst PREFS_TTL_MS = 10 * 365 * 24 * 3600 * 1000;\n\n/** 主题模式之一：跟随系统（等价于不设 data-theme，由 CSS 的 prefers-color-scheme 决定）。 */\nconst THEME_SYSTEM = 'system';\n\n/** 默认状态。 */\nconst DEFAULT_STATE = {\n  /** @type {{lat:number, lon:number, name:string}} 定位失败时的默认地点（北京天安门）。 */\n  defaultPlace: { lat: 39.9087, lon: 116.3975, name: '北京 · 天安门' },\n  /** @type {'metric'|'imperial'} 单位制（阶段一只有 metric 生效）。 */\n  unitSystem: 'metric',\n  /**\n   * @type {'system'|'light'|'dark'} 主题模式。\n   *\n   * 默认必须是 'system'：CSS 侧（styles/tokens.css）「不设 data-theme」这条路径本就等于\n   * 跟随系统偏好（prefers-color-scheme）。默认值若写成 'light' 或 'dark'，会出现\n   * 「store 说 dark、CSS 实际浅色」的错位 —— 用户第一次进设置页，看到的选中项与眼中\n   * 画面不一致。\n   */\n  themeMode: 'system',\n  /** @type {'wifi'|'cellular'|'unknown'} 网络类型（手动点选，默认未知）。 */\n  networkType: 'unknown',\n  /** @type {boolean} 调试开关。 */\n  debug: false,\n  /** @type {Array<{lat:number, lon:number, name:string}>} 收藏（阶段二启用）。 */\n  favorites: [],\n};\n\n/** @type {Object} 内存态。 */\nlet _state = { ...DEFAULT_STATE };\n\n/** @type {boolean} 是否已从缓存载入。 */\nlet _loaded = false;\n\n/**\n * 从缓存载入偏好（幂等）。\n *\n * @returns {void}\n */\nfunction _load() {\n  if (_loaded) return;\n  _loaded = true;\n  const entry = get(KEY_PREFS);\n  if (entry && entry.value && typeof entry.value === 'object') {\n    _state = { ...DEFAULT_STATE, ...entry.value };\n    // 数组字段做一次防御性归一，避免坏数据导致渲染崩溃\n    if (!Array.isArray(_state.favorites)) _state.favorites = [];\n  }\n  // URL 参数 ?debug=1 优先级最高\n  try {\n    const search = typeof location !== 'undefined' && location ? String(location.search || '') : '';\n    if (search.indexOf('debug=1') !== -1) _state.debug = true;\n  } catch (err) {\n    /* 非浏览器环境忽略 */\n  }\n}\n\n/**\n * 持久化偏好（失败静默）。\n *\n * @returns {void}\n */\nfunction _persist() {\n  set(KEY_PREFS, _state, PREFS_TTL_MS);\n}\n\n/**\n * 读取整份状态（副本）。\n *\n * @returns {Object} 状态副本。\n */\nexport function getState() {\n  _load();\n  return { ..._state, favorites: [..._state.favorites] };\n}\n\n/**\n * 归一地点对象（内部用）。\n *\n * 只认识五个字段里的 defaultPlace 形状；坐标必须是**有限数字**且在经纬度范围内，\n * 否则回落默认地点。为什么不做 Number() 宽容解析：`Number(null)` / `Number('')`\n * 都是 0，那会把「坏数据」静默变成「几内亚湾 0,0」这个真实存在的地点。\n * 名称长度不做截断 —— 截断规则归 core/backup.js 的 MAX_NAME_LEN 一处管。\n *\n * @param {*} p 任意值。\n * @returns {{lat:number, lon:number, name:string}} 归一后的地点。\n */\nfunction _normPlace(p) {\n  const d = DEFAULT_STATE.defaultPlace;\n  if (!p || typeof p !== 'object') return { ...d };\n  const lat = p.lat;\n  const lon = p.lon;\n  if (typeof lat !== 'number' || typeof lon !== 'number') return { ...d };\n  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return { ...d };\n  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return { ...d };\n  return { lat, lon, name: String(p.name === null || p.name === undefined ? '' : p.name) };\n}\n\n/**\n * 整体替换状态（供 core/backup.js 导入备份使用）。\n *\n * 为什么需要它：导入备份如果逐字段 set，中途失败会留下「改了一半」的状态\n * （defaultPlace 已经换了、favorites 还是旧的）。调用方（backup.js）先把完整的\n * next state 算完并校验通过，再由本函数**一次性**写入内存 + 持久化，保证原子性。\n *\n * 本函数只做**形状归一**（store 自身不变量：绝不把坏地点 / 非数组收藏写进内存态），\n * 不做业务级「非法就整体拒绝」—— 那是 backup.js 的职责。两者是同一把尺子的两道防线：\n * backup.js 负责拒绝，本函数保证就算被绕过了，内存态也不会存进不可用的值。\n *\n * 不改变任何既有 API 的语义，也不删除任何既有导出。\n *\n * ⚠️ `themeMode` 的特殊处理（漏了这条就会把用户的主题抹回去）：本函数整体重建\n * `_state`，而**备份里没有 themeMode 字段**（主题是这台机器的属性，不是用户数据，\n * 理由同 backup.js 里「debug 不从备份带入」那条）。若照其它字段一律读 `src.themeMode`，\n * 那么 `src` 里根本没有这个字段 → 一律回落 'system' → 导入一次备份就把用户手选的主题\n * 静默清掉了。所以这里也走 「有明确值就用它，否则保持当前值」。\n *\n * @param {Object} next 新状态（{ defaultPlace, unitSystem, networkType, debug, favorites, themeMode? }）。\n * @returns {Object} 实际落地的状态副本（与 getState() 同形状）。\n */\nexport function replaceState(next) {\n  _load();\n  const src = next && typeof next === 'object' ? next : {};\n  _state = {\n    defaultPlace: _normPlace(src.defaultPlace),\n    unitSystem: src.unitSystem === 'imperial' ? 'imperial' : DEFAULT_STATE.unitSystem,\n    networkType: src.networkType === 'wifi' || src.networkType === 'cellular' ? src.networkType : DEFAULT_STATE.networkType,\n    debug: !!src.debug,\n    // themeMode 不在备份里（见本函数 JSDoc）：src 没带就保持当前值，不许回落默认。\n    themeMode: src.themeMode === 'light' || src.themeMode === 'dark' ? src.themeMode : _state.themeMode,\n    favorites: (Array.isArray(src.favorites) ? src.favorites : [])\n      .filter((f) => f && typeof f === 'object' && typeof f.lat === 'number' && Number.isFinite(f.lat) && typeof f.lon === 'number' && Number.isFinite(f.lon))\n      .map((f) => ({ lat: f.lat, lon: f.lon, name: String(f.name === null || f.name === undefined ? '' : f.name) })),\n  };\n  _persist();\n  return getState();\n}\n\n/**\n * 设置默认地点。\n *\n * @param {{lat:number, lon:number, name:string}} place 地点对象。\n * @returns {void}\n */\nexport function setDefaultPlace(place) {\n  _load();\n  _state.defaultPlace = {\n    lat: Number(place.lat),\n    lon: Number(place.lon),\n    name: String(place.name || ''),\n  };\n  _persist();\n}\n\n/**\n * 取默认地点（含 source 标记，便于上游直接当 coord 用）。\n *\n * @returns {{lat:number, lon:number, name:string, source:'default'}} 默认地点。\n */\nexport function getDefaultPlace() {\n  _load();\n  const p = _state.defaultPlace;\n  return { lat: p.lat, lon: p.lon, name: p.name, source: 'default' };\n}\n\n/**\n * 设置单位制。\n *\n * @param {'metric'|'imperial'} unit 单位制。\n * @returns {void}\n */\nexport function setUnitSystem(unit) {\n  _load();\n  _state.unitSystem = unit === 'imperial' ? 'imperial' : 'metric';\n  _persist();\n}\n\n/** @returns {'metric'|'imperial'} 当前单位制。 */\nexport function getUnitSystem() {\n  _load();\n  return _state.unitSystem;\n}\n\n/**\n * 设置主题模式。\n *\n * 白名单钳位：只认 'light' / 'dark'，其它任何值（含 undefined / 拼错的字符串）一律\n * 回落 'system' —— 宁可跟随系统，也不把一个 UI 认不出来的值写进 <html data-theme>。\n *\n * @param {'system'|'light'|'dark'} mode 主题模式。\n * @returns {void}\n */\nexport function setThemeMode(mode) {\n  _load();\n  _state.themeMode = mode === 'light' || mode === 'dark' ? mode : THEME_SYSTEM;\n  _persist();\n}\n\n/** @returns {'system'|'light'|'dark'} 当前主题模式。 */\nexport function getThemeMode() {\n  _load();\n  return _state.themeMode;\n}\n\n/**\n * 设置网络类型（自检页手动点选）。\n *\n * @param {'wifi'|'cellular'|'unknown'} t 网络类型。\n * @returns {void}\n */\nexport function setNetworkType(t) {\n  _load();\n  _state.networkType = t === 'wifi' || t === 'cellular' ? t : 'unknown';\n  _persist();\n}\n\n/** @returns {'wifi'|'cellular'|'unknown'} 网络类型。 */\nexport function getNetworkType() {\n  _load();\n  return _state.networkType;\n}\n\n/**\n * 写入最近一次快照（离线冷启动的降级底座）。\n *\n * @param {Object} snapshot NowSnapshot。\n * @returns {void}\n */\nexport function setLastSnapshot(snapshot) {\n  _load();\n  set(KEY_SNAPSHOT, snapshot, PREFS_TTL_MS);\n}\n\n/**\n * 读取最近一次快照。\n *\n * @returns {Object|null} NowSnapshot 或 null。\n */\nexport function getLastSnapshot() {\n  const entry = get(KEY_SNAPSHOT);\n  return entry && entry.value ? entry.value : null;\n}\n\n/** @returns {boolean} debug 是否开启。 */\nexport function isDebug() {\n  _load();\n  return !!_state.debug;\n}\n\n/**\n * 设置 debug 开关（同时写入缓存，等价于 localStorage['gs:v1:debug']='1' 的效果）。\n *\n * @param {boolean} on 是否开启。\n * @returns {void}\n */\nexport function setDebug(on) {\n  _load();\n  _state.debug = !!on;\n  _persist();\n}\n\n/**\n * 调试日志：debug 关闭时完全静默（禁止 elsewhere 直写 console.log）。\n *\n * @param {...*} args 日志内容。\n * @returns {void}\n */\nexport function log(...args) {\n  if (!isDebug()) return;\n  try {\n    console.log('[GeoScope]', ...args);\n  } catch (err) {\n    /* 环境无 console 时静默 */\n  }\n}\n\n/** @returns {Array<{lat:number, lon:number, name:string}>} 收藏列表副本（阶段二启用）。 */\nexport function getFavorites() {\n  _load();\n  return [..._state.favorites];\n}\n\n/**\n * 追加收藏。\n *\n * @param {{lat:number, lon:number, name:string}} place 地点。\n * @returns {void}\n */\nexport function addFavorite(place) {\n  _load();\n  const lat = Number(place.lat);\n  const lon = Number(place.lon);\n  if (_state.favorites.some((f) => f.lat === lat && f.lon === lon)) return;\n  _state.favorites.push({ lat, lon, name: String(place.name || '') });\n  _persist();\n}\n\n/**\n * 判断某个坐标是否已收藏（口径与 addFavorite 的去重一致：lat + lon 精确相等）。\n *\n * 为什么单独给一个：now.js 的收藏按钮每次渲染都要问一次「现在是不是已收藏」，\n * 让 UI 层自己 `getFavorites().some(...)` 等于把去重口径抄一份到界面层 ——\n * 哪天去重规则从「精确相等」改成「四舍五入到 4 位」，界面就会和 store 判出两种结论。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {boolean} 是否已收藏。\n */\nexport function isFavorite(lat, lon) {\n  _load();\n  const la = Number(lat);\n  const lo = Number(lon);\n  return _state.favorites.some((f) => f.lat === la && f.lon === lo);\n}\n\n/**\n * 删除收藏（按 lat + lon 精确匹配，口径与 addFavorite 的去重一致）。\n *\n * 返回值必须区分「删掉了」和「本来就没有」：UI 要用它区分成功反馈与无效点击，\n * 若一律返回 undefined，取消收藏按钮在「条目已被另一处删掉」时会假报成功。\n *\n * 未命中时**不写盘**：无意义的 _persist() 会给 localStorage 增加一次写入，\n * 在配额紧张的 iOS 上是不必要的消耗。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {boolean} 是否真的删掉了（false = 本来就没有这一条）。\n */\nexport function removeFavorite(lat, lon) {\n  _load();\n  const la = Number(lat);\n  const lo = Number(lon);\n  const before = _state.favorites.length;\n  const next = _state.favorites.filter((f) => !(f.lat === la && f.lon === lo));\n  if (next.length === before) return false;\n  _state.favorites = next;\n  _persist();\n  return true;\n}\n\n/**\n * 重置本机状态（仅供自检/排障使用）。\n *\n * @returns {void}\n */\nexport function resetStore() {\n  _loaded = true;\n  _state = { ...DEFAULT_STATE, favorites: [] };\n  _persist();\n}\n",
  "src/core/wmo.js": "/**\n * 气象映射表（WMO / 欧洲 AQI / UV / 风向 / 蒲福风级）\n *\n * 职责：把数值编码翻译为中文语义与色彩令牌，供展示层直接消费。纯数据 + 纯函数，零网络。\n *\n * 口径：\n *   - WMO 天气码：Open-Meteo 使用的 weather_code（0..99）；\n *   - 欧洲 AQI：0–20 优 / 21–40 良 / 41–60 中 / 61–80 差 / 81–100 很差 / >100 极差；\n *   - UV：0–2 低 / 3–5 中 / 6–7 高 / 8–10 很高 / 11+ 极高；\n *   - 风向：16 方位中文；蒲福风级：0–12 级。\n *\n * 文案：advice 文案取自 i18n（t(adviceKey)），故本模块依赖 i18n/zh.js（叶子模块，无循环）。\n */\n\nimport { t } from '../i18n/zh.js';\n\n/**\n * WMO 天气码表（Open-Meteo 口径）。\n * zh 完整描述 / short 短描述 / icon 单字符符号（内联字符，非外链图标）。\n */\nconst WMO_TABLE = {\n  0: { zh: '晴', short: '晴', icon: '☀' },\n  1: { zh: '大部晴朗', short: '晴间少云', icon: '🌤' },\n  2: { zh: '局部多云', short: '多云', icon: '⛅' },\n  3: { zh: '阴', short: '阴', icon: '☁' },\n  45: { zh: '雾', short: '雾', icon: '🌫' },\n  48: { zh: '沉积雾凇雾', short: '雾凇', icon: '🌫' },\n  51: { zh: '小毛毛雨', short: '毛毛雨', icon: '🌦' },\n  53: { zh: '中毛毛雨', short: '毛毛雨', icon: '🌦' },\n  55: { zh: '大毛毛雨', short: '毛毛雨', icon: '🌦' },\n  56: { zh: '冻毛毛雨（弱）', short: '冻毛毛雨', icon: '🌧' },\n  57: { zh: '冻毛毛雨（强）', short: '冻毛毛雨', icon: '🌧' },\n  61: { zh: '小雨', short: '小雨', icon: '🌧' },\n  63: { zh: '中雨', short: '中雨', icon: '🌧' },\n  65: { zh: '大雨', short: '大雨', icon: '🌧' },\n  66: { zh: '冻雨（弱）', short: '冻雨', icon: '🌨' },\n  67: { zh: '冻雨（强）', short: '冻雨', icon: '🌨' },\n  71: { zh: '小雪', short: '小雪', icon: '🌨' },\n  73: { zh: '中雪', short: '中雪', icon: '🌨' },\n  75: { zh: '大雪', short: '大雪', icon: '❄' },\n  77: { zh: '米雪', short: '米雪', icon: '❄' },\n  80: { zh: '小阵雨', short: '阵雨', icon: '🌦' },\n  81: { zh: '中阵雨', short: '阵雨', icon: '🌧' },\n  82: { zh: '强阵雨', short: '暴雨', icon: '⛈' },\n  85: { zh: '小阵雪', short: '阵雪', icon: '🌨' },\n  86: { zh: '大阵雪', short: '阵雪', icon: '❄' },\n  95: { zh: '雷阵雨', short: '雷阵雨', icon: '⛈' },\n  96: { zh: '雷阵雨伴小冰雹', short: '雷暴冰雹', icon: '⛈' },\n  99: { zh: '雷阵雨伴大冰雹', short: '强雷暴冰雹', icon: '⛈' },\n};\n\n/** 未知天气码兜底。 */\nconst WMO_UNKNOWN = { zh: '未知天气', short: '未知', icon: '·' };\n\n/**\n * WMO 天气码 → 中文描述。\n *\n * @param {number} code WMO 天气码。\n * @param {boolean} [isDay=true] 是否白昼（预留昼夜图标切换，本阶段文案一致）。\n * @returns {{code:number, zh:string, short:string, icon:string, day:boolean}} 描述对象。\n */\nexport function wmo(code, isDay = true) {\n  // 【致命兜底】天气码缺失（null / '' / undefined）或非法（NaN / 'abc' / {} / []）一律落到「未知天气」。\n  // 原因：Number(null)===0、Number('')===0、Number([])===0 —— 若直接 Number() 会把「没数据」\n  // 误判成 WMO 0「晴」，界面显示「☀ 晴」。这是**误导性天气显示**，比显示「未知」更糟。\n  // 因此这里只对「number」和「非空字符串」做数值化，其余全部归一为 code = -1 的未知档。\n  let n = NaN;\n  if (typeof code === 'number') {\n    n = code;\n  } else if (typeof code === 'string' && code.trim() !== '') {\n    n = Number(code);\n  }\n  if (!Number.isFinite(n)) {\n    return {\n      code: -1,\n      zh: WMO_UNKNOWN.zh,\n      short: WMO_UNKNOWN.short,\n      icon: WMO_UNKNOWN.icon,\n      day: !!isDay,\n    };\n  }\n  const c = Math.trunc(n);\n  const base = WMO_TABLE[c] || WMO_UNKNOWN;\n  return { code: c, zh: base.zh, short: base.short, icon: base.icon, day: !!isDay };\n}\n\n/** 欧洲 AQI 六档定义。 */\nconst AQI_LEVELS = [\n  { max: 20, level: 'good', zh: '优', token: '--c-ok', adviceKey: 'aqi.good.advice' },\n  { max: 40, level: 'fair', zh: '良', token: '--c-ok', adviceKey: 'aqi.fair.advice' },\n  { max: 60, level: 'moderate', zh: '中', token: '--c-warn', adviceKey: 'aqi.moderate.advice' },\n  { max: 80, level: 'poor', zh: '差', token: '--c-warn', adviceKey: 'aqi.poor.advice' },\n  { max: 100, level: 'very-poor', zh: '很差', token: '--c-alert', adviceKey: 'aqi.very-poor.advice' },\n  { max: Infinity, level: 'extreme', zh: '极差', token: '--c-alert', adviceKey: 'aqi.extreme.advice' },\n];\n\n/**\n * 欧洲 AQI 分级。\n *\n * 说明：`value` 保留原始测量值（含负值，便于排查上游异常）；`displayValue` 是钳制到 [0, +∞)\n * 之后的展示值，界面一律用 displayValue，避免出现「优 · AQI -10」这种自相矛盾的文案。\n * 非有限入参（undefined / null / 'x' / NaN / {}）一律兜底为 0 / good。\n *\n * @param {number} europeanAqi 欧洲 AQI 值。\n * @returns {{value:number, displayValue:number, level:string, zh:string, colorToken:string,\n *            advice:string, adviceKey:string}} 分级结果。\n */\nexport function aqi(europeanAqi) {\n  const v = Number(europeanAqi);\n  const value = Number.isFinite(v) ? Math.round(v) : 0;\n  const hit = AQI_LEVELS.find((l) => value <= l.max) || AQI_LEVELS[AQI_LEVELS.length - 1];\n  return {\n    value,\n    displayValue: Math.max(0, value),\n    level: hit.level,\n    zh: hit.zh,\n    colorToken: hit.token,\n    advice: t(hit.adviceKey),\n    adviceKey: hit.adviceKey,\n  };\n}\n\n/** UV 五档定义。 */\nconst UV_LEVELS = [\n  { max: 2, level: 'low', zh: '低', token: '--c-ok', adviceKey: 'uv.low.advice' },\n  { max: 5, level: 'moderate', zh: '中', token: '--c-warn', adviceKey: 'uv.moderate.advice' },\n  { max: 7, level: 'high', zh: '高', token: '--c-warn', adviceKey: 'uv.high.advice' },\n  { max: 10, level: 'very-high', zh: '很高', token: '--c-alert', adviceKey: 'uv.very-high.advice' },\n  { max: Infinity, level: 'extreme', zh: '极高', token: '--c-alert', adviceKey: 'uv.extreme.advice' },\n];\n\n/**\n * 紫外线指数分级。\n *\n * 说明：同 aqi() —— `value` 保留原始值，`displayValue` 钳制到 [0, +∞) 供界面使用。\n * 非有限入参与负值一律兜底为 low 档。\n *\n * @param {number} index UV 指数。\n * @returns {{value:number, displayValue:number, level:string, zh:string, colorToken:string,\n *            advice:string, adviceKey:string}} 分级结果。\n */\nexport function uv(index) {\n  const v = Number(index);\n  const value = Number.isFinite(v) ? Math.round(v) : 0;\n  const hit = UV_LEVELS.find((l) => value <= l.max) || UV_LEVELS[UV_LEVELS.length - 1];\n  return {\n    value,\n    displayValue: Math.max(0, value),\n    level: hit.level,\n    zh: hit.zh,\n    colorToken: hit.token,\n    advice: t(hit.adviceKey),\n    adviceKey: hit.adviceKey,\n  };\n}\n\n/** 16 方位中文（顺时针，0 = 北）。 */\nconst DIR16 = [\n  '北', '东北偏北', '东北', '东北偏东',\n  '东', '东南偏东', '东南', '东南偏南',\n  '南', '西南偏南', '西南', '西南偏西',\n  '西', '西北偏西', '西北', '西北偏北',\n];\n\n/**\n * 风向 16 方位。\n *\n * @param {number} deg 风向角度（0 = 北，顺时针）。\n * @returns {{deg:number, zh:string}} 方位对象，zh 形如 '西北偏北风'。\n */\nexport function windDir16(deg) {\n
