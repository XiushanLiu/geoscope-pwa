// poster reuse the existing w.* keys instead of growing a second vocabulary.\n  'poster.make': 'Make poster',\n  'poster.shareTitle': 'Weather in {place}',\n  'poster.shared': 'Poster shared',\n  'poster.saved': 'Poster saved as an image',\n  'poster.fail': 'Could not create the poster, please try again',\n  'poster.brand': 'GeoScope',\n  'poster.footer': 'Source: Open-Meteo · For travel reference only',\n  'card.air': 'Air',\n  // ★2026-10 device: the number comes from `european_aqi` (bands 20/40/60/80/100), while the\n  //   level words read like China's national standard — a Chinese user reads EAQI 74 as \"良\"\n  //   (51-100) when it is 60-80 = poor on the European scale. The number is right; what was\n  //   missing is which ruler it was measured on. ★Label only — no algorithm change.\n  'air.aqiScale': 'AQI is the European standard (EAQI); its bands differ from China\\'s national standard',\n  'card.place': 'Place',\n  'card.provenance': 'Sources',\n  // \"No request was sent\" — must never render as 0 ms. Own key, not borrowed from map.cacheHit.\n  'prov.cacheHit': 'Cache hit',\n  'prov.cachedAgo': 'Cached · updated {ago}',\n  'card.forecast': 'Today & next days',\n\n  'w.temp': 'Temperature',\n  'w.feels': 'Feels like',\n  'w.humidity': 'Humidity',\n  // ★\"Precipitation\" and \"Chance of rain\" are two different quantities and the two labels\n  // must each say so: one is millimetres, the other a percentage. Writing both as \"Rain\"\n  // makes the reader think it is one number phrased two ways.\n  'w.precip': 'Precipitation',\n  'w.pop': 'Chance of rain',\n  'w.wind': 'Wind',\n  'w.pressure': 'Pressure',\n  'w.visibility': 'Visibility',\n  'w.sunrise': 'Sunrise',\n  'w.sunset': 'Sunset',\n  'w.dayLength': 'Day length',\n  'w.uv': 'UV index',\n  'w.elevation': 'Elevation',\n  'w.coord': 'Coordinates (WGS84)',\n  'w.air': 'European AQI',\n  'w.pm10': 'PM10',\n  'w.pm25': 'PM2.5',\n  'w.ozone': 'Ozone O₃',\n  'w.no2': 'Nitrogen dioxide NO₂',\n  'w.latency': 'Latency',\n  'w.beaufortLevel': '{name} (force {level})',\n  'w.unitC': '°C',\n  'w.aqiAdvice': '{level} · {advice}',\n  'w.noMap': 'Map off, coordinates-only mode',\n  'w.todayMax': \"Today's high\",\n  'w.todayMin': \"Today's low\",\n  'w.daylight': 'Daylight',\n  'w.night': 'Night',\n\n  // ---------- UV / AQI advice ----------\n  'uv.low.advice': 'No protection needed',\n  'uv.moderate.advice': 'Wear a hat if you stay out long',\n  'uv.high.advice': 'Use sunscreen and seek shade',\n  'uv.very-high.advice': 'Avoid being outdoors at midday',\n  'uv.extreme.advice': 'Full protection essential',\n  'aqi.good.advice': 'Air quality is satisfactory',\n  'aqi.fair.advice': 'Normal activity is fine',\n  'aqi.moderate.advice': 'Sensitive groups should cut back on intense outdoor exercise',\n  'aqi.poor.advice': 'Consider reducing time outdoors',\n  'aqi.very-poor.advice': 'Sensitive groups should stay indoors',\n  'aqi.extreme.advice': 'Avoid going out; wear a mask if you must',\n\n  // ---------- Place search ----------\n  // Search is the only way to \"look somewhere else\": without it the user can only see\n  // where they stand (GPS) or places already favourited.\n  // ★'search.failed' and 'search.empty' must stay TWO DIFFERENT sentences: collapsing them\n  // into one \"not found\" disguises a timeout / offline state as \"this place doesn't exist\".\n  'search.open': 'Search places',\n  'search.close': 'Close search',\n  'search.placeholder': 'Type a city or place',\n  'search.minChars': 'Type at least {n} characters',\n  'search.loading': 'Searching…',\n  'search.empty': 'No such place found',\n  'search.failed': 'Search failed — this is not \"no such place\"',\n  'search.unnamed': '(unnamed)',\n\n  // ---------- Self-check ----------\n  'sc.title': 'Source self-check',\n  'sc.subtitle': 'On-device re-check: samples each source serially, tiles judged by fingerprint de-duplication',\n  // Entry on the Me page (2026-10-16: self-check moved out of the bottom tabbar)\n  'sc.entryTitle': 'Source self-check',\n  'sc.entryHint': 'Sample each source and see which ones answer. Start here when you change network or the data looks wrong.',\n  'sc.entryBtn': 'Open',\n  'sc.networkType': 'Network type',\n  'sc.networkType.hint': 'Browsers do not expose the real network type, pick one manually',\n  'sc.net.wifi': 'WiFi',\n  'sc.net.cellular': 'Cellular',\n  'sc.net.unknown': 'Unknown',\n  'sc.samples': 'Samples',\n  'sc.run': 'Start check',\n  'sc.running': 'Check running…',\n  'sc.export': 'Export JSON',\n  'sc.copy': 'Copy result',\n  'sc.copyOk': 'Copied to clipboard, ready to paste',\n  'sc.copyFail': 'Copy failed; the JSON is shown in the log area, long-press to select all',\n  'sc.copyCompact': 'Copy compact',\n  'sc.copyCompactOk': 'Copied compact version (~1.5 KB, long URLs and UA stripped), ready to paste',\n  'sc.copyCompactFail': 'Copy failed; the compact JSON is shown in the log area, long-press to select all',\n  'sc.sources': 'Sources',\n  'sc.tiles': 'Tile fingerprints',\n  'sc.log': 'Log',\n  'sc.summary.pass': '{pass}/{total} passed',\n  'sc.verdict.all-ok': 'All sources available',\n  'sc.verdict.partial': 'Some sources unavailable',\n  'sc.verdict.offline': 'Device is offline, no request was made',\n  'sc.ms': '{ms} ms',\n  'sc.latencyRange': 'Latency {min}–{max} ms',\n  'sc.latencyP50': 'P50 {ms} ms',\n  'sc.latencyAvg': 'Avg {ms} ms',\n  'sc.httpStatus': 'HTTP {status}',\n  'sc.bytes': '{bytes} B',\n  'sc.fp': 'Fingerprint fp',\n  'sc.fpShort': 'fp',\n  'sc.fpAlgo': 'Algorithm {algo}',\n  'sc.dedupeReal': 'Verdict: real ({styles} basemap styles each have distinct fingerprints — genuine tiles)',\n  'sc.dedupeFake': 'Verdict: fake (within each of the {styles} styles the fingerprints are all identical — likely placeholders)',\n  'sc.dedupeUnknown': 'Verdict: unknown (styles disagree or too few samples, {unique}/{total})',\n  'sc.dedupeByStyle': '{label}: {unique}/{total} → {verdict}',\n  'sc.mapMode': 'Basemap mode: {mode}',\n  'sc.mapMode.map': 'Basemap available',\n  'sc.mapMode.grid': 'Grid + coordinates only (some tiles failed, has not declared \"no map\")',\n  'sc.mapMode.no-map': 'Coordinates only (basemap unavailable)',\n  'sc.warmup': '1 warm-up sample (not counted)',\n  'sc.sampleDone': 'Sample {i}/{n} done',\n  'sc.exportName': 'geoscope-selfcheck-{stamp}.json',\n  'sc.exportFail': 'Export failed: this browser does not support file download',\n  'sc.offlineSkip': 'Device is offline, the check made no requests',\n  'sc.tileOk': '{label} · {ms} ms · {bytes} B',\n  'sc.tileFail': '{label} · failed · {message}',\n  'sc.effectiveType': 'effectiveType: {value}',\n  'sc.downlink': 'downlink: {value} Mb/s',\n  'sc.userAgent': 'UA: {value}',\n\n  // ---------- Geo screen (place + basemap + bearing + full compass) ----------\n  // 2026-10-17 nav rework: compass.html grew from the \"bearing\" page into the \"geo\" tab.\n  // `geo.title` is its <title>; the header's first line is the PLACE NAME (dynamic), not this.\n  'geo.title': 'Geo · Bearing & basemap',\n\n  // ---------- Bearing screen (WMM2025 declination + compass) ----------\n  // Wording rule: state \"the value the model computes\" and \"the model's validity window\",\n  // and NOTHING about accuracy. The WMM COF carries no error model and this module exports\n  // no uncertainty field, so \"±X° error\" would be invented.\n  'compass.title': 'Bearing · Magnetic declination',\n  'compass.subtitle': 'Computed on device: WMM2025 geomagnetic model, no network',\n  'compass.na': 'Not available',\n  'compass.unavailable': 'Declination not available ({reason})',\n  'compass.defaultPlaceNotice': 'No location fix, showing the default place',\n  'compass.altitudeUnknown': 'Elevation unknown, using 0 m',\n  'compass.calcNote': 'Values are computed by the model, not calibrated on site',\n\n  'card.declination': 'Declination',\n  // No longer rendered (2026-10-26: the model card's last row uses `compass.modelAt`). Kept ONLY as a\n  // reverse anchor: `tests/compass.test.mjs` asserts this key must NOT be reused as that row's label.\n  // Delete it and `t()` returns the key literal 'card.magnetic' — the assertion stays green while\n  // pinning nothing, and nothing reports red (same silent-weakening class as `compass.title`, which is\n  // the conservative upper bound of section 16 in tools/check.mjs).\n  'card.magnetic': 'Magnetic elements',\n  'card.model': 'Model',\n  'card.convert': 'True ↔ magnetic bearing',\n  'card.compass': 'Compass',\n\n  'compass.d': 'Declination D',\n  'compass.i': 'Inclination I',\n  'compass.f': 'Total field F',\n  'compass.h': 'Horizontal component H',\n  'compass.x': 'North component X',\n  'compass.y': 'East component Y',\n  'compass.z': 'Vertical component Z',\n  // How to READ D: east is positive, so a negative number must read as \"N° west\";\n  // showing a bare -7.49° is not a reading.\n  'compass.east': '{deg}° east',\n  'compass.west': '{deg}° west',\n  'compass.noDeclination': 'Due north (no offset)',\n  // The annual change is part of the model (symbolRates.dD, deg/year → arcmin/year);\n  // it is not an accuracy figure.\n  'compass.rateD': 'Declination changes about {min}′ per year',\n\n  'compass.modelName': 'Model',\n  'compass.modelEpoch': 'Epoch',\n  'compass.modelRangeLabel': 'Valid for',\n  'compass.modelSource': 'Source',\n  // Value here is `decimalYear`; it used to borrow `card.magnetic` (screen read \"Magnetic elements 2026.82\").\n  'compass.modelAt': 'Computed for (decimal year)',\n  'compass.modelDoi': 'DOI',\n  'compass.modelRange': '{from} – {until}',\n  'compass.modelOk': 'Within validity',\n  'compass.modelLeft': 'About {years} years left',\n  // Out of range / back-dated: the numbers still show, only the trust level drops here\n  // (the card gets a warning state; nothing is hidden).\n  'compass.modelExpired': 'About {years} years past validity, values are approximate only',\n  'compass.modelAhead': 'About {years} years before the model epoch, this is a back-extrapolation',\n\n  'compass.trueBearing': 'True bearing',\n  'compass.magBearing': 'Magnetic bearing',\n  'compass.inputTrueHint': 'Enter a true bearing (degrees)',\n  'compass.inputMagHint': 'Enter a magnetic bearing (degrees)',\n  'compass.resultPrefix': 'Result',\n  'compass.convertHint': 'East is positive: true = magnetic + declination',\n  'compass.inputInvalid': 'Please enter an angle (a number)',\n  'compass.convertUnavailable': 'Declination unavailable, conversion cannot run',\n\n  'compass.sensorUnsupported': 'No orientation sensor on this device · showing computed values and manual conversion only',\n  // WebKit remembers the refusal per site and never asks again — say where to undo it.\n  'compass.sensorDenied': 'Orientation sensor not permitted · showing computed values and manual conversion only; if you tapped \"Don\\'t allow\", turn it back on in the browser\\'s settings for this site',\n  // Deliberately not naming iPhone: every iOS browser is WebKit, and Chrome on Android may\n  // require the same gesture in future. \"This browser\" stays true either way.\n  'compass.sensorIdle': 'This browser only grants access to the orientation sensor after a tap · until then, computed values and manual conversion only',\n  'compass.sensorWaiting': 'Sensor enabled, waiting for a reading…',\n  'compass.sensorEnable': 'Enable orientation sensor',\n  'compass.headingMag': 'Heading (magnetic) {deg}°',\n  'compass.headingTrue': 'Heading (true) {deg}°',\n  // Mountain name is derived from the magnetic heading — same basis as the dial ticks.\n  'compass.shanNow': '24 Mountains: {name}',\n  // Real-device report: \"which needle is true north and which is magnetic?\" — a legend row\n  // under the dial. The dots take their colour from the very same CSS tokens as the needles\n  // (.compass-dot--mag / --true); the copy here only NAMES the colour, it never paints it.\n  // Hard-coding a hex here would let the legend lie the day a token changes.\n  'compass.legendMag': 'Red · magnetic north',\n  'compass.legendTrue': 'Teal · true north',\n  // Shown only when a declination exists: with no declination there is no true-north needle,\n  // so \"the angle between the needles\" would be a false statement.\n  'compass.needleHint': 'The angle between the needles is the declination: red points to magnetic north, teal to true north',\n  'compass.compassNote': 'The needle comes from the device sensor, it is not calibrated — for reference only',\n\n  // ---------- Tile styles ----------\n  'tile.street': 'Streets',\n  'tile.imagery': 'Imagery',\n  'tile.dark': 'Dark',\n\n  // ---------- Basemap rendering (S57 street style / S58 GRID fallback) ----------\n  'card.map': 'Basemap',\n  'map.subtitle': '256 px tiles stitched by z/x/y · streets / imagery / dark',\n  'map.zoom': 'z{zoom}',\n  'map.trusted': 'Trusted',\n  'map.untrusted': 'Not trusted',\n  'map.cacheHit': 'Cache hit',\n  'map.loading': 'Loading tiles',\n  // Terminal state \"every tile fetched\" — it used to fall through to \"Loading tiles\". Never borrows loading / cacheHit.\n  'map.loaded': 'Loaded',\n  'map.blocks': '{ok}/{total} tiles',\n  'map.detail': '{blocks} · {elapsed} · {tail}',\n  'map.tailBlank': '{n} blank',\n  'map.tailFailed': '{n} failed',\n  'map.noMap': 'Basemap unavailable, switched to coordinates-only mode',\n  'map.noMapNote': 'Coordinates and values are unaffected',\n  'map.zoomIn': 'Zoom in',\n  'map.zoomOut': 'Zoom out',\n  // \"Zoom maxed out\" must be said out loud: before this, hitting the style's ceiling only greyed out\n  // the + button — users could not tell a network failure from \"this style simply has no finer data\"\n  // (streets cap at z13 in China, two taps in). Shown only when actually at the ceiling.\n  // Real-device report: \"imagery looks blurry at max zoom\". This line must answer WHY, not\n  // just print a number. It states only two certain facts: (1) the style ceiling is reached,\n  // (2) zooming past it will not yield finer tiles. It must NOT promise \"zoom in and it\n  // sharpens\", and must NOT claim \"there is no imagery here\" — we only measured Beijing,\n  // and the screenshot came from somewhere else. Sharpness genuinely varies with the source\n  // coverage of the area, so say exactly that.\n  'map.zoomMax': 'Zoom {z} is the deepest this style has · zooming further will not reveal finer imagery; sharpness depends on the coverage of this area',\n  'map.footnote': 'Tiles cached by URL for 7 days · requests only after you trust the source · 6 s timeout, no retry',\n  'map.gridFootnote': 'Missing basemap tiles do not affect coordinates or values · grid still works offline',\n  'map.credit': 'Basemap attribution',\n  'map.skeletonNote': 'Tiles not in yet · skeleton first',\n\n  // ---------- About & limits ----------\n  'about.title': 'About & limits',\n  'about.noCommercial': 'Not commercial: a personal tool. No ads, no third-party tracking, no accounts, no backend.',\n  'about.noE2ee': 'No end-to-end encrypted sync: data lives only in this device\\'s localStorage; moving it means exporting JSON.',\n  'about.noAlert': 'No alerting data source bought: push alerts are out of scope for this stage.',\n  // The NUMBER in this sentence must track the source table. Honesty rule — adding a\n  // source means updating this sentence, otherwise the privacy promise itself is false.\n  // 2026-10-17: the road-trip module was removed, so it is no longer \"six + two road\n  // sources = eight\"; it is now \"the six self-check sources (SOURCE_LIST) + the climate\n  // normals source = SEVEN\" (see SOURCE_TABLE in data/sources.js).\n  'about.privacy': 'Apart from the declared data sources (seven at present), this app contacts no other domain; your coordinates are not uploaded anywhere beyond those sources.',\n  // Developer credit: the \"+\" after \"Best\" lives in the HTML as a <sup> (see .about-dev-plus),\n  //   NOT in this string — applyI18n overwrites textContent and would erase it.\n  'about.developerLabel': 'Developer: ',\n  'about.developer': 'Best',\n\n  // ---------- How to use (static #help block in settings.html) ----------\n  'help.title': 'How to use',\n  'help.step1': 'Three tabs at the bottom: Geo / Climate / Me. The home-screen icon opens the Geo page.',\n  'help.step2': 'Location: the app asks for your position on first open; if you decline or it times out it falls back to the default place. Change it under Me → Default place, or search a place name on the Climate page.',\n  'help.step3': 'Geo: the magnetic declination is computed on this device from the WMM2025 model and works offline. The basemap switches between street, imagery and dark; zoom with the Zoom in / Zoom out buttons. If your phone has an orientation sensor, tap Enable orientation sensor to get the compass.',\n  'help.step4': 'Climate: weather, air quality, today and the days ahead, plus Show monthly averages for 1991–2020 climate normals. Cached data is still shown and marked as updated, never left blank.',\n  'help.step5': 'Add to home screen: use Add to Home screen in the browser menu. The built-in OPPO browser has no such menu — open the same URL in 360 or Chrome instead.',\n  'help.step6': 'Backup: data stays on this device. Me → Export backup writes a JSON file; Import backup restores it on a new phone. CSV export is also available.',\n  'help.tip': 'Declination and the grid basemap work offline; when offline, weather shows the last cached values together with their update time.',\n  'help.entry': 'Read the guide',\n\n  // ---------- Favorites ----------\n  // A favourite is a PLACE, not a weather snapshot: it stores a name + lat/lon only.\n  // The empty state must spell out the \"favourite → backup\" link — that link is the reason\n  // favourites exist at all: data is local only, iOS can wipe PWA storage, and the backup\n  // export is the one way out.\n  'fav.title': 'Saved places',\n  'fav.count': '{count} saved',\n  'fav.hint': 'Saved places stay on this device and are never uploaded; they travel with a backup export and come back with an import.',\n  'fav.empty': 'No saved places yet. On the Now screen, tap the star under the title to save the place you are looking at — saved places go out with your backup, and importing that JSON on a new phone restores them as they were.',\n  // Button states (☆ / ★ are icons; the words themselves go through i18n)\n  'fav.add': 'Save this place',\n  'fav.added': 'Saved',\n  // Short feedback after the tap; the \"add\" one repeats that a backup will carry it.\n  'fav.addedHint': 'Saved · it will be included in your backup export',\n  'fav.removedHint': 'Removed from saved places',\n  'fav.delete': 'Delete',\n  'fav.deleteOf': 'Delete saved place: {name}',\n  'fav.go': 'See weather now',\n  'fav.unnamed': 'Unnamed place',\n\n  // ---------- Multi-place compare ----------\n  // Entered from the Me screen (it is not a tab: the bottom bar is already at its limit on a\n  // 320 px screen, a fifth item would push the four tabs onto two lines — a real bug seen on\n  // a real device).\n  // Rule: each place is fetched SEPARATELY (one request at a time). A place that fails is\n  // marked failed on its own with \"—\" placeholders; data from elsewhere is never substituted.\n  'compare.title': 'Compare places',\n  'compare.subtitle': 'The same set of readings for each saved place, one card per place — read across a row to compare',\n  'compare.entry': 'Compare saved places',\n  'compare.entryBtn': 'Start comparison',\n  'compare.hint': 'Every place needs its own request, and only one request goes out at a time — the more places you save, the longer you wait.',\n  'compare.current': '{count} saved now',\n  'compare.needFav': 'Save some places first: on the Now screen tap the star under the title, store the places you want to compare, then come back.',\n  'compare.maxNote': 'You have more than {max} saved places; only the first {max} are compared. To compare others, delete the ones you do not need above.',\n  'compare.summary': '{total} places · {ok} fetched · {failed} failed',\n  'compare.summaryRunning': '{total} places · fetching number {done}…',\n  'compare.offline': 'Device is offline, no request was made',\n  'compare.allFailed': 'Not one of these {total} places returned data. The network may be down or a source may be temporarily unavailable — it does not mean these places have no weather.',\n  'compare.rowFailed': 'No data for this place: {reason}',\n  'compare.loading': 'Fetching…',\n  'compare.refresh': 'Refresh',\n  'compare.back': 'Back to Me',\n\n  // ---------- Settings / Me ----------\n  'settings.title': 'Me · Settings',\n  'settings.subtitle': 'Backup and appearance: nothing leaves this device, both export and import happen locally.',\n\n  // Add to desktop / home screen (a one-off action; it collapses to a single line once installed)\n  'install.hint': 'Add it to your desktop for one-tap access to the geography page.',\n  'install.hintCta': 'Install',\n  'install.dismiss': 'Dismiss install hint',\n  'settings.installTitle': 'Add to desktop or home screen',\n  'settings.installHint': 'Once added, open it from the icon on your desktop or home screen: no address bar, and it opens even when offline.',\n  'settings.installBtn': 'Add to desktop',\n  'settings.installedNote': 'Already added: open it from that icon on your desktop or home screen.',\n  // Platform-neutral: this page cannot tell iOS from Android reliably, so both routes are spelled out\n  'settings.installManual': 'This browser gives the page no one-tap install entry point, so add it manually: on iPhone / iPad open this page in Safari, tap Share at the bottom → Add to Home Screen; on Android open this page in Chrome, tap the menu at the top right → Install app or Add to Home Screen. Once added, open it from that icon.',\n  'settings.installAccepted': 'Install accepted: the system will add an icon to your desktop or home screen.',\n  'settings.installDismissed': 'Not installed this time: you dismissed the system prompt. Reload this page to try again, or follow the manual steps above.',\n  'settings.installFailed': 'This step did not go through (usually a repeated tap, or an unsupported browser). The manual steps above still work.',\n  // Per-host-environment branches: say why this environment cannot install, then give the way out.\n  // Criteria live in detectHostEnv() in install.js\n  'settings.installBlockedWechat': 'You are inside WeChat\\'s built-in browser (not Chrome or Safari), and it cannot add a web page to the desktop — so no matter how many times you tap here, no icon will appear, and nothing is wrong with this app. The one way out: tap \"…\" at the top right → \"Open in Browser\", then continue in the system browser and use its menu.',\n  'settings.installBlockedQq': 'You are inside QQ\\'s built-in browser (not Chrome or Safari), and it cannot add a web page to the desktop — this step simply does not exist there, and nothing is wrong with this app. The way out: tap \"…\" at the top right → \"Open in Browser\", then continue in the system browser and use its menu.',\n  'settings.installManualIos': 'On iPhone / iPad open this page in Safari: Chrome, WeChat and QQ on iOS all run on the same WebKit engine, and only Safari has this entry point. Then tap Share at the bottom centre of the screen → scroll down the list to Add to Home Screen → Add at the top right.',\n  // ★Real-device check (ColorOS, 2026-11-07): no \"Add to home screen\" in the menu, and no such\n  //   item on long-pressing a bookmark — the old four-step bookmark path was wrong. 360 Browser\n  //   installs it in one step on the same phone, so the copy now points there.\n  'settings.installManualOppo': 'You are using OPPO\\'s built-in browser (ColorOS). Checked on a real device: its menu has no \"Add to home screen\", and long-pressing a bookmark does not offer it either — bookmarking only leaves the page in the Bookmarks list and never creates a home-screen icon, so do not look for it there. What actually works: ① copy the address below, then open it in 360 Browser or Chrome (verified on a real device: 360 Browser\\'s \"Add to home screen\" installs it in one step, with no address bar afterwards); ② tap \"Add to home screen\" on that page, and \"GeoScope\" appears on the home screen, opening straight to the geography page; ③ if you must stay in the built-in browser, it can only be a bookmark — there will be no icon.',\n  'settings.installManualAndroid': 'Two routes. ① Try the quick one first: open this page in Chrome or your built-in browser → \"⋮\" at the top right → Install app or Add to Home Screen (on Samsung, Xiaomi, Huawei, UC and Quark the menu is in the bottom bar, not at the top right). ② If you cannot find it, use the system fallback: long-press an empty spot on the home screen → \"Shortcuts\" or \"Widgets\" → \"Website shortcut\" → enter {url} as the address → name it \"{app}\". Note: that fallback exists only on some Android devices (Samsung, stock Android) — OPPO\\'s ColorOS and vivo have no \"Shortcuts\" entry there, so do not go looking for it (this card gives those two browsers their own steps). If neither works: install Chrome and open this page in it. The difference: ② only makes a bookmark icon (address bar, no offline); Chrome installs the full version without an address bar that works offline.',\n  // Same copy when the address cannot be determined (non-browser environments): never leak the {url} placeholder onto the screen\n  'settings.installManualAndroidNoUrl': 'Two routes. ① Try the quick one first: open this page in Chrome or your built-in browser → \"⋮\" at the top right → Install app or Add to Home Screen (on Samsung, Xiaomi, Huawei, UC and Quark the menu is in the bottom bar, not at the top right). ② If you cannot find it, use the system fallback: long-press an empty spot on the home screen → \"Shortcuts\" or \"Widgets\" → \"Website shortcut\" → enter the address of this page (it is what the browser address bar shows right now — long-press to copy) → name it \"{app}\". Note: that fallback exists only on some Android devices (Samsung, stock Android) — OPPO\\'s ColorOS and vivo have no \"Shortcuts\" entry there, so do not go looking for it. If neither works: install Chrome and open this page in it. The difference: ② only makes a bookmark icon (address bar, no offline); Chrome installs the full version without an address bar that works offline.',\n  'settings.installCopyUrl': 'Copy the address',\n  'settings.installCopied': 'Copied {url}: paste it into the browser address bar or the website-shortcut field.',\n  'settings.installCopyFailed': 'This browser will not let a page copy to the clipboard, so do it by hand: long-press the address line above and copy the selection.',\n\n  // Default place (this is what shows when location is unavailable; the factory one must be labelled — it is not the user's place)\n  'settings.defaultPlaceTitle': 'Default place',\n  'settings.defaultPlaceHint': 'When location is unavailable (denied / timed out / no signal / unsupported), this is the place the Now and Geo screens fall back to. Saved places and search jumps are not affected.',\n  'settings.defaultPlaceCurrent': 'Currently: {name} · {coord}',\n  'settings.defaultPlaceFactoryNote': 'This is the factory default, not your place — if you never changed it, this is what shows whenever location is unavailable.',\n  'settings.defaultPlaceGpsBtn': 'Use current location',\n  'settings.defaultPlaceGpsDone': 'Default place set to: {name}',\n  'settings.defaultPlaceGpsDenied': 'Not changed: location permission was denied (by you or by the system). The default place was left untouched.',\n  'settings.defaultPlaceGpsTimeout': 'Not changed: waiting for location timed out. The default place was left untouched.',\n  'settings.defaultPlaceGpsUnsupported': 'Not changed: this environment has no browser geolocation. The default place was left untouched.',\n  'settings.defaultPlaceGpsOther': 'Not changed: location was not obtained and the reason cannot be told apart (not a timeout — likely permission or unavailable positioning). The default place was left untouched.',\n  'settings.defaultPlaceFavTitle': 'Pick from saved places',\n  'settings.defaultPlaceFavEmpty': 'Nothing saved yet — save a few places from the Now or Geo screen first, then you can pick one here.',\n  'settings.defaultPlaceFavDone': 'Default place set to: {name}',\n  'settings.defaultPlaceFavMissing': 'Not changed: that saved place is no longer in the list (it may have just been deleted). The default place was left untouched.',\n  'settings.defaultPlaceResetBtn': 'Restore factory default',\n  'settings.defaultPlaceResetDone': 'Restored the factory default: {name}',\n\n  // First-screen segment timings (one whole sentence as the template, numbers only; missing segments show \"—\", never 0, never dropped)\n  'settings.bootTiming': 'First screen: location {geo} · weather {weather} · air {air} · elevation {elevation} · background {background} · total {total}',\n\n  'settings.exportTitle': 'Export backup',\n  'settings.exportBtn': 'Export backup file',\n  'settings.exportCurrent': 'Ready to export: default place {place} · {count} saved places · weather snapshot {snapshot}',\n  'settings.snapshotYes': 'Saved',\n  'settings.snapshotNo': 'None',\n  'settings.exportDone': 'Exported {name}',\n  'settings.exportFail': 'Export failed: this browser does not support file download',\n  // exportBackup()'s JSDoc requires telling the user up front that the file carries location.\n  // This line sits under the button permanently, it is not a toast that flashes after the tap —\n  // the user must know before pressing.\n  //\n  // \"With snapshot\" and \"without snapshot\" must be two different sentences: the snapshot\n  // embeds the LAST KNOWN COORDINATES (lat/lon, precise to a neighbourhood) plus four source\n  // request URLs that carry the same coordinates — an order of magnitude more sensitive than\n  // defaultPlace (which is usually the factory default and not the user's real location).\n  // Checked against a real exported backup on 2026-10-12: the old wording buried the most\n  // sensitive item inside four inconspicuous words.\n  'settings.backupPrivacy': 'This file contains your location: the default place, {count} saved places, and the last known coordinates (latitude/longitude, precise enough to identify a neighbourhood) plus the weather and air data fetched at that time — the source links carry that same pair of coordinates. Exporting is offline and uploads nothing; the file goes only where you choose to save it. Do not send it to people casually.',\n  'settings.backupPrivacyNoSnap': 'This file contains your location: the default place and {count} saved places. There is no weather snapshot this time, so it carries no coordinates. Exporting is offline and uploads nothing; the file goes only where you choose to save it. Do not send it to people casually.',\n\n  'settings.importTitle': 'Import backup',\n  'settings.importHint': 'Pick a geoscope-backup-*.json. Read what is inside before you decide — confirming overwrites this device\\'s default place, saved places and last known coordinates.',\n  'settings.importPick': 'Choose a backup file',\n  'settings.importReady': 'Read {name}, contents below. Nothing on this device has changed yet.',\n  'settings.pickFirst': 'Choose a backup file first.',\n  'settings.previewTitle': 'What this backup holds',\n  'settings.previewExportedAt': 'Exported at: {time}',\n  'settings.previewPlace': 'Default place: {name}',\n  'settings.previewFavorites': 'Saved places: {count}',\n  'settings.previewDropped': '{count} of them will not be imported: invalid coordinates, duplicates, or beyond the 200-place cap.',\n  'settings.previewNoPlace': 'Unnamed place',\n  'settings.confirmBtn': 'Confirm import',\n  'settings.confirmHint': 'This is the step that writes to this device and overwrites current data with what you see above.',\n  'settings.importOk': 'Import done: default place {name} · {count} saved places',\n  'settings.importFail': 'Import failed: {reason}',\n  'settings.readFail': 'Could not read the file: {message}',\n  'settings.readEmpty': 'The file is empty; it may not be a text-format backup.',\n\n  'settings.themeTitle': 'Theme',\n  'settings.themeHint': 'Follow system means your device\\'s light/dark setting decides; once you pick one manually it sticks until you change it back.',\n  'settings.theme.system': 'Follow system',\n  'settings.theme.light': 'Light',\n  'settings.theme.dark': 'Dark',\n  'settings.themeDone': 'Theme set to {mode}',\n\n  // ---------- Accessibility font scale ----------\n  // The three tiers only change a multiplier (--fs-scale in styles/tokens.css); no colour\n  // values and no --sp-* spacing are touched.\n  // The hero temperature deliberately scales more slowly (--fs-hero-scale): it is already\n  // four times body text, and scaling it equally breaks narrow screens. Say so honestly\n  // rather than vaguely promising \"enlarge everything\".\n  'settings.fontTitle': 'Text size',\n  'settings.fontHint': 'Three tiers enlarge text across the app. That big temperature grows more slowly: it is already four times body text, and scaling it equally would break narrow screens.',\n  'settings.font.normal': 'Default',\n  'settings.font.large': 'Large',\n  'settings.font.xlarge': 'Largest',\n  'settings.fontDone': 'Text size set to {mode}',\n\n  // ---------- Offline shell version (the card on the Me screen) ----------\n  // Why surface the version at all: the browser decides whether to update a service worker by\n  // looking at sw.js's own bytes, so a device can keep running a **much older** shell — the page\n  // is stale but nothing errors, and there was no way to tell except guessing.\n  // What is shown here is not \"the newest version in the repo\" but the one the running service\n  // worker reports back, i.e. the copy this device is actually using.\n  // ★Never invent a version: when it cannot be read, say \"unknown / unsupported\" honestly rather\n  //   than assembling one from a constant or a cache name — a made-up version is worse than\n  //   \"unknown\", because it makes you believe you are already on the new one.\n  'shell.title': 'Offline shell',\n  'shell.querying': 'Checking…',\n  'shell.unknown': 'Unknown (could not read the local shell version)',\n  'shell.unsupported': 'Offline shell unavailable here (needs https or localhost)',\n  'shell.checkBtn': 'Check for updates',\n  'shell.checking': 'New version found, applying…',\n  'shell.upToDate': 'Up to date',\n  'shell.compareUnknown': 'Could not read the version needed for the comparison, so \"up to date\" cannot be confirmed; update requested — reload and check the version above.',\n  'shell.checkFailed': 'Check failed: {msg}',\n  'shell.fingerprint': 'Fingerprint {fp}',\n  'shell.noSW': 'This browser does not run the offline shell (common in WeChat / QQ in-app browsers). Open in Chrome / Edge / 360 to get updates.',\n  'shell.registered': 'Offline shell registered — reload once to take effect.',\n  'shell.onlineVersion': 'Online latest: {v}',\n  'shell.localOlder': 'Local {local}, online is {online}; update requested, reload to switch.',\n  'shell.hint': 'Browsers sometimes keep serving an older offline shell; what you see here is the copy this device is actually running. If it looks older than you expected, the cache has not swapped yet — use \"Check for updates\" to nudge it.',\n  // Site-wide note (src/ui/shellupdate.js): shown at the top of any page when a new shell has\n  // installed and is waiting to take over. reloadBtn only ever appears on that note — reloading\n  // is the user's click, never automatic (it would wipe a half-typed search term).\n  'shell.updateReady': 'A new version is ready',\n  'shell.reloadBtn': 'Reload now',\n\n  // ---------- Export CSV ----------\n  // Same rule as the backup JSON privacy note: say up front what is exported and how\n  // missing values are represented.\n  // Note in particular \"missing is blank, never 0\" — the UI shows a placeholder \"—\" but in a\n  // CSV that makes Excel treat the whole column as text, which kills the numeric columns;\n  // blank is the spreadsheet way of saying \"no data here\".\n  'settings.csvTitle': 'Export CSV',\n  'settings.csvHint': 'Export the latest Now reading as a spreadsheet. UTF-8 with BOM so Excel opens it without mojibake; one row per observation, missing values left blank (not 0).',\n  'settings.csvBtn': 'Export CSV file',\n  'settings.csvCurrent': 'Ready to export: {time} · {place}',\n  'settings.csvNone': 'Ready to export: no data yet',\n  'settings.csvEmpty': 'Nothing to export yet — open the Now screen once and it will save a snapshot to this device.',\n  'settings.csvDone': 'Exported {name}',\n  'settings.csvFail': 'Export failed: this browser does not support file download',\n  'settings.csvNoSnapshot': 'No snapshot to export',\n\n  // CSV headers (consumed by core/csv.js): every column maps to a number you can see on\n  // screen; no column may hold a quantity that is not on screen.\n  // The two time columns state their timezone on purpose: export time is device-local like\n  // the filename, observation time is local to the queried place. When you look up somewhere\n  // else these two legitimately differ; not saying so reads as a bug.\n  'csv.h.exportedAt': 'Exported at (device)',\n  'csv.h.observedAt': 'Observed at (local)',\n  'csv.h.place': 'Place',\n  'csv.h.lat': 'Latitude (deg)',\n  'csv.h.lon': 'Longitude (deg)',\n  'csv.h.elevation': 'Elevation (m)',\n  'csv.h.temp': 'Temperature (°C)',\n  'csv.h.feels': 'Feels like (°C)',\n  'csv.h.humidity': 'Humidity (%)',\n  'csv.h.precip': 'Precipitation (mm)',\n  'csv.h.windSpeed': 'Wind speed (m/s)',\n  'csv.h.windDir': 'Wind direction',\n  'csv.h.beaufort': 'Beaufort force',\n  'csv.h.pressure': 'Pressure (hPa)',\n  'csv.h.visibility': 'Visibility (m)',\n  'csv.h.weather': 'Conditions',\n  'csv.h.wmoCode': 'WMO code',\n  'csv.h.sunrise': 'Sunrise',\n  'csv.h.sunset': 'Sunset',\n  'csv.h.dayLength': 'Day length (min)',\n  'csv.h.uv': 'UV index',\n  'csv.h.uvLevel': 'UV band',\n  'csv.h.todayMax': \"Today's high (°C)\",\n  'csv.h.todayMin': \"Today's low (°C)\",\n  'csv.h.aqi': 'European AQI (EAQI)',\n  'csv.h.aqiLevel': 'EAQI band',\n  'csv.h.pm10': 'PM10 (µg/m³)',\n  'csv.h.pm25': 'PM2.5 (µg/m³)',\n  'csv.h.ozone': 'Ozone (µg/m³)',\n  'csv.h.no2': 'NO₂ (µg/m³)',\n  'csv.h.declination': 'Declination (deg, east positive)',\n  'csv.h.sources': 'Data sources',\n\n  // ---------- Legend / what the numbers mean ----------\n  // \"What the numbers mean\" is a collapsible panel at the bottom of the Now screen that\n  // explains the specialist figures in plain language.\n  // ★Threshold discipline (read before editing): wherever a BAND NUMBER appears below it is\n  //   READ OUT of src/core/wmo.js's existing tables by src/ui/legend.js — no threshold is\n  //   hard-coded here. Copying numbers in would mean the legend silently lies the day the\n  //   table changes.\n  //   Metrics with no band in the code (temperature / humidity / pressure / visibility /\n  //   pollutant concentration / elevation / coordinates / timezone) state \"what it is + unit\"\n  //   only and are honestly marked with legend.noScale.\n  'legend.title': 'What the numbers mean',\n  'legend.open': 'Show explanations',\n  'legend.close': 'Hide explanations',\n  'legend.note': 'Each entry below matches a number on screen. Bands are listed only for the scales this app actually implements (Beaufort force, European AQI, the five UV bands, the 16-point wind rose); the rest get a description and a unit, no invented standard.',\n  'legend.noScale': 'This app sets no bands for this one, it shows the value and unit only.',\n\n  'legend.group.weather': 'Weather',\n  'legend.group.air': 'Air',\n  'legend.group.place': 'Place and time',\n\n  'legend.temp.title': 'Temperature',\n  'legend.temp.unit': '°C',\n  'legend.temp.body': 'Air temperature 2 m above ground, from the source\\'s temperature_2m.',\n\n  'legend.feels.title': 'Feels like',\n  'legend.feels.unit': '°C',\n  'legend.feels.body': 'The apparent temperature the source reports (apparent_temperature): it folds wind and humidity into the air temperature. It is computed, not a second measurement — higher than the air temperature in summer and lower in winter is both normal.',\n\n  'legend.humidity.title': 'Relative humidity',\n  'legend.humidity.unit': '%',\n  'legend.humidity.body': 'Actual vapour pressure as a share of the saturation vapour pressure at the same temperature (relative_humidity_2m). 100% means saturated, at which point fog or dew becomes likely.',\n\n  'legend.precip.title': 'Precipitation',\n  'legend.precip.unit': 'mm',\n  'legend.precip.body': 'Precipitation accumulated in the current hour (precipitation), in millimetres. This is how much has fallen, not whether it will — for that see the next entry.',\n\n  'legend.pop.title': 'Chance of rain',\n  'legend.pop.unit': '%',\n  'legend.pop.body': 'The probability of precipitation in the current hour (precipitation_probability), as a percentage. It is an HOURLY figure; the screen shows the hour that lines up with \"Observed at\". When it cannot be fetched the placeholder \"—\" is shown, never 0% — 0% means \"it will definitely not rain\", which is not the same as \"we do not know\".',\n\n  'legend.wind.title': 'Wind speed',\n  'legend.wind.unit': 'm/s',\n  'legend.wind.body': 'Wind speed at 10 m above ground (wind_speed_10m) in metres per second; the screen also shows the km/h conversion (1 m/s = 3.6 km/h).',\n\n  'legend.beaufort.title': 'Beaufort force',\n  'legend.beaufort.unit': 'force',\n  'legend.beaufort.body': 'Wind speed split into forces 0–12; this is where \"Moderate breeze (force 4)\" on screen comes from. Names and thresholds are read from this app\\'s own conversion table:',\n  'legend.beaufort.row': 'Force {level} · {name} · under {max} m/s',\n  'legend.beaufort.rowLast': 'Force {level} · {name} · {min} m/s and above',\n\n  'legend.winddir.title': 'Wind direction',\n  'legend.winddir.unit': '°',\n  'legend.winddir.body': 'The direction the wind comes FROM (wind_direction_10m), cut into 16 points of 22.5° each. \"North-northwest wind\" means it blows from the north-northwest, not towards it:',\n  'legend.winddir.row': '{dir}',\n\n  'legend.pressure.title': 'Pressure',\n  'legend.pressure.unit': 'hPa',\n  'legend.pressure.body': 'Surface pressure (surface_pressure) in hectopascals. It moves with elevation and weather systems; a single absolute value means little on its own.',\n\n  'legend.visibility.title': 'Visibility',\n  'legend.visibility.unit': 'm / km',\n  'legend.visibility.body': 'The furthest distance you can see horizontally (visibility). Below 1000 m it is shown in metres; from 1000 m up it is converted to kilometres with one decimal.',\n\n  'legend.uv.title': 'UV index',\n  'legend.uv.unit': 'no unit',\n  'legend.uv.body': 'The day\\'s maximum UV index (uv_index_max), a unitless index. The five bands and their advice come from this app\\'s existing conversion table:',\n  'legend.uv.row': '{min}–{max} · {name} · {advice}',\n  'legend.uv.rowLast': '{min} and above · {name} · {advice}',\n\n  'legend.sun.title': 'Sunrise and sunset',\n  'legend.sun.unit': 'local time',\n  'legend.sun.body': 'Given by the source in local time (daily.sunrise / sunset). When the source omits them, the on-device NOAA algorithm is used instead.',\n\n  'legend.dayLength.title': 'Day length',\n  'legend.dayLength.unit': 'h · min',\n  'legend.dayLength.body': 'Sunset minus sunrise, i.e. how long daylight lasts. Around midnight sun or polar night the source may omit both times, and then the placeholder \"—\" is shown.',\n\n  'legend.today.title': \"Today's high / low\",\n  'legend.today.unit': '°C',\n  'legend.today.body': \"The day's maximum and minimum temperature from the source (temperature_2m_max / _min). These are FORECASTS for the whole day, not a reading taken right now.\",\n\n  'legend.wmo.title': 'Conditions',\n  'legend.wmo.unit': 'WMO code',\n  'legend.wmo.body': 'The icon and description are translated from a WMO weather code (0–99; for example 0 is clear, 61 is light rain). When the code is missing or invalid it says \"Unknown\" — \"no data\" is never reported as clear sky.',\n\n  'legend.observedAt.title': 'Observed at',\n  'legend.observedAt.unit': 'local time',\n  'legend.observedAt.body': 'The time step the source reports for the current data, converted to local time using the local offset.',\n\n  'legend.aqi.title': 'European AQI',\n  'legend.aqi.unit': 'no unit',\n  'legend.aqi.body': 'The European AQI as the source reports it (european_aqi): several pollutants folded into one number, lower is better. This app only splits it into six bands — the bands and advice follow:',\n  'legend.aqi.row': '{min}–{max} · {name} · {advice}',\n  'legend.aqi.rowLast': '{min} and above · {name} · {advice}',\n\n  'legend.pollutants.title': 'PM2.5 / PM10 / O₃ / NO₂',\n  'legend.pollutants.unit': 'µg/m³',\n  'legend.pollutants.body': 'Four pollutant concentrations in micrograms per cubic metre. This app does not grade individual pollutants — grading applies to the European AQI above, and these four are its inputs, so no bands are given here either.',\n\n  'legend.elevation.title': 'Elevation',\n  'legend.elevation.unit': 'm',\n  'legend.elevation.body': 'Elevation at this place (Open-Meteo Elevation) in metres. When it cannot be fetched the placeholder \"—\" is shown.',\n\n  'legend.coord.title': 'Coordinates',\n  'legend.coord.unit': 'degrees (WGS84)',\n  'legend.coord.body': 'WGS84 latitude and longitude to four decimals (about 11 m). Saving a place and jumping between screens both use these two numbers as the place\\'s identity.',\n\n  'legend.tz.title': 'Timezone offset',\n  'legend.tz.unit': 'seconds',\n  'legend.tz.body': 'The offset of local time from UTC as the source returns it (utc_offset_seconds). Sunrise, sunset and observation time are all converted with it — change it and those times move too.',\n\n  // ---------- WMO weather codes ----------\n  // core/wmo.js's wmo(code) returns only { key, shortKey, icon } — never an English string,\n  // because core may not read a locale table. These 28 pairs are turned into words by the UI\n  // layer via t(). full is used in the legend and the CSV; short in tight spots such as the\n  // hero subline and the compare screen.\n  'wmo.0': 'Clear sky',\n  'wmo.0.short': 'Clear',\n  'wmo.1': 'Mainly clear',\n  'wmo.1.short': 'Mainly clear',\n  'wmo.2': 'Partly cloudy',\n  'wmo.2.short': 'Cloudy',\n  'wmo.3': 'Overcast',\n  'wmo.3.short': 'Overcast',\n  'wmo.45': 'Fog',\n  'wmo.45.short': 'Fog',\n  'wmo.48': 'Depositing rime fog',\n  'wmo.48.short': 'Rime fog',\n  'wmo.51': 'Light drizzle',\n  'wmo.51.short': 'Drizzle',\n  'wmo.53': 'Moderate drizzle',\n  'wmo.53.short': 'Drizzle',\n  'wmo.55': 'Dense drizzle',\n  'wmo.55.short': 'Drizzle',\n  'wmo.56': 'Light freezing drizzle',\n  'wmo.56.short': 'Freezing drizzle',\n  'wmo.57': 'Dense freezing drizzle',\n  'wmo.57.short': 'Freezing drizzle',\n  'wmo.61': 'Slight rain',\n  'wmo.61.short': 'Light rain',\n  'wmo.63': 'Moderate rain',\n  'wmo.63.short': 'Rain',\n  'wmo.65': 'Heavy rain',\n  'wmo.65.short': 'Heavy rain',\n  'wmo.66': 'Light freezing rain',\n  'wmo.66.short': 'Freezing rain',\n  'wmo.67': 'Heavy freezing rain',\n  'wmo.67.short': 'Freezing rain',\n  'wmo.71': 'Slight snow fall',\n  'wmo.71.short': 'Light snow',\n  'wmo.73': 'Moderate snow fall',\n  'wmo.73.short': 'Snow',\n  'wmo.75': 'Heavy snow fall',\n  'wmo.75.short': 'Heavy snow',\n  'wmo.77': 'Snow grains',\n  'wmo.77.short': 'Snow grains',\n  'wmo.80': 'Slight rain showers',\n  'wmo.80.short': 'Showers',\n  'wmo.81': 'Moderate rain showers',\n  'wmo.81.short': 'Showers',\n  'wmo.82': 'Violent rain showers',\n  'wmo.82.short': 'Torrential',\n  'wmo.85': 'Slight snow showers',\n  'wmo.85.short': 'Snow showers',\n  'wmo.86': 'Heavy snow showers',\n  'wmo.86.short': 'Snow showers',\n  'wmo.95': 'Thunderstorm',\n  'wmo.95.short': 'Thunderstorm',\n  'wmo.96': 'Thunderstorm with slight hail',\n  'wmo.96.short': 'Thunder, hail',\n  'wmo.99': 'Thunderstorm with heavy hail',\n  'wmo.99.short': 'Severe thunder, hail',\n  // Unknown-code fallback: ★must mean \"no data\", never \"clear\".\n  'wmo.unknown': 'Unknown conditions',\n  'wmo.unknown.short': 'Unknown',\n\n  // ---------- Beaufort forces 0–12 ----------\n  'bf.0': 'Calm',\n  'bf.1': 'Light air',\n  'bf.2': 'Light breeze',\n  'bf.3': 'Gentle breeze',\n  'bf.4': 'Moderate breeze',\n  'bf.5': 'Fresh breeze',\n  'bf.6': 'Strong breeze',\n  'bf.7': 'Near gale',\n  'bf.8': 'Gale',\n  'bf.9': 'Strong gale',\n  'bf.10': 'Storm',\n  'bf.11': 'Violent storm',\n  'bf.12': 'Hurricane force',\n\n  // ---------- 16-point wind rose ----------\n  // full is used in the legend (spell it out), abbr on the Now screen next to the number\n  // (keep it short). The two differ in English; in Chinese they were both the full name,\n  // because Chinese has no shorter conventional abbreviation that reads better.\n  'dir.0': 'North',\n  'dir.0.abbr': 'N',\n  'dir.1': 'North-northeast',\n  'dir.1.abbr': 'NNE',\n  'dir.2': 'Northeast',\n  'dir.2.abbr': 'NE',\n  'dir.3': 'East-northeast',\n  'dir.3.abbr': 'ENE',\n  'dir.4': 'East',\n  'dir.4.abbr': 'E',\n  'dir.5': 'East-southeast',\n  'dir.5.abbr': 'ESE',\n  'dir.6': 'Southeast',\n  'dir.6.abbr': 'SE',\n  'dir.7': 'South-southeast',\n  'dir.7.abbr': 'SSE',\n  'dir.8': 'South',\n  'dir.8.abbr': 'S',\n  'dir.9': 'South-southwest',\n  'dir.9.abbr': 'SSW',\n  'dir.10': 'Southwest',\n  'dir.10.abbr': 'SW',\n  'dir.11': 'West-southwest',\n  'dir.11.abbr': 'WSW',\n  'dir.12': 'West',\n  'dir.12.abbr': 'W',\n  'dir.13': 'West-northwest',\n  'dir.13.abbr': 'WNW',\n  'dir.14': 'Northwest',\n  'dir.14.abbr': 'NW',\n  'dir.15': 'North-northwest',\n  'dir.15.abbr': 'NNW',\n  // Wind direction is where the wind comes FROM. Chinese uses a \"wind\" suffix, English uses\n  // a preposition — the two languages order it differently, so the whole phrase is one\n  // template and only the point name is interpolated.\n  'w.windFrom': 'wind from {dir}',\n\n  // ---------- Band names (six European AQI bands / five UV bands) ----------\n  'level.aqi.good': 'Good',\n  'level.aqi.fair': 'Fair',\n  'level.aqi.moderate': 'Moderate',\n  'level.aqi.poor': 'Poor',\n  'level.aqi.very-poor': 'Very poor',\n  'level.aqi.extreme': 'Extremely poor',\n  'level.uv.low': 'Low',\n  'level.uv.moderate': 'Moderate',\n  'level.uv.high': 'High',\n  'level.uv.very-high': 'Very high',\n  'level.uv.extreme': 'Extreme',\n\n  // ---------- Durations / relative time / staleness ----------\n  // The three core/format.js functions emit only a structured { unit, value }; the whole\n  // phrase is translated here — Chinese and English order these differently\n  // (\"10 小时 32 分\" vs \"10h 32m\", \"3 分钟前\" vs \"3 min ago\"), so assembling from fragments\n  // is wrong. Only numbers are interpolated.\n  'fmt.duration.hm': '{h}h {m}m',\n  'fmt.duration.m': '{m}m',\n  'fmt.ago.now': 'just now',\n  'fmt.ago.minute': '{n} min ago',\n  'fmt.ago.hour': '{n} h ago',\n  'fmt.ago.day': '{n} d ago',\n  'fmt.ago.month': '{n} mo ago',\n  'fmt.stale.second': '{n} s',\n  'fmt.stale.minute': '{n} min',\n  'fmt.stale.hour': '{n} h',\n  'fmt.stale.day': '{n} d',\n\n  // ---------- Default place name ----------\n  // core/geo.js and core/store.js store only the coordinates plus a stable marker name; the\n  // display name comes from here — core may not read a locale table, but this is a place\n  // name, and on an English screen it has to read \"Beijing · Tian'anmen\".\n  'place.default': \"Beijing · Tian'anmen\",\n\n  // ---------- Per-page <meta> and screen-reader labels ----------\n  // Spots in the HTML shell with NO child element (meta description / iOS home-screen\n  // name) plus the aria-labels a screen reader reads out. All of them are visible to\n  // somebody — some just via the ears — so they go through i18n too.\n  'app.shortName': 'GeoScope',\n  'app.description': 'GeoScope — a personal weather and place glance: one screen of data, here and now.',\n  'desc.selfcheck': 'GeoScope — source self-check: sample each source and see which ones answer.',\n  'desc.compass': 'GeoScope — magnetic declination and true/magnetic bearing conversion, computed on device with WMM2025, offline.',\n  'desc.settings': 'GeoScope — backup export and import, theme switching; data stays on this device, no network.',\n  'desc.compare': 'GeoScope — compare places: the same readings for each saved place, side by side.',\n  // Geo page (compass.html): place (elevation / coordinates / name) + basemap +\n  // bearing & magnetic declination + the full compass.\n  // 2026-10-17 nav restructure: the bearing page was promoted to the \"Geo\" main tab, so\n  // the page description widened accordingly — the compass is still here, just no longer\n  // the only subject.\n  'desc.geo': 'GeoScope — geo: elevation, coordinates and place name, with a basemap, bearing & magnetic declination, and the full compass.',\n  'a11y.mainNav': 'Main navigation',\n  'a11y.checkParams': 'Self-check parameters',\n  'a11y.located': 'Location updated: {place}',\n  'a11y.weather': 'Weather updated: {temp}, {desc}',\n  // ---------- Interface language ----------\n  // The switch lives on the Me screen. ★each option is written in ITS OWN language\n  // (the Chinese screen shows \"English\", not an-English-word-for-Chinese) — when a user\n  // cannot read the current interface language, the one thing that can save them is the\n  // option labelled in their own tongue.\n  'settings.langTitle': 'Language',\n  'settings.langHint': 'Switches the language of the whole interface. Place names and figures are unaffected — they come from the data sources as they are.',\n  'settings.lang.zh': '中文',\n  'settings.lang.en': 'English',\n  'settings.langDone': 'Language set to {name}',\n\n  // ---------- Source attribution ----------\n  // Attribution is legally required text: the service name and the licence name\n  // (CC-BY 4.0 / ODbL) are never translated, only the connective wording follows\n  // the interface language. Parenthesis style follows each language's own habit.\n  'attr.openmeteo': 'Open-Meteo.com (CC-BY 4.0)',\n  'attr.photon': 'Photon by Komoot (based on OpenStreetMap, ODbL)',\n  'attr.tile': 'Esri ArcGIS Online World Tile Service',\n\n  // ---------- Backup import failure reasons ----------\n  // core/backup.js returns only reasonKey / reasonParams (core may not import i18n);\n  // the UI splices them into settings.importFail's {reason}.\n  'backup.badJson': 'not valid JSON',\n  'backup.notObject': 'the backup body is not a JSON object',\n  'backup.badSchema': 'unsupported backup schema version (schema={schema})',\n  'backup.notGeoscope': 'not a GeoScope backup file',\n  'backup.noPrefs': 'missing prefs',\n  'backup.badDefaultPlace': 'defaultPlace coordinates are invalid (lat/lon must be finite numbers, latitude within ±90, longitude within ±180)',\n  'backup.planNoDefaultPlace': 'the import plan has no valid defaultPlace (call inspectBackup first)',\n  'backup.planNoFavorites': 'the import plan has no favorites array (call inspectBackup first)',\n  'backup.writeFailed': 'failed to write local state: {msg}',\n\n  // ---------- Invalid tile coordinates ----------\n  // The data layer MAY import i18n (only core may not), so this one is translated\n  // right where it is thrown.\n  'tile.badCoord': 'invalid tile coordinates (z={z}, x={x}, y={y}); no request was sent',\n};\n",
  "src/i18n/index.js": "/**\n * i18n 入口：当前 locale + 文案表 + t()\n *\n * 为什么 t() 不能继续住在 zh.js 里：翻译函数是**运行时**（要读「当前是哪一国的界面」），\n * 而 zh.js 只是一份**静态表**。两者混在一个文件时，新增英文包只能「再建一个 en.js 并\n * 另写一份 t()」，于是「当前 locale」这个概念无家可归 —— 谁切换、存在哪、什么时候生效\n * 全都得靠口头约定。本模块就是那个家。\n *\n * 三件事：\n *   1) 持有当前 locale（默认 'zh'：本项目中文界面为主）与 setLocale() / getLocale()；\n *   2) t(key, params) 按当前 locale 取表、替换占位符；\n *   3) tr(spec) 把 core 层吐出的**结构化文案量** `{ key, params }` 翻成字符串\n *      —— core 不许 import 本模块（core ← data ← ui ← html 单向依赖），它只能返回 key。\n *\n * ★缺键策略（与旧实现一致，别改成抛异常或返回空串）：返回 key 本身。\n *   「界面上显示 wmo.61」比「显示空白 / 白屏」好排查一万倍，而且它是**可见的**失败。\n *   真正的兜底是 tools/check.mjs 第 14 节：zh.js 与 en.js 的 key 集合双向校验，\n *   少一个 key 直接报红 —— 让缺键死在提交前，而不是死在用户屏幕上。\n *\n * 非浏览器安全：本模块不碰 DOM（写 <html lang> 是 ui/locale.js 的事），\n * 因此 tools/check.mjs 在 Node 侧动态 import 全部 src 模块时是安全的。\n */\n\nimport { ZH } from './zh.js';\nimport { EN } from './en.js';\n\n/** 应用元信息（导出 JSON 与页面标题共用）。 */\nexport const APP_NAME = 'GeoScope';\nexport const APP_VERSION = '1.0.0';\n\n/** 默认 locale：中文界面为主（用户拍板）。 */\nexport const DEFAULT_LOCALE = 'zh';\n\n/** 受支持的 locale（顺序即「我的」页切换器的界面顺序）。 */\nexport const LOCALES = ['zh', 'en'];\n\n/** locale → 文案表。 */\nconst TABLES = { zh: ZH, en: EN };\n\n/** locale → <html lang> 该写的 BCP-47 标签（与 ui/locale.js 共用这一处真相）。 */\nconst LANG_ATTR = { zh: 'zh-CN', en: 'en' };\n\n/** @type {string} 当前 locale（模块级：一次切换，全站生效）。 */\nlet _locale = DEFAULT_LOCALE;\n\n/**\n * 白名单钳位：只认 LOCALES 里的值。\n *\n * 为什么读侧也要钳（不直接返回 _locale）：内存态可能来自一份被外力改坏的缓存，\n * 一旦出去一个 'jp' 这样的值，TABLES['jp'] 是 undefined，t() 会全站返回原始 key。\n * 宁可回落默认语言，也不让整个界面变成一串键名。\n *\n * @param {*} v 任意值。\n * @returns {string} 'zh' 或 'en'。\n */\nfunction _norm(v) {\n  return v === 'en' ? 'en' : DEFAULT_LOCALE;\n}\n\n/**\n * 取当前 locale。\n *\n * @returns {string} 'zh' 或 'en'。\n */\nexport function getLocale() {\n  return _norm(_locale);\n}\n\n/**\n * 切换当前 locale。\n *\n * 只改内存态，**不碰 store**：写盘是 ui/settings.js 的事（与 setThemeMode / setFontScale\n * 同形状 —— store 负责持久化，本模块负责「此刻显示哪国话」）。这样 core 层不需要知道\n * i18n 的存在，i18n 也不需要 import store，两边都不破坏单向依赖。\n *\n * @param {*} v 目标 locale；非法值回落 DEFAULT_LOCALE。\n * @returns {string} 实际生效的 locale。\n */\nexport function setLocale(v) {\n  _locale = _norm(v);\n  return _locale;\n}\n\n/**\n * 取某个 locale 的文案表（供守卫脚本与单测比对两张表）。\n *\n * @param {string} [locale] locale；缺省为当前 locale。\n * @returns {Object<string,string>} 文案表（**引用**，只读用途，勿改）。\n */\nexport function tableOf(locale) {\n  return TABLES[_norm(locale === undefined ? _locale : locale)] || ZH;\n}\n\n/**\n * 取文案。\n *\n * @param {string} key 文案键，如 'status.ok'。\n * @param {Object<string, string|number>} [params] 占位符替换表，如 { ms: 123 }。\n * @returns {string} 替换后的文案；键缺失时返回 key 本身（可见的失败，便于排查）。\n */\nexport function t(key, params = {}) {\n  const table = tableOf();\n  const tpl = table[key];\n  if (tpl === undefined) {\n    // 缺失键：静默返回 key；不抛、不打日志 —— 打日志会引 store，而 store 属于 core 层，\n    // 那会让 i18n 反向依赖 core。缺键由 tools/check.mjs 第 14 节在提交前拦下。\n    return String(key);\n  }\n  return String(tpl).replace(/\\{(\\w+)\\}/g, (m, name) => {\n    const v = params[name];\n    return v === undefined || v === null ? m : String(v);\n  });\n}\n\n/**\n * 把 core 层吐出的**结构化文案量**翻成字符串。\n *\n * core/format.js 的 duration() / relativeTime() / staleFor() 返回的是\n * `{ key: 'fmt.duration.hm', params: { h: 10, m: 32 } }` —— 因为 core 不许 import 本模块。\n * 本函数就是那座桥。\n *\n * 顺带兼容「已经是字符串」的情况：那几个函数在**数值缺失**时返回 core/format.js 的\n * DASH 占位符（'—'），它不是 key，必须原样透传，不能被当成键名去查表。\n *\n * @param {string|{key:string, params?:Object}|null} spec 结构化文案量或已成文本。\n * @param {Object<string, string|number>} [extra] 额外占位符（覆盖 spec.params 的同名项）。\n * @returns {string} 文本；null / undefined 返回空串。\n */\nexport function tr(spec, extra = {}) {\n  if (spec === null || spec === undefined) return '';\n  if (typeof spec !== 'object') return String(spec);\n  const key = spec.key === undefined || spec.key === null ? '' : String(spec.key);\n  if (!key) return '';\n  return t(key, { ...(spec.params && typeof spec.params === 'object' ? spec.params : {}), ...extra });\n}\n\n/**\n * 判断文案键是否存在（debug 自检与单测用）。\n *\n * @param {string} key 文案键。\n * @returns {boolean} 是否存在于当前表。\n */\nexport function hasKey(key) {\n  return Object.prototype.hasOwnProperty.call(tableOf(), key);\n}\n\n/**\n * 导出当前表的全部键（供冒烟脚本与守卫检查完整性）。\n *\n * @returns {string[]} 键数组。\n */\nexport function allKeys() {\n  return Object.keys(tableOf());\n}\n\n/**\n * 取某个 locale 该写在 <html lang> 上的 BCP-47 标签。\n *\n * 放在这里而不写进 ui/locale.js：语言标签是语言的一部分，跟着表走，\n * 免得将来加了第三国语言时漏改某个写死 'zh-CN' 的地方。\n *\n * @param {string} [locale] locale；缺省为当前 locale。\n * @returns {string} 形如 'zh-CN' / 'en'。\n */\nexport function langAttrOf(locale) {\n  return LANG_ATTR[_norm(locale === undefined ? _locale : locale)] || LANG_ATTR[DEFAULT_LOCALE];\n}\n\n/** 重新导出两张表（供守卫脚本与单测做同构比对，UI 层请勿直接用 —— 一律走 t()）。 */\nexport { ZH, EN };\n",
  "src/core/cache.js": "/**\n * 缓存层（localStorage 封装）\n *\n * 职责：统一读写本机缓存，提供 TTL 与 fresh / stale / miss 三态判定，并作为降级底座 ——\n * 只要存在陈旧数据就绝不显示空白。全应用**唯一**允许直接触碰 localStorage 的模块。\n *\n * 约定：\n *   - 命名空间固定 'gs:v1:'，键格式 'gs:v1:<sourceId>:<参数>'；坐标一律 toFixed(4)，关键词 encodeURIComponent；\n *   - 值序列化为 { v, t, ttl, stale }，其中 t = storedAt（ms epoch）；\n *   - 配额超限先淘汰最旧条目再重试一次，仍失败返回 false 且不抛异常；\n *   - Node / 非浏览器环境下降级为内存 Map（供 tools/smoke.mjs 无网冒烟使用）。\n */\n\n/** 缓存键命名空间（版本号变更即整体失效）。 */\nexport const NS = 'gs:v1:';\n\n/** 默认容量上限（字节，按 JSON 字符串长度估算）。 */\nexport const DEFAULT_MAX_BYTES = 4_500_000;\n\n/** @type {Map<string, string>} 无 localStorage 时的内存兜底。 */\nconst _memory = new Map();\n\n/** @type {boolean} 是否已确认使用内存兜底。 */\nlet _useMemory = !(typeof localStorage !== 'undefined' && localStorage !== null);\n\n/**\n * 内存版存储适配器（接口与 Storage 对齐的最小子集）。\n */\nconst memoryStorage = {\n  getItem: (k) => (_memory.has(k) ? _memory.get(k) : null),\n  setItem: (k, v) => { _memory.set(k, String(v)); },\n  removeItem: (k) => { _memory.delete(k); },\n  keys: () => Array.from(_memory.keys()),\n};\n\n/**\n * 取当前可用存储。\n *\n * @returns {{getItem:Function, setItem:Function, removeItem:Function, keys:Function}} 存储适配器。\n */\nfunction _store() {\n  if (_useMemory) return memoryStorage;\n  try {\n    // 探测真实可用性（隐私模式 / 被禁用时会抛）\n    const probeKey = `${NS}__probe__`;\n    localStorage.setItem(probeKey, '1');\n    localStorage.removeItem(probeKey);\n    return {\n      getItem: (k) => localStorage.getItem(k),\n      setItem: (k, v) => localStorage.setItem(k, v),\n      removeItem: (k) => localStorage.removeItem(k),\n      keys: () => {\n        const out = [];\n        for (let i = 0; i < localStorage.length; i += 1) {\n          const k = localStorage.key(i);\n          if (k !== null) out.push(k);\n        }\n        return out;\n      },\n    };\n  } catch (err) {\n    _useMemory = true;\n    return memoryStorage;\n  }\n}\n\n/**\n * 构造缓存键。\n *\n * @param {string} sourceId 源 id（或 'store' 等伪源）。\n * @param {...(string|number)} parts 参数片段。\n * @returns {string} 'gs:v1:<sourceId>:<p1>:<p2>'。\n */\nexport function makeKey(sourceId, ...parts) {\n  return `${NS}${sourceId}:${parts.join(':')}`;\n}\n\n/**\n * 读取条目（不做 TTL 判定）。\n *\n * @param {string} key 缓存键。\n * @returns {{value: *, storedAt: number, ttlMs: number}|null} 条目或 null。\n */\nexport function get(key) {\n  const store = _store();\n  const raw = store.getItem(key);\n  if (raw === null || raw === undefined) return null;\n  try {\n    const parsed = JSON.parse(raw);\n    if (!parsed || typeof parsed !== 'object') return null;\n    return {\n      value: parsed.v,\n      storedAt: Number(parsed.t) || 0,\n      ttlMs: Number(parsed.ttl) || 0,\n    };\n  } catch (err) {\n    // 坏数据直接丢弃，避免污染后续判定\n    store.removeItem(key);\n    return null;\n  }\n}\n\n/**\n * 写入条目。\n *\n * @param {string} key 缓存键。\n * @param {*} value 任意可 JSON 序列化的值。\n * @param {number} ttlMs TTL 毫秒（0 = 不缓存语义，由调用方决定是否调用）。\n * @returns {boolean} 写入是否成功。\n */\nexport function set(key, value, ttlMs = 0) {\n  const store = _store();\n  const payload = JSON.stringify({ v: value, t: Date.now(), ttl: Number(ttlMs) || 0, stale: false });\n  try {\n    store.setItem(key, payload);\n    return true;\n  } catch (err) {\n    // 配额满：淘汰最旧的一半后重试一次\n    try {\n      evictOldest(0.5);\n      store.setItem(key, payload);\n      return true;\n    } catch (err2) {\n      return false;\n    }\n  }\n}\n\n/**\n * 带三态判定读取。\n *\n * @param {string} key 缓存键。\n * @returns {{state:'fresh'|'stale'|'miss', value:*, ageMs:number, staleForMs:number}} 三态结果。\n */\nexport function getWithState(key) {\n  const entry = get(key);\n  if (entry === null) {\n    return { state: 'miss', value: null, ageMs: 0, staleForMs: 0 };\n  }\n  const now = Date.now();\n  const ageMs = Math.max(0, now - entry.storedAt);\n  if (ageMs < entry.ttlMs) {\n    return { state: 'fresh', value: entry.value, ageMs, staleForMs: 0 };\n  }\n  return { state: 'stale', value: entry.value, ageMs, staleForMs: ageMs - entry.ttlMs };\n}\n\n/**\n * 标记为陈旧：上游失败但存在旧数据时，保留值只改标记（ageMs 继续增长）。\n *\n * @param {string} key 缓存键。\n * @returns {void}\n */\nexport function markStale(key) {\n  const entry = get(key);\n  if (entry === null) return;\n  const store = _store();\n  try {\n    store.setItem(key, JSON.stringify({ v: entry.value, t: entry.storedAt, ttl: entry.ttlMs, stale: true }));\n  } catch (err) {\n    /* 配额异常时静默：标记失败不影响主流程 */\n  }\n}\n\n/**\n * 删除**单个**条目（精确匹配，不是前缀匹配）。\n *\n * ★为什么必须存在：删一条记录若用 `clearPrefix(key)` 代替，而另一个键恰好以它为前缀\n *   （行程 id 'abc' 与 'abcd' 就属于这种情况 —— 导入进来的 id 是别人生成的，撞前缀\n *   完全可能），结果就是**一次删除带走两条用户数据**，且没有任何提示。\n *   精确删除与前缀清理是两种语义，混用必然出事，所以各自有一个名字。\n *\n * @param {string} key 缓存键（精确）。\n * @returns {boolean} 是否真的删掉了（本来就不存在返回 false，不假称成功）。\n */\nexport function remove(key) {\n  const store = _store();\n  if (store.getItem(key) === null || store.getItem(key) === undefined) return false;\n  store.removeItem(key);\n  return true;\n}\n\n/**\n * 按前缀清理。\n *\n * @param {string} prefix 键前缀（通常传 NS 或 makeKey('weather')）。\n * @returns {number} 清除条数。\n */\nexport function clearPrefix(prefix) {\n  const store = _store();\n  let count = 0;\n  for (const k of store.keys()) {\n    if (k.startsWith(prefix)) {\n      store.removeItem(k);\n      count += 1;\n    }\n  }\n  return count;\n}\n\n/**\n * 估算字符串占用字节数（UTF-8 近似：非 ASCII 按 3 字节计）。\n *\n * @param {string} s 字符串。\n * @returns {number} 估算字节数。\n */\nexport function byteSize(s) {\n  let n = 0;\n  for (let i = 0; i < s.length; i += 1) {\n    const code = s.charCodeAt(i);\n    n += code < 0x80 ? 1 : code < 0x800 ? 2 : 3;\n  }\n  return n;\n}\n\n/**\n * 淘汰最旧条目。\n *\n * @param {number} [ratio=0.25] 淘汰比例（按条目数计）。\n * @returns {number} 实际淘汰条数。\n */\nexport function evictOldest(ratio = 0.25) {\n  const store = _store();\n  const items = [];\n  for (const k of store.keys()) {\n    if (!k.startsWith(NS)) continue;\n    const raw = store.getItem(k);\n    let t = 0;\n    try {\n      t = Number(JSON.parse(raw).t) || 0;\n    } catch (err) {\n      t = 0;\n    }\n    items.push({ k, t });\n  }\n  items.sort((a, b) => a.t - b.t);\n  const drop = Math.max(1, Math.floor(items.length * ratio));\n  let n = 0;\n  for (let i = 0; i < drop && i < items.length; i += 1) {\n    store.removeItem(items[i].k);\n    n += 1;\n  }\n  return n;\n}\n\n/**\n * 容量回收：总字节超限时按 storedAt 升序淘汰，直到降到阈值以下。\n *\n * @param {number} [maxBytes=4500000] 容量上限（字节）。\n * @returns {number} 释放的条目数。\n */\nexport function prune(maxBytes = DEFAULT_MAX_BYTES) {\n  const store = _store();\n  let items = [];\n  let total = 0;\n  for (const k of store.keys()) {\n    if (!k.startsWith(NS)) continue;\n    const raw = store.getItem(k) || '';\n    let t = 0;\n    try {\n      t = Number(JSON.parse(raw).t) || 0;\n    } catch (err) {\n      t = 0;\n    }\n    total += byteSize(raw);\n    items.push({ k, t });\n  }\n  if (total <= maxBytes) return 0;\n  items.sort((a, b) => a.t - b.t);\n  let freed = 0;\n  for (const item of items) {\n    if (total <= maxBytes) break;\n    const raw = store.getItem(item.k) || '';\n    total -= byteSize(raw);\n    store.removeItem(item.k);\n    freed += 1;\n  }\n  return freed;\n}\n\n/**\n * 清空全部本应用缓存（设置项与快照一并清除，供「重置」使用）。\n *\n * @returns {number} 清除条数。\n */\nexport function clearAll() {\n  return clearPrefix(NS);\n}\n\n/**\n * 测试用：切换为内存存储并清空（仅供 tools/smoke.mjs 使用）。\n *\n * @returns {void}\n */\nexport function __useMemory() {\n  _memory.clear();\n  _useMemory = true;\n}\n",
  "src/core/geo.js": "/**\n * 定位与坐标工具\n *\n * 职责：封装浏览器定位（WGS84）、坐标四舍五入（toFixed(4) ≈ 11 m）、缓存键片段生成、\n * 两点球面距离，以及 **GCJ-02 ↔ WGS84 双向纠偏**。\n *\n * ★坐标系方向（改代码前先读）：本模块的**内部与对外口径一律是 WGS84**。\n *   - `wgs84ToGcj02()`：把 WGS84 加偏成 GCJ-02（只在「要按中国法规提交给国内服务」时用）；\n *   - `gcj02ToWgs84()`：把 GCJ-02 反解回 WGS84（**国内来源的 POI 真正要用的方向** ——\n *     国内服务返回的 POI 是 GCJ-02，必须转回 WGS84 才能和 Esri 底图画在同一张图上）。\n *   两者**不是**同一个函数，方向搞反会把点位挪到几百米外（架构 §2.2：天安门处经度偏移\n *   可达 531 m），属于「看起来正常但错了」的最坏一类 bug。\n *\n * ★境外（含港澳台以外的中国境外偏移区）一律**原样返回、不纠偏**，由 `isInOffsetZone()`\n *   判定（实测口径：东京坐标经 gcj02ToWgs84 返回原值）。\n *\n * 算法说明（不是本仓库自创）：GCJ-02 加偏使用官方公布的克拉索夫斯基椭球参数与三角级数，\n * 反解（GCJ-02 → WGS84）用 **5 次定常迭代反演** —— 偏移量本身只有几百米、梯度平缓，\n * 迭代 5 次后往返残差已远小于 1 m。\n *\n * ★断言在哪：往返残差 < 1 m 的 6 个境内样本，连同境外原样返回、`isInOffsetZone`\n *   边界、非数字入参三组用例，都钉在 `tests/geo-coord.test.mjs`。这批断言原本挂在自驾\n *   那批测试里，自驾下线时被一并删掉 —— 那是**删除造成的回归**，现已一字未改迁回，\n *   并做过变异验证：把任一方向改成恒等映射、或把 `GCJ_INVERSE_ITERATIONS` 从 5 降到 1，\n *   该测试都会红。\n *\n * ★但「有断言」不等于「有活调用方」：这两个导出目前没有活调用方（原调用方是已删除的\n *   自驾 POI 模块）。`data/tiles.js` 里出现过这两个函数名，但**只在注释里**，\n *   `tests/geo-coord.test.mjs` 第 ⑤ 条把这条反向钉住了。本文件守的只是**算法契约**。\n *\n * 红线：内部坐标一律 WGS84；绝不上传用户坐标到数据源以外的任何地方。\n */\n\n/** 定位超时（毫秒）：超时即降级为默认地点，不阻塞首屏。 */\nexport const GEO_TIMEOUT_MS = 8000;\n\n/**\n * 出厂默认地点的**标记名**。\n *\n * ★它是一个**地名**，界面上必须跟着语言走（英文界面下要写成 \"Beijing · Tian'anmen\"），\n *   而 core 不许读 locale 表 —— 所以这里存的是**中文那一份原文**，UI 层拿它和\n *   `place.default` 这条文案键对应起来（src/ui/locale.js 的 placeDisplayName()）。\n *   不改成一个抽象标记（比如 'default'）的理由：这个名字会被**写进备份 JSON**，\n *   换成一个标记会让老备份里的默认地点显示成一个词不是地名的值。\n */\nexport const DEFAULT_PLACE_NAME = '北京 · 天安门';\n\n/** 定位被拒 / 超时 / 无权限时的默认地点：北京天安门（WGS84）。 */\nexport const DEFAULT_PLACE = { lat: 39.9087, lon: 116.3975, name: DEFAULT_PLACE_NAME };\n\n/**\n * 四位小数取整（≈11 m），用于缓存键与对外传参。\n *\n * @param {number|string} n 数值。\n * @returns {number} 四位小数数字。\n */\nexport function round4(n) {\n  const v = Number(n);\n  if (!Number.isFinite(v)) return 0;\n  return Math.round(v * 1e4) / 1e4;\n}\n\n/**\n * 坐标整体四位小数归一。\n *\n * @param {{lat:number, lon:number}} c 坐标。\n * @returns {{lat:number, lon:number}} 归一后的坐标。\n */\nexport function roundCoord(c) {\n  return { lat: round4(c.lat), lon: round4(c.lon) };\n}\n\n/**\n * 生成缓存键坐标片段 '39.9087:116.3975'。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {string} 键片段。\n */\nexport function coordKey(lat, lon) {\n  return `${round4(lat).toFixed(4)}:${round4(lon).toFixed(4)}`;\n}\n\n/**\n * 取当前位置。\n *\n * 行为：优先 navigator.geolocation（超时 8 s）；无权限 / 拒绝 / 超时 / 环境不支持时，\n * 一律降级为 DEFAULT_PLACE，并标记 source='default'，保证此刻屏始终可渲染。\n *\n * 附带海拔：`coords.altitude` 是**高于 WGS84 椭球面的高度（米）**，正好是 WMM 需要的\n * 那个「椭球高」定义（不是海拔高，两者可差几十米；磁偏角对这个量不敏感，够用）。\n * 拿不到就是 null，消费侧必须能接受缺失（方位屏按 0 参与计算）。\n *\n * @param {{timeoutMs?:number, enableHighAccuracy?:boolean}} [opts] 定位参数。\n * @returns {Promise<{lat:number, lon:number, source:'gps'|'default', accuracyM:number|null, altitudeM:number|null, name:string|null}>} 坐标结果。\n */\nexport function getCurrentPosition(opts = {}) {\n  const timeoutMs = Number(opts.timeoutMs) || GEO_TIMEOUT_MS;\n  const enableHighAccuracy = opts.enableHighAccuracy !== false;\n\n  const fallback = () => ({\n    lat: DEFAULT_PLACE.lat,\n    lon: DEFAULT_PLACE.lon,\n    source: 'default',\n    accuracyM: null,\n    altitudeM: null,\n    name: DEFAULT_PLACE.name,\n  });\n\n  if (typeof navigator === 'undefined' || !navigator.geolocation) {\n    return Promise.resolve(fallback());\n  }\n\n  return new Promise((resolve) => {\n    let settled = false;\n    const finish = (value) => {\n      if (settled) return;\n      settled = true;\n      resolve(value);\n    };\n\n    // 硬超时：定位回调迟迟不返回时也要放行首屏\n    const timer = setTimeout(() => finish(fallback()), timeoutMs);\n\n    try {\n      navigator.geolocation.getCurrentPosition(\n        (pos) => {\n          clearTimeout(timer);\n          const coords = pos && pos.coords ? pos.coords : null;\n          if (!coords || !Number.isFinite(coords.latitude) || !Number.isFinite(coords.longitude)) {\n            finish(fallback());\n            return;\n          }\n          finish({\n            lat: round4(coords.latitude),\n            lon: round4(coords.longitude),\n            source: 'gps',\n            accuracyM: Number.isFinite(coords.accuracy) ? Math.round(coords.accuracy) : null,\n            altitudeM: Number.isFinite(coords.altitude) ? Math.round(coords.altitude) : null,\n            name: null,\n          });\n        },\n        () => {\n          // 拒绝 / 不可用 / 位置信息缺失：统一降级\n          clearTimeout(timer);\n          finish(fallback());\n        },\n        {\n          enableHighAccuracy,\n          timeout: timeoutMs,\n          maximumAge: 600000, // 10 分钟内复用系统缓存，减少定位耗电\n        }\n      );\n    } catch (err) {\n      clearTimeout(timer);\n      finish(fallback());\n    }\n  });\n}\n\n/**\n * 两点球面距离（Haversine），单位 km（阶段二「附近」能力预留）。\n *\n * @param {{lat:number, lon:number}} a 起点。\n * @param {{lat:number, lon:number}} b 终点。\n * @returns {number} 距离 km。\n */\nexport function distanceKm(a, b) {\n  const R = 6371;\n  const toRad = (d) => (d * Math.PI) / 180;\n  const dLat = toRad(b.lat - a.lat);\n  const dLon = toRad(b.lon - a.lon);\n  const lat1 = toRad(a.lat);\n  const lat2 = toRad(b.lat);\n  const h =\n    Math.sin(dLat / 2) * Math.sin(dLat / 2) +\n    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);\n  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));\n}\n\n/* ------------------------------------------------------------------ */\n/* GCJ-02 纠偏（官方算法常量 + 双向变换）                                */\n/* ------------------------------------------------------------------ */\n\n/** GCJ-02 加偏所用椭球的长半轴（克拉索夫斯基 1940，单位：米）。 */\nconst GCJ_A = 6378245.0;\n\n/** 该椭球的第一偏心率平方。 */\nconst GCJ_EE = 0.00669342162296594323;\n\n/** 圆周率：与公开实现保持一致，改精度会让结果差出米级。 */\nconst GCJ_PI = 3.1415926535897932384626;\n\n/** GCJ-02 施加偏移的经度范围（中国大陆的粗略外包框，境外一律不纠偏）。 */\nconst OFFSET_LON_MIN = 72.004;\nconst OFFSET_LON_MAX = 137.8347;\n/** GCJ-02 施加偏移的纬度范围。 */\nconst OFFSET_LAT_MIN = 0.8293;\nconst OFFSET_LAT_MAX = 55.8271;\n\n/**\n * 安全取有限数字（缺失一律 null，绝不变成 0）。\n *\n * ★为什么不能直接 `Number(v)`：`Number(null) === 0`、`Number('') === 0` —— 于是\n *   「没有坐标」会被变成「几内亚湾 0,0」，再经过加偏计算后看起来是一个合法的中国境外\n *   坐标，错得悄无声息。口径与 core/format.js 的 `_num()` 完全一致。\n *\n * @param {*} v 任意值。\n * @returns {number|null} 有限数字或 null。\n */\nfunction _finite(v) {\n  if (v === null || v === undefined) return null;\n  if (typeof v === 'boolean') return null;\n  if (Array.isArray(v)) return null;\n  if (typeof v === 'string' && v.trim() === '') return null;\n  const n = typeof v === 'number' ? v : Number(v);\n  return Number.isFinite(n) ? n : null;\n}\n\n/**\n * 判定一个坐标是否落在 GCJ-02 的偏移区（中国大陆粗略外包框）内。\n *\n * ★为什么是「粗略外包框」而不是精确国界：GCJ-02 的加偏范围从来没有被官方公布过精确\n *   边界，公开实现一致使用这个外包框。**框外的点一律原样返回** —— 拿一个框外的坐标去\n *   加偏/反解，会凭空制造几百米的误差，那是比不纠偏严重得多的错。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {boolean} 落在偏移区内返回 true；非数字一律 false（宁可不纠偏，也不制造假偏移）。\n */\nexport function isInOffsetZone(lat, lon) {\n  const la = _finite(lat);\n  const lo = _finite(lon);\n  if (la === null || lo === null) return false;\n  if (lo < OFFSET_LON_MIN || lo > OFFSET_LON_MAX) return false;\n  if (la < OFFSET_LAT_MIN || la > OFFSET_LAT_MAX) return false;\n  return true;\n}\n\n/**\n * 纬度方向的加偏分量（官方算法的三角级数项）。\n *\n * @param {number} x 相对 105°E 的经度差。\n * @param {number} y 相对 35°N 的纬度差。\n * @returns {number} 以「米」为量纲的中间量，调用方再换算成角度。\n */\nfunction _transformLat(x, y) {\n  let ret =\n    -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));\n  ret += ((20.0 * Math.sin(6.0 * x * GCJ_PI) + 20.0 * Math.sin(2.0 * x * GCJ_PI)) * 2.0) / 3.0;\n  ret += ((20.0 * Math.sin(y * GCJ_PI) + 40.0 * Math.sin((y / 3.0) * GCJ_PI)) * 2.0) / 3.0;\n  ret += ((160.0 * Math.sin((y / 12.0) * GCJ_PI) + 320 * Math.sin((y * GCJ_PI) / 30.0)) * 2.0) / 3.0;\n  return ret;\n}\n\n/**\n * 经度方向的加偏分量（官方算法的三角级数项）。\n *\n * @param {number} x 相对 105°E 的经度差。\n * @param {number} y 相对 35°N 的纬度差。\n * @returns {number} 以「米」为量纲的中间量，调用方再换算成角度。\n */\nfunction _transformLon(x, y) {\n  let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));\n  ret += ((20.0 * Math.sin(6.0 * x * GCJ_PI) + 20.0 * Math.sin(2.0 * x * GCJ_PI)) * 2.0) / 3.0;\n  ret += ((20.0 * Math.sin(x * GCJ_PI) + 40.0 * Math.sin((x / 3.0) * GCJ_PI)) * 2.0) / 3.0;\n  ret += ((150.0 * Math.sin((x / 12.0) * GCJ_PI) + 300.0 * Math.sin((x / 30.0) * GCJ_PI)) * 2.0) / 3.0;\n  return ret;\n}\n\n/**\n * WGS84 → GCJ-02 加偏。\n *\n * 用途：只在「必须按 GCJ-02 提交坐标给国内服务」时才用。本仓实际走的是**反方向**\n * （`gcj02ToWgs84`：把国内来源的 GCJ-02 点位转回 WGS84），别拿错。\n * 境内返回加偏后的坐标，境外（见 `isInOffsetZone`）原样返回。\n *\n * @param {number} lat WGS84 纬度。\n * @param {number} lon WGS84 经度。\n * @returns {{lat:number, lon:number}} GCJ-02 坐标（境外 = 入参原值）。\n */\nexport function wgs84ToGcj02(lat, lon) {\n  const la = _finite(lat);\n  const lo = _finite(lon);\n  // 非数字 / 境外：原样返回（★注意返回的是**入参原值**，不是 Number() 后的 0）\n  if (la === null || lo === null) return { lat, lon };\n  if (!isInOffsetZone(la, lo)) return { lat: la, lon: lo };\n\n  let dLat = _transformLat(lo - 105.0, la - 35.0);\n  let dLon = _transformLon(lo - 105.0, la - 35.0);\n\n  const radLat = (la / 180.0) * GCJ_PI;\n  let magic = Math.sin(radLat);\n  magic = 1 - GCJ_EE * magic * magic;\n  const sqrtMagic = Math.sqrt(magic);\n\n  dLat = (dLat * 180.0) / (((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic)) * GCJ_PI);\n  dLon = (dLon * 180.0) / ((GCJ_A / sqrtMagic) * Math.cos(radLat) * GCJ_PI);\n\n  return { lat: la + dLat, lon: lo + dLon };\n}\n\n/** GCJ-02 → WGS84 的反演迭代次数。 */\nexport const GCJ_INVERSE_ITERATIONS = 5;\n\n/**\n * GCJ-02 → WGS84 逆变换（**本仓真正要用的方向**：国内来源点位 → WGS84）。\n *\n * 方法：定常迭代反演 —— 从一个 WGS84 猜测值出发，反复「加偏 → 用残差修正猜测值」。\n * 加偏量只有几百米且梯度平缓，5 次迭代后往返残差远小于 1 m（比 GPS 自身精度还小一个量级），\n * 再增加迭代没有实际意义。\n *\n * ★境外坐标**原样返回**（`converted` 语义由调用方据 `isInOffsetZone()` 自行标注）。\n *\n * @param {number} lat GCJ-02 纬度。\n * @param {number} lon GCJ-02 经度。\n * @returns {{lat:number, lon:number}} WGS84 坐标（境外 = 入参原值）。\n */\nexport function gcj02ToWgs84(lat, lon) {\n  const la = _finite(lat);\n  const lo = _finite(lon);\n  if (la === null || lo === null) return { lat, lon };\n  if (!isInOffsetZone(la, lo)) return { lat: la, lon: lo };\n\n  let guessLat = la;\n  let guessLon = lo;\n  for (let i = 0; i < GCJ_INVERSE_ITERATIONS; i += 1) {\n    const gcj = wgs84ToGcj02(guessLat, guessLon);\n    guessLat += la - gcj.lat;\n    guessLon += lo - gcj.lon;\n  }\n  return { lat: guessLat, lon: guessLon };\n}\n\n/**\n * 十进制数字字面量：`-?整数(.小数)?`。\n *\n * 只认这一种形态 —— 十六进制（'0x10'）、'Infinity' / 'NaN'、科学计数法（'1e2'）、\n * 前导 '+'、省略整数位的 '.5'、尾随小数点的 '31.' 一律不收。先过这道正则再\n * Number()，才能挡住 `Number()` 那些「看着像数字其实不是本意」的宽容转换\n * （`Number('0x10') === 16`、`Number('Infinity') === Infinity`）。\n *\n * **取舍：不收科学计数法。** 本项目唯一的 URL 生产者是 `ui/settings.js` 的 _favHref()\n * （`String(number)`），在纬度 ±90 / 经度 ±180 这个量级上永远不会产出指数形式。\n * ★收下的形态里必须包含 '0' / '-0' / '0.0000'：0,0（几内亚湾）是真实地点。\n */\nconst DECIMAL_LITERAL_RE = /^-?\\d+(\\.\\d+)?$/;\n\n/**\n * 从 URL 查询串解析「指定地点」（跨页传参：收藏列表 / 地点搜索 → 气候页 / 地理页）。\n *\n * 为什么必须有它：本项目**无 SPA 路由**，多个 HTML 页靠 `<nav class=\"tabbar\">` 的\n * `<a href>` 整页跳转，页面间没有任何共享内存（每次导航都是全新的 JS 环境）。\n * 收藏列表要点一下就跳到那个地点、搜索结果点一下就切过去，只能把坐标写在 URL 上。\n *\n * ★`source` 为什么叫 'explicit' 而不是 'favorite'：这条通路现在承载**两种**来源\n * （收藏跳转 + 地点搜索结果），写死 'favorite' 就是假话 —— 搜索出来的城市从来没被\n * 收藏过。判断「是不是默认地点」仍只看 `source === 'default'`（见 resolveCoord）。\n *\n * 严格十进制解析（不做 Number() 宽容转换）：空串 / 空白 / 非十进制字面量一律判为非法 ——\n * `Number('')` 与 `Number(null)` 都是 0，宽容解析会把「参数坏了」静默变成\n * 「几内亚湾 0,0」这个真实存在的地点，用户会看到一片陌生的天气却毫无提示。\n * 参数非法 / 缺失一律返回 null，调用方退回原有的定位流程，行为不变。\n *\n * ★2026-10-17 导航重构：本函数从 `src/ui/app.js` 迁来 —— 地理页（compass.js）\n *   与气候页（app.js）都要用同一套严格解析，留在 app.js 就得让一个 ui 模块去\n *   import 另一个 ui 模块。\n *\n * @param {string} [search] 查询串（可带或不带前导 '?'）；缺省读 location.search。\n * @returns {{lat:number, lon:number, name:string, source:'explicit'}|null} 解析结果；非法时 null。\n */\nexport function parsePlaceParam(search) {\n  let raw =
