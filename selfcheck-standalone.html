index_max), a unitless index. The five bands and their advice come from this app\\'s existing conversion table:',\r\n  'legend.uv.row': '{min}–{max} · {name} · {advice}',\r\n  'legend.uv.rowLast': '{min} and above · {name} · {advice}',\r\n\r\n  'legend.sun.title': 'Sunrise and sunset',\r\n  'legend.sun.unit': 'local time',\r\n  'legend.sun.body': 'Given by the source in local time (daily.sunrise / sunset). When the source omits them, the on-device NOAA algorithm is used instead.',\r\n\r\n  'legend.dayLength.title': 'Day length',\r\n  'legend.dayLength.unit': 'h · min',\r\n  'legend.dayLength.body': 'Sunset minus sunrise, i.e. how long daylight lasts. Around midnight sun or polar night the source may omit both times, and then the placeholder \"—\" is shown.',\r\n\r\n  'legend.today.title': \"Today's high / low\",\r\n  'legend.today.unit': '°C',\r\n  'legend.today.body': \"The day's maximum and minimum temperature from the source (temperature_2m_max / _min). These are FORECASTS for the whole day, not a reading taken right now.\",\r\n\r\n  'legend.wmo.title': 'Conditions',\r\n  'legend.wmo.unit': 'WMO code',\r\n  'legend.wmo.body': 'The icon and description are translated from a WMO weather code (0–99; for example 0 is clear, 61 is light rain). When the code is missing or invalid it says \"Unknown\" — \"no data\" is never reported as clear sky.',\r\n\r\n  'legend.observedAt.title': 'Observed at',\r\n  'legend.observedAt.unit': 'local time',\r\n  'legend.observedAt.body': 'The time step the source reports for the current data, converted to local time using the local offset.',\r\n\r\n  'legend.aqi.title': 'European AQI',\r\n  'legend.aqi.unit': 'no unit',\r\n  'legend.aqi.body': 'The European AQI as the source reports it (european_aqi): several pollutants folded into one number, lower is better. This app only splits it into six bands — the bands and advice follow:',\r\n  'legend.aqi.row': '{min}–{max} · {name} · {advice}',\r\n  'legend.aqi.rowLast': '{min} and above · {name} · {advice}',\r\n\r\n  'legend.pollutants.title': 'PM2.5 / PM10 / O₃ / NO₂',\r\n  'legend.pollutants.unit': 'µg/m³',\r\n  'legend.pollutants.body': 'Four pollutant concentrations in micrograms per cubic metre. This app does not grade individual pollutants — grading applies to the European AQI above, and these four are its inputs, so no bands are given here either.',\r\n\r\n  'legend.elevation.title': 'Elevation',\r\n  'legend.elevation.unit': 'm',\r\n  'legend.elevation.body': 'Elevation at this place (Open-Meteo Elevation) in metres. When it cannot be fetched the placeholder \"—\" is shown.',\r\n\r\n  'legend.coord.title': 'Coordinates',\r\n  'legend.coord.unit': 'degrees (WGS84)',\r\n  'legend.coord.body': 'WGS84 latitude and longitude to four decimals (about 11 m). Saving a place and jumping between screens both use these two numbers as the place\\'s identity.',\r\n\r\n  'legend.tz.title': 'Timezone offset',\r\n  'legend.tz.unit': 'seconds',\r\n  'legend.tz.body': 'The offset of local time from UTC as the source returns it (utc_offset_seconds). Sunrise, sunset and observation time are all converted with it — change it and those times move too.',\r\n\r\n  // ---------- WMO weather codes ----------\r\n  // core/wmo.js's wmo(code) returns only { key, shortKey, icon } — never an English string,\r\n  // because core may not read a locale table. These 28 pairs are turned into words by the UI\r\n  // layer via t(). full is used in the legend and the CSV; short in tight spots such as the\r\n  // hero subline and the compare screen.\r\n  'wmo.0': 'Clear sky',\r\n  'wmo.0.short': 'Clear',\r\n  'wmo.1': 'Mainly clear',\r\n  'wmo.1.short': 'Mainly clear',\r\n  'wmo.2': 'Partly cloudy',\r\n  'wmo.2.short': 'Cloudy',\r\n  'wmo.3': 'Overcast',\r\n  'wmo.3.short': 'Overcast',\r\n  'wmo.45': 'Fog',\r\n  'wmo.45.short': 'Fog',\r\n  'wmo.48': 'Depositing rime fog',\r\n  'wmo.48.short': 'Rime fog',\r\n  'wmo.51': 'Light drizzle',\r\n  'wmo.51.short': 'Drizzle',\r\n  'wmo.53': 'Moderate drizzle',\r\n  'wmo.53.short': 'Drizzle',\r\n  'wmo.55': 'Dense drizzle',\r\n  'wmo.55.short': 'Drizzle',\r\n  'wmo.56': 'Light freezing drizzle',\r\n  'wmo.56.short': 'Freezing drizzle',\r\n  'wmo.57': 'Dense freezing drizzle',\r\n  'wmo.57.short': 'Freezing drizzle',\r\n  'wmo.61': 'Slight rain',\r\n  'wmo.61.short': 'Light rain',\r\n  'wmo.63': 'Moderate rain',\r\n  'wmo.63.short': 'Rain',\r\n  'wmo.65': 'Heavy rain',\r\n  'wmo.65.short': 'Heavy rain',\r\n  'wmo.66': 'Light freezing rain',\r\n  'wmo.66.short': 'Freezing rain',\r\n  'wmo.67': 'Heavy freezing rain',\r\n  'wmo.67.short': 'Freezing rain',\r\n  'wmo.71': 'Slight snow fall',\r\n  'wmo.71.short': 'Light snow',\r\n  'wmo.73': 'Moderate snow fall',\r\n  'wmo.73.short': 'Snow',\r\n  'wmo.75': 'Heavy snow fall',\r\n  'wmo.75.short': 'Heavy snow',\r\n  'wmo.77': 'Snow grains',\r\n  'wmo.77.short': 'Snow grains',\r\n  'wmo.80': 'Slight rain showers',\r\n  'wmo.80.short': 'Showers',\r\n  'wmo.81': 'Moderate rain showers',\r\n  'wmo.81.short': 'Showers',\r\n  'wmo.82': 'Violent rain showers',\r\n  'wmo.82.short': 'Torrential',\r\n  'wmo.85': 'Slight snow showers',\r\n  'wmo.85.short': 'Snow showers',\r\n  'wmo.86': 'Heavy snow showers',\r\n  'wmo.86.short': 'Snow showers',\r\n  'wmo.95': 'Thunderstorm',\r\n  'wmo.95.short': 'Thunderstorm',\r\n  'wmo.96': 'Thunderstorm with slight hail',\r\n  'wmo.96.short': 'Thunder, hail',\r\n  'wmo.99': 'Thunderstorm with heavy hail',\r\n  'wmo.99.short': 'Severe thunder, hail',\r\n  // Unknown-code fallback: ★must mean \"no data\", never \"clear\".\r\n  'wmo.unknown': 'Unknown conditions',\r\n  'wmo.unknown.short': 'Unknown',\r\n\r\n  // ---------- Beaufort forces 0–12 ----------\r\n  'bf.0': 'Calm',\r\n  'bf.1': 'Light air',\r\n  'bf.2': 'Light breeze',\r\n  'bf.3': 'Gentle breeze',\r\n  'bf.4': 'Moderate breeze',\r\n  'bf.5': 'Fresh breeze',\r\n  'bf.6': 'Strong breeze',\r\n  'bf.7': 'Near gale',\r\n  'bf.8': 'Gale',\r\n  'bf.9': 'Strong gale',\r\n  'bf.10': 'Storm',\r\n  'bf.11': 'Violent storm',\r\n  'bf.12': 'Hurricane force',\r\n\r\n  // ---------- 16-point wind rose ----------\r\n  // full is used in the legend (spell it out), abbr on the Now screen next to the number\r\n  // (keep it short). The two differ in English; in Chinese they were both the full name,\r\n  // because Chinese has no shorter conventional abbreviation that reads better.\r\n  'dir.0': 'North',\r\n  'dir.0.abbr': 'N',\r\n  'dir.1': 'North-northeast',\r\n  'dir.1.abbr': 'NNE',\r\n  'dir.2': 'Northeast',\r\n  'dir.2.abbr': 'NE',\r\n  'dir.3': 'East-northeast',\r\n  'dir.3.abbr': 'ENE',\r\n  'dir.4': 'East',\r\n  'dir.4.abbr': 'E',\r\n  'dir.5': 'East-southeast',\r\n  'dir.5.abbr': 'ESE',\r\n  'dir.6': 'Southeast',\r\n  'dir.6.abbr': 'SE',\r\n  'dir.7': 'South-southeast',\r\n  'dir.7.abbr': 'SSE',\r\n  'dir.8': 'South',\r\n  'dir.8.abbr': 'S',\r\n  'dir.9': 'South-southwest',\r\n  'dir.9.abbr': 'SSW',\r\n  'dir.10': 'Southwest',\r\n  'dir.10.abbr': 'SW',\r\n  'dir.11': 'West-southwest',\r\n  'dir.11.abbr': 'WSW',\r\n  'dir.12': 'West',\r\n  'dir.12.abbr': 'W',\r\n  'dir.13': 'West-northwest',\r\n  'dir.13.abbr': 'WNW',\r\n  'dir.14': 'Northwest',\r\n  'dir.14.abbr': 'NW',\r\n  'dir.15': 'North-northwest',\r\n  'dir.15.abbr': 'NNW',\r\n  // Wind direction is where the wind comes FROM. Chinese uses a \"wind\" suffix, English uses\r\n  // a preposition — the two languages order it differently, so the whole phrase is one\r\n  // template and only the point name is interpolated.\r\n  'w.windFrom': 'wind from {dir}',\r\n\r\n  // ---------- Band names (six European AQI bands / five UV bands) ----------\r\n  'level.aqi.good': 'Good',\r\n  'level.aqi.fair': 'Fair',\r\n  'level.aqi.moderate': 'Moderate',\r\n  'level.aqi.poor': 'Poor',\r\n  'level.aqi.very-poor': 'Very poor',\r\n  'level.aqi.extreme': 'Extremely poor',\r\n  'level.uv.low': 'Low',\r\n  'level.uv.moderate': 'Moderate',\r\n  'level.uv.high': 'High',\r\n  'level.uv.very-high': 'Very high',\r\n  'level.uv.extreme': 'Extreme',\r\n\r\n  // ---------- Durations / relative time / staleness ----------\r\n  // The three core/format.js functions emit only a structured { unit, value }; the whole\r\n  // phrase is translated here — Chinese and English order these differently\r\n  // (\"10 小时 32 分\" vs \"10h 32m\", \"3 分钟前\" vs \"3 min ago\"), so assembling from fragments\r\n  // is wrong. Only numbers are interpolated.\r\n  'fmt.duration.hm': '{h}h {m}m',\r\n  'fmt.duration.m': '{m}m',\r\n  'fmt.ago.now': 'just now',\r\n  'fmt.ago.minute': '{n} min ago',\r\n  'fmt.ago.hour': '{n} h ago',\r\n  'fmt.ago.day': '{n} d ago',\r\n  'fmt.ago.month': '{n} mo ago',\r\n  'fmt.stale.second': '{n} s',\r\n  'fmt.stale.minute': '{n} min',\r\n  'fmt.stale.hour': '{n} h',\r\n  'fmt.stale.day': '{n} d',\r\n\r\n  // ---------- Default place name ----------\r\n  // core/geo.js and core/store.js store only the coordinates plus a stable marker name; the\r\n  // display name comes from here — core may not read a locale table, but this is a place\r\n  // name, and on an English screen it has to read \"Beijing · Tian'anmen\".\r\n  'place.default': \"Beijing · Tian'anmen\",\r\n\r\n  // ---------- Per-page <meta> and screen-reader labels ----------\r\n  // Spots in the HTML shell with NO child element (meta description / iOS home-screen\r\n  // name) plus the aria-labels a screen reader reads out. All of them are visible to\r\n  // somebody — some just via the ears — so they go through i18n too.\r\n  'app.shortName': 'GeoScope',\r\n  'app.description': 'GeoScope — a personal weather and place glance: one screen of data, here and now.',\r\n  'desc.selfcheck': 'GeoScope — source self-check: sample each source and see which ones answer.',\r\n  'desc.compass': 'GeoScope — magnetic declination and true/magnetic bearing conversion, computed on device with WMM2025, offline.',\r\n  'desc.settings': 'GeoScope — backup export and import, theme switching; data stays on this device, no network.',\r\n  'desc.compare': 'GeoScope — compare places: the same readings for each saved place, side by side.',\r\n  'a11y.mainNav': 'Main navigation',\r\n  'a11y.checkParams': 'Self-check parameters',\r\n  // ---------- Interface language ----------\r\n  // The switch lives on the Me screen. ★each option is written in ITS OWN language\r\n  // (the Chinese screen shows \"English\", not an-English-word-for-Chinese) — when a user\r\n  // cannot read the current interface language, the one thing that can save them is the\r\n  // option labelled in their own tongue.\r\n  'settings.langTitle': 'Language',\r\n  'settings.langHint': 'Switches the language of the whole interface. Place names and figures are unaffected — they come from the data sources as they are.',\r\n  'settings.lang.zh': '中文',\r\n  'settings.lang.en': 'English',\r\n  'settings.langDone': 'Language set to {name}',\r\n\r\n  // ---------- Source attribution ----------\r\n  // Attribution is legally required text: the service name and the licence name\r\n  // (CC-BY 4.0 / ODbL) are never translated, only the connective wording follows\r\n  // the interface language. Parenthesis style follows each language's own habit.\r\n  'attr.openmeteo': 'Open-Meteo.com (CC-BY 4.0)',\r\n  'attr.photon': 'Photon by Komoot (based on OpenStreetMap, ODbL)',\r\n  'attr.tile': 'Esri ArcGIS Online World Tile Service',\r\n\r\n  // ---------- Backup import failure reasons ----------\r\n  // core/backup.js returns only reasonKey / reasonParams (core may not import i18n);\r\n  // the UI splices them into settings.importFail's {reason}.\r\n  'backup.badJson': 'not valid JSON',\r\n  'backup.notObject': 'the backup body is not a JSON object',\r\n  'backup.badSchema': 'unsupported backup schema version (schema={schema})',\r\n  'backup.notGeoscope': 'not a GeoScope backup file',\r\n  'backup.noPrefs': 'missing prefs',\r\n  'backup.badDefaultPlace': 'defaultPlace coordinates are invalid (lat/lon must be finite numbers, latitude within ±90, longitude within ±180)',\r\n  'backup.planNoDefaultPlace': 'the import plan has no valid defaultPlace (call inspectBackup first)',\r\n  'backup.planNoFavorites': 'the import plan has no favorites array (call inspectBackup first)',\r\n  'backup.writeFailed': 'failed to write local state: {msg}',\r\n\r\n  // ---------- Invalid tile coordinates ----------\r\n  // The data layer MAY import i18n (only core may not), so this one is translated\r\n  // right where it is thrown.\r\n  'tile.badCoord': 'invalid tile coordinates (z={z}, x={x}, y={y}); no request was sent',\r\n};\r\n",
  "src/i18n/index.js": "/**\n * i18n 入口：当前 locale + 文案表 + t()\n *\n * 为什么 t() 不能继续住在 zh.js 里：翻译函数是**运行时**（要读「当前是哪一国的界面」），\n * 而 zh.js 只是一份**静态表**。两者混在一个文件时，新增英文包只能「再建一个 en.js 并\n * 另写一份 t()」，于是「当前 locale」这个概念无家可归 —— 谁切换、存在哪、什么时候生效\n * 全都得靠口头约定。本模块就是那个家。\n *\n * 三件事：\n *   1) 持有当前 locale（默认 'zh'：本项目中文界面为主）与 setLocale() / getLocale()；\n *   2) t(key, params) 按当前 locale 取表、替换占位符；\n *   3) tr(spec) 把 core 层吐出的**结构化文案量** `{ key, params }` 翻成字符串\n *      —— core 不许 import 本模块（core ← data ← ui ← html 单向依赖），它只能返回 key。\n *\n * ★缺键策略（与旧实现一致，别改成抛异常或返回空串）：返回 key 本身。\n *   「界面上显示 wmo.61」比「显示空白 / 白屏」好排查一万倍，而且它是**可见的**失败。\n *   真正的兜底是 tools/check.mjs 第 14 节：zh.js 与 en.js 的 key 集合双向校验，\n *   少一个 key 直接报红 —— 让缺键死在提交前，而不是死在用户屏幕上。\n *\n * 非浏览器安全：本模块不碰 DOM（写 <html lang> 是 ui/locale.js 的事），\n * 因此 tools/check.mjs 在 Node 侧动态 import 全部 src 模块时是安全的。\n */\n\nimport { ZH } from './zh.js';\nimport { EN } from './en.js';\n\n/** 应用元信息（导出 JSON 与页面标题共用）。 */\nexport const APP_NAME = 'GeoScope';\nexport const APP_VERSION = '1.0.0';\n\n/** 默认 locale：中文界面为主（用户拍板）。 */\nexport const DEFAULT_LOCALE = 'zh';\n\n/** 受支持的 locale（顺序即「我的」页切换器的界面顺序）。 */\nexport const LOCALES = ['zh', 'en'];\n\n/** locale → 文案表。 */\nconst TABLES = { zh: ZH, en: EN };\n\n/** locale → <html lang> 该写的 BCP-47 标签（与 ui/locale.js 共用这一处真相）。 */\nconst LANG_ATTR = { zh: 'zh-CN', en: 'en' };\n\n/** @type {string} 当前 locale（模块级：一次切换，全站生效）。 */\nlet _locale = DEFAULT_LOCALE;\n\n/**\n * 白名单钳位：只认 LOCALES 里的值。\n *\n * 为什么读侧也要钳（不直接返回 _locale）：内存态可能来自一份被外力改坏的缓存，\n * 一旦出去一个 'jp' 这样的值，TABLES['jp'] 是 undefined，t() 会全站返回原始 key。\n * 宁可回落默认语言，也不让整个界面变成一串键名。\n *\n * @param {*} v 任意值。\n * @returns {string} 'zh' 或 'en'。\n */\nfunction _norm(v) {\n  return v === 'en' ? 'en' : DEFAULT_LOCALE;\n}\n\n/**\n * 取当前 locale。\n *\n * @returns {string} 'zh' 或 'en'。\n */\nexport function getLocale() {\n  return _norm(_locale);\n}\n\n/**\n * 切换当前 locale。\n *\n * 只改内存态，**不碰 store**：写盘是 ui/settings.js 的事（与 setThemeMode / setFontScale\n * 同形状 —— store 负责持久化，本模块负责「此刻显示哪国话」）。这样 core 层不需要知道\n * i18n 的存在，i18n 也不需要 import store，两边都不破坏单向依赖。\n *\n * @param {*} v 目标 locale；非法值回落 DEFAULT_LOCALE。\n * @returns {string} 实际生效的 locale。\n */\nexport function setLocale(v) {\n  _locale = _norm(v);\n  return _locale;\n}\n\n/**\n * 取某个 locale 的文案表（供守卫脚本与单测比对两张表）。\n *\n * @param {string} [locale] locale；缺省为当前 locale。\n * @returns {Object<string,string>} 文案表（**引用**，只读用途，勿改）。\n */\nexport function tableOf(locale) {\n  return TABLES[_norm(locale === undefined ? _locale : locale)] || ZH;\n}\n\n/**\n * 取文案。\n *\n * @param {string} key 文案键，如 'status.ok'。\n * @param {Object<string, string|number>} [params] 占位符替换表，如 { ms: 123 }。\n * @returns {string} 替换后的文案；键缺失时返回 key 本身（可见的失败，便于排查）。\n */\nexport function t(key, params = {}) {\n  const table = tableOf();\n  const tpl = table[key];\n  if (tpl === undefined) {\n    // 缺失键：静默返回 key；不抛、不打日志 —— 打日志会引 store，而 store 属于 core 层，\n    // 那会让 i18n 反向依赖 core。缺键由 tools/check.mjs 第 14 节在提交前拦下。\n    return String(key);\n  }\n  return String(tpl).replace(/\\{(\\w+)\\}/g, (m, name) => {\n    const v = params[name];\n    return v === undefined || v === null ? m : String(v);\n  });\n}\n\n/**\n * 把 core 层吐出的**结构化文案量**翻成字符串。\n *\n * core/format.js 的 duration() / relativeTime() / staleFor() 返回的是\n * `{ key: 'fmt.duration.hm', params: { h: 10, m: 32 } }` —— 因为 core 不许 import 本模块。\n * 本函数就是那座桥。\n *\n * 顺带兼容「已经是字符串」的情况：那几个函数在**数值缺失**时返回 core/format.js 的\n * DASH 占位符（'—'），它不是 key，必须原样透传，不能被当成键名去查表。\n *\n * @param {string|{key:string, params?:Object}|null} spec 结构化文案量或已成文本。\n * @param {Object<string, string|number>} [extra] 额外占位符（覆盖 spec.params 的同名项）。\n * @returns {string} 文本；null / undefined 返回空串。\n */\nexport function tr(spec, extra = {}) {\n  if (spec === null || spec === undefined) return '';\n  if (typeof spec !== 'object') return String(spec);\n  const key = spec.key === undefined || spec.key === null ? '' : String(spec.key);\n  if (!key) return '';\n  return t(key, { ...(spec.params && typeof spec.params === 'object' ? spec.params : {}), ...extra });\n}\n\n/**\n * 判断文案键是否存在（debug 自检与单测用）。\n *\n * @param {string} key 文案键。\n * @returns {boolean} 是否存在于当前表。\n */\nexport function hasKey(key) {\n  return Object.prototype.hasOwnProperty.call(tableOf(), key);\n}\n\n/**\n * 导出当前表的全部键（供冒烟脚本与守卫检查完整性）。\n *\n * @returns {string[]} 键数组。\n */\nexport function allKeys() {\n  return Object.keys(tableOf());\n}\n\n/**\n * 取某个 locale 该写在 <html lang> 上的 BCP-47 标签。\n *\n * 放在这里而不写进 ui/locale.js：语言标签是语言的一部分，跟着表走，\n * 免得将来加了第三国语言时漏改某个写死 'zh-CN' 的地方。\n *\n * @param {string} [locale] locale；缺省为当前 locale。\n * @returns {string} 形如 'zh-CN' / 'en'。\n */\nexport function langAttrOf(locale) {\n  return LANG_ATTR[_norm(locale === undefined ? _locale : locale)] || LANG_ATTR[DEFAULT_LOCALE];\n}\n\n/** 重新导出两张表（供守卫脚本与单测做同构比对，UI 层请勿直接用 —— 一律走 t()）。 */\nexport { ZH, EN };\n",
  "src/core/cache.js": "/**\n * 缓存层（localStorage 封装）\n *\n * 职责：统一读写本机缓存，提供 TTL 与 fresh / stale / miss 三态判定，并作为降级底座 ——\n * 只要存在陈旧数据就绝不显示空白。全应用**唯一**允许直接触碰 localStorage 的模块。\n *\n * 约定：\n *   - 命名空间固定 'gs:v1:'，键格式 'gs:v1:<sourceId>:<参数>'；坐标一律 toFixed(4)，关键词 encodeURIComponent；\n *   - 值序列化为 { v, t, ttl, stale }，其中 t = storedAt（ms epoch）；\n *   - 配额超限先淘汰最旧条目再重试一次，仍失败返回 false 且不抛异常；\n *   - Node / 非浏览器环境下降级为内存 Map（供 tools/smoke.mjs 无网冒烟使用）。\n */\n\n/** 缓存键命名空间（版本号变更即整体失效）。 */\nexport const NS = 'gs:v1:';\n\n/** 默认容量上限（字节，按 JSON 字符串长度估算）。 */\nexport const DEFAULT_MAX_BYTES = 4_500_000;\n\n/** @type {Map<string, string>} 无 localStorage 时的内存兜底。 */\nconst _memory = new Map();\n\n/** @type {boolean} 是否已确认使用内存兜底。 */\nlet _useMemory = !(typeof localStorage !== 'undefined' && localStorage !== null);\n\n/**\n * 内存版存储适配器（接口与 Storage 对齐的最小子集）。\n */\nconst memoryStorage = {\n  getItem: (k) => (_memory.has(k) ? _memory.get(k) : null),\n  setItem: (k, v) => { _memory.set(k, String(v)); },\n  removeItem: (k) => { _memory.delete(k); },\n  keys: () => Array.from(_memory.keys()),\n};\n\n/**\n * 取当前可用存储。\n *\n * @returns {{getItem:Function, setItem:Function, removeItem:Function, keys:Function}} 存储适配器。\n */\nfunction _store() {\n  if (_useMemory) return memoryStorage;\n  try {\n    // 探测真实可用性（隐私模式 / 被禁用时会抛）\n    const probeKey = `${NS}__probe__`;\n    localStorage.setItem(probeKey, '1');\n    localStorage.removeItem(probeKey);\n    return {\n      getItem: (k) => localStorage.getItem(k),\n      setItem: (k, v) => localStorage.setItem(k, v),\n      removeItem: (k) => localStorage.removeItem(k),\n      keys: () => {\n        const out = [];\n        for (let i = 0; i < localStorage.length; i += 1) {\n          const k = localStorage.key(i);\n          if (k !== null) out.push(k);\n        }\n        return out;\n      },\n    };\n  } catch (err) {\n    _useMemory = true;\n    return memoryStorage;\n  }\n}\n\n/**\n * 构造缓存键。\n *\n * @param {string} sourceId 源 id（或 'store' 等伪源）。\n * @param {...(string|number)} parts 参数片段。\n * @returns {string} 'gs:v1:<sourceId>:<p1>:<p2>'。\n */\nexport function makeKey(sourceId, ...parts) {\n  return `${NS}${sourceId}:${parts.join(':')}`;\n}\n\n/**\n * 读取条目（不做 TTL 判定）。\n *\n * @param {string} key 缓存键。\n * @returns {{value: *, storedAt: number, ttlMs: number}|null} 条目或 null。\n */\nexport function get(key) {\n  const store = _store();\n  const raw = store.getItem(key);\n  if (raw === null || raw === undefined) return null;\n  try {\n    const parsed = JSON.parse(raw);\n    if (!parsed || typeof parsed !== 'object') return null;\n    return {\n      value: parsed.v,\n      storedAt: Number(parsed.t) || 0,\n      ttlMs: Number(parsed.ttl) || 0,\n    };\n  } catch (err) {\n    // 坏数据直接丢弃，避免污染后续判定\n    store.removeItem(key);\n    return null;\n  }\n}\n\n/**\n * 写入条目。\n *\n * @param {string} key 缓存键。\n * @param {*} value 任意可 JSON 序列化的值。\n * @param {number} ttlMs TTL 毫秒（0 = 不缓存语义，由调用方决定是否调用）。\n * @returns {boolean} 写入是否成功。\n */\nexport function set(key, value, ttlMs = 0) {\n  const store = _store();\n  const payload = JSON.stringify({ v: value, t: Date.now(), ttl: Number(ttlMs) || 0, stale: false });\n  try {\n    store.setItem(key, payload);\n    return true;\n  } catch (err) {\n    // 配额满：淘汰最旧的一半后重试一次\n    try {\n      evictOldest(0.5);\n      store.setItem(key, payload);\n      return true;\n    } catch (err2) {\n      return false;\n    }\n  }\n}\n\n/**\n * 带三态判定读取。\n *\n * @param {string} key 缓存键。\n * @returns {{state:'fresh'|'stale'|'miss', value:*, ageMs:number, staleForMs:number}} 三态结果。\n */\nexport function getWithState(key) {\n  const entry = get(key);\n  if (entry === null) {\n    return { state: 'miss', value: null, ageMs: 0, staleForMs: 0 };\n  }\n  const now = Date.now();\n  const ageMs = Math.max(0, now - entry.storedAt);\n  if (ageMs < entry.ttlMs) {\n    return { state: 'fresh', value: entry.value, ageMs, staleForMs: 0 };\n  }\n  return { state: 'stale', value: entry.value, ageMs, staleForMs: ageMs - entry.ttlMs };\n}\n\n/**\n * 标记为陈旧：上游失败但存在旧数据时，保留值只改标记（ageMs 继续增长）。\n *\n * @param {string} key 缓存键。\n * @returns {void}\n */\nexport function markStale(key) {\n  const entry = get(key);\n  if (entry === null) return;\n  const store = _store();\n  try {\n    store.setItem(key, JSON.stringify({ v: entry.value, t: entry.storedAt, ttl: entry.ttlMs, stale: true }));\n  } catch (err) {\n    /* 配额异常时静默：标记失败不影响主流程 */\n  }\n}\n\n/**\n * 按前缀清理。\n *\n * @param {string} prefix 键前缀（通常传 NS 或 makeKey('weather')）。\n * @returns {number} 清除条数。\n */\nexport function clearPrefix(prefix) {\n  const store = _store();\n  let count = 0;\n  for (const k of store.keys()) {\n    if (k.startsWith(prefix)) {\n      store.removeItem(k);\n      count += 1;\n    }\n  }\n  return count;\n}\n\n/**\n * 估算字符串占用字节数（UTF-8 近似：非 ASCII 按 3 字节计）。\n *\n * @param {string} s 字符串。\n * @returns {number} 估算字节数。\n */\nexport function byteSize(s) {\n  let n = 0;\n  for (let i = 0; i < s.length; i += 1) {\n    const code = s.charCodeAt(i);\n    n += code < 0x80 ? 1 : code < 0x800 ? 2 : 3;\n  }\n  return n;\n}\n\n/**\n * 淘汰最旧条目。\n *\n * @param {number} [ratio=0.25] 淘汰比例（按条目数计）。\n * @returns {number} 实际淘汰条数。\n */\nexport function evictOldest(ratio = 0.25) {\n  const store = _store();\n  const items = [];\n  for (const k of store.keys()) {\n    if (!k.startsWith(NS)) continue;\n    const raw = store.getItem(k);\n    let t = 0;\n    try {\n      t = Number(JSON.parse(raw).t) || 0;\n    } catch (err) {\n      t = 0;\n    }\n    items.push({ k, t });\n  }\n  items.sort((a, b) => a.t - b.t);\n  const drop = Math.max(1, Math.floor(items.length * ratio));\n  let n = 0;\n  for (let i = 0; i < drop && i < items.length; i += 1) {\n    store.removeItem(items[i].k);\n    n += 1;\n  }\n  return n;\n}\n\n/**\n * 容量回收：总字节超限时按 storedAt 升序淘汰，直到降到阈值以下。\n *\n * @param {number} [maxBytes=4500000] 容量上限（字节）。\n * @returns {number} 释放的条目数。\n */\nexport function prune(maxBytes = DEFAULT_MAX_BYTES) {\n  const store = _store();\n  let items = [];\n  let total = 0;\n  for (const k of store.keys()) {\n    if (!k.startsWith(NS)) continue;\n    const raw = store.getItem(k) || '';\n    let t = 0;\n    try {\n      t = Number(JSON.parse(raw).t) || 0;\n    } catch (err) {\n      t = 0;\n    }\n    total += byteSize(raw);\n    items.push({ k, t });\n  }\n  if (total <= maxBytes) return 0;\n  items.sort((a, b) => a.t - b.t);\n  let freed = 0;\n  for (const item of items) {\n    if (total <= maxBytes) break;\n    const raw = store.getItem(item.k) || '';\n    total -= byteSize(raw);\n    store.removeItem(item.k);\n    freed += 1;\n  }\n  return freed;\n}\n\n/**\n * 清空全部本应用缓存（设置项与快照一并清除，供「重置」使用）。\n *\n * @returns {number} 清除条数。\n */\nexport function clearAll() {\n  return clearPrefix(NS);\n}\n\n/**\n * 测试用：切换为内存存储并清空（仅供 tools/smoke.mjs 使用）。\n *\n * @returns {void}\n */\nexport function __useMemory() {\n  _memory.clear();\n  _useMemory = true;\n}\n",
  "src/core/geo.js": "/**\n * 定位与坐标工具\n *\n * 职责：封装浏览器定位（WGS84）、坐标四舍五入（toFixed(4) ≈ 11 m）、缓存键片段生成，\n * 并提供 GCJ-02 纠偏的**占位**实现（阶段二实现，业务层本阶段禁止调用）。\n *\n * 红线：内部坐标一律 WGS84；绝不上传用户坐标到数据源以外的任何地方。\n */\n\n/** 定位超时（毫秒）：超时即降级为默认地点，不阻塞首屏。 */\nexport const GEO_TIMEOUT_MS = 8000;\n\n/**\n * 出厂默认地点的**标记名**。\n *\n * ★它是一个**地名**，界面上必须跟着语言走（英文界面下要写成 \"Beijing · Tian'anmen\"），\n *   而 core 不许读 locale 表 —— 所以这里存的是**中文那一份原文**，UI 层拿它和\n *   `place.default` 这条文案键对应起来（src/ui/locale.js 的 placeDisplayName()）。\n *   不改成一个抽象标记（比如 'default'）的理由：这个名字会被**写进备份 JSON**，\n *   换成一个标记会让老备份里的默认地点显示成一个词不是地名的值。\n */\nexport const DEFAULT_PLACE_NAME = '北京 · 天安门';\n\n/** 定位被拒 / 超时 / 无权限时的默认地点：北京天安门（WGS84）。 */\nexport const DEFAULT_PLACE = { lat: 39.9087, lon: 116.3975, name: DEFAULT_PLACE_NAME };\n\n/**\n * 四位小数取整（≈11 m），用于缓存键与对外传参。\n *\n * @param {number|string} n 数值。\n * @returns {number} 四位小数数字。\n */\nexport function round4(n) {\n  const v = Number(n);\n  if (!Number.isFinite(v)) return 0;\n  return Math.round(v * 1e4) / 1e4;\n}\n\n/**\n * 坐标整体四位小数归一。\n *\n * @param {{lat:number, lon:number}} c 坐标。\n * @returns {{lat:number, lon:number}} 归一后的坐标。\n */\nexport function roundCoord(c) {\n  return { lat: round4(c.lat), lon: round4(c.lon) };\n}\n\n/**\n * 生成缓存键坐标片段 '39.9087:116.3975'。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {string} 键片段。\n */\nexport function coordKey(lat, lon) {\n  return `${round4(lat).toFixed(4)}:${round4(lon).toFixed(4)}`;\n}\n\n/**\n * 取当前位置。\n *\n * 行为：优先 navigator.geolocation（超时 8 s）；无权限 / 拒绝 / 超时 / 环境不支持时，\n * 一律降级为 DEFAULT_PLACE，并标记 source='default'，保证此刻屏始终可渲染。\n *\n * 附带海拔：`coords.altitude` 是**高于 WGS84 椭球面的高度（米）**，正好是 WMM 需要的\n * 那个「椭球高」定义（不是海拔高，两者可差几十米；磁偏角对这个量不敏感，够用）。\n * 拿不到就是 null，消费侧必须能接受缺失（方位屏按 0 参与计算）。\n *\n * @param {{timeoutMs?:number, enableHighAccuracy?:boolean}} [opts] 定位参数。\n * @returns {Promise<{lat:number, lon:number, source:'gps'|'default', accuracyM:number|null, altitudeM:number|null, name:string|null}>} 坐标结果。\n */\nexport function getCurrentPosition(opts = {}) {\n  const timeoutMs = Number(opts.timeoutMs) || GEO_TIMEOUT_MS;\n  const enableHighAccuracy = opts.enableHighAccuracy !== false;\n\n  const fallback = () => ({\n    lat: DEFAULT_PLACE.lat,\n    lon: DEFAULT_PLACE.lon,\n    source: 'default',\n    accuracyM: null,\n    altitudeM: null,\n    name: DEFAULT_PLACE.name,\n  });\n\n  if (typeof navigator === 'undefined' || !navigator.geolocation) {\n    return Promise.resolve(fallback());\n  }\n\n  return new Promise((resolve) => {\n    let settled = false;\n    const finish = (value) => {\n      if (settled) return;\n      settled = true;\n      resolve(value);\n    };\n\n    // 硬超时：定位回调迟迟不返回时也要放行首屏\n    const timer = setTimeout(() => finish(fallback()), timeoutMs);\n\n    try {\n      navigator.geolocation.getCurrentPosition(\n        (pos) => {\n          clearTimeout(timer);\n          const coords = pos && pos.coords ? pos.coords : null;\n          if (!coords || !Number.isFinite(coords.latitude) || !Number.isFinite(coords.longitude)) {\n            finish(fallback());\n            return;\n          }\n          finish({\n            lat: round4(coords.latitude),\n            lon: round4(coords.longitude),\n            source: 'gps',\n            accuracyM: Number.isFinite(coords.accuracy) ? Math.round(coords.accuracy) : null,\n            altitudeM: Number.isFinite(coords.altitude) ? Math.round(coords.altitude) : null,\n            name: null,\n          });\n        },\n        () => {\n          // 拒绝 / 不可用 / 位置信息缺失：统一降级\n          clearTimeout(timer);\n          finish(fallback());\n        },\n        {\n          enableHighAccuracy,\n          timeout: timeoutMs,\n          maximumAge: 600000, // 10 分钟内复用系统缓存，减少定位耗电\n        }\n      );\n    } catch (err) {\n      clearTimeout(timer);\n      finish(fallback());\n    }\n  });\n}\n\n/**\n * 两点球面距离（Haversine），单位 km（阶段二「附近」能力预留）。\n *\n * @param {{lat:number, lon:number}} a 起点。\n * @param {{lat:number, lon:number}} b 终点。\n * @returns {number} 距离 km。\n */\nexport function distanceKm(a, b) {\n  const R = 6371;\n  const toRad = (d) => (d * Math.PI) / 180;\n  const dLat = toRad(b.lat - a.lat);\n  const dLon = toRad(b.lon - a.lon);\n  const lat1 = toRad(a.lat);\n  const lat2 = toRad(b.lat);\n  const h =\n    Math.sin(dLat / 2) * Math.sin(dLat / 2) +\n    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);\n  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));\n}\n\n/**\n * WGS84 → GCJ-02 纠偏。\n *\n * 阶段二实现。当前为**空实现（原值返回）**，并明确注释：本阶段业务层禁止调用本函数，\n * 显示层不做任何坐标变换，界面坐标即数据源返回的 WGS84 原值。\n *\n * @param {number} lat WGS84 纬度。\n * @param {number} lon WGS84 经度。\n * @returns {{lat:number, lon:number}} GCJ-02 坐标（当前等于入参）。\n */\nexport function wgs84ToGcj02(lat, lon) {\n  // 阶段二实现：需引入加密纠偏算法（含中国境外不纠偏的边界判断）。\n  // 本阶段保持恒等返回，避免误以为已纠偏。\n  return { lat: Number(lat), lon: Number(lon) };\n}\n\n/**\n * GCJ-02 → WGS84 逆变换。\n *\n * 阶段二实现；当前为空实现（原值返回）。\n *\n * @param {number} lat GCJ-02 纬度。\n * @param {number} lon GCJ-02 经度。\n * @returns {{lat:number, lon:number}} WGS84 坐标（当前等于入参）。\n */\nexport function gcj02ToWgs84(lat, lon) {\n  // 阶段二实现。\n  return { lat: Number(lat), lon: Number(lon) };\n}\n",
  "src/core/format.js": "/**\n * 格式化工具（纯函数，无副作用、无网络）\n *\n * 职责：把「存储层的原始数值」转成「上屏的人类可读字符串」。单位换算只发生在展示层，\n * 存储与接口层固定使用：温度 °C / 风速 m·s⁻¹ / 风向 deg / 气压 hPa / 能见度 m /\n * 降水量 mm / 海拔 m / 污染物 µg·m⁻³ / 时延 ms / 字节 byte。\n *\n * 约束：所有函数对 null / undefined / NaN 一律返回占位符（'—'），绝不抛异常。\n */\n\n/** 占位符：数值缺失时统一展示。 */\nexport const DASH = '—';\n\n/**\n * 安全取数：非有限数字返回 null，便于上层决定显示占位符。\n *\n * @param {*} v 任意值。\n * @returns {number|null} 有限数字或 null。\n */\nfunction _num(v) {\n  // 硬规则：缺失绝不显示成 0。必须显式拦截的几类「看起来有值其实是空」的入参：\n  //   - null / undefined：Number(null) === 0，不拦截就会把「没数据」渲染成 0°；\n  //   - 布尔：true → 1、false → 0，同样是伪装成数值的空值；\n  //   - 纯空白串 '' / ' ' / '\\t' / '\\n'：Number('') 与 Number(' ') 都是 0，必须先 trim 再判空；\n  //   - 数组（含 [] 与 [0]）：Number([]) === 0、Number([0]) === 0，而数组从来不是标量温度。\n  // 数字字符串（'23'）走正常解析，不能被误判成缺失。\n  if (v === null || v === undefined) return null;\n  if (typeof v === 'boolean') return null;\n  if (Array.isArray(v)) return null;\n  if (typeof v === 'string' && v.trim() === '') return null;\n  const n = typeof v === 'number' ? v : Number(v);\n  return Number.isFinite(n) ? n : null;\n}\n\n/**\n * 固定小数位格式化。\n *\n * @param {*} v 数值。\n * @param {number} [digits=0] 小数位数。\n * @param {string} [unit=''] 追加单位。\n * @returns {string} 形如 '23.4 °C'；缺失时返回 '—'。\n */\nexport function num(v, digits = 0, unit = '') {\n  const n = _num(v);\n  if (n === null) return DASH;\n  const s = n.toFixed(digits);\n  return unit ? `${s} ${unit}` : s;\n}\n\n/** 温度：'23°'（展示层可不带 °C，单位另由标签给出）。 */\nexport function tempC(v, digits = 0) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(digits)}°`;\n}\n\n/** 体感温度：'体感 26°' 里的数值部分。 */\nexport function feelsC(v, digits = 0) {\n  return tempC(v, digits);\n}\n\n/** 湿度：'48%'。 */\nexport function humidity(pct) {\n  const n = _num(pct);\n  if (n === null) return DASH;\n  return `${Math.round(n)}%`;\n}\n\n/**\n * 通用百分比：'30%'；缺失时返回 '—'。\n *\n * 为什么单独给一个而不复用 humidity()：两者此刻的算法恰好一样（取整 + '%'），\n * 但 humidity 的语义是「相对湿度」，降水概率若借它的函数名，将来任一方改了取整\n * 口径（比如湿度保留一位小数）都会连带改错另一方 —— 语义不同就该各自有名。\n *\n * @param {*} v 百分比数值。\n * @param {number} [digits=0] 小数位数。\n * @returns {string} '30%' 或 '—'。\n */\nexport function percent(v, digits = 0) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(digits)}%`;\n}\n\n/** 降水：'0.4 mm'；0 显示为 '0 mm'。 */\nexport function precipMm(v) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(1)} mm`;\n}\n\n/** 风：'3.2 m/s · 11.5 km/h'。 */\nexport function wind(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  const kmh = n * 3.6;\n  return `${n.toFixed(1)} m/s · ${kmh.toFixed(1)} km/h`;\n}\n\n/** 气压：'1013 hPa'。 */\nexport function pressure(hpa) {\n  const n = _num(hpa);\n  if (n === null) return DASH;\n  return `${Math.round(n)} hPa`;\n}\n\n/** 能见度：≥1000 m 转 km，否则保留 m。 */\nexport function visibility(m) {\n  const n = _num(m);\n  if (n === null) return DASH;\n  if (n >= 1000) return `${(n / 1000).toFixed(1)} km`;\n  return `${Math.round(n)} m`;\n}\n\n/** 海拔：'43 m'。 */\nexport function elevationM(m) {\n  const n = _num(m);\n  if (n === null) return DASH;\n  return `${Math.round(n)} m`;\n}\n\n/** 污染物浓度：'12.3 µg/m³'。 */\nexport function pollutant(v) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(1)} µg/m³`;\n}\n\n/** 时延：'123 ms'；≥1000 时保留整数毫秒。 */\nexport function latency(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  return `${Math.round(n)} ms`;\n}\n\n/** 字节：'12.3 KB'。 */\nexport function bytes(n) {\n  const v = _num(n);\n  if (v === null) return DASH;\n  if (v < 1024) return `${v} B`;\n  if (v < 1024 * 1024) return `${(v / 1024).toFixed(1)} KB`;\n  return `${(v / 1024 / 1024).toFixed(2)} MB`;\n}\n\n/** 补零两位。 */\nexport function pad2(n) {\n  const v = _num(n);\n  if (v === null) return '00';\n  return String(Math.floor(v)).padStart(2, '0');\n}\n\n/**\n * 毫秒 epoch → 'HH:MM'（按给定时区偏移）。\n *\n * @param {number|null} atMs 毫秒 epoch。\n * @param {number} [offsetSec=0] 目标时区相对 UTC 的偏移秒数（东为正）。\n * @returns {string} '07:12' 或 '—'。\n */\nexport function hhmm(atMs, offsetSec = 0) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  const d = new Date(n + offsetSec * 1000);\n  return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;\n}\n\n/**\n * 毫秒 epoch → 'MM-DD HH:MM'。\n *\n * @param {number|null} atMs 毫秒 epoch。\n * @param {number} [offsetSec=0] 时区偏移秒数。\n * @returns {string} '01-05 07:12' 或 '—'。\n */\nexport function mdHm(atMs, offsetSec = 0) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  const d = new Date(n + offsetSec * 1000);\n  return `${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;\n}\n\n/**\n * 昼长毫秒 → **结构化时长量**（不是字符串）。\n *\n * ★为什么不再直接返回 '10 小时 32 分'：本模块在 core 层，不许 import i18n（core 读\n *   locale 状态 = 最底层反向依赖上层）。而时长的**语序是语言相关的** —— 中文\n *   「10 小时 32 分」、英文 \"10h 32m\"，把「小时」「分」两个词翻出来再拼回去必然拼错\n *   （英文根本不是「10 hours 32 minutes」的写法）。所以整句作为一条模板留在文案表里，\n *   这里只产出 `{ key, params }`，由 UI 层 `tr()` 翻译。\n *\n * @param {*} ms 毫秒数。\n * @returns {{key:string, params:Object}|string} 结构化量；缺失时返回 DASH（'—'，它本身就是文本，tr() 会原样透传）。\n */\nexport function duration(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  const totalMin = Math.round(n / 60000);\n  const h = Math.floor(totalMin / 60);\n  const m = totalMin % 60;\n  if (h <= 0) return { key: 'fmt.duration.m', params: { m } };\n  return { key: 'fmt.duration.hm', params: { h, m } };\n}\n\n/**\n * 坐标 → '39.9087°N, 116.3975°E'（WGS84，四位小数 ≈ 11 m）。\n *\n * @param {number|null} lat 纬度。\n * @param {number|null} lon 经度。\n * @returns {string} 坐标文本或 '—'。\n */\nexport function coord(lat, lon) {\n  const la = _num(lat);\n  const lo = _num(lon);\n  if (la === null || lo === null) return DASH;\n  const ns = la >= 0 ? 'N' : 'S';\n  const ew = lo >= 0 ? 'E' : 'W';\n  return `${Math.abs(la).toFixed(4)}°${ns}, ${Math.abs(lo).toFixed(4)}°${ew}`;\n}\n\n/**\n * 相对时间 → **结构化量**（'刚刚' / '3 分钟前' / '2 小时前' / '3 天前' 的骨架）。\n *\n * 与 duration() 同一条理由：'3 分钟前' 在英文里是 \"3 min ago\"，**语序与词序都不同**，\n * 拼片段必错。这里只决定「用哪个时间单位 + 数字是多少」，话怎么说是文案表的事。\n *\n * @param {number|null} atMs 过去时刻（ms epoch）。\n * @param {number} [nowMs=Date.now()] 参照时刻。\n * @returns {{key:string, params:Object}|string} 结构化量；缺失时返回 DASH。\n */\nexport function relativeTime(atMs, nowMs = Date.now()) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  // 未来时刻（时钟漂移 / 服务端时间偏快）也按「刚刚」处理，避免出现「-3 分钟前」\n  const diff = nowMs - n;\n  if (diff < 60000) return { key: 'fmt.ago.now', params: {} };\n  const min = Math.floor(diff / 60000);\n  if (min < 60) return { key: 'fmt.ago.minute', params: { n: min } };\n  const hour = Math.floor(min / 60);\n  if (hour < 24) return { key: 'fmt.ago.hour', params: { n: hour } };\n  const day = Math.floor(hour / 24);\n  if (day < 30) return { key: 'fmt.ago.day', params: { n: day } };\n  const month = Math.floor(day / 30);\n  return { key: 'fmt.ago.month', params: { n: month } };\n}\n\n/**\n * 陈旧时长（供降级提示使用，与 relativeTime 同义但语义更明确）→ **结构化量**。\n *\n * @param {number} staleMs 陈旧毫秒数。\n * @returns {{key:string, params:Object}|string} 结构化量；缺失时返回 DASH。\n */\nexport function staleFor(staleMs) {\n  const n = _num(staleMs);\n  if (n === null) return DASH;\n  if (n < 60000) return { key: 'fmt.stale.second', params: { n: Math.max(1, Math.round(n / 1000)) } };\n  const min = Math.floor(n / 60000);\n  if (min < 60) return { key: 'fmt.stale.minute', params: { n: min } };\n  const hour = Math.floor(min / 60);\n  if (hour < 24) return { key: 'fmt.stale.hour', params: { n: hour } };\n  return { key: 'fmt.stale.day', params: { n: Math.floor(hour / 24) } };\n}\n\n/**\n * 生成导出文件名时间戳 'YYYYMMDD-HHmm'（本地时区）。\n *\n * @param {number} [atMs=Date.now()] 时刻。\n * @returns {string} 形如 '20250105-1423'。\n */\nexport function stamp(atMs = Date.now()) {\n  const d = new Date(atMs);\n  const y = d.getFullYear();\n  const mo = pad2(d.getMonth() + 1);\n  const da = pad2(d.getDate());\n  const h = pad2(d.getHours());\n  const mi = pad2(d.getMinutes());\n  return `${y}${mo}${da}-${h}${mi}`;\n}\n",
  "src/core/sun.js": "/**\n * 日出日落本地算法（NOAA 近似，纯函数、离线可用）\n *\n * 职责：在无网络或上游 daily 缺失时兜底计算 sunrise / sunset / solarNoon / dayLength。\n * 纯函数、零依赖、零网络：不读时钟以外任何全局（Date.now() 仅由调用方传入 dateUTC 决定）。\n *\n * 算法：NOAA Solar Calculator（太阳天顶角 90.833°，含大气折射与日面半径修正）。\n * 返回均为 **ms epoch（UTC 语义）**；显示层按 utc_offset_seconds 转本地时间。\n * 极区可能出现 cosH 越界：cosH > 1 → 极夜，cosH < -1 → 极昼，此时 sunrise/sunset 为 null。\n */\n\nconst RAD = Math.PI / 180;\nconst DEG = 180 / Math.PI;\nconst DAY_MS = 86400000;\n\n/**\n * 归一化到 [0, 360)。\n *\n * @param {number} deg 角度。\n * @returns {number} 归一化角度。\n */\nfunction _norm360(deg) {\n  let d = deg % 360;\n  if (d < 0) d += 360;\n  return d;\n}\n\n/**\n * 归一化到 [0, 24)。\n *\n * @param {number} h 小时。\n * @returns {number} 归一化小时。\n */\nfunction _norm24(h) {\n  let v = h % 24;\n  if (v < 0) v += 24;\n  return v;\n}\n\n/**\n * 把 dateUTC 入参归一化成 ms epoch。\n *\n * 接受三种形态：ms epoch 数字、Date 实例、可被 Date.parse 解析的字符串（如 ISO 8601）。\n * 直接 Number('2025-06-21T00:00:00Z') 会得到 NaN，从而把「格式不同」误判成「算不出来」，\n * 所以字符串必须走 Date.parse；解析失败返回 NaN，由调用方的有限性校验统一降级为 null。\n *\n * @param {*} v 入参。\n * @returns {number} ms epoch；无法解析时为 NaN。\n */\nfunction _toMs(v) {\n  if (v === null || v === undefined || v === '') return NaN;\n  if (v instanceof Date) return v.getTime();\n  if (typeof v === 'number') return v;\n  if (typeof v === 'string') return Date.parse(v);\n  return NaN;\n}\n\n/**\n * 取 UTC 年内的第几天（1 月 1 日 = 1）。\n *\n * @param {Date} d UTC 日期对象。\n * @returns {number} 天序号。\n */\nfunction _dayOfYear(d) {\n  const start = Date.UTC(d.getUTCFullYear(), 0, 1);\n  const today = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());\n  return Math.floor((today - start) / DAY_MS) + 1;\n}\n\n/**\n * 计算日出日落。\n *\n * @param {{lat:number, lon:number, dateUTC:number, zenith?:number}} args 入参。\n *   lat 纬度（-90..90）；lon 经度（-180..180）；\n *   dateUTC 基准时刻，支持 ms epoch / Date / ISO 字符串三种形态（无法解析则整体降级为 null）；\n *   zenith 太阳天顶角（默认 90.833，注意显式传 0 会被 `||` 当成未提供 —— 见函数内注释）。\n * @returns {{sunriseAt:number|null, sunsetAt:number|null, solarNoonAt:number, dayLengthMs:number|null,\n *            polar:'none'|'polar-day'|'polar-night'}} 结果（ms epoch，UTC 语义）。\n */\nexport function sunriseSunset(args) {\n  const lat = Number(args && args.lat);\n  const lon = Number(args && args.lon);\n  // 已知边界（QA 已固化为回归用例，保留现状）：`|| 90.833` 会让显式传入的 zenith=0\n  // 被当成「未提供」而回落默认值（理想写法是 ??，但改了会破坏既有断言，等 QA 同步改用例）。\n  const zenith = Number(args && args.zenith) || 90.833;\n  // dateUTC 三种形态一视同仁：ms epoch / Date / ISO 字符串；解析不出时间就降级为 NaN，\n  // 由下面的有限性校验统一返回 null（绝不抛异常，调用方是首屏渲染路径）。\n  const dateUTC = _toMs(args && args.dateUTC);\n\n  if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(dateUTC)) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: NaN, dayLengthMs: null, polar: 'none' };\n  }\n\n  const d = new Date(dateUTC);\n  const N = _dayOfYear(d);\n  const midnightUtc = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());\n  const lngHour = lon / 15;\n\n  // 太阳平近点角与时间角参数（日出用 6h、日落用 18h）\n  const tRise = N + (6 - lngHour) / 24;\n  const tSet = N + (18 - lngHour) / 24;\n\n  const M = (0.9856 * tRise) - 3.289;\n\n  // 太阳真黄经\n  let L = M + (1.916 * Math.sin(M * RAD)) + (0.020 * Math.sin(2 * M * RAD)) + 282.634;\n  L = _norm360(L);\n\n  // 太阳赤经（与 L 同象限）后折算为小时\n  let RA = Math.atan(0.91764 * Math.tan(L * RAD)) * DEG;\n  RA = _norm360(RA);\n  const LQ = Math.floor(L / 90) * 90;\n  const RAQ = Math.floor(RA / 90) * 90;\n  RA = (RA + (LQ - RAQ)) / 15;\n\n  // 太阳赤纬\n  const sinDec = 0.39782 * Math.sin(L * RAD);\n  const cosDec = Math.cos(Math.asin(sinDec));\n\n  // 时角余弦\n  const cosH =\n    (Math.cos(zenith * RAD) - sinDec * Math.sin(lat * RAD)) / (cosDec * Math.cos(lat * RAD));\n\n  // 极昼 / 极夜\n  if (cosH > 1) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: midnightUtc + 12 * 3600000, dayLengthMs: 0, polar: 'polar-night' };\n  }\n  if (cosH < -1) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: midnightUtc + 12 * 3600000, dayLengthMs: DAY_MS, polar: 'polar-day' };\n  }\n\n  const H = Math.acos(cosH) * DEG;\n  const hRise = (360 - H) / 15;\n  const hSet = H / 15;\n\n  const tRiseUtc = _norm24(hRise + RA - 0.06571 * tRise - 6.622 - lngHour);\n  const tSetUtc = _norm24(hSet + RA - 0.06571 * tSet - 6.622 - lngHour);\n\n  const sunriseAt = midnightUtc + tRiseUtc * 3600000;\n  const sunsetAt = midnightUtc + tSetUtc * 3600000;\n  let dayLengthMs = sunsetAt - sunriseAt;\n  if (dayLengthMs < 0) dayLengthMs += DAY_MS;\n  const solarNoonAt = sunriseAt + dayLengthMs / 2;\n\n  return { sunriseAt, sunsetAt, solarNoonAt, dayLengthMs, polar: 'none' };\n}\n\n/**\n * 正午（太阳中天）时刻。\n *\n * @param {{lat:number, lon:number, dateUTC:number}} args 入参。\n * @returns {number} ms epoch。\n */\nexport function solarNoon(args) {\n  const r = sunriseSunset(args);\n  return Number.isFinite(r.solarNoonAt) ? r.solarNoonAt : Number(args && args.dateUTC);\n}\n\n/**\n * 指定时刻是否白昼。\n *\n * @param {number} atMs 待判时刻（ms epoch）。\n * @param {{lat:number, lon:number}} pos 位置。\n * @returns {boolean} true = 白昼。\n */\nexport function isDaylight(atMs, pos) {\n  const r = sunriseSunset({ lat: pos.lat, lon: pos.lon, dateUTC: Number(atMs) });\n  if (r.polar === 'polar-day') return true;\n  if (r.polar === 'polar-night') return false;\n  if (r.sunriseAt === null || r.sunsetAt === null) return true;\n  if (r.sunsetAt >= r.sunriseAt) {\n    return atMs >= r.sunriseAt && atMs < r.sunsetAt;\n  }\n  // 跨日情况（高纬）：日落时刻在次日\n  return atMs >= r.sunriseAt || atMs < r.sunsetAt;\n}\n",
  "src/core/store.js": "/**\n * 本机状态（Store）\n *\n * 职责：保存本机偏好与最近状态 —— 默认地点、单位制、最近一次快照、debug 开关、\n * 网络类型标记、收藏（阶段二启用，本阶段仅占位 schema）。所有持久化**必须**经 core/cache.js，\n * 本模块不直接触碰 localStorage。\n *\n * 设计：内存态 + 持久化双写；读优先内存，冷启动从缓存反序列化。\n * 日志：对外只暴露 log()，debug 关闭时完全静默，禁止 elsewhere 直写 console.log。\n */\n\nimport { get, set, makeKey } from './cache.js';\nimport { DEFAULT_PLACE_NAME } from './geo.js';\n\n/** 持久化键（store 视作一个伪 sourceId）。 */\nconst KEY_PREFS = makeKey('store', 'prefs');\nconst KEY_SNAPSHOT = makeKey('store', 'snapshot');\n\n/** store 条目 TTL：十年（等同长期有效；读用 get() 不做三态判定，故 TTL 无实际影响）。 */\nconst PREFS_TTL_MS = 10 * 365 * 24 * 3600 * 1000;\n\n/** 主题模式之一：跟随系统（等价于不设 data-theme，由 CSS 的 prefers-color-scheme 决定）。 */\nconst THEME_SYSTEM = 'system';\n\n/** 默认状态。 */\nconst DEFAULT_STATE = {\n  /** @type {{lat:number, lon:number, name:string}} 定位失败时的默认地点（北京天安门）。 */\n  defaultPlace: { lat: 39.9087, lon: 116.3975, name: DEFAULT_PLACE_NAME },\n  /** @type {'metric'|'imperial'} 单位制（阶段一只有 metric 生效）。 */\n  unitSystem: 'metric',\n  /**\n   * @type {'system'|'light'|'dark'} 主题模式。\n   *\n   * 默认必须是 'system'：CSS 侧（styles/tokens.css）「不设 data-theme」这条路径本就等于\n   * 跟随系统偏好（prefers-color-scheme）。默认值若写成 'light' 或 'dark'，会出现\n   * 「store 说 dark、CSS 实际浅色」的错位 —— 用户第一次进设置页，看到的选中项与眼中\n   * 画面不一致。\n   */\n  themeMode: 'system',\n  /**\n   * @type {'normal'|'large'|'xlarge'} 无障碍字号档位。\n   *\n   * 默认 'normal'：CSS 侧（styles/tokens.css）默认档就是「`<html>` 上没有 data-fs」这条\n   * 路径（--fs-scale: 1）。默认值若写成 'large'/'xlarge'，会出现「store 说放大、\n   * 页面首帧却是默认字号」的错位 —— 与上面 themeMode 必须默认 'system' 是同一条道理。\n   *\n   * ★它和 themeMode 一样**不进备份**（见 core/backup.js 的 exportBackup：prefs 只有\n   * 5 个字段），理由是「这台机器屏幕多大、用户眼睛舒不舒服」是本机属性，不是可搬家的\n   * 用户数据 —— 从一台开了特大的旧手机导入备份，不该把新手机的字号也顶到特大。\n   */\n  fontScale: 'normal',\n  /**\n   * @type {'zh'|'en'} 界面语言。\n   *\n   * 默认 'zh'（中文界面为主，用户拍板）。与 themeMode / fontScale **同形状、同处理**：\n   * 白名单钳位、读侧也钳、且**不进备份**（见 core/backup.js 的 exportBackup：prefs 只有\n   * 5 个字段）—— 语言是这台机器前一个人的属性，不是可搬家的用户数据。\n   *\n   * ★store 只存 **'zh' / 'en' 这两个标记**，一个中文串都不存：翻译表住在\n   * src/i18n/，core 不许读它（core ← data ← ui ← html 单向依赖）。把「当前界面说哪国话」\n   * 落到 i18n 的是 ui/locale.js 的 applyLocale()。\n   */\n  locale: 'zh',\n  /** @type {'wifi'|'cellular'|'unknown'} 网络类型（手动点选，默认未知）。 */\n  networkType: 'unknown',\n  /** @type {boolean} 调试开关。 */\n  debug: false,\n  /** @type {Array<{lat:number, lon:number, name:string}>} 收藏（阶段二启用）。 */\n  favorites: [],\n};\n\n/** @type {Object} 内存态。 */\nlet _state = { ...DEFAULT_STATE };\n\n/** @type {boolean} 是否已从缓存载入。 */\nlet _loaded = false;\n\n/**\n * 从缓存载入偏好（幂等）。\n *\n * @returns {void}\n */\nfunction _load() {\n  if (_loaded) return;\n  _loaded = true;\n  const entry = get(KEY_PREFS);\n  if (entry && entry.value && typeof entry.value === 'object') {\n    _state = { ...DEFAULT_STATE, ...entry.value };\n    // 数组字段做一次防御性归一，避免坏数据导致渲染崩溃\n    if (!Array.isArray(_state.favorites)) _state.favorites = [];\n  }\n  // URL 参数 ?debug=1 优先级最高\n  try {\n    const search = typeof location !== 'undefined' && location ? String(location.search || '') : '';\n    if (search.indexOf('debug=1') !== -1) _state.debug = true;\n  } catch (err) {\n    /* 非浏览器环境忽略 */\n  }\n}\n\n/**\n * 持久化偏好（失败静默）。\n *\n * @returns {void}\n */\nfunction _persist() {\n  set(KEY_PREFS, _state, PREFS_TTL_MS);\n}\n\n/**\n * 读取整份状态（副本）。\n *\n * @returns {Object} 状态副本。\n */\nexport function getState() {\n  _load();\n  return { ..._state, favorites: [..._state.favorites] };\n}\n\n/**\n * 归一地点对象（内部用）。\n *\n * 只认识五个字段里的 defaultPlace 形状；坐标必须是**有限数字**且在经纬度范围内，\n * 否则回落默认地点。为什么不做 Number() 宽容解析：`Number(null)` / `Number('')`\n * 都是 0，那会把「坏数据」静默变成「几内亚湾 0,0」这个真实存在的地点。\n * 名称长度不做截断 —— 截断规则归 core/backup.js 的 MAX_NAME_LEN 一处管。\n *\n * @param {*} p 任意值。\n * @returns {{lat:number, lon:number, name:string}} 归一后的地点。\n */\nfunction _normPlace(p) {\n  const d = DEFAULT_STATE.defaultPlace;\n  if (!p || typeof p !== 'object') return { ...d };\n  const lat = p.lat;\n  const lon = p.lon;\n  if (typeof lat !== 'number' || typeof lon !== 'number') return { ...d };\n  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return { ...d };\n  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return { ...d };\n  return { lat, lon, name: String(p.name === null || p.name === undefined ? '' : p.name) };\n}\n\n/**\n * 整体替换状态（供 core/backup.js 导入备份使用）。\n *\n * 为什么需要它：导入备份如果逐字段 set，中途失败会留下「改了一半」的状态\n * （defaultPlace 已经换了、favorites 还是旧的）。调用方（backup.js）先把完整的\n * next state 算完并校验通过，再由本函数**一次性**写入内存 + 持久化，保证原子性。\n *\n * 本函数只做**形状归一**（store 自身不变量：绝不把坏地点 / 非数组收藏写进内存态），\n * 不做业务级「非法就整体拒绝」—— 那是 backup.js 的职责。两者是同一把尺子的两道防线：\n * backup.js 负责拒绝，本函数保证就算被绕过了，内存态也不会存进不可用的值。\n *\n * 不改变任何既有 API 的语义，也不删除任何既有导出。\n *\n * ⚠️ `themeMode` 与 `fontScale` 的特殊处理（漏了这条就会把用户的主题 / 字号抹回去）：\n * 本函数整体重建 `_state`，而**备份里没有这两个字段**（它们都是这台机器的属性，不是\n * 用户数据，理由同 backup.js 里「debug 不从备份带入」那条）。若照其它字段一律读\n * `src.themeMode`，那么 `src` 里根本没有这个字段 → 一律回落 'system' → 导入一次备份\n * 就把用户手选的主题静默清掉了。字号同理：从一台开了「特大」的旧手机导入备份，不该把\n * 新手机的字号也顶到「特大」。所以这两个字段都走「有明确值就用它，否则保持当前值」。\n *\n * @param {Object} next 新状态（{ defaultPlace, unitSystem, networkType, debug, favorites,\n *                             themeMode?, fontScale? }）。\n * @returns {Object} 实际落地的状态副本（与 getState() 同形状）。\n */\nexport function replaceState(next) {\n  _load();\n  const src = next && typeof next === 'object' ? next : {};\n  _state = {\n    defaultPlace: _normPlace(src.defaultPlace),\n    unitSystem: src.unitSystem === 'imperial' ? 'imperial' : DEFAULT_STATE.unitSystem,\n    networkType: src.networkType === 'wifi' || src.networkType === 'cellular' ? src.networkType : DEFAULT_STATE.networkType,\n    debug: !!src.debug,\n    // themeMode 不在备份里（见本函数 JSDoc）：src 没带就保持当前值，不许回落默认。\n    themeMode: src.themeMode === 'light' || src.themeMode === 'dark' ? src.themeMode : _state.themeMode,\n    // fontScale 与 themeMode 同理（同为本机属性、不进备份）：src 没带就保持当前值。\n    fontScale: src.fontScale === 'large' || src.fontScale === 'xlarge' ? src.fontScale : _state.fontScale,\n    // locale 与上面两个同理（本机属性、不进备份）：src 没带就保持当前值 ——\n    // 从一台用英文界面的旧手机导入备份，不该把新手机的界面也顶成英文。\n    locale: src.locale === 'en' ? 'en' : _state.locale,\n    favorites: (Array.isArray(src.favorites) ? src.favorites : [])\n      .filter((f) => f && typeof f === 'object' && typeof f.lat === 'number' && Number.isFinite(f.lat) && typeof f.lon === 'number' && Number.isFinite(f.lon))\n      .map((f) => ({ lat: f.lat, lon: f.lon, name: String(f.name === null || f.name === undefined ? '' : f.name) })),\n  };\n  _persist();\n  return getState();\n}\n\n/**\n * 设置默认地点。\n *\n * @param {{lat:number, lon:number, name:string}} place 地点对象。\n * @returns {void}\n */\nexport function setDefaultPlace(place) {\n  _load();\n  _state.defaultPlace = {\n    lat: Number(place.lat),\n    lon: Number(place.lon),\n    name: String(place.name || ''),\n  };\n  _persist();\n}\n\n/**\n * 取默认地点（含 source 标记，便于上游直接当 coord 用）。\n *\n * @returns {{lat:number, lon:number, name:string, source:'default'}} 默认地点。\n */\nexport function getDefaultPlace() {\n  _load();\n  const p = _state.defaultPlace;\n  return { lat: p.lat, lon: p.lon, name: p.name, source: 'default' };\n}\n\n/**\n * 设置单位制。\n *\n * @param {'metric'|'imperial'} unit 单位制。\n * @returns {void}\n */\nexport function setUnitSystem(unit) {\n  _load();\n  _state.unitSystem = unit === 'imperial' ? 'imperial' : 'metric';\n  _persist();\n}\n\n/** @returns {'metric'|'imperial'} 当前单位制。 */\nexport function getUnitSystem() {\n  _load();\n  return _state.unitSystem;\n}\n\n/**\n * 设置主题模式。\n *\n * 白名单钳位：只认 'light' / 'dark'，其它任何值（含 undefined / 拼错的字符串）一律\n * 回落 'system' —— 宁可跟随系统，也不把一个 UI 认不出来的值写进 <html data-theme>。\n *\n * @param {'system'|'light'|'dark'} mode 主题模式。\n * @returns {void}\n */\nexport function setThemeMode(mode) {\n  _load();\n  _state.themeMode = mode === 'light' || mode === 'dark' ? mode : THEME_SYSTEM;\n  _persist();\n}\n\n/** @returns {'system'|'light'|'dark'} 当前主题模式。 */\nexport function getThemeMode() {\n  _load();\n  return _state.themeMode;\n}\n\n/**\n * 设置无障碍字号档位。\n *\n * 白名单钳位：只认 'large' / 'xlarge'，其它任何值（含 undefined / 拼错的字符串）一律\n * 回落 'normal' —— 宁可回到默认字号，也不把一个 UI 认不出来的值写进 <html data-fs>。\n * 与 setThemeMode() 同构：两者都是「写全站属性 + 白名单钳位」这一件事的两个实例。\n *\n * @param {'normal'|'large'|'xlarge'} scale 字号档位。\n * @returns {void}\n */\nexport function setFontScale(scale) {\n  _load();\n  _state.fontScale = scale === 'large' || scale === 'xlarge' ? scale : 'normal';\n  _persist();\n}\n\n/**\n * @returns {'normal'|'large'|'xlarge'} 当前字号档位。\n *\n * 读侧同样钳位（不直接返回 _state.fontScale）：内存态可能来自一份被外力改坏的缓存，\n * 一旦出去一个 '超大' 这样的值，ui/theme.js 会把它当 'normal' 处理，于是界面显示\n * 「默认」而设置页显示「特大」—— 两个页面各说各话。在这里收口，全站只会看到三档之一。\n */\nexport function getFontScale() {\n  _load();\n  const v = _state.fontScale;\n  return v === 'large' || v === 'xlarge' ? v : 'normal';\n}\n\n/**\n * 设置界面语言。\n *\n * 白名单钳位：只认 'en'，其它任何值（含 undefined / 拼错的字符串）一律回落 'zh'\n * —— 与 setThemeMode() / setFontScale() 同构，三者都是「写一个全站属性 + 白名单钳位」。\n *\n * ★本函数只落**标记**，不碰文案：真正切语言的是 ui/locale.js 的 applyLocale()\n * （它会拿这里的值去调 i18n 的 setLocale）。这样 store（core 层）不需要知道\n * src/i18n/ 的存在，i18n 也不需要 import store，两边都不破坏单向依赖。\n *\n * @param {'zh'|'en'} locale 语言标记。\n * @returns {void}\n */\nexport function setLocale(locale) {\n  _load();\n  _state.locale = locale === 'en' ? 'en' : 'zh';\n  _persist();\n}\n\n/**\n * @returns {'zh'|'en'} 当前界面语言标记。\n *\n * 读侧同样钳位（不直接返回 _state.locale）：内存态可能来自一份被外力改坏的缓存，\n * 一旦出去一个 'jp' 这样的值，i18n 会整站返回原始 key（界面变成一串键名）。\n * 与 getFontScale() 同一条理由，在这里收口，全站只会看到两档之一。\n */\nexport function getLocale() {\n  _load();\n  const v = _state.locale;\n  return v === 'en' ? 'en' : 'zh';\n}\n\n/**\n * 设置网络类型（自检页手动点选）。\n *\n * @param {'wifi'|'cellular'|'unknown'} t 网络类型。\n * @returns {void}\n */\nexport function setNetworkType(t) {\n  _load();\n  _state.networkType = t === 'wifi' || t === 'cellular' ? t : 'unknown';\n  _persist();\n}\n\n/** @returns {'wifi'|'cellular'|'unknown'} 网络类型。 */\nexport function getNetworkType() {\n  _load();\n  return _state.networkType;\n}\n\n/**\n * 写入最近一次快照（离线冷启动的降级底座）。\n *\n * @param {Object} snapshot NowSnapshot。\n * @returns {void}\n */\nexport function setLastSnapshot(snapshot) {\n  _load();\n  set(KEY_SNAPSHOT, snapshot, PREFS_TTL_MS);\n}\n\n/**\n * 读取最近一次快照。\n *\n * @returns {Object|null} NowSnapshot 或 null。\n */\nexport function getLastSnapshot() {\n  const entry = get(KEY_SNAPSHOT);\n  return entry && entry.value ? entry.value : null;\n}\n\n/** @returns {boolean} debug 是否开启。 */\nexport function isDebug() {\n  _load();\n  return !!_state.debug;\n}\n\n/**\n * 设置 debug 开关（同时写入缓存，等价于 localStorage['gs:v1:debug']='1' 的效果）。\n *\n * @param {boolean} on 是否开启。\n * @returns {void}\n */\nexport function setDebug(on) {\n  _load();\n  _state.debug = !!on;\n  _persist();\n}\n\n/**\n * 调试日志：debug 关闭时完全静默（禁止 elsewhere 直写 console.log）。\n *\n * @param {...*} args 日志内容。\n * @returns {void}\n */\nexport function log(...args) {\n  if (!isDebug()) return;\n  try {\n    console.log('[GeoScope]', ...args);\n  } catch (err) {\n    /* 环境无 console 时静默 */\n  }\n}\n\n/** @returns {Array<{lat:number, lon:number, name:string}>} 收藏列表副本（阶段二启用）。 */\nexport function getFavorites() {\n  _load();\n  return [..._state.favorites];\n}\n\n/**\n * 追加收藏。\n *\n * @param {{lat:number, lon:number, name:string}} place 地点。\n * @returns {void}\n */\nexport function addFavorite(place) {\n  _load();\n  const lat = Number(place.lat);\n  const lon = Number(place.lon);\n  if (_state.favorites.some((f) => f.lat === lat && f.lon === lon)) return;\n  _state.favorites.push({ lat, lon, name: String(place.name || '') });\n  _persist();\n}\n\n/**\n * 判断某个坐标是否已收藏（口径与 addFavorite 的去重一致：lat + lon 精确相等）。\n *\n * 为什么单独给一个：now.js 的收藏按钮每次渲染都要问一次「现在是不是已收藏」，\n * 让 UI 层自己 `getFavorites().some(...)` 等于把去重口径抄一份到界面层 ——\n * 哪天去重规则从「精确相等」改成「四舍五入到 4 位」，界面就会和 store 判出两种结论。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {boolean} 是否已收藏。\n */\nexport function isFavorite(lat, lon) {\n  _load();\n  const la = Number(lat);\n  const lo = Number(lon);\n  return _state.favorites.some((f) => f.lat === la && f.lon === lo);\n}\n\n/**\n * 删除收藏（按 lat + lon 精确匹配，口径与 addFavorite 的去重一致）。\n *\n * 返回值必须区分「删掉了」和「本来就没有」：UI 要用它区分成功反馈与无效点击，\n * 若一律返回 undefined，取消收藏按钮在「条目已被另一处删掉」时会假报成功。\n *\n * 未命中时**不写盘**：无意义的 _persist() 会给 localStorage 增加一次写入，\n * 在配额紧张的 iOS 上是不必要的消耗。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {boolean} 是否真的删掉了（false = 本来就没有这一条）。\n */\nexport function removeFavorite(lat, lon) {\n  _load();\n  const la = Number(lat);\n  const lo = Number(lon);\n  const before = _state.favorites.length;\n  const next = _state.favorites.filter((f) => !(f.lat === la && f.lon === lo));\n  if (next.length === before) return false;\n  _state.favorites = next;\n  _persist();\n  return true;\n}\n\n/**\n * 重置本机状态（仅供自检/排障使用）。\n *\n * @returns {void}\n */\nexport function resetStore() {\n  _loaded = true;\n  _state = { ...DEFAULT_STATE, favorites: [] };\n  _persist();\n}\n",
  "src/core/wmo.js": "/**\n * 气象映射表（WMO / 欧洲 AQI / UV / 风向 / 蒲福风级）\n *\n * 职责：把数值编码翻译成**色彩令牌 + 文案键**，供展示层直接消费。纯数据 + 纯函数，零网络。\n *\n * ★本模块不产出任何人类语言 —— 一律产出 **i18n key**（如 `{ key: 'wmo.61' }`），\n *   由 UI 层 t() 之后才变成「小雨」/ \"Slight rain\"。\n *\n *   为什么：本模块在 core 层。四层单向依赖 `core ← data ← ui ← html` 规定 core 不得\n *   反向 import 上层（tools/check.mjs 第 8 节与 tests/static.test.mjs 都有硬断言），\n *   而 i18n 的 **locale 状态**（当前是哪一国界面）住在 src/i18n/index.js —— core 一旦\n *   import 它，就等于让最底层去读一个全局可变的「现在该说哪国话」，分层倒置且不可测。\n *   所以这里只给键，UI 层负责翻。\n *\n *   为什么不用「core 自己 import 文案表、按 locale 选」：那仍要 import i18n，同样破分层；\n *   为什么不用「core 接受一个翻译回调、默认走中文」：默认中文会让「英文表少一个 key」\n *   这种错误**静默降级成中文**，正好是 tools/check.mjs 第 14 节那道同构守卫要抓的东西 ——\n *   有默认兜底，守卫就被架空了。返回 key 则没有兜底：少一个 key 界面就显示 `wmo.61`，\n *   而提交前守卫必定报红。\n *\n * 口径：\n *   - WMO 天气码：Open-Meteo 使用的 weather_code（0..99）；\n *   - 欧洲 AQI：0–20 优 / 21–40 良 / 41–60 中 / 61–80 差 / 81–100 很差 / >100 极差；\n *   - UV：0–2 低 / 3–5 中 / 6–7 高 / 8–10 很高 / 11+ 极高；\n *   - 风向：16 方位；蒲福风级：0–12 级。\n *\n * 依赖：零 import（纯常量 + 纯函数）。\n */\n\n/**\n * WMO 天气码表（Open-Meteo 口径）。\n *\n * key 完整描述键 / shortKey 短描述键 / icon 单字符符号（内联字符，非外链图标）。\n * 键名前缀 `wmo.`，未知码落到 `wmo.unknown`。\n */\nconst WMO_TABLE = {\n  0: { key: 'wmo.0', shortKey: 'wmo.0.short', icon: '☀' },\n  1: { key: 'wmo.1', shortKey: 'wmo.1.short', icon: '🌤' },\n  2: { key: 'wmo.2', shortKey: 'wmo.2.short', icon: '⛅' },\n  3: { key: 'wmo.3', shortKey: 'wmo.3.short', icon: '☁' },\n  45: { key: 'wmo.45', shortKey: 'wmo.45.short', icon: '🌫' },\n  48: { key: 'wmo.48', shortKey: 'wmo.48.short', icon: '🌫' },\n  51: { key: 'wmo.51', shortKey: 'wmo.51.short', icon: '🌦' },\n  53: { key: 'wmo.53', shortKey: 'wmo.53.short', icon: '🌦' },\n  55: { key: 'wmo.55', shortKey: 'wmo.55.short', icon: '🌦' },\n  56: { key: 'wmo.56', shortKey: 'wmo.56.short', icon: '🌧' },\n  57: { key: 'wmo.57', shortKey: 'wmo.57.short', icon: '🌧' },\n  61: { key: 'wmo.61', shortKey: 'wmo.61.short', icon: '🌧' },\n  63: { key: 'wmo.63', shortKey: 'wmo.63.short', icon: '🌧' },\n  65: { key: 'wmo.65', shortKey: 'wmo.65.short', icon: '🌧' },\n  66: { key: 'wmo.66', shortKey: 'wmo.66.short', icon: '🌨' },\n  67: { key: 'wmo.67', shortKey: 'wmo.67.short', icon: '🌨' },\n  71: { key: 'wmo.71', shortKey: 'wmo.71.short', icon: '🌨' },\n  73: { key: 'wmo.73', shortKey: 'wmo.73.short', icon: '🌨' },\n  75: { key: 'wmo.75', shortKey: 'wmo.75.short', icon: '❄' },\n  77: { key: 'wmo.77', shortKey: 'wmo.77.short', icon: '❄' },\n  80: { key: 'wmo.80', shortKey: 'wmo.80.short', icon: '🌦' },\n  81: { key: 'wmo.81', shortKey: 'wmo.81.short', icon: '🌧' },\n  82: { key: 'wmo.82', shortKey: 'wmo.82.short', icon: '⛈' },\n  85: { key: 'wmo.85', shortKey: 'wmo.85.short', icon: '🌨' },\n  86: { key: 'wmo.86', shortKey: 'wmo.86.short', icon: '❄' },\n  95: { key: 'wmo.95', shortKey: 'wmo.95.short', icon: '⛈' },\n  96: { key: 'wmo.96', shortKey: 'wmo.96.short', icon: '⛈' },\n  99: { key: 'wmo.99', shortKey: 'wmo.99.short', icon: '⛈' },\n};\n\n/** 未知天气码兜底。 */\nconst WMO_UNKNOWN = { key: 'wmo.unknown', shortKey: 'wmo.unknown.short', icon: '·' };\n\n/**\n * WMO 天气码 → 描述（**文案键**，不是文字）。\n *\n * @param {number} code WMO 天气码。\n * @param {boolean} [isDay=true] 是否白昼（预留昼夜图标切换，本阶段文案一致）。\n * @returns {{code:number, key:string, shortKey:string, icon:string, day:boolean}} 描述对象。\n */\nexport function wmo(code, isDay = true) {\n  // 【致命兜底】天气码缺失（null / '' / undefined）或非法（NaN / 'abc' / {} / []）一律落到「未知天气」。\n  // 原因：Number(null)===0、Number('')===0、Number([])===0 —— 若直接 Number() 会把「没数据」\n  // 误判成 WMO 0「晴」，界面显示「☀ 晴」。这是**误导性天气显示**，比显示「未知」更糟。\n  // 因此这里只对「number」和「非空字符串」做数值化，其余全部归一为 code = -1 的未知档。\n  let n = NaN;\n  if (typeof code === 'number') {\n    n = code;\n  } else if (typeof code === 'string' && code.trim() !== '') {\n    n = Number(code);\n  }\n  if (!Number.isFinite(n)) {\n    return {\n      code: -1,\n      key: WMO_UNKNOWN.key,\n      shortKey: WMO_UNKNOWN.shortKey,\n      icon: WMO_UNKNOWN.icon,\n      day: !!isDay,\n    };\n  }\n  const c = Math.trunc(n);\n  const base = WMO_TABLE[c] || WMO_UNKNOWN;\n  return { code: c, key: base.key, shortKey: base.shortKey, icon: base.icon, day: !!isDay };\n}\n\n/** 欧洲 AQI 六档定义（zh 字段已换成 levelKey，文案由 UI 翻译）。 */\nconst AQI_LEVELS = [\n  { max: 20, level: 'good', levelKey: 'level.aqi.good', token: '--c-ok', adviceKey: 'aqi.good.advice' },\n  { max: 40, level: 'fair', levelKey: 'level.aqi.fair', token: '--c-ok', adviceKey: 'aqi.fair.advice' },\n  { max: 60, level: 'moderate', levelKey: 'level.aqi.moderate', token: '--c-warn', adviceKey: 'aqi.moderate.advice' },\n  { max: 80, level: 'poor', levelKey: 'level.aqi.poor', token: '--c-warn', adviceKey: 'aqi.poor.advice' },\n  { max: 100, level: 'very-poor', levelKey: 'level.aqi.very-poor', token: '--c-alert', adviceKey: 'aqi.very-poor.advice' },\n  { max: Infinity, level: 'extreme', levelKey: 'level.aqi.extreme', token: '--c-alert', adviceKey: 'aqi.extreme.advice' },\n];\n\n/**\n * 欧洲 AQI 分级。\n *\n * 说明：`value` 保留原始测量值（含负值，便于排查上游异常）；`displayValue` 是钳制到 [0, +∞)\n * 之后的展示值，界面一律用 displayValue，避免出现「优 · AQI -10」这种自相矛盾的文案。\n * 非有限入参（undefined / null / 'x' / NaN / {}）一律兜底为 0 / good。\n *\n * ★`levelKey` / `adviceKey` 是**键**，不是文字（理由见文件头）。UI 层要显示就用\n * `t(info.levelKey)` / `t(info.adviceKey)`；本模块的旧字段 `zh` / `advice` 已移除 ——\n * 留着它们等于留一条「不切语言也能显示」的捷径，那条捷径正是英文包漏翻的温床。\n *\n * @param {number} europeanAqi 欧洲 AQI 值。\n * @returns {{value:number, displayValue:number, level:string, levelKey:string,\n *            colorToken:string, adviceKey:string}} 分级结果。\n */\nexport function aqi(europeanAqi) {\n  const v = Number(europeanAqi);\n  const value = Number.isFinite(v) ? Math.round(v) : 0;\n  const hit = AQI_LEVELS.find((l) => value <= l.max) || AQI_LEVELS[AQI_LEVELS.length - 1];\n  return {\n    value,\n    displayValue: Math.max(0, value),\n    level: hit.level,\n    levelKey: hit.levelKey,\n    colorToken: hit.token,\n    adviceKey: hit.adviceKey,\n  };\n}\n\n/** UV 五档定义。 */\nconst UV_LEVELS = [\n  { max: 2, level: 'low', levelKey: 'level.uv.low', token: '--c-ok', adviceKey: 'uv.low.advice' },\n  { max: 5, level: 'moderate', levelKey: 'level.uv.moderate', token: '--c-warn', adviceKey: 'uv.moderate.advice' },\n  { max: 7, level: 'high', levelKey: 'level.uv.high', token: '--c-warn', adviceKey: 'uv.high.advice' },\n  { max: 10, level: 'very-high', levelKey: 'level.uv.very-high', token: '--c-alert', adviceKey: 'uv.very-high.advice' },\n  { max: Infinity, level: 'extreme', levelKey: 'level.uv.extreme', token: '--c-alert', adviceKey: 'uv.extreme.advice' },\n];\n\n/**\n * 紫外线指数分级。\n *\n * 说明：同 aqi() —— `value` 保留原始值，`displayValue` 钳制到 [0, +∞) 供界面使用。\n * 非有限入参与负值一律兜底为 low 档。\n *\n * @param {number} index UV 指数。\n * @returns {{value:number, displayValue:number, level:string, levelKey:string,\n *            colorToken:string, adviceKey:string}} 分级结果。\n */\nexport function uv(index) {\n  const v = Number(index);\n  const value = Number.isFinite(v) ? Math.round(v) : 0;\n  const hit = UV_LEVELS.find((l) => value <= l.max) || UV_LEVELS[UV_LEVELS.length - 1];\n  return {\n    value,\n    displayValue: Math.max(0, value),\n    level: hit.level,\n    levelKey: hit.levelKey,\n    colorToken: hit.token,\n    adviceKey: hit.adviceKey,\n  };\n}\n\n/**\n * 16 方位的**文案键**（顺时针，0 = 北）。\n *\n * `dir.N` 是全名（图例用），`dir.N.abbr` 是缩写（此刻页那个数字后面用）。\n * 中文两档同值，英文缩写更短（'North-northeast' → 'NNE'）—— 所以必须分两档存。\n */\nconst DIR16_KEYS = [\n  'dir.0', 'dir.1', 'dir.2', 'dir.3',\n  'dir.4', 'dir.5', 'dir.6', 'dir.7',\n  'dir.8', 'dir.9', 'dir.10', 'dir.11',\n  'dir.12', 'dir.13', 'dir.14', 'dir.15',\n];\n\n/**\n * 风向 16 方位。\n *\n * ★只返回**键**。方位名带「风」后缀那个动作（中文「西北偏北风」/ 英文 \"wind from NNW\"）\n * 由 UI 层用 `t('w.windFrom', { dir: t(dir.abbrKey) })` 完成 —— 中英文那句话的**语序不同**\n * （后缀 vs 介词），core 拼不出两种语言都对的字符串。\n *\n * @param {number} deg 风向角度（0 = 北，顺时针）。\n * @returns {{deg:number, key:string, abbrKey:string}} 方位对象。\n */\nexport function windDir16(deg) {\n  const d = Number(deg);\n  const normalized = Number.isFinite(d) ? ((d % 360) + 360) % 360 : 0;\n  const idx = Math.round(normalized / 22.5) % 16;\n  return { deg: normalized, key: DIR16_KEYS[idx], abbrKey: `${DIR16_KEYS[idx]}.abbr` };\n}\n\n/** 蒲福风级上限（m/s）。 */\nconst BEAUFORT = [0.3, 1.6, 3.4, 5.5, 8.0, 10.8, 13.9, 17.2, 20.8, 24.5, 28.5, 32.7, Infinity];\n/** 蒲福风级的文案键（0–12 级 → 'bf.0' … 'bf.12'）。 */\nconst BEAUFORT_KEYS = BEAUFORT.map((_, level) => `bf.${level}`);\n\n/**\n * 蒲福风级。\n *\n * @param {number} ms 风速（m/s）。\n * @returns {{level:number, key:string}} 风级对象（key 形如 'bf.4'，UI 层 t() 得「和风」/ \"Moderate breeze\"）。\n */\nexport function beaufort(ms) {\n  const v = Number(ms);\n  const speed = Number.isFinite(v) && v > 0 ? v : 0;\n  let level = 0;\n  while (level < BEAUFORT.length - 1 && speed >= BEAUFORT[level]) level += 1;\n  return { level, key: BEAUFORT_KEYS[level] };\n}\n\n/* ------------------------------------------------------------------ */\n/* 分级表的只读视图（供「指标释义」图例直接消费）                        */\n/* ------------------------------------------------------------------ */\n/*\n * 为什么要有这几个访问器：图例要把「清风（4 级）」解释成一张档位表，而阈值必须来自\n * **既有实现** —— 若在 legend.js 里另抄一份数字，就等于新造一套标准，将来改了换算表\n * 图例会静默说谎。这里只把上面那几张常量表原样吐出去（不新增、不改写任何数值），\n * legend.js 拿到的永远是界面真正用的那一份。\n *\n * 返回的是**副本**：调用方改不动模块内的常量表。\n * 返回的 `key` / `levelKey` / `adviceKey` 是文案键，由 UI 层翻译（理由见文件头）。\n */\n\n/**\n * 蒲福风级全表（0–12 级）。\n *\n * `maxMs` 是该级的**上限（不含）**：`speed < maxMs` 且 `speed >= 上一级的 maxMs` 即本级。\n * 最高级（12 级）的 maxMs 为 Infinity。\n *\n * @returns {Array<{level:number, key:string, maxMs:number}>} 13 级全表副本。\n */\nexport function beaufortScale() {\n  return BEAUFORT.map((maxMs, level) => ({ level, key: BEAUFORT_KEYS[level], maxMs }));\n}\n\n/**\n * 欧洲 AQI 六档全表。\n *\n * @returns {Array<{level:string, levelKey:string, max:number, adviceKey:string}>} 六档副本。\n */\nexport function aqiScale() {\n  return AQI_LEVELS.map((l) => ({\n    level: l.level,\n    levelKey: l.levelKey,\n    max: l.max,\n    adviceKey: l.adviceKey,\n  }));\n}\n\n/**\n * UV 五档全表。\n *\n * @returns {Array<{level:string, levelKey:string, max:number, adviceKey:string}>} 五档副本。\n */\nexport function uvScale() {\n  return UV_LEVELS.map((l) => ({\n    level: l.level,\n    levelKey: l.levelKey,\n    max: l.max,\n    adviceKey: l.adviceKey,\n  }));\n}\n\n/**\n * 风向 16 方位的**文案键**（顺时针，0 = 北）。\n *\n * 返回的是全名键（'dir.0' … 'dir.15'）；界面上「西北偏北风」那个「风」字由 UI 层\n * 用 `t('w.windFrom', { dir })` 补上，理由见 windDir16()。\n *\n * @returns {string[]} 16 个方位键副本。\n */\nexport function windRose16() {\n  return [...DIR16_KEYS];\n}\n",
  "src/core/http.js": "/**\n * 请求内核（HTTP）\n *\n * 职责：全应用**唯一**的网络出口。所有 fetch 必须经此模块，内置：\n *   1) 全局串行队列（并发恒为 1）——避免多源抢带宽，真机弱网下更稳；\n *   2) AbortController 超时中断（源只声明 timeoutMs，不自己 fetch）；\n *   3) 固定重试（仅在 error.retriable === true 时发生，且重试前不额外退避）；\n *   4) 缓存三态短路（fresh 命中不发请求）；\n *   5) 离线短路（navigator.onLine === false 且非 force 时直接返回 OFFLINE，不入队）；\n *   6) 统一 SourceResult / SourceError 形状，禁止裸抛 Error 穿越模块边界。\n *\n * 分层：core 层不允许 import data 层，因此源注册表通过 setSourceResolver() 注入\n * （由 data/sources.js 在模块加载时自行注册），保证依赖方向单向。\n */\n\nimport { getWithState, set } from './cache.js';\nimport { log } from './store.js';\n\n/* ------------------------------------------------------------------ */\n/* 串行队列                                                             */\n/* ------------------------------------------------------------------ */\n\n/** @type {Promise<unknown>} 队列尾指针。 */\nlet _chain = Promise.resolve();\n/** @type {number} 队列中（含正在执行）的任务数。 */\nlet _pending = 0;\n\n/**\n * 入队执行（全局并发 1）。\n *\n * @template T\n * @param {() => Promise<T>|T} fn 任务函数。\n * @param {{name?:string}} [opts] 任务名（仅用于调试日志）。\n * @returns {Promise<T>} 任务结果（异常原样向上抛）。\n */\nexport function enqueue(fn, opts = {}) {\n  const name = (opts && opts.name) || 'task';\n  _pending += 1;\n  log(`enqueue:${name}`, 'pending=' + _pending);\n\n  const task = _chain.then(() => fn());\n  // 队列本身不因单个任务失败而断裂\n  _chain = task.then(\n    () => undefined,\n    () => undefined\n  );\n\n  return task.then(\n    (value) => {\n      _pending -= 1;\n      return value;\n    },\n    (err) => {\n      _pending -= 1;\n      throw err;\n    }\n  );\n}\n\n/** @returns {number} 队列中（含执行中）的任务数。 */\nexport function queueLength() {\n  return _pending;\n}\n\n/**\n * 重置队列（自检页开始新一轮取样前调用）。\n *\n * @returns {void}\n */\nexport function resetQueue() {\n  _chain = Promise.resolve();\n  _pending = 0;\n}\n\n/* ------------------------------------------------------------------ */\n/* 源注册表注入                                                         */\n/* ------------------------------------------------------------------ */\n\n/** @type {null|((id:string)=>Object|null)} 源解析器。 */\nlet _resolver = null;\n\n/**\n * 注入源解析器（由 data/sources.js 调用）。\n *\n * @param {(id:string)=>Object|null} fn 解析器。\n * @returns {void}\n */\nexport function setSourceResolver(fn) {\n  _resolver = typeof fn === 'function' ? fn : null;\n}\n\n/** @returns {null|((id:string)=>Object|null)} 当前解析器。 */\nexport function getSourceResolver() {\n  return _resolver;\n}\n\n/* ------------------------------------------------------------------ */\n/* 错误与结果构造                                                       */\n/* ------------------------------------------------------------------ */\n\n/**\n * 构造统一 SourceError。\n *\n * ★不给 `message`（人类语言），只给 `messageKey` + `messageParams`。\n *   理由与 core/wmo.js、core/csv.js 完全相同：本模块在 core 层，不许 import i18n ——\n *   「当前界面说哪国话」是上层状态，core 去读它就是分层倒置。错误文案一律由 UI 层\n *   `tr({ key: err.messageKey, params: err.messageParams })` 翻出来。\n *   刻意**不保留**一个已成文本的 `message` 字段：留着它等于留一条「不切语言也能显示」\n *   的捷径，那条捷径会让英文包漏翻时静默显示中文。\n *\n * @param {'OFFLINE'|'TIMEOUT'|'HTTP'|'NETWORK'|'PARSE'|'ABORT'|'EMPTY'|'UNSUPPORTED'} code 错误码。\n * @param {string} sourceId 源 id。\n * @param {{httpStatus?:number|null, params?:Object}} [extra] 附加信息。\n * @returns {{code:string, messageKey:string, messageParams:Object,\n *            httpStatus:number|null, sourceId:string, retriable:boolean}} SourceError。\n */\nexport function makeError(code, sourceId, extra = {}) {\n  const httpStatus = extra.httpStatus === undefined ? null : extra.httpStatus;\n  const params = extra.params || {};\n  // 可重试：超时 / 网络 / 5xx / 429；其余一律不可重试\n  let retriable = false;\n  if (code === 'TIMEOUT' || code === 'NETWORK') retriable = true;\n  if (code === 'HTTP' && typeof httpStatus === 'number' && (httpStatus >= 500 || httpStatus === 429)) {\n    retriable = true;\n  }\n  return {\n    code,\n    messageKey: `error.${code}`,\n    messageParams: { ms: params.timeoutMs, status: httpStatus },\n    httpStatus,\n    sourceId,\n    retriable,\n  };\n}\n\n/**\n * 构造统一 SourceResult。\n *\n * 显式携带 `stale` 字段的原因：`ok === false` 时 `data` 可能是**陈旧兜底值**（上游失败但有旧缓存），\n * 调用方不能只看 `ok` 就把 `data` 当成功数据用。判定规则统一为 `meta.cacheState === 'stale'`。\n *\n * @param {boolean} ok 是否成功。\n * @param {string} sourceId 源 id。\n * @param {*} data 数据（失败时可能是陈旧兜底值）。\n * @param {Object|null} error SourceError。\n * @param {Object} meta ResultMeta。\n * @returns {{ok:boolean, sourceId:string, data:*, error:Object|null, meta:Object, stale:boolean}} SourceResult。\n */\nfunction _result(ok, sourceId, data, error, meta) {\n  return {\n    ok: !!ok,\n    sourceId,\n    data: data === undefined ? null : data,\n    error: error || null,\n    meta,\n    stale: meta.cacheState === 'stale',\n  };\n}\n\n/**\n * 构造统一 ResultMeta。\n *\n * @returns {{attempts:number, latencyMs:number, queuedMs:number, startedAt:number, finishedAt:number,\n *            fromCache:boolean, cacheState:'fresh'|'stale'|'miss'|'n/a', staleAgeMs:number,\n *            requestUrl:string, httpStatus:number|null, bytes:number|null}} ResultMeta。\n */\nfunction _blankMeta() {\n  const now = Date.now();\n  return {\n    attempts: 0,\n    latencyMs: 0,\n    queuedMs: 0,\n    startedAt: now,\n    finishedAt: now,\n    fromCache: false,\n    cacheState: 'miss',\n    staleAgeMs: 0,\n    requestUrl: '',\n    httpStatus: null,\n    bytes: null,\n  };\n}\n\n/**\n * 取 navigator.onLine（非浏览器环境视为在线）。\n *\n * @returns {boolean} 是否在线。\n */\nexport function isOnline() {\n  if (typeof navigator === 'undefined' || navigator === null) return true;\n  return navigator.onLine !== false;\n}\n\n/**\n * 拼接最终 URL（params 为空或 url 已带 '?' 时按既定规则处理）。\n *\n * @param {{url:string, params?:Object<string,string|number>}} req RequestSpec。\n * @returns {string} 最终 URL。\n */\nexport function buildUrl(req) {\n  const url = String((req && req.url) || '');\n  const params = (req && req.params) || null;\n  if (!params) return url;\n  const keys = Object.keys(params);\n  if (keys.length === 0) return url;\n  const qs = keys\n    .map((k) => `${encodeURIComponent(k)}=${encodeURIComponent(String(params[k]))}`)\n    .join('&');\n  return url.indexOf('?') === -1 ? `${url}?${qs}` : `${url}&${qs}`;\n}\n\n/**\n * 估算文本字节数（用于 meta.bytes，容忍无 Blob 环境）。\n *\n * @param {string} text 文本。\n * @returns {number} 字节数。\n */\nfunction _textBytes(text) {\n  if (typeof Blob !== 'undefined') {\n    try {\n      return new Blob([text]).size;\n    } catch (err) {\n      /* 退化到字符数 */\n    }\n  }\n  return text.length;\n}\n\n/**\n * 取响应 Content-Type（容忍 mock）。\n *\n * @param {Object} res 响应对象。\n * @returns {string|null} MIME 或 null。\n */\nfunction _contentType(res) {\n  try {\n    if (res && res.headers && typeof res.headers.get === 'function') {\n      return res.headers.get('content-type') || null;\n    }\n  } catch (err) {\n    /* ignore */\n  }\n  return null;\n}\n\n/**\n * 单次尝试（不含重试与排队）。\n *\n * @param {string} url 最终 URL。\n * @param {number} timeoutMs 超时毫秒。\n * @param {'json'|'bytes'} responseType 响应类型。\n * @returns {Promise<{ok:boolean, json?:*, data?:ArrayBuffer, latencyMs:number,\n *            httpStatus:number|null, bytes:number|null, contentType:string|null, error?:Object}>} 尝试结果。\n */\nasync function _attempt(url, timeoutMs, responseType) {\n  const t0 = Date.now();\n  const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;\n  let timer = null;\n  let abortedByTimeout = false;\n\n  if (controller) {\n    timer = setTimeout(() => {\n      abortedByTimeout = true;\n      try {\n        controller.abort();\n      } catch (err) {\n        /* ignore */\n      }\n    }, timeoutMs);\n  }\n\n  try {\n    const fetchFn = typeof globalThis !== 'undefined' ? globalThis.fetch : undefined;\n    if (typeof fetchFn !== 'function') {\n      return {\n        ok: false,\n        latencyMs: Date.now() - t0,\n        httpStatus: null,\n        bytes: null,\n        contentType: null,\n        error: makeError('NETWORK', 'raw'),\n      };\n    }\n\n    const init = {\n      method: 'GET',\n      headers: { Accept: responseType === 'bytes' ? 'image/*,*/*' : 'application/json' },\n      credentials: 'omit', // 不携带任何凭据，避免向数据源泄漏身份\n      cache: 'no-store',\n    };\n    if (controller) init.signal = controller.signal;\n\n    const res = await fetchFn(url, init);\n    const status = typeof res.status === 'number' ? res.status : 0;\n\n    if (status < 200 || status >= 300) {\n      return {\n        ok: false,\n        latencyMs: Date.now() - t0,\n        httpStatus: status,\n        bytes: null,\n        contentType: _contentType(res),\n        error: makeError('HTTP', 'raw', { httpStatus: status }),\n      };\n    }\n\n    if (responseType === 'bytes') {\n      const buf = await res.arrayBuffer();\n      return {\n        ok: true,\n        data: buf,\n        latencyMs: Date.now() - t0,\n        httpStatus: status,\n        bytes: buf && typeof buf.byteLength === 'number' ? buf.byteLength : null,\n        contentType: _contentType(res),\n      };\n    }\n\n    const text = await res.text();\n    if (!text || text.trim() === '') {\n      return {\n        ok: false,\n        latencyMs: Date.now() - t0,\n        httpStatus: status,\n        bytes: 0,\n        contentType: _contentType(res),\n        error: makeError('EMPTY', 'raw', { httpStatus: status }),\n      };\n    }\n    let json = null;\n    try {\n      json = JSON.parse(text);\n    } catch (err) {\n      return {\n        ok: false,\n        latencyMs: Date.now() - t0,\n        httpStatus: status,\n        bytes: _textBytes(text),\n        contentType: _contentType(res),\n        error: makeError('PARSE', 'raw', { httpStatus: status }),\n      };\n    }\n    return {\n      ok: true,\n      json,\n      latencyMs: Date.now() - t0,\n      httpStatus: status,\n      bytes: _textBytes(text),\n      contentType: _contentType(res),\n    };\n  } catch (err) {\n    const name = err && err.name ? err.name : '';\n    const code = abortedByTimeout || name === 'AbortError' ? 'TIMEOUT' : 'NETWORK';\n    return {\n      ok: false,\n      latencyMs: Date.now() - t0,\n      httpStatus: null,\n      bytes: null,\n      contentType: null,\n      error: makeError(code, 'raw', { params: { timeoutMs } }),\n    };\n  } finally {\n    if (timer) clearTimeout(timer);\n  }\n}\n\n/**\n * 执行「尝试 + 重试」循环（不含缓存与离线判定）。\n *\n * @param {string} url 最终 URL。\n * @param {number} timeoutMs 单次超时。\n * @param {number} retry 重试次数（0 = 不重试）。\n * @param {'json'|'bytes'} responseType 响应类型。\n * @param {string} sourceId 源 id（用于错误信息）。\n * @returns {Promise<{ok:boolean, json?:*, data?:ArrayBuffer, attempts:number, latencyMs:number,\n *            httpStatus:number|null, bytes:number|null, contentType:string|null, error?:Object}>} 结果。\n */\nasync function _tryWithRetry(url, timeoutMs, retry, responseType, sourceId) {\n  const maxAttempts = (Number.isFinite(Number(retry)) ? Number(retry) : 0) + 1;\n  let attempts = 0;\n  let last = null;\n\n  for (let i = 0; i < maxAttempts; i += 1) {\n    attempts += 1;\n    last = await _attempt(url, timeoutMs, responseType);\n    if (last.ok) break;\n    // 覆写 error.sourceId（_attempt 阶段尚不知具体源）\n    last.error.sourceId = sourceId;\n    if (!last.error.retriable) break;\n    log('retry', sourceId, 'attempt=' + attempts, last.error.code);\n  }\n\n  if (last && last.error) last.error.sourceId = sourceId;\n  return { ...last, attempts };\n}\n\n/* ------------------------------------------------------------------ */\n/* 对外主入口                                                           */\n/* ------------------------------------------------------------------ */\n\n/**\n * 按源 id 发起请求（走缓存三态 + 离线短路 + 串行队列 + 重试 + 解析）。\n *\n * @param {string} sourceId 源 id。\n * @param {Object} ctx 上下文（至少含 lat/lon；geocode 需 keyword）。\n * @param {{force?:boolean}} [opts] force=true 跳过缓存与离线短路（仅自检页使用）。\n * @returns {Promise<{ok:boolean, sourceId:string, data:*, error:Object|null, meta:Object, stale:boolean}>} SourceResult。\n */\nexport async function request(s
