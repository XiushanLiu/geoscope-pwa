<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="" data-i18n-attr="content" data-i18n-key="desc.selfcheck" />
  <title data-i18n="sc.title">数据源自检</title>

  <meta name="theme-color" content="#1E9C8C" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="地候" data-i18n-attr="content" data-i18n-key="app.shortName" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='96'%20fill='%231E9C8C'/%3E%3Ccircle%20cx='256'%20cy='256'%20r='120'%20fill='none'%20stroke='%23ffffff'%20stroke-width='24'/%3E%3Cpath%20d='M256%2096v320M96%20256h320'%20stroke='%23ffffff'%20stroke-width='16'%20opacity='.85'/%3E%3C/svg%3E" />
  <style>
/**
 * 设计令牌（Design Tokens）
 *
 * 职责：集中定义「地候 GeoScope」的视觉基线 —— 品牌色、屏渐变、文本层级、8pt 栅格、
 * 字号阶梯、圆角、阴影、玻璃材质。深浅双主题在此成对定义，业务样式一律只引用变量，
 * 不允许在 app.css 里再写死颜色。
 *
 * 命名：'--c-*' 颜色 / '--sp-*' 间距 / '--fs-*' 字号 / '--r-*' 圆角 / '--sh-*' 阴影。
 * 字体：只允许 font-family 声明，禁止任何字体外链（隐私红线：不向字体 CDN 发请求）。
 */

:root {
  /* ---------- 品牌 ---------- */
  --c-brand: #1e9c8c;          /* 晨曦青（亮态） */
  --c-brand-dark: #2bb6a3;     /* 晨曦青（暗态） */
  /* 实心填充专用：--c-brand 压白字只有 3.39:1（深浅同值，见 contrast-audit），撑不住
     「实心底 + 白字」的场景。--c-brand 本身不动（它还承担描边、图标、8% 浅填充），
     实心按钮/当前 Tab 一律改用这个更深的变体：白字实测 4.94:1。 */
  --c-brand-solid: #167e70;
  --c-hot: #e08a3c;            /* 温度高 */
  --c-cold: #4a93b8;           /* 温度低 */
  --c-alert: #c9584b;          /* 告警红 */
  --c-ok: var(--c-brand);
  --c-warn: #e0a13c;

  /* ---------- 字体 ---------- */
  --ff-sans: 'Noto Sans SC', 'Geist', system-ui, -apple-system, 'Segoe UI', 'PingFang SC',
    'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  --ff-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;

  /* ---------- 字号阶梯 ---------- */
  /* ★无障碍字号三档（v15）★
     全站字号的**唯一放大开关**就是 --fs-scale，八个 --fs-* 一律写成
     `calc(<基准 px> × 乘数)`，基准 px 原值留在行末注释里备查。

     为什么是「乘数」而不是改 `html { font-size }`：Web 上最常见的那套做法（根字号 +
     rem）在本仓库**完全无效** —— styles/app.css 的 72 处 font-size 里 69 处是
     `var(--fs-*)`，全是裸 px，全站零 rem，`html` / `:root` / `body` 也都没设过
     font-size（跟着浏览器默认 16px）。改根字号对这 69 处一个都不生效，改了等于没改。

     默认 1：**默认档下每个 --fs-* 的计算值必须与加这份开关前一模一样**，一个像素都不许变。
     档位选择器见本文件末尾「无障碍字号档位」一节。 */
  --fs-scale: 1;

  /* 英雄温度（--fs-hero / --fs-hero-sm）走**单独一个乘数**，且默认恒为 1。
     理由：56px 已经是正文（14px）的 4 倍，再按 1.3 放大到 72.8px 时，「−12」这串等宽
     数字按 0.6em 估宽约 131px，加上 °C 单位与卡内边距，在 320px 窄屏上会把右侧那列
     天气描述挤到不足 80px —— 放大「已经够大的字」换来的可读性本来就比正文小，
     所以英雄区放得比正文慢。1.1 / 1.15 这两个取值是 tools/check.mjs 第 13 节按
     320px 视口机器算出来的，实测三档（温度 0.6em×3 字 + 单位 1.1em + gap 16px +
     描述列下限 2.25em）：
        默认   hero 56.0px → 共需 176.8px / 卡内容宽 248px → 余量 71.2px
        large  hero 61.6px → 共需 195.6px / 卡内容宽 248px → 余量 52.4px
        xlarge hero 64.4px → 共需 209.3px / 卡内容宽 248px → 余量 38.7px
     xlarge 下描述列实得 248 − 115.9 − 30.6 − 16 = 85.5px，仍高于「☀ 晴」那一行的
     下限 46.8px。
     ⚠️ 将来新增放大档时必须**显式**给 --fs-hero-scale 一个更小的值；忘了给的档位
     英雄区不放大（宁可不长，也不要撑破布局）。第 13 节会断言每个档位块都定义了它。 */
  --fs-hero-scale: 1;

  --fs-xs: calc(11px * var(--fs-scale));
  --fs-sm: calc(12px * var(--fs-scale));
  --fs-md: calc(14px * var(--fs-scale));
  --fs-lg: calc(16px * var(--fs-scale));
  --fs-xl: calc(20px * var(--fs-scale));
  --fs-2xl: calc(26px * var(--fs-scale));
  --fs-hero: calc(56px * var(--fs-hero-scale));   /* 此刻温度（基准 56px） */
  --fs-hero-sm: calc(40px * var(--fs-hero-scale)); /* 窄屏英雄温度（基准 40px） */

  /* ---------- 8pt 栅格 ---------- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ---------- 圆角 ---------- */
  --r-card: 20px;    /* 卡片 18–20 */
  --r-card-sm: 18px;
  --r-pill: 36px;    /* 胶囊 */
  --r-chip: 12px;

  /* ---------- 触达 ---------- */
  --touch-min: 44px;

  /* ---------- 玻璃材质 ---------- */
  --glass-fill: rgba(255, 255, 255, 0.07);
  --glass-stroke: rgba(255, 255, 255, 0.1);

  /* ---------- 深色屏（默认） ---------- */
  --c-screen-a: #0a0f17;
  --c-screen-b: #0f262e;
  --c-text-1: #ffffff;   /* 标题 */
  --c-text-2: #e6edf0;   /* 正文 */
  /* 次要。⚠️ 4.41 / 3.51 是**旧值 #8a9aa3 的历史数字**（深·卡片表面最差端 / 浅·纯白卡），
     已在 v13 被下面这个压深过的值取代；现值 #a5b3bb 实测 5.95 / 5.36，两档都过 AA。
     之所以把旧数字留在这里：它是「为什么必须压深」的唯一依据，删了下一个人会改回去。
     之所以加这句警告：已经有人扫到这两个数就当成当前结论报了一次 —— 别再误读。 */
  --c-text-3: #a5b3bb;
  --c-card-fill: rgba(255, 255, 255, 0.07);
  --c-card-stroke: rgba(255, 255, 255, 0.1);
  --c-divider: rgba(255, 255, 255, 0.08);

  --sh-card: 0 8px 28px rgba(0, 0, 0, 0.32);
  --sh-pill: 0 6px 20px rgba(0, 0, 0, 0.36);

  color-scheme: dark light;
}

/* ---------- 无障碍字号档位 ---------- */
/* 三档**只改乘数**：不动任何色值、不动 --sp-* 间距、也不动默认档 —— 默认档就是
   「`<html>` 上没有 data-fs、上面那两个乘数保持原值」这条路径。两档放大幅度取：
     · 1.15 —— 常见的「大」档，正文 14 → 16.1px，不触发任何布局重排；
     · 1.30 —— 常见的「特大」档，正文 14 → 18.2px，接近 WCAG 建议的 200% 放大上限。
   `<html data-fs>` 由 src/ui/theme.js 的 applyFontScale() 在**四个入口的模块顶层**写入
   （与 data-theme 同一时机、同一手法），并由每个 HTML `<head>` 里的同步脚本在首帧之前
   预置一次，避免「先按默认字号画一帧、再跳到放大档」。
   布局安全性（line-height: 1 的那几处、固定高度容器、英雄区宽度）由 tools/check.mjs
   第 13 节机器核算，改这里的数字必须重跑那一节。 */
:root[data-fs='large'] {
  --fs-scale: 1.15;
  --fs-hero-scale: 1.1;
}
:root[data-fs='xlarge'] {
  --fs-scale: 1.3;
  --fs-hero-scale: 1.15;
}

/* ---------- 浅色屏 ---------- */
:root[data-theme='light'],
body[data-theme='light'] {
  --c-screen-a: #f7fafa;
  --c-screen-b: #e3eff2;
  --c-text-1: #0f181d;   /* 标题 */
  /* ⚠️ 4.72 / 2.99 是**旧值** #5a6b74 + #7c8b94 的历史数字，下面两个是压深后的现值。
     正文 / 次要：旧值在浅色屏渐变暗端（#e3eff2）只有 4.72 / 2.99，
     且两档之间塞不进「第三级」—— 见 §9 v13 的死结推导。压深两档后：
     屏暗端 7.44 / 4.57、纯白卡 8.74 / 5.37，三档梯度 2.057 / 1.628（更均匀）。
     次要色特意多压一档（#5e6e77 → #5d6d76）：前者在屏暗端实测 4.504，只高出 4.5
     线 0.004，是全清单唯一贴线项，将来任何微调（哪怕只动一下屏渐变）都会把它挤下
     线。多压一档换 0.073 余量，代价只是梯度少 0.025 —— 划算。 */
  --c-text-2: #3f4d55;   /* 正文 */
  --c-text-3: #5d6d76;   /* 次要 */
  --c-card-fill: #ffffff;
  --c-card-stroke: rgba(15, 24, 29, 0.09);
  --c-divider: rgba(15, 24, 29, 0.08);

  /* 状态色解耦后的浅色值（见文末注释：字面色必须在两个浅色块里各写一遍） */
  --c-state-offline: #7c8b94;
  --c-state-idle: #7c8b94;

  --glass-fill: #ffffff;
  --glass-stroke: rgba(15, 24, 29, 0.09);

  --sh-card: 0 6px 20px rgba(15, 24, 29, 0.08);
  --sh-pill: 0 4px 16px rgba(15, 24, 29, 0.12);
}

/* 系统浅色偏好时同步切换（可在设置里被 data-theme 覆盖） */
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --c-screen-a: #f7fafa;
    --c-screen-b: #e3eff2;
    --c-text-1: #0f181d;
    --c-text-2: #3f4d55;   /* 与上面 [data-theme='light'] 块同值，改一处必须改两处 */
    --c-text-3: #5d6d76;
    --c-card-fill: #ffffff;
    --c-card-stroke: rgba(15, 24, 29, 0.09);
    --c-divider: rgba(15, 24, 29, 0.08);
    /* 状态色解耦后的浅色值（字面色必须在两个浅色块里各写一遍，漏一处只在一半路径生效） */
    --c-state-offline: #7c8b94;
    --c-state-idle: #7c8b94;
    --glass-fill: #ffffff;
    --glass-stroke: rgba(15, 24, 29, 0.09);
    --sh-card: 0 6px 20px rgba(15, 24, 29, 0.08);
    --sh-pill: 0 4px 16px rgba(15, 24, 29, 0.12);
  }
}

/* ---------- 状态色 ---------- */
/* offline / idle 原先是 `var(--c-text-3)` 的别名 —— 状态色复用文字层级色是偷懒：
   chip 的填充会跟着「次要文字」的调整一起动，而这两件事的诉求完全不同
   （文字要的是**与底色的对比度**，chip 填充要的是**与基础 chip 底的区分度**）。
   v14 起写死为字面色值，chip 填充从此脱离 --c-text-3 独立演化。
   数值取解耦那一刻的实际取值（深色 #8a9aa3 / 浅色 #7c8b94），画面零变化。
   注意：因为是字面色，浅色值必须在下面两个浅色块里各写一遍
   （[data-theme='light'] 与 prefers-color-scheme 媒体块），漏一处就只在半条路径上生效。 */
:root {
  --c-state-ok: var(--c-brand);
  --c-state-stale: var(--c-warn);
  --c-state-failed: var(--c-alert);
  --c-state-offline: #8a9aa3;
  --c-state-idle: #8a9aa3;
}

/**
 * 全局与组件样式
 *
 * 职责：把 tokens.css 的令牌落成真实组件 —— 屏渐变背景、玻璃卡、胶囊 Tab、状态徽标、
 * 溯源气泡、降级横幅、自检页表格与分段控件。所有颜色/间距/圆角均取自 CSS 变量。
 *
 * 约束：
 *   - 交互元素最小 44×44（--touch-min）；
 *   - 手机 390 宽为基准，容器最大 640 居中；
 *   - 无任何外链资源（字体/图标/背景图一律不用 URL）。
 */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: var(--ff-sans);
  font-size: var(--fs-md);
  color: var(--c-text-2);
  background:
    radial-gradient(120% 80% at 50% 0%, var(--c-screen-b) 0%, var(--c-screen-a) 62%) fixed,
    var(--c-screen-a);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* 底部 Tab 高度 + 安全区 */
  padding-bottom: calc(var(--sp-12) + var(--sp-6) + env(safe-area-inset-bottom, 0px));
}

/* 对比页没有底部 tabbar：body 那条「给 tab 留位」的下内边距要撤掉，否则页面
   底部会白留一大块空地（那块地的高度正好是一个 tabbar + 安全区）。
   只新增这一条 padding 覆盖，不动 --sp-* 的定义值、也不动其它页面。 */
body[data-page="compare"] {
  padding-bottom: var(--sp-6);
}

/* 数字与拉丁走 Geist，等宽数字走 Geist Mono（缺失时回退系统字体，不外链） */
.num { font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }

/* ---------------- 布局容器 ---------------- */

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-4) var(--sp-6);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.skeleton-note {
  color: var(--c-text-3);
  font-size: var(--fs-sm);
  padding: var(--sp-6) 0;
  text-align: center;
}

/* ---------------- 顶部标题 ---------------- */

/* 页头 = 左列（标题 + 坐标，可换行）+ 右列（来源说明，可换行）。
   这一排的历史与「为什么右列绝不能 nowrap」写在 .hd-time 上方，**改前必读**。 */
.hd {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-1) var(--sp-1);
}

.hd-place {
  font-size: var(--fs-lg);
  color: var(--c-text-1);
  font-weight: 600;
  margin: 0;
  line-height: 1.3;
  /* 中文无空格 → 浏览器默认不在此换行；给了它，标题在极窄情形下才有一个「兜底断点」，
     不至于把整行硬撑出去。正常宽度下永远不会触发（见 .hd-time 的宽度上限推导）。 */
  overflow-wrap: anywhere;
}

.hd-coord {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  margin: var(--sp-1) 0 0;
}

/* ★右列（观测时刻 / 来源说明）—— 这一条是真机 bug 的定案，改动前请读完。
   ── 真机 bug（320px CSS 视口 + 「特大」档）：页头标题「方位 · 磁偏角」折成两行。
   ── 根因（Chromium 实测，非纸面推演）：
      ① 这里原本是 `white-space: nowrap` —— 右列文案「本机计算：WMM2025 地磁模型，不联网」
         被钉成**一行不可断**，flex 里它的收缩下限就是整行文案宽（`--fs-xs` 下实测
         197.41 / 227.03 / 256.64px @默认 / large / xlarge）；
      ② 右列原本既无 `max-width` 也无 `min-width: 0`，这个下限无人约束；
      ③ 于是留给左列的**算术余量**只剩 280 − 12(gap) − 右列 = 70.59 / 40.97 / 11.36px。
         左列 `.hd-place` 是 flex item，`flex-basis: auto` 的**自动最小尺寸**是它自己的
         min-content，压不到那么窄：
         ★ 实测**推翻**了早先注释里「min-content ≈ 2 个汉字（2 × font-size）」的判词 ——
           游离探针实测中文标题 min-content = **1.00em**（就是 1 个汉字：默认档 16px、
           large 18.41px、xlarge 20.81px），因为汉字之间本来就有断行点，不需要 `anywhere`。
         ⇒ 左列实得 = max(余量, 自己的 min-content) = **70.59 / 40.97 / 20.81px**，
           而标题单行需要 103.27 / 118.77 / 134.25px → 断成 **2 / 3 / 6 行**。
      ⚠️ 上面这组「左列实得宽」是**标题单独在左列里**（坐标行 `.hd-coord` 尚未解析出真实
         坐标）时测的 —— 这是标题最坏、且**只由 CSS + 固定文案决定**（不随用户坐标漂移）
         的一档，可复现。坐标一旦显示出来，左列反而会被那个坐标串的最长不可断词
         顶开（`40.1712°N, 116.3112°E` @xlarge 会顶到 78.63px；换成 `1.2345°N, 6.7890°E`
         又变成 70.77px）—— **同一份 CSS 换一串坐标换一个数**，所以那种口径不适合写进注释。
         （余量 < 下限时 flex 行装不下，`.hd` 溢出 0 / 25 / 63px，即下文缺陷 2。）
   ── 定案（两条，各管一件事）：
      1. 去掉 `white-space: nowrap` + 给 `overflow-wrap: anywhere`：右列**允许换行**，
         它的 min-content 不再等于整行文案宽，交给 flex 正常收缩；
      2. `max-width: 45%` + `min-width: 0`：把「右列最多占页头约 45%」写成硬约束。
         ⚠️ 百分比按包含块的 **content box** 解析（CSS 2.1 §10.4），解析基数**不是**
         `.hd` 的 padding box(288px) 而是它的 **content box(280px)** —— Chromium 实测
         45% → 126px = 280 × 0.45，而不是 288 × 0.45（= 129.6px，对不上）。
         换言之上限是一个**与文案长度解耦的常数**，右列再长也超不过 126px。
   ── 定案后实测（320px，Chromium + DPR 2.75，`getClientRects()` 数标题行数）：
      右列恒为 126px（三档不变）；左列**实得** 103.27 / 142 / 142px（默认 / large / xlarge，
      后两档正好贴着上限 142 = 280 − 12 − 126），而标题单行**所需** 103.27 / 118.77 /
      134.25px —— **三档全部单行**。
      ⚠️ 别把这两个数列混为一谈：早先这里写的「左列 103.27 / 118.77 / 134.25」其实是
         **标题所需宽**，不是左列实得宽（左列实得是 103.27 / 142 / 142）。
      `.hd` 的 scrollWidth 从 293px 回落到 288px（= clientWidth），页头自身不再溢出；
      `document.scrollingElement.scrollWidth − clientWidth` 三档均为 0。
   ── 「右列文案再变长也不影响横向」这一条是**实测确认**的，不是推论。在「左列只有标题」
      的确定性状态下（去掉 `.hd-coord` 排除坐标干扰）把 `compass.subtitle` 依次拉长：
         文案长度 21 → 34(1.6×) → 84(4×)
         右列实得   126 → 126 → 126px          ← 横向一分不动
         左列实得 103.27 → 103.27 → 103.27px   ← 标题恒为 1 行
         唯一变化是右列行数 2 → 3 → 8 行、`.hd` 溢出恒为 0。
      反向才有效：文案缩短到 `--`(2 字符) 时右列自然宽掉到 7.64px —— 说明 126 确实是
      上限撑出来的，不是凑巧。
   ── 为什么不改成 `flex-basis`：`.hd-time` 的真实宽度是**收缩后的结果**，用 `flex-basis: auto`
      更省事；关键是给 min-content 一个可断点 + 一个上限，而不是去猜一个固定占比。
   ── 与字号档位的关系：三档只改 `--fs-*` 乘数，`max-width: 45%` 与 `overflow-wrap: anywhere`
      都是相对值 / 布尔值，**不随字号放大而失效**；但**也是因此，左列可得上限 142px 不随
      字号放大**，而标题所需宽度跟着放大 —— 压力全落在最大档（xlarge 余量只剩 7.75px）。
      宽度够不够由 `tools/check.mjs` 第 16 节按 i18n 真实文案机器核算，不再靠纸面估算。
   ── 英文标题 `Bearing · Magnetic declination` 在 320px 下**放不下**（实测断成 3 行，
      第 16 节三档全红）。这是**已知未修的产品决策**（改文案 / 省略号 / 标题独占一行），
      本轮的修复只针对中文标题 —— 不要为了解决英文而动这四条声明。
   ── ⚠️ 不要为了「让右列回到一行」把 nowrap 加回来：那正是本次真机 bug 的根因。
      右列文案本来就是给「扫一眼」的补充说明，换行可接受；页头标题折行不可接受。 */
.hd-time {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  text-align: right;
  overflow-wrap: anywhere;
  min-width: 0;
  max-width: 45%;
}

/* 收藏按钮：两态的**配色**复用既有 .btn（未收藏）与 .btn--primary（已收藏），
   这两条规则的底色/文字组合已经过 tools/contrast-audit.mjs；这里只补排版，
   不新增任何 color: 声明 —— 新增色值等于新增一笔要审计的债。 */
.hd-fav {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
  flex-wrap: wrap;
}

.hd-fav .btn {
  min-height: 36px;
  min-width: 0;
  padding: 0 var(--sp-3);
  font-size: var(--fs-sm);
}

.hd-hint {
  font-size: var(--fs-xs);
}

/* ---------------- 地点搜索（此刻页） ---------------- */
/* 入口是一颗放大镜按钮，点开才内联展开面板 —— 标题那一排已经有地名 / 坐标 / 观测时刻 /
   收藏按钮，把输入框常驻进去会挤到断行。
   配色全部复用既有 token，不新增任何色值：每一条 `color:` 都会自动进入
   tools/contrast-audit.mjs 的全量扫描（深浅两套主题、门槛 4.5:1），新色值等于新债。 */

.hd-place-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* 不写 color：继承 .btn 的 --c-text-1（已过审计）；这里只把它压成一颗图标按钮的尺寸 */
.hd-search-btn {
  min-height: 36px;
  min-width: 36px;
  padding: 0 var(--sp-2);
  font-size: var(--fs-md);
  line-height: 1;
}

.search-panel {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
}

.search-field {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.search-input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--touch-min);
  padding: 0 var(--sp-3);
  border-radius: var(--r-chip);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-family: inherit;
  font-size: var(--fs-md);
}

.search-status {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

.search-list {
  display: flex;
  flex-direction: column;
}

/* 结果项：主行地名，次行 `admin1 · country`（同名多地全靠次行分开） */
.search-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--sp-2) 0;
  border: none;
  border-top: 1px solid var(--c-divider);
  /* 用 --c-card-fill 而不是 transparent / none：按钮的 UA 底色（buttonface）要盖掉，
     而 contrast-audit 的取色器不认 `none` / `transparent` 这两个关键字（会直接抛错）。
     与面板同色，视觉上就是一条分隔线下的纯文字行。 */
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.search-item:first-child {
  border-top: none;
}

.search-item-name {
  font-size: var(--fs-md);
  color: var(--c-text-1);
}

.search-item-sub {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

/* ---------------- 收藏列表（我的页） ---------------- */

.fav-list {
  display: flex;
  flex-direction: column;
  margin: var(--sp-2) 0 0;
}

.fav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-top: 1px solid var(--c-divider);
}

.fav-item:first-child { border-top: none; }

.fav-link {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1 1 auto;
  min-width: 0;
  text-decoration: none;
  color: var(--c-text-2);
}

.fav-name {
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--c-text-1);
}

.fav-coord {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.fav-item .btn {
  min-height: 36px;
  min-width: 0;
  padding: 0 var(--sp-3);
  font-size: var(--fs-sm);
  flex: 0 0 auto;
}

/* ---------------- 卡片 ---------------- */

.card {
  background: var(--c-card-fill);
  border: 1px solid var(--c-card-stroke);
  border-radius: var(--r-card);
  box-shadow: var(--sh-card);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.card--hero {
  padding: var(--sp-5);
  gap: var(--sp-3);
}

.card-title {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  margin: 0;
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* 今日逐时曲线：温度折线 + 降水概率柱（阶段二） */
.card--hourly {
  gap: var(--sp-1);
}

.hourly-svg {
  display: block;
  width: 100%;
  height: 104px; /* 与 now.js 的 viewBox 高度同口径；高度固定才能保证拉伸比例稳定 */
  /* 竖向滑动仍交给页面滚动，横向按下拖动归图表 */
  touch-action: pan-y;
}

.hourly-line {
  fill: none;
  stroke: var(--c-brand-dark);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  /* preserveAspectRatio="none" 会把图形横向拉伸，描边必须声明为非缩放，否则线宽跟着变形 */
  vector-effect: non-scaling-stroke;
}

.hourly-area {
  fill: url(#hourlyFill);
  stroke: none;
}

.hourly-fill-top {
  stop-color: var(--c-brand);
  stop-opacity: 0.28;
}

.hourly-fill-bottom {
  stop-color: var(--c-brand);
  stop-opacity: 0;
}

.hourly-bar {
  fill: var(--c-cold);
  opacity: 0.5;
}

.hourly-hl-line {
  stroke: var(--c-text-3);
  stroke-width: 1;
  stroke-dasharray: 3 3;
  vector-effect: non-scaling-stroke;
  opacity: 0.8;
}

.hourly-hl-dot {
  fill: var(--c-brand-solid);
  stroke: var(--c-card-fill);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

.hourly-hit {
  fill: transparent;
}

.hourly-tip {
  margin: 0;
  font-size: var(--fs-md);
  color: var(--c-text-1);
  font-variant-numeric: tabular-nums;
}

.hourly-axis {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  font-variant-numeric: tabular-nums;
}

.hourly-hint,
.hourly-empty {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.card--row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}

/* 卡内操作行（目前只有「生成海报」）：右对齐，与上方数值网格拉开一点间距。
   只写布局与背景，不写 color（文字色沿用 .btn 的 --c-text-1，已过对比度审计）。 */
.card-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
}

/* 天气英雄区 */
.hero {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
}

.hero-temp {
  font-family: var(--ff-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-hero);
  line-height: 1;
  color: var(--c-text-1);
  font-weight: 500;
}

.hero-temp .unit {
  font-size: var(--fs-xl);
  color: var(--c-text-3);
  margin-left: 2px;
}

.hero-desc {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.hero-wmo {
  font-size: var(--fs-lg);
  color: var(--c-text-1);
  font-weight: 500;
}

.hero-sub {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

/* 键值网格 */
.kv {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-2) var(--sp-3);
}

.kv-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.kv-k {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.kv-v {
  font-family: var(--ff-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-md);
  color: var(--c-text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 冷热色同样不作文字色（与上面 .kv-v--alert 同一条规矩：数据色只走填充与边框）。
   旧写法 --c-hot 浅色 2.67:1、--c-cold 深浅双破 3.75/3.41，均低于 4.5:1。
   文字统一 --c-text-1（深色 12.80:1 / 浅色 17.97:1），冷热语义改由**值下方那条
   2px 色线**承载 —— 区分度不丢，且不靠文字颜色差。
   注：本条当前同样无调用方（_kv() 的 mod 参数全项目无人传），改它不影响任何画面；
   将来若接上，请沿用「色线/底纹承载语义」这条路，不要改回彩色文字。 */
.kv-v--hot { color: var(--c-text-1); border-bottom: 2px solid var(--c-hot); }
.kv-v--cold { color: var(--c-text-1); border-bottom: 2px solid var(--c-cold); }
/* 告警红不作文字色，只作底纹与边框：红字压深底实测仅 3.04:1（浅色 4.22:1），
   双双低于 WCAG 4.5:1 小字门槛 —— 越需要被看见的颜色越看不清，传达效果是负的。
   改走 --c-text-1（随主题翻转）后：深色 12.80:1 / 浅色 17.97:1。
   注：本条当前无调用方（_kv() 从未传过 'alert'），改它不影响任何画面；
   将来若接上，告警语义请用红色底纹承载，不要改回红字。 */
.kv-v--alert { color: var(--c-text-1); }

/* 气候常态月度表（4 列：月份 / 平均最高 / 平均最低 / 月降水）
   —— 使用者：src/ui/now.js 的 _climateTable()（气候常态卡，「此刻」页）。
   ★只有布局与字号：颜色一律继承 .card / 父级，不新增任何 color 声明
     （tools/contrast-audit.mjs v2 全量扫 app.css 的 color 声明，加一条就要重新达标）。 */
.clim {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--sp-1) var(--sp-2);
  font-size: var(--fs-sm);
}

/* 表头：比数值小一号，与 .kv-k / .kv-v 的主次关系一致 */
.clim-h {
  font-size: var(--fs-xs);
}

/* 数值列：等宽 + 等宽数字，12 行上下对齐才读得出「哪个月更高」 */
.clim-c {
  font-family: var(--ff-mono);
  font-variant-numeric: tabular-nums;
}

/* ---------------- 徽标 / 胶囊 ---------------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  min-height: 24px;
  padding: 2px var(--sp-2);
  border-radius: var(--r-chip);
  background: var(--c-card-stroke);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
  white-space: nowrap;
}

/* 状态色只做填充与徽点，**不做文字色**。
   旧写法把状态色同时当文字色，实测（基底口径：chip 坐在**卡片表面**上，不是直接叠在屏渐变上）
   全部低于 WCAG 4.5:1 小字门槛 —— ok 2.82/2.65、stale 3.86/1.90、degraded 3.86/1.90、
   offline 3.14/2.79、failed 2.50/3.18（深色/浅色）。
   文字统一改 --c-text-1（随主题翻转）后最低 7.06:1（.chip--idle），且不新增 token、
   不需要按主题分别取值。
   注：v14 起 --c-state-offline / --c-state-idle 已不再复用 --c-text-3（改写字面色值），
   chip 填充从此不随文字层级调整而变 —— 这两个数值是解耦后的稳定值。
   告警语义不丢：填充仍是 22% 状态色，此刻屏的 chip 内还有一颗同色徽点。 */
.chip--ok { background: color-mix(in srgb, var(--c-state-ok) 22%, transparent); color: var(--c-text-1); }
.chip--stale { background: color-mix(in srgb, var(--c-state-stale) 22%, transparent); color: var(--c-text-1); }
/* 告警红不作文字色，只留在填充上：红字压 22% 红纹实测仅 2.50:1（浅色 3.18:1），
   远低于 4.5:1。文字改走 --c-text-1 后：深色 10.55:1 / 浅色 13.57:1。
   告警语义不丢 —— 填充仍是 22% 告警红，chip 内还有一颗 --c-state-failed 的徽点。 */
.chip--failed { background: color-mix(in srgb, var(--c-state-failed) 22%, transparent); color: var(--c-text-1); }
.chip--offline { background: color-mix(in srgb, var(--c-state-offline) 22%, transparent); color: var(--c-text-1); }
.chip--degraded { background: color-mix(in srgb, var(--c-warn) 22%, transparent); color: var(--c-text-1); }

/* .chip--idle：**先补信号，再改文字色**（顺序不能反，反过来会把语义抹掉）。
   旧状态的病根：填充 --c-card-stroke 与基础 .chip 的底色完全同色（实测两底只差 1.03:1、
   通道差 3，肉眼分不开），而自检页渲染 chip 时根本不插徽点 —— 于是文字色是它唯一的语义信号。
   第一步补信号：填充换成 38% 的 --c-state-idle（**v14 起是字面色值，不再复用 --c-text-3**），
   与基础 chip 底拉开到 1.33:1（通道差 19，浅色 Δ28），视觉上分得开。
   第二步才改文字：--c-text-1，实测深色 7.06:1 / 浅色 11.88:1（旧值 3.23:1 / 2.92:1）。
   不补 .badge--idle：自检页那四处根本不插徽点，补了是死规则。
   基础 .chip 没有 border，所以不涉及「边框同步加深」。 */
.chip--idle { background: color-mix(in srgb, var(--c-state-idle) 38%, transparent); color: var(--c-text-1); }

.badge {
  display: inline-block;
  min-width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--c-state-idle);
}
.badge--ok { background: var(--c-state-ok); }
.badge--stale { background: var(--c-state-stale); }
.badge--failed { background: var(--c-state-failed); }
.badge--offline { background: var(--c-state-offline); }
.badge--degraded { background: var(--c-state-stale); }

/* ---------------- 降级横幅 ---------------- */

.banner {
  max-width: 640px;
  margin: var(--sp-3) auto 0;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-2);
  font-size: var(--fs-sm);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.banner--stale { border-color: color-mix(in srgb, var(--c-warn) 40%, transparent); }
.banner--offline { border-color: color-mix(in srgb, var(--c-text-3) 40%, transparent); }
.banner--failed { border-color: color-mix(in srgb, var(--c-alert) 45%, transparent); }
.banner--no-map { border-color: color-mix(in srgb, var(--c-text-3) 30%, transparent); }

/* grid：底图半残（部分瓦片没取到，已降为网格）——琥珀色，与徽点 --c-state-stale 同源。
   不能只描一圈边框：底色也要带一点琥珀，否则和「数据源失败」的 partial 撞脸。
   填充比例压得很低（14%），是为了不抢五张数据卡的视觉权重 —— 底图只是少了瓦片。 */
.banner--grid {
  border-color: color-mix(in srgb, var(--c-warn) 55%, transparent);
  background: color-mix(in srgb, var(--c-warn) 14%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* partial：非关键 API 源失败（数据本身缺一块）。
   比 grid 轻（填充 7%）、比基础横幅强（正文升到 --c-text-1），边框偏中性带一点琥珀：
   它说的是「数据不全」，不是「底图不全」，不该和 grid 用同一个色阶。 */
.banner--partial {
  border-color: color-mix(in srgb, var(--c-warn) 28%, var(--c-card-stroke));
  background: color-mix(in srgb, var(--c-warn) 7%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* empty：关键源全部彻底失败且无缓存 —— 一个数据都没有，是最重的一档。
   红系告警色 --c-alert（#c9584b，深浅同值），填充 20% 压过 grid 的 14% 与 partial 的 7%。
   文字一律用 --c-text-1：它本身随主题翻转（深色 #fff / 浅色 #0f181d），
   告警红只做低透明度底纹，绝不当文字色 —— 否则深色屏下红字压深底会掉到 4.5:1 以下。
   实测对比度：深色屏最差 10.76:1、浅色屏 13.93:1（fill 20%，叠在屏渐变两端各算一次）。 */
.banner--empty {
  border-color: color-mix(in srgb, var(--c-alert) 60%, transparent);
  background: color-mix(in srgb, var(--c-alert) 20%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* 开发者署名：英文的「+」是上标，字号取 --fs-sm（与正文同档、比浏览器默认 sup 的 0.83em 更大），
   用 token 而不是裸 px / em —— 后者切字号档时不会跟着放大（check.mjs 会报红） */

/* ---------------- 底部胶囊 Tab ---------------- */

.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--sp-3) + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: var(--sp-1);
  padding: var(--sp-1);
  border-radius: var(--r-pill);
  border: 1px solid var(--glass-stroke);
  background: var(--glass-fill);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--sh-pill);
  z-index: 20;
}

/* 四个 Tab 一行排布。下面是这一组属性被反复改动的历史与最终定案，**改前请读**。
   ── 真机截图暴露的 bug：四个 tab 文字全断成两行（「此/刻」「自/检」「方/位」「我/的」）。
      引入于 a0dde93（加第 4 个 tab 时把 `.tab` 从 `min-width: 88px` 改成 `flex: 1 1 0`
      + `min-width: 64px`）。当时的纸面推算是「4×68 + 3×4 + 2×4 = 294px < 320px，不溢出」
      —— 算错了，而且**算的不是换行这件事**。

   ── 根因：`.tabbar` 是 `position: fixed` 且**没有设 `width`**。
      fixed + 无 width → 宽度是 shrink-to-fit，即**由内容决定**，不是占满 390px。
      于是 `flex: 1 1 0` 里的 `flex-basis: 0` 在一个 shrink-to-fit 容器里分不到「剩余空间」
      （本来就没有剩余空间可分），每个 tab 实际拿到 ≈ (max-content 总宽) / 4 ≈ 70px。
      再减去 `padding: 0 var(--sp-5)` 的左右共 40px，**内容区只剩约 30px** ——
      而「此刻」两个汉字在 `--fs-md`(14px) 下正好约 28–30px。**卡在临界点**，
      真机字体渲染与桌面稍有差异就换行。

   ── 定案（三条，各管一件事）：
      1. `padding: 0 var(--sp-3)`（12px，原 `--sp-5` 20px）：内容区从 ~30px 提到 46px，
         留出明显余量，不再贴着两字临界点。
      2. `white-space: nowrap`：即使将来再挤，也宁可横向挤压也**不断行**。
         断行会让 tab 变高、把上方内容顶掉，危害远大于横向挤一点。
      3. `flex: 0 0 auto`（原 `1 1 0`）：`tabbar` 是 shrink-to-fit 容器，`flex-basis: 0`
         在这里的行为难以预测（正是踩的坑）；改成按内容宽度排布，配合 `min-width: 64px`
         完全可预测。四个 tab 文字都是两字，宽度天然相同，观感与「均分」一致。

   ── 保留：`min-width: 64px`（宽度下限，窄屏）、`min-height: var(--touch-min)`（触控下限）。
   ── 不要把 `--sp-*` 或 `--fs-*` 改成别的值来「腾空间」：那是全局栅格/字号阶梯，一动影响全站。
      宽度够不够现在由 `tools/check.mjs` 第 12 节机器计算，不再靠纸面估算。 */
.tab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  min-width: 64px;
  min-height: var(--touch-min);
  padding: 0 var(--sp-3);
  border-radius: var(--r-pill);
  color: var(--c-text-3);
  font-size: var(--fs-md);
  text-decoration: none;
  white-space: nowrap;
}

/* 实心底改用 --c-brand-solid：白字压 --c-brand 实测只有 3.39:1（深浅同值），
   压 --c-brand-solid #167e70 为 4.94:1。--c-brand 本身不动，仍用于描边与浅填充。 */
.tab--active {
  background: var(--c-brand-solid);
  color: #ffffff;
  font-weight: 600;
}

/* ---------------- 按钮 / 分段控件 ---------------- */

/* ---------------- 自检页 ---------------- */

.sc-head {

/* ---------------- 数据源自检页 ---------------- */

/* ★2026-10-17：原「自驾页筛选条件」段（.filt / .filt-sum / .filt-body）已整段删除 ——
   它只服务于已下线的路线规划页筛选器，全仓 grep 零引用，留着就是死样式。
   那段注释里「不画新配色、配色一律走 tokens.css 变量」的规矩仍然有效，见本文件顶部。 */

.sc-section {

  margin: 0 auto var(--sp-5);
  padding: 0 var(--sp-4);

.sc-list {

.sc-row {

.sc-row-head {

.sc-row-metrics {

/* ---------------- 空态 / 骨架 ---------------- */

.empty {
  border-radius: var(--r-card);

  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--c-text-3);

.sk {
  border-radius: var(--r-card);

  background-size: 200% 100%;
  animation: sk-sweep 1.4s ease-in-out infinite;
  height: 96px;

@keyframes sk-sweep {

  100% { background-position: -200% 0; }
}

@media (prefers-reduced-motion: reduce) {

/* ---------------- 方位屏（磁偏角 / 罗盘） ---------------- */

/* 卡内补充说明：与 .card-title 同级（次一级文字），不抢数值的视觉权重 */
.card-note {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  margin: 0;
  line-height: 1.5;
}

/* 超期/告警态：数值**照常显示**（用户仍需要一个近似值），只把信任等级降下来。
   红只描边框、不进文字也不铺底 —— 状态色作文字色会掉到 4.5:1 以下（见 chip 那条注释），
   铺底又会盖住卡片本身，这里一层红边框 + 卡内那枚 .chip--failed 已足够传达。 */
.card--alert {
  border-color: color-mix(in srgb, var(--c-alert) 45%, transparent);
  color: var(--c-text-1);
}

/* 磁偏角读法：大号是「西偏 7.49°」，小号跟一个原始有符号值，方向信息不丢 */
.compass-hero {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.compass-hero-num {
  font-size: var(--fs-2xl);
  font-weight: 600;
  color: var(--c-text-1);
  line-height: 1.2;
}
.compass-hero-signed {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

.compass-heading {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  margin: 0;
}

/* 罗盘盘面：盘面整体转 −heading，真北针再相对磁北针转一个磁偏角 */
.compass-dial {
  position: relative;
  width: 176px;
  height: 176px;
  margin: var(--sp-2) auto;
  border-radius: 999px;
  border: 1px solid var(--c-card-stroke);
  background: color-mix(in srgb, var(--c-brand) 8%, var(--c-card-fill));
}

/* N/E/S/W 是罗盘唯一的方位锚点，不能按装饰处理；它压在盘面（8% 品牌色 + 卡片填色）上，
   比同色文字在纯卡片表面上还低一档 —— --c-text-3 实测仅 3.26/3.22，是全局最差的一处。
   这里单独升到 --c-text-2：深色 8.00:1 / 浅色 5.07:1。 */
.compass-mark {
  position: absolute;
  font-size: var(--fs-xs);
  color: var(--c-text-2);
}
.compass-mark--n { top: 8px; left: 50%; transform: translateX(-50%); }
.compass-mark--s { bottom: 8px; left: 50%; transform: translateX(-50%); }
.compass-mark--w { left: 8px; top: 50%; transform: translateY(-50%); }
.compass-mark--e { right: 8px; top: 50%; transform: translateY(-50%); }

.compass-rose {
  position: absolute;
  inset: 0;
  transition: transform 120ms linear;
}

.compass-needle {
  position: absolute;
  left: 50%;
  bottom: 50%;
  width: 3px;
  height: 40%;
  margin-left: -1.5px;
  border-radius: 2px;
  transform-origin: 50% 100%;
}
/* 磁北针红、真北针青：两支针都在盘面上，颜色差是唯一的区分手段。
   红只作填充（不是文字色），符合「状态色只做填充与徽点」的红线。 */
.compass-needle--mag { background: var(--c-state-failed); }
.compass-needle--true { background: var(--c-brand); }

/* 二十四山刻度：每山 15°，随盘面一起转（因此放在 .compass-rose 内）。
   刻度用 ::before 画在元素顶端，元素本身 inset:0 后整体 rotate —— 转心天然是盘面中心，
   盘面尺寸改了也不用改这里的偏移；若用 transform-origin 写死半宽，改尺寸就会错位。
   本节只写 background，不写 color：tools/contrast-audit.mjs 全量扫本文件的 color: 声明。 */
.compass-shan,
.compass-shan-tick {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.compass-shan-tick::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 5px;
  width: 1px;
  height: 6px;
  margin-left: -0.5px;
  background: var(--c-card-stroke);
}
/* 每 45°（子 / 巽 / 午 / 乾）一条长刻度：分钟级别的小偏角不用数细线 */
.compass-shan-tick--major::before {
  top: 4px;
  height: 10px;
  background: var(--c-text-3);
}

/* 配色图例：盘面下两个色点，回答「红针是谁、青针是谁」。
   ★两条 --mag / --true 必须与上面两支针**取同一个 token**：图例复制一份十六进制，
     就等于埋一颗「token 改了、图例还在撒谎」的雷（tests/compass.test.mjs 交叉钉住这一点）。
   ★本节**只写 background**：tools/contrast-audit.mjs 全量扫本文件的 `color:` 声明，
     新增一条就会进审计口径；图例文字借用 .card-note（已有的一条小字样式）。 */
.compass-legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-1) var(--sp-4);
}

.compass-legend-item {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}

.compass-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
}
.compass-dot--mag { background: var(--c-state-failed); }
.compass-dot--true { background: var(--c-brand); }

/* 真/磁方位换算：手动输入，双向，不依赖传感器 */
.compass-row {
  gap: var(--sp-2);
  align-items: center;
}

.compass-input {
  min-height: var(--touch-min);
  width: 128px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-chip);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-size: var(--fs-md);
}

.compass-out {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  min-width: 64px;
}

.compass-arrow {
  color: var(--c-text-3);
}

@media (prefers-reduced-motion: reduce) {
  .compass-rose { transition: none; }
}

/* ---------------- 底图卡（S57 街道样式 / S58 GRID 降级） ---------------- */

/* 副标题 + 状态标记（S57 `17:7` / `17:4`）：同一行，状态右对齐 */
.map-sub {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.map-sub-t { font-size: var(--fs-sm); color: var(--c-text-3); }
.map-status {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* 样式切换 chip（S57 `17:36/38/40`）—— 状态色只做填充，文字一律 --c-text-1 */
.map-chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.map-chip {
  min-height: 32px;
  padding: 0 var(--sp-4);
  border-radius: var(--r-pill);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.map-chip--active {
  background: color-mix(in srgb, var(--c-brand) 18%, transparent);
  border-color: color-mix(in srgb, var(--c-brand) 45%, transparent);
}

/* 视口：瓦片在此绝对定位叠放，落点恒在正中。
   max-width:100% 而不是写死宽度 —— 窄屏靠它收缩，瓦片按设计基准裁切（本阶段不做重排）。 */
.map-viewport {
  position: relative;
  overflow: hidden;
  margin-inline: auto;
  max-width: 100%;
  border-radius: var(--r-card-sm);
  background: color-mix(in srgb, var(--c-text-3) 12%, transparent);
}

/* 单块瓦片：骨架 → 字节 → 或失败留白（S58 的「空洞瓦片」） */
.map-cell { position: absolute; overflow: hidden; }
.map-cell--loading { background: var(--c-card-fill); }
.map-cell--fail {
  background: var(--c-card-fill);
  box-shadow: inset 0 0 0 1px var(--c-divider);
}
.map-cell-img { display: block; width: 100%; height: 100%; }
.map-cell-x {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 基准 24px（瓦片缺块时盖在瓦片上的「×」）。原来是裸 px —— 切到放大档时它纹丝不动，
     会和四周跟着放大的文字/图标对不齐，所以同样挂上 --fs-scale。 */
  font-size: calc(24px * var(--fs-scale));
  line-height: 1;
  color: var(--c-text-3);
}

/* 落点（S57 `17:29`–`17:34`）：光环 48×48（品牌青 18% 填充 + 50% 描边）、
   实心点 8×8、四向准星。位置恒在视口正中 —— 网格按落点对齐铺，不做平移。 */
.map-pin {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48px;
  height: 48px;
  margin: -24px 0 0 -24px;
  pointer-events: none;
}
.map-pin-halo {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: color-mix(in srgb, var(--c-brand) 18%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-brand) 50%, transparent);
}
.map-pin-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--c-brand);
}
.map-pin-tick { position: absolute; background: var(--c-brand); }
.map-pin-tick--up { left: 23px; top: -14px; width: 2px; height: 14px; }
.map-pin-tick--down { left: 23px; bottom: -14px; width: 2px; height: 14px; }
.map-pin-tick--left { top: 23px; left: -14px; width: 14px; height: 2px; }
.map-pin-tick--right { top: 23px; right: -14px; width: 14px; height: 2px; }

/* 缩放控件（S57 `17:45`，48×64，视口右下） */
.map-zoom {
  position: absolute;
  right: var(--sp-3);
  bottom: var(--sp-3);
  width: 48px;
  border-radius: 14px;
  overflow: hidden;
  background: var(--c-card-fill);
  box-shadow: inset 0 0 0 1px var(--c-card-stroke);
}
.map-zoom-btn {
  display: block;
  width: 100%;
  height: 32px;
  border: 0;
  background: transparent;
  color: var(--c-text-1);
  font-size: var(--fs-lg);
  line-height: 1;
  cursor: pointer;
}
.map-zoom-btn:disabled { color: var(--c-text-3); cursor: default; }
.map-zoom-sep { display: block; height: 1px; background: var(--c-divider); }

/* 纯坐标模式（S58 的 no-map 语义）：一块都不请求，明确告诉用户数值不受影响 */
.map-viewport--nomap {
  display: flex;
  align-items: center;
  justify-content: center;
}
.map-nomap { display: flex; flex-direction: column; gap: var(--sp-1); text-align: center; padding: var(--sp-4); }
.map-nomap-t { font-size: var(--fs-md); color: var(--c-text-1); }
.map-nomap-d { font-size: var(--fs-xs); color: var(--c-text-3); }

/* 骨架视口 */
.map-viewport--sk { display: flex; align-items: center; justify-content: center; }
.map-sk-note { font-size: var(--fs-sm); color: var(--c-text-3); }

/* 坐标行（S57 `17:42`–`17:44`）：坐标用等宽字体，明细次要色 */
.map-coord {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.map-coord-v {
  font-family: var(--ff-mono);
  font-size: var(--fs-sm);
  color: var(--c-text-1);
  font-variant-numeric: tabular-nums;
}
.map-coord-d { font-size: var(--fs-xs); color: var(--c-text-3); }

/* 署名（Esri 条款硬要求，设计稿漏画的一行）—— 必须始终可见、不被遮挡 */
.map-credit {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  line-height: 1.5;
}

/* 「已到当前样式的缩放上限」那一句：只在到顶时出现（常驻就是一行永久噪声）。
   ★刻意**不写 color**：继承卡片正文色 —— 既不新增 `color:` 声明（tools/contrast-audit.mjs
     全量扫的就是它），对比度也必然不低于正文。
   ★必须能折行：它是独立一行而不是拼进 nowrap 的 .map-status，就是为了这点。 */
.map-cap {
  margin: 0;
  font-size: var(--fs-xs);
  line-height: 1.5;
}

.map-foot {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

@media (prefers-reduced-motion: reduce) {
  .map-chip { transition: none; }
}

/* ---------------- 小屏微调 ---------------- */

@media (max-width: 360px) {
  .hero-temp { font-size: var(--fs-hero-sm); }
  .kv { grid-template-columns: 1fr; }
}

/* ---------------- 指标释义（图例） ---------------- */

/* 类名一律 .legend- 前缀，与上面任何既有规则零重叠、零覆盖。
   颜色只取 --c-text-1 / -2 / -3 三档，全部已经过 tools/contrast-audit.mjs 的
   深浅双主题全量扫描；这里**不新增任何色值** —— 每多一条 color: 就多一笔要审计的债。
   唯一带底色的那条（风向胶囊 .legend-scale--wrap .legend-scale-row）用 --c-text-2 而不是
   --c-text-3：胶囊底是 --c-card-stroke，浅色屏下 --c-text-3 压它实测 4.46:1（差 0.04 不达标），
   --c-text-2 是 7.26:1（深色 7.93:1）。 */

.legend-panel {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.legend-note {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  line-height: 1.6;
}

.legend-group {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.legend-group-title {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-2);
  font-weight: 600;
}

.legend-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

/* 条目分隔线画在**顶部**而不是底部：最后一条下面不该拖一条多余的线 */
.legend-item {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  padding-top: var(--sp-2);
  border-top: 1px solid var(--c-divider);
}

.legend-item:first-child {
  border-top: none;
  padding-top: 0;
}

.legend-item-head {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  flex-wrap: wrap;
}

.legend-item-name {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  font-weight: 600;
}

.legend-item-unit {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.legend-item-body {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-2);
  line-height: 1.6;
}

/* 档位表：竖排（蒲福 / AQI / UV） */
.legend-scale {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.legend-scale-row {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

/* 档位表：横排换行（风向 16 方位，竖排会拉出一条 16 行的长条） */
.legend-scale--wrap {
  flex-direction: row;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-2);
}

/* 方位胶囊：底色 --c-card-stroke，文字 --c-text-2（取值理由见本节开头注释） */
.legend-scale--wrap .legend-scale-row {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-chip);
  background: var(--c-card-stroke);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
}

.legend-none {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

/* ==========================================================================
   Pad 横屏（≥ 768px）
   --------------------------------------------------------------------------
   纯 CSS：这一个媒体块是**追加**在文件末尾的，上面任何一条既有规则都没被改动；
   不新增 JS、不改 HTML 结构、不改 tokens.css 的色值、不改 --sp-* / --fs-*
   （那是全局栅格与字号阶梯，一动影响全站）。需要放大字号时这里一律给具体 px 值。

   改了什么（逐条理由）：
     1) .app → 两列栅格 + 960 上限居中：横屏下原来 390 的单列会被拉成一条很窄的长条，
        两列才用得上横向空间；上限 960 是为了不让正文拉成 1000px 一行的长句。
     2) 天气卡 / 空气卡并排（原先上下堆叠）；底图卡独占一行以便放大。
        行号写死而不是靠自动排布：DOM 顺序是固定的（search → weather → air →
        place → map → prov → legend），显式给 grid-row 比依赖自动排布可预测。
     3) .map-viewport → zoom 1.8：底图 350×260 → 630×468（★为什么是 zoom 而不是
        width/height，见下面该条注释 —— 直接改宽高会把地图搞歪）。
     4) .tab 放大到 96px / 15px：平板该有的触控尺寸。**不动 .tabbar 的居中方式**。
   ========================================================================== */

@media (min-width: 768px) {
  /* 1) 内容区：两列栅格 + 上限居中 */
  .app {
    max-width: 960px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: var(--sp-4);
  }

  /* 行位显式给定：DOM 顺序固定，写死比自动排布可预测（见本节开头） */
  .app > .hd { grid-column: 1 / -1; grid-row: 1; }
  #card-search { grid-column: 1 / -1; grid-row: 2; }
  #card-weather { grid-column: 1 / 2; grid-row: 3; }
  #card-air { grid-column: 2 / 3; grid-row: 3; }
  #card-place { grid-column: 1 / -1; grid-row: 4; }
  /* 气候常态卡（12 行月度表）独占一整行：半宽会让 4 列挤到换行。
     行位显式给定而不是靠自动排布 —— 自动排布下它会和同样未登记的槽位
     （2026-10-26 前是 #card-bearing，那张「方位 · 磁偏角」概览卡已删）
     一起被塞进同一行的两半里，那张表就废了。 */
  #card-climate { grid-column: 1 / -1; grid-row: 8; }
  #card-map { grid-column: 1 / -1; grid-row: 5; }
  #card-prov { grid-column: 1 / -1; grid-row: 6; }
  #card-legend { grid-column: 1 / -1; grid-row: 7; }

  /* 并排的这两张卡等高：让卡填满它那一格（只针对这一对，不波及其它槽位 ——
     #card-prov 里是「标题 + 气泡」两个兄弟，套同样的规则会把它们拉成左右两半） */
  #card-weather, #card-air { display: flex; }
  #card-weather > .card, #card-air > .card { flex: 1 1 auto; min-width: 0; }

  /* 2) 顶部横幅与内容区同宽（原本 640，横屏下比内容区窄一截，看着像没对齐） */
  .banner { max-width: 960px; }

  /* 3) 英雄温度放大：--fs-hero 是 56px，横屏下 64px（给具体值，不改变量）。
        挂 --fs-hero-scale 而不是 --fs-scale：与竖屏那套英雄区口径保持一致
        （见 tokens.css 里 --fs-hero-scale 那条注释 —— 大号字放得比正文慢）。 */
  .hero-temp { font-size: calc(64px * var(--fs-hero-scale)); }

  /* 4) 底图：350×260 → 630×468
     ★为什么用 zoom 而不是 width/height：视口宽高是 JS 写在 inline style 上的
       （src/ui/map.js 的 VIEW_W / VIEW_H），而瓦片是**按这两个常量算出来的像素坐标**
       绝对定位的（_layTiles 的 left0/top0 = VIEW_W/2 − …），落点又是 50%/50%。
       若只把容器改成 520×390，瓦片仍按 350×260 的中心铺，落点却跑到新中心 ——
       地图整体偏移、右下留白，落点和地图对不上。
       zoom 是**整体缩放**：瓦片、落点、缩放控件一起放大，相对关系原样保留，
       不需要任何补偿数字，也不会因为将来改 VIEW_W 而失配。
       不支持 zoom 的浏览器（Firefox 126 之前）就保持 350×260 —— 优雅降级，不会裂。 */
  .map-viewport { zoom: 1.8; }

  /* 5) 底部 tab：只放大 tab 本身，**不改 .tabbar 的居中方式**
       —— .tabbar 是 position: fixed 且**没有设 width**（shrink-to-fit，宽度由内容决定）。
       给它加 width 或改成靠边，会重演真机上「四个 tab 文字断成两行」那个 bug
       （commit fa1ec49，根因见上面 .tab 那一大段注释）。横屏左右余量充足，
       把 tab 放大到 96px 也不会挤压：4×96 + 3×4 + 2×4 = 404px，远小于 768px。 */
  .tab { min-width: 96px; padding: 0 var(--sp-4); font-size: calc(15px * var(--fs-scale)); }

  /* 6) 图例：横屏下两列排布 —— 单列会变成又窄又长的两三条，短行更好读。
       两列时每行的第一条不该带分隔线，所以把 :first-child 的例外扩到 :nth-child(2)。 */
  .legend-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--sp-3) var(--sp-4);
  }
  .legend-list > .legend-item:nth-child(2) { border-top: none; padding-top: 0; }
}

/* ---------------- 读屏专用与页头缓存年龄 ---------------- */

/* 视觉隐藏但读屏可读：#live 的 role="status" 靠它「只出声、不占位」 */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;

  border: 0;

/* 页头右列第二行（缓存年龄）：字号/颜色沿用父级 .hd-time，只去掉段落默认外边距 */
.hd-fresh { margin: var(--sp-1) 0 0; }

/* ---------------- 地理页一次性安装提示 ---------------- */

.install-hint {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin: var(--sp-2) var(--sp-4) 0;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--c-card-stroke);
  border-radius: var(--r-chip);
  background: var(--c-card-fill);
  color: var(--c-text-2);
  font-size: var(--fs-md);
}

/* hidden 必须压过 display:flex，否则「已看过」也照样显示 */
.install-hint[hidden] { display: none; }

.install-hint-text { flex: 1 1 auto; min-width: 0; }
.install-hint-link { flex: 0 0 auto; color: var(--c-brand); font-weight: 600; }

.install-hint-close {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--c-text-3);
  font-size: var(--fs-lg);
  line-height: 1;
  cursor: pointer;
}

</style>

  <!-- 无障碍字号档位预置（防跳档）
       ES module 是 defer 的：等 src/ui/*.js 跑起来才去写 <html data-fs>，浏览器很可能
       已经按默认字号画过一帧 —— 用户会看到整页文字「先小后大」地跳一下。这段同步脚本在
       <head> 里直接读本机偏好把属性设上，比模块早那么一瞬间。
       ★键 'gs:v1:store:prefs' = core/cache.js 的 NS('gs:v1:') + store 的 prefs 键，
         tools/check.mjs 第 13 节会断言它与源码一致 —— 改命名空间必须连这里一起改。
       读不到 / 解析失败 / 值非法就**什么都不做**（模块顶层还会再应用一次），绝不抛异常。
       放大乘数全在 styles/tokens.css，这里不存任何数字。 -->
  <script>
    try {
      var gsPrefs = JSON.parse(localStorage.getItem('gs:v1:store:prefs') || '{}');
      var gsFs = gsPrefs && gsPrefs.v && gsPrefs.v.fontScale;
      if (gsFs === 'large' || gsFs === 'xlarge') document.documentElement.setAttribute('data-fs', gsFs);
    } catch (gsErr) { /* 读不到就交给模块顶层，不抛 */ }
  </script>
</head>

<script>

\n  'card.compass': '罗盘',\n\n  'compass.d': '磁偏角 D',\n  'compass.i': '磁倾角 I',\n  'compass.f': '总场强 F',\n  'compass.h': '水平分量 H',\n  'compass.x': '北向分量 X',\n  'compass.y': '东向分量 Y',\n  'compass.z': '垂直分量 Z',\n  // D 的**读法**：东偏为正，负数要读成「西偏 N°」，不能直愣愣显示 -7.49°\n  'compass.east': '东偏 {deg}°',\n  'compass.west': '西偏 {deg}°',\n  'compass.noDeclination': '正北（不偏）',\n  // 年变率是模型自带的（symbolRates.dD，单位 度/年 → 换算成分/年），不是精度指标\n  'compass.rateD': '磁偏角每年变化约 {min}′',\n\n  'compass.modelName': '模型',\n  'compass.modelEpoch': '历元',\n  'compass.modelRangeLabel': '有效期',\n  'compass.modelSource': '来源',\n  // ★这一行的值是小数年，原借 `card.magnetic`（地磁要素）当标签，界面读到「地磁要素 2026.82」。\n  'compass.modelAt': '计算时刻（小数年）',\n  'compass.modelDoi': 'DOI',\n  'compass.modelRange': '{from} – {until}',\n  'compass.modelOk': '在有效期内',\n  'compass.modelLeft': '距失效约 {years} 年',\n  // 超期/回溯：数值照常显示，只在这里把信任等级降下来（卡片挂告警态，数字不隐藏）\n  'compass.modelExpired': '已超出有效期约 {years} 年，数值仅供近似参考',\n  'compass.modelAhead': '早于模型历元约 {years} 年，为回溯推值',\n\n  'compass.trueBearing': '真方位',\n  'compass.magBearing': '磁方位',\n  'compass.inputTrueHint': '输入真方位（度）',\n  'compass.inputMagHint': '输入磁方位（度）',\n  'compass.resultPrefix': '结果',\n  'compass.convertHint': '东偏为正：真方位 = 磁方位 + 磁偏角',\n  'compass.inputInvalid': '请输入一个角度（数字）',\n  'compass.convertUnavailable': '磁偏角暂不可用，换算不可进行',\n\n  'compass.sensorUnsupported': '本机无方向传感器 · 仅显示计算值与手动换算',\n  // ★「未授权」这句要能真的帮到人：WebKit 会把拒绝决定按站点记住，之后不再询问，\n  //   所以必须告诉用户去哪儿改回来（只说「未授权」等于把人卡死）。\n  'compass.sensorDenied': '方向传感器未授权 · 仅显示计算值与手动换算；若曾点过「不允许」，需到浏览器的站点设置里改回',\n  // ★不说「iPhone」：所有 iOS 浏览器都走 WebKit，且未来的 Chrome 安卓也会要授权 ——\n  //   写死平台名，那条未来一到来就是错的（用「本浏览器」这类不指名平台的说法）。\n  'compass.sensorIdle': '本浏览器要求点击后才授权读取方向传感器 · 未授权前仅显示计算值与手动换算',\n  'compass.sensorWaiting': '已启用，正在等待方向数据…',\n  'compass.sensorEnable': '启用方向传感器',\n  'compass.headingMag': '当前朝向（磁）{deg}°',\n  'compass.headingTrue': '当前朝向（真）{deg}°',\n  // ★山名按**磁方位**取（与盘面刻度同源）：用真方位会整体错一个磁偏角\n  'compass.shanNow': '二十四山：{name}',\n  // ★真机问题「红蓝两针不知道哪个是真北哪个是磁北」——盘面下方给一行图例。\n  //   色点**只由 CSS token 取色**（.compass-dot--mag / --true），文案这里只负责命名：\n  //   写死十六进制，哪天 token 改了图例就会撒谎。\n  'compass.legendMag': '红针 · 磁北',\n  'compass.legendTrue': '青针 · 真北',\n  // ★只在磁偏角有效时才上屏：没有磁偏角就没有真北针，此时说「两针夹角」是假话。\n  //   这句话本身是真的 —— _dial() 里真北针是在磁北针基础上再转 +declination。\n  'compass.needleHint': '两针夹角即磁偏角：红针指向磁北，青针指向真北',\n  'compass.compassNote': '指针方向来自设备传感器，未做校准，仅供参考',\n\n  // ---------- 瓦片样式 ----------\n  'tile.street': '街道图',\n  'tile.imagery': '影像图',\n  'tile.dark': '暗色图',\n\n  // ---------- 底图渲染（S57 街道样式 / S58 GRID 降级） ----------\n  'card.map': '底图',\n  'map.subtitle': '256 px 瓦片按 z/x/y 拼接 · 街道 / 影像 / 暗色三样式',\n  'map.zoom': 'z{zoom}',\n  'map.trusted': '已授信',\n  'map.untrusted': '未授信',\n  'map.cacheHit': '缓存命中',\n  'map.loading': '瓦片加载中',\n  // ★终态「全部取回成功」，原先无词可说被兜底成「瓦片加载中」（读到「9/9 块 · 瓦片加载中」）。不许借 loading / cacheHit。\n  'map.loaded': '已加载',\n  'map.blocks': '{ok}/{total} 块',\n  'map.detail': '{blocks} · {elapsed} · {tail}',\n  'map.tailBlank': '{n} 块留白',\n  'map.tailFailed': '{n} 块失败',\n  'map.noMap': '底图不可用，已切换为纯坐标模式',\n  'map.noMapNote': '坐标与数值不受影响',\n  'map.zoomIn': '放大',\n  'map.zoomOut': '缩小',\n  // ★「画不动了」要说出来：以前顶到缩放上限只有一个变灰的 +，用户不知道是网络失败还是到底了\n  //   （street 在中国上限 z13，放大两下就撞上）。只在到顶时出现，不许常驻。\n  // ★真机反馈「影像放到最大偏模糊」：这句要能回答「为什么糊」，而不是只报一个数字。\n  //   只陈述两条确定的事实 —— ① 已经到样式上限；② 再放大拿不到更细的瓦片。\n  //   ★不许承诺「放大就清楚」，也不许说「此地区没有影像」（我们只实测过北京，\n  //     实拍截图的位置是别处）；清晰度确实随该地区的源数据覆盖而变，如实说明即可。\n  'map.zoomMax': '已到最高 {z} 级 · 再放大不会有更细的影像，清晰度取决于该地区覆盖',\n  'map.footnote': '瓦片按 URL 缓存 7 天 · 授信后发请求 · 6 s 超时不重试',\n  'map.gridFootnote': '底图缺块不影响坐标与数值 · 离线仍可出网格',\n  'map.credit': '底图署名',\n  'map.skeletonNote': '瓦片未到 · 先出骨架',\n\n  // ---------- 关于与边界 ----------\n  'about.title': '关于与边界',\n  'about.noCommercial': '不商业化：自用工具，无广告、无第三方统计、无账号登录、无后端。',\n  'about.noE2ee': '不做端到端加密同步：数据只存本机 localStorage，搬家靠导出 JSON。',\n  'about.noAlert': '预警不采购数据源：本阶段不实现预警推送。',\n  // ★这句话里的**数字必须跟着源表走**：诚实原则 —— 加了源就得改说法，\n  //   否则这句话本身就成了假的隐私承诺。\n  //   2026-10-17 自驾下线：原本是「六路 + 自驾两路 = 八路」，现为\n  //   「自检六路（`SOURCE_LIST`）+ 气候常态一路 = 七路」（见 data/sources.js 的 `SOURCE_TABLE`）。\n  'about.privacy': '除已声明的数据源（现有七路）之外，本应用不向任何域名发起请求；你的坐标不会被上传到数据源以外的地方。',\n  // 开发者署名：中文只显示「善哉」；英文的「+」是写在 HTML 里的 <sup>（见 about-dev-plus），\n  //   不放文案里 —— applyI18n 用 textContent 覆盖，写这里会被抹掉。\n  'about.developerLabel': '开发者：',\n  'about.developer': '善哉',\n\n  // ---------- 使用说明（settings.html 的 #help 静态区块） ----------\n  // 只写代码与 README 已确认的行为，不承诺未验证的能力（不写精度、不写实测耗时）。\n  'help.title': '使用说明',\n  'help.step1': '三个页面：底部胶囊切换「地理 / 气候 / 我的」。桌面图标直接落在「地理」页。',\n  'help.step2': '定位与地点：首次打开会请求定位；拒绝或超时会用默认地点。可在「我的 → 默认地点」改，或在「气候」页的搜索框按地名查找。',\n  'help.step3': '地理页：磁偏角由 WMM2025 模型在本机算出，断网也能用；底图可在街道 / 影像 / 暗色三种样式间切换，用「放大 / 缩小」按钮缩放；手机有方向传感器时可点「启用方向传感器」看罗盘。',\n  'help.step4': '气候页：天气、空气、今日与未来，以及「查看月平均」取 1991–2020 气候常态。有旧缓存时照常显示并标注「更新于 …」，不会留空白。',\n  'help.step5': '添加到桌面：在浏览器菜单里选「添加到桌面 / 添加到主屏幕」。OPPO 自带浏览器没有这个菜单，请改用 360 或 Chrome 打开同一个网址。',\n  'help.step6': '备份：数据只存本机。「我的 → 备份导出」生成 JSON，换机后用「备份导入」恢复；也可以导出 CSV 表格。',\n  'help.tip': '磁偏角与网格底图离线可用；离线时天气显示的是上一次的缓存值，并标明更新时间。',\n  'help.entry': '查看使用说明',\n\n  // ---------- 收藏 ----------\n  // 收藏是「地点」，不是天气快照：只存 名称 + 经纬度，不存任何取回来的数据。\n  // 空态必须把「收藏 → 备份」这条关系讲明白 —— 这是收藏这个功能存在的理由：\n  // 数据只在本机，iOS 会清 PWA 存储，收藏唯一的退路就是跟着备份导出走。\n  'fav.title': '收藏地点',\n  'fav.count': '共 {count} 条',\n  'fav.hint': '收藏只存本机，不上传；导出备份时会一起带走，导入备份时会一起回来。',\n  'fav.empty': '还没有收藏地点。到「此刻」页点标题下的收藏按钮，把当前地点存到这里 —— 收藏会随备份一起导出，换手机时导入那份 JSON 就能原样恢复。',\n  // 按钮两态（☆ / ★ 是图标，文案本身走 i18n）\n  'fav.add': '收藏此地',\n  'fav.added': '已收藏',\n  // 点完的短暂反馈：add 那条顺手把「备份时会带上」说清楚，替空态文案再讲一次\n  'fav.addedHint': '已收藏 · 导出备份时会带上它',\n  'fav.removedHint': '已取消收藏',\n  'fav.delete': '删除',\n  'fav.deleteOf': '删除收藏：{name}',\n  'fav.go': '查看此刻天气',\n  'fav.unnamed': '未命名地点',\n\n  // ---------- 多地点对比 ----------\n  // 对比页从「我的」页进（不进底部 tabbar：tabbar 在 320px 屏上已经贴着临界点，\n  // 再加一项会把四个 tab 挤到换行 —— 那是个真机上真实发生过的 bug）。\n  // 口径规矩：每个地点**单独**取一次数（网络一次只发一个请求），取不到的那个\n  // 单独标失败、指标留占位符「—」，绝不拿别处的数据填进来。\n  'compare.title': '多地点对比',\n  'compare.subtitle': '把收藏地点的同一批指标逐个列出来，一个地点一张卡，同一行的指标可以直接对读',\n  'compare.entry': '对比收藏地点',\n  'compare.entryBtn': '开始对比',\n  'compare.hint': '每个地点要单独取一次数，而网络一次只发一个请求 —— 收藏越多，等得越久。',\n  'compare.current': '当前收藏 {count} 条',\n  'compare.needFav': '先收藏地点：到「此刻」页点标题下的收藏按钮，把想对比的地方存起来，再回来。',\n  'compare.maxNote': '收藏超过 {max} 条，本次只对比前 {max} 条。想对比别的，先到上面把不看的删掉。',\n  'compare.summary': '共 {total} 个地点 · 已取到 {ok} 个 · 失败 {failed} 个',\n  'compare.summaryRunning': '共 {total} 个地点 · 正在取第 {done} 个…',\n  'compare.offline': '设备离线，未发起请求',\n  'compare.allFailed': '这 {total} 个地点一个都没取到数据。可能是网络不通或数据源暂时不可用 —— 不是这些地点没有天气。',\n  'compare.rowFailed': '这个地点没取到数据：{reason}',\n  'compare.loading': '正在取数…',\n  'compare.refresh': '刷新',\n  'compare.back': '返回「我的」',\n\n  // ---------- 设置 / 我的 ----------\n  'settings.title': '我的 · 设置',\n  'settings.subtitle': '备份搬家与外观：整机数据不出设备，导出与导入都在本机完成。',\n\n  // 地理页一次性安装提示（compass.js 用）：只出现一次，链接到设置页的安装卡\n  'install.hint': '可添加到桌面，下次一键直达地理页。',\n  'install.hintCta': '去安装',\n  'install.dismiss': '关闭安装提示',\n  // 添加到桌面 / 主屏幕（一次性动作，装完折叠成一行）\n  'settings.installTitle': '添加到桌面或主屏幕',\n  'settings.installHint': '装好之后从桌面或主屏幕的图标打开就是它：不显示地址栏，断网也能打开这一页。',\n  'settings.installBtn': '添加到桌面',\n  'settings.installedNote': '已经装好了：从桌面或主屏幕上的那个图标打开即可。',\n  // 平台中立：本页无法可靠判断 iOS / 安卓，所以两条路都写出来，让用户自己对号入座\n  'settings.installManual': '这个浏览器没有给页面「一键安装」的入口，需要手动添加：iPhone / iPad 请用 Safari 打开本页，点底部「分享」→「添加到主屏幕」；安卓请用 Chrome 打开本页，点右上角菜单 →「安装应用」或「添加到主屏幕」。装好后从那个图标打开即可。',\n  'settings.installAccepted': '已接受安装：系统会在桌面或主屏幕上加一个图标。',\n  'settings.installDismissed': '这次没装：你在系统提示里点了取消。想再试可以刷新本页，或按上面的手动步骤添加。',\n  'settings.installFailed': '这一步没能走完（多半是重复点击或浏览器不支持）。按上面的手动步骤一样能添加。',\n  // 宿主环境分档：先说清「为什么这里装不了」，再给出路。判据见 install.js 的 detectHostEnv()\n  'settings.installBlockedWechat': '你现在是在「微信内置的浏览器」里（不是 Chrome / Safari），它不支持把网页装到桌面 —— 所以这一步在微信里无论点多少次都不会有图标，跟本 App 本身没关系。唯一可行的出路：点右上角「…」→「在浏览器打开」，换系统浏览器打开本页，再按那边的菜单添加。',\n  'settings.installBlockedQq': '你现在是在「QQ 内置的浏览器」里（不是 Chrome / Safari），它不支持把网页装到桌面 —— 这一步在 QQ 里点不出来，跟本 App 本身没关系。出路：点右上角「…」→「在浏览器打开」，换系统浏览器打开本页，再按那边的菜单添加。',\n  'settings.installManualIos': 'iPhone / iPad 请用「Safari」打开本页：iOS 上的 Chrome、微信、QQ 用的都是同一套 WebKit 内核，只有 Safari 有这个入口。然后点屏幕「底部中间」的「分享」→ 在列表里下滑找到「添加到主屏幕」→ 右上角「添加」。',\n  // ★这一档以真机核对为准（ColorOS，2026-11-07）：菜单里**没有**「添加到桌面」，\n  //   长按书签也没有这一项 —— 旧的「长按书签→添加到桌面」是错的，别再写回去。\n  //   同一台机器上用 360 浏览器可一步装成，所以文案改为「换 360 / Chrome」。\n  'settings.installManualOppo': '你用的是 OPPO 自带浏览器（ColorOS）。实机核对过：它的菜单里没有「添加到桌面」，长按书签也没有这一项 —— 加收藏只会把网页留在「书签收藏」列表里，不会生成桌面图标，别在这儿找。能装成的办法：① 复制下面的网址，打开 360 浏览器或 Chrome 粘贴访问（实机验证：360 浏览器的「添加到桌面」一步装成，点开没有地址栏）；② 在那个页面点「添加到桌面」，桌面出现「地候 GeoScope」，点开进入地理页；③ 若坚持用自带浏览器，它只能当书签用，桌面不会有图标。',\n  'settings.installManualAndroid': '两条路。① 先试快的：用「Chrome 或系统自带浏览器」打开本页 → 右上角「⋮」→「安装应用」或「添加到主屏幕」（三星 / 小米 / 华为 / UC / 夸克的菜单在屏幕「底部的底栏」里，不在右上角）。② 找不到就用系统兜底：长按手机桌面空白处 →「快捷方式」或「小部件」→「网站快捷方式」→ 网址填 {url} → 名称填「{app}」。★但这条兜底只有部分安卓机（三星、原生系统）有 —— OPPO 的 ColorOS 和 vivo 的桌面编辑里没有「快捷方式」这一项，别在那里找（用这两个自带浏览器打开时，本卡会直接给你它们各自的路径）。两条都不成：装 Chrome，用它打开本页安装。差别说清：②只是书签图标（有地址栏、断网打不开）；Chrome 装出来的才是无地址栏、能离线的完整版。',\n  // 拿不到网址（Node 侧等非浏览器环境）时的同一条安卓文案：不许把 {url} 占位符漏到界面上\n  'settings.installManualAndroidNoUrl': '两条路。① 先试快的：用「Chrome 或系统自带浏览器」打开本页 → 右上角「⋮」→「安装应用」或「添加到主屏幕」（三星 / 小米 / 华为 / UC / 夸克的菜单在屏幕「底部的底栏」里，不在右上角）。② 找不到就用系统兜底：长按手机桌面空白处 →「快捷方式」或「小部件」→「网站快捷方式」→ 网址填「浏览器地址栏里当前这一页的地址」（长按可复制）→ 名称填「{app}」。★但这条兜底只有部分安卓机（三星、原生系统）有 —— OPPO 的 ColorOS 和 vivo 的桌面编辑里没有「快捷方式」这一项，别在那里找。两条都不成：装 Chrome，用它打开本页安装。差别说清：②只是书签图标（有地址栏、断网打不开）；Chrome 装出来的才是无地址栏、能离线的完整版。',\n  'settings.installCopyUrl': '复制网址',\n  'settings.installCopied': '已复制 {url}：粘到浏览器地址栏或「网站快捷方式」的网址栏里就行。',\n  'settings.installCopyFailed': '这个浏览器不允许网页自动复制，只能手动：长按上面那行网址，选中后复制。',\n\n  // 默认地点（定位拿不到时显示的就是它；出厂那份必须标注出来，它不是用户的位置）\n  'settings.defaultPlaceTitle': '默认地点',\n  'settings.defaultPlaceHint': '定位拿不到的时候（拒绝 / 超时 / 没信号 / 环境不支持），此刻屏与地理页显示的就是这里设的地点。收藏与搜索跳转不受它影响。',\n  'settings.defaultPlaceCurrent': '现在是：{name} · {coord}',\n  'settings.defaultPlaceFactoryNote': '这是出厂默认的那个地点，不是你的位置 —— 没改过的话，定位拿不到时显示的就是它。',\n  'settings.defaultPlaceGpsBtn': '用当前位置',\n  'settings.defaultPlaceGpsDone': '已设为默认地点：{name}',\n  'settings.defaultPlaceGpsDenied': '没改成：定位权限被拒绝（你或系统拒的）。默认地点一个字节都没动。',\n  'settings.defaultPlaceGpsTimeout': '没改成：等定位等到超时。默认地点一个字节都没动。',\n  'settings.defaultPlaceGpsUnsupported': '没改成：这个环境不支持浏览器定位。默认地点一个字节都没动。',\n  'settings.defaultPlaceGpsOther': '没改成：定位没拿到，原因分不出来（不是超时，可能是权限或本机定位不可用）。默认地点一个字节都没动。',\n  'settings.defaultPlaceFavTitle': '从收藏选',\n  'settings.defaultPlaceFavEmpty': '还没有收藏 —— 先去此刻页或地理页收藏几个地点，就能在这里选了。',\n  'settings.defaultPlaceFavDone': '已设为默认地点：{name}',\n  'settings.defaultPlaceFavMissing': '没改成：那条收藏已经不在列表里了（可能刚被删掉）。默认地点一个字节都没动。',\n  'settings.defaultPlaceResetBtn': '恢复出厂默认',\n  'settings.defaultPlaceResetDone': '已恢复出厂默认：{name}',\n\n  // 首屏分段耗时（整句成模板，只插值数字；缺段显示「—」，不许显示 0 也不许省略整段）\n  'settings.bootTiming': '首屏耗时：定位 {geo} · 天气 {weather} · 空气 {air} · 海拔 {elevation} · 后台 {background} · 合计 {total}',\n\n  'settings.exportTitle': '备份导出',\n  'settings.exportBtn': '导出备份文件',\n  'settings.exportCurrent': '当前可导出：默认地点 {place} · 收藏 {count} 条 · 天气快照 {snapshot}',\n  'settings.snapshotYes': '已保存',\n  'settings.snapshotNo': '暂无',\n  'settings.exportDone': '已导出 {name}',\n  'settings.exportFail': '导出失败：本机浏览器不支持文件下载',\n  // exportBackup() 的 JSDoc 明确要求：导出前必须告知用户这份文件含位置信息。\n  // 这句话常驻在按钮下方，不是点完才闪一下的提示 —— 用户要在按之前就知道。\n  //\n  // 有快照 / 无快照必须分开说，不能用同一句含糊带过：快照里嵌着**最近一次定位坐标**\n  // （经纬度，能精确到社区）以及四条同样含经纬度的数据源请求链接 —— 这比 defaultPlace\n  // 敏感一个量级（defaultPlace 通常是出厂默认值「北京·天安门」，根本不是用户的真实位置）。\n  // 2026-10-12 用真机导出的第一份备份核对后发现原文案只说「最近一次天气快照」，\n  // 把最敏感的一项藏在了最不起眼的四个字里。\n  'settings.backupPrivacy': '这份文件含你的位置信息：默认地点、{count} 个收藏地点，以及最近一次定位坐标（经纬度，能精确到社区）和当时取到的天气、空气数据 —— 数据源链接里也嵌着同一串经纬度。导出不联网、不上传，文件只存到你选择的位置；别把它随手发给别人。',\n  'settings.backupPrivacyNoSnap': '这份文件含你的位置信息：默认地点与 {count} 个收藏地点。本次没有天气快照，所以不含定位坐标。导出不联网、不上传，文件只存到你选择的位置；别把它随手发给别人。',\n\n  'settings.importTitle': '备份导入',\n  'settings.importHint': '选择 geoscope-backup-*.json。先看清楚内容再决定 —— 确认后会覆盖本机的默认地点、收藏与最近一次定位坐标。',\n  'settings.importPick': '选择备份文件',\n  'settings.importReady': '已读取 {name}，内容如下。本机数据此刻还没动。',\n  'settings.pickFirst': '请先选择一个备份文件。',\n  'settings.previewTitle': '这份备份的内容',\n  'settings.previewExportedAt': '导出时间：{time}',\n  'settings.previewPlace': '默认地点：{name}',\n  'settings.previewFavorites': '收藏地点：{count} 条',\n  'settings.previewDropped': '其中 {count} 条不会被导入：坐标非法、与前面的重复，或超出 200 条上限。',\n  'settings.previewNoPlace': '未命名地点',\n  'settings.confirmBtn': '确认导入',\n  'settings.confirmHint': '这一步才会写入本机，并把上面的内容覆盖到当前数据。',\n  'settings.importOk': '导入完成：默认地点 {name} · 收藏 {count} 条',\n  'settings.importFail': '导入失败：{reason}',\n  'settings.readFail': '读取文件失败：{message}',\n  'settings.readEmpty': '文件内容是空的，可能不是文本格式的备份文件。',\n\n  'settings.themeTitle': '主题',\n  'settings.themeHint': '跟随系统＝由系统的深浅色设置决定；手动指定后会一直保持，直到你改回来。',\n  'settings.theme.system': '跟随系统',\n  'settings.theme.light': '浅色',\n  'settings.theme.dark': '深色',\n  'settings.themeDone': '主题已切换为「{mode}」',\n\n  // ---------- 无障碍字号三档 ----------\n  // 三档只改「乘数」（styles/tokens.css 的 --fs-scale），不动任何色值、不动 --sp-* 间距。\n  // 英雄区那个大温度刻意放得比正文慢（--fs-hero-scale）—— 它本来就是正文的 4 倍，\n  // 再按 1.3 放大会把窄屏挤坏。这句话要如实讲给用户听，别含糊成「放大全部文字」。\n  'settings.fontTitle': '字号',\n  'settings.fontHint': '三档放大全站文字。那个大号温度放得慢一些：它本来就是正文的四倍，跟着一起放大会把窄屏挤坏。',\n  'settings.font.normal': '默认',\n  'settings.font.large': '大',\n  'settings.font.xlarge': '特大',\n  'settings.fontDone': '字号已切换为「{mode}」',\n\n  // ---------- 离线壳版本（「我的」页那张卡） ----------\n  // 为什么要把版本号摆到界面上：浏览器只看 sw.js 自身的字节判断要不要更新，\n  // 真机可能一直跑着一份**很旧**的壳 —— 页面是旧的，但没有任何报错，只能靠猜。\n  // 这里显示的不是「仓库里最新的版本号」，而是 SW 自己报回来的、这台设备实际在用的那一份。\n  // ★绝不编版本号：拿不到就如实说「未知 / 本环境不支持」，不许拿常量或缓存名拼一个糊上去 ——\n  //   编出来的版本号比「未知」更糟，它会让人以为自己已经在跑新版。\n  'shell.title': '离线壳版本',\n  'shell.querying': '查询中…',\n  'shell.unknown': '未知（没读到本机离线壳的版本）',\n  'shell.unsupported': '本环境不支持离线壳（需要 https 或 localhost）',\n  'shell.checkBtn': '检查更新',\n  'shell.checking': '发现新版本，正在应用…',\n  'shell.upToDate': '已是最新',\n  'shell.compareUnknown': '没拿到要对比的版本号，无法确认是否最新；已催浏览器去查更新，刷新后再看上方版本号。',\n  'shell.checkFailed': '检查失败：{msg}',\n  'shell.fingerprint': '指纹 {fp}',\n  // 微信 / QQ 内置浏览器不运行 Service Worker：这不是「没更新」，是根本没壳可更新，必须说清楚\n  'shell.noSW': '这个浏览器不运行离线壳（微信、QQ 内置浏览器常见），换 Chrome / Edge / 360 打开才会自动更新。',\n  'shell.registered': '已注册离线壳，刷新一次页面后生效。',\n  'shell.onlineVersion': '线上最新：{v}',\n  'shell.localOlder': '本机 {local}，线上已是 {online}；已催更新，刷新页面即换新。',\n  'shell.hint': '浏览器有时会继续用旧的那份离线壳，这里显示的就是本机实际在用的那一份。如果它比你以为的旧，说明缓存还没换过来 —— 点「检查更新」可以手动催一次。',\n  // 全站提示条（src/ui/shellupdate.js）：新壳已装好、正等待接管时，任何页面顶部都会显示。\n  // reloadBtn 只出现在提示条上，刷新**由用户点**，不自动刷（会把正在输入的搜索词冲掉）。\n  'shell.updateReady': '有新版本已就绪',\n  'shell.reloadBtn': '立即刷新',\n\n  // ---------- 导出 CSV ----------\n  // 口径（与备份 JSON 那条隐私说明同一套规矩）：导出前就说清楚导的是什么、缺的项怎么表示。\n  // 特别注意「缺的项留空，不填 0」—— 本项目界面上缺失一律显示占位符「—」，但 CSV 里写\n  // 「—」会让 Excel 把整列判成文本列，数字列就废了；留空才是表格里「没有数据」的语义。\n  'settings.csvTitle': '导出 CSV',\n  'settings.csvHint': '把最近一次「此刻」数据导出成表格。UTF-8 带 BOM，Excel 直接打开不乱码；每一行一个时刻，缺的项留空（不填 0）。',\n  'settings.csvBtn': '导出 CSV 文件',\n  'settings.csvCurrent': '当前可导出：{time} · {place}',\n  'settings.csvNone': '当前可导出：暂无数据',\n  'settings.csvEmpty': '还没有可导出的数据 —— 先去「此刻」页取一次，它会自动存一份到本机。',\n  'settings.csvDone': '已导出 {name}',\n  'settings.csvFail': '导出失败：本机浏览器不支持文件下载',\n  'settings.csvNoSnapshot': '暂无快照可导出',\n\n  // CSV 表头（core/csv.js 消费）：每一列都对应界面上一个数字，不许出现界面上没有的量。\n  // 时间两列特意标出时区：导出时间跟文件名一样是设备本地时间，观测时刻是被查询\n  // 地点的当地时间。查异地时这两列本来就不一样，不明写会被当成 bug。\n  'csv.h.exportedAt': '导出时间（本机）',\n  'csv.h.observedAt': '观测时刻（当地）',\n  'csv.h.place': '地点',\n  'csv.h.lat': '纬度（度）',\n  'csv.h.lon': '经度（度）',\n  'csv.h.elevation': '海拔（m）',\n  'csv.h.temp': '气温（°C）',\n  'csv.h.feels': '体感（°C）',\n  'csv.h.humidity': '湿度（%）',\n  'csv.h.precip': '降水（mm）',\n  'csv.h.windSpeed': '风速（m/s）',\n  'csv.h.windDir': '风向',\n  'csv.h.beaufort': '蒲福风级',\n  'csv.h.pressure': '气压（hPa）',\n  'csv.h.visibility': '能见度（m）',\n  'csv.h.weather': '天气现象',\n  'csv.h.wmoCode': '天气码',\n  'csv.h.sunrise': '日出',\n  'csv.h.sunset': '日落',\n  'csv.h.dayLength': '昼长（分）',\n  'csv.h.uv': '紫外线指数',\n  'csv.h.uvLevel': '紫外线档位',\n  'csv.h.todayMax': '今日最高（°C）',\n  'csv.h.todayMin': '今日最低（°C）',\n  // ★与屏幕口径一致：空气卡上写的是 EAQI（欧洲标准），导出的两列也必须是同一把尺子。\n  'csv.h.aqi': '欧洲 AQI（EAQI）',\n  'csv.h.aqiLevel': 'EAQI 档位',\n  'csv.h.pm10': 'PM10（µg/m³）',\n  'csv.h.pm25': 'PM2.5（µg/m³）',\n  'csv.h.ozone': '臭氧（µg/m³）',\n  'csv.h.no2': '二氧化氮（µg/m³）',\n  'csv.h.declination': '磁偏角（度，东偏为正）',\n  'csv.h.sources': '数据来源',\n\n  // ---------- 图例与指标释义 ----------\n  // 「指标释义」是此刻页底部一个可展开的面板，把界面上那些专业数字讲成人话。\n  // ★阈值纪律（改这段文案前必须知道）：下面凡是出现**分档数字**的，全部由\n  //   src/ui/legend.js 从 src/core/wmo.js 的既有换算表**读出来**再拼进占位符，\n  //   这里一个阈值都不写死 —— 抄死数字等于将来改了换算表图例还在说谎。\n  //   代码里找不到现成分档的指标（气温 / 湿度 / 气压 / 能见度 / 污染物浓度 / 海拔 /\n  //   坐标 / 时区），一律只写「是什么 + 单位」，并如实标注 legend.noScale。\n  'legend.title': '指标释义',\n  'legend.open': '展开指标释义',\n  'legend.close': '收起指标释义',\n  'legend.note': '下面每一条对应界面上一个数字。分档只列本应用「已经实现」的那几套（蒲福风级、欧洲 AQI、UV 五档、风向 16 方位）；其余指标只说明含义与单位，不另立标准。',\n  'legend.noScale': '本应用没有对这项设分档，只显示数值与单位。',\n\n  'legend.group.weather': '天气',\n  'legend.group.air': '空气',\n  'legend.group.place': '位置与时间',\n\n  'legend.temp.title': '气温',\n  'legend.temp.unit': '°C',\n  'legend.temp.body': '离地 2 米高处的气温，取自数据源的 temperature_2m。',\n\n  'legend.feels.title': '体感温度',\n  'legend.feels.unit': '°C',\n  'legend.feels.body': '数据源给出的体感温度（apparent_temperature）：在气温之外还把风与湿度的影响算了进去。它是算出来的，不是另测一个数 —— 夏天比气温高、冬天比气温低都属正常。',\n\n  'legend.humidity.title': '相对湿度',\n  'legend.humidity.unit': '%',\n  'legend.humidity.body': '空气中实际水汽压与同温度下饱和水汽压之比（relative_humidity_2m）。100% 表示已饱和，此时容易起雾或结露。',\n\n  'legend.precip.title': '降水量',\n  'legend.precip.unit': 'mm',\n  'legend.precip.body': '当前时次累计的降水量（precipitation），单位毫米。这是「下了多少」，不是「会不会下」—— 会不会下看下面那条降水概率。',\n\n  'legend.pop.title': '降水概率',\n  'legend.pop.unit': '%',\n  'legend.pop.body': '当前这一小时出现降水的概率（precipitation_probability），单位百分比。它是**逐时**量，界面显示的是与「观测时刻」对上的那一小时。取不到时显示占位符「—」，不按 0% 显示 —— 0% 是「确定不下」，与「不知道」不是一回事。',\n\n  'legend.wind.title': '风速',\n  'legend.wind.unit': 'm/s',\n  'legend.wind.body': '离地 10 米处的风速（wind_speed_10m），单位米每秒；界面同时给出公里每小时换算（1 m/s = 3.6 km/h）。',\n\n  'legend.beaufort.title': '蒲福风级',\n  'legend.beaufort.unit': '级',\n  'legend.beaufort.body': '把风速分成 0–12 级，界面上「清风（4 级）」就是这么来的。级名与阈值取自本应用的换算表：',\n  'legend.beaufort.row': '{level} 级 · {name} · 小于 {max} m/s',\n  'legend.beaufort.rowLast': '{level} 级 · {name} · {min} m/s 及以上',\n\n  'legend.winddir.title': '风向',\n  'legend.winddir.unit': '°',\n  'legend.winddir.body': '风的**来向**（wind_direction_10m），按每 22.5° 一段切成 16 个方位。「西北偏北风」说的是风从西北偏北吹来，不是吹向那边：',\n  'legend.winddir.row': '{dir}',\n\n  'legend.pressure.title': '气压',\n  'legend.pressure.unit': 'hPa',\n  'legend.pressure.body': '地面气压（surface_pressure），单位百帕。数值随海拔与天气系统起伏，单看一个绝对值意义不大。',\n\n  'legend.visibility.title': '能见度',\n  'legend.visibility.unit': 'm / km',\n  'legend.visibility.body': '水平方向能看清的最远距离（visibility）。不足 1000 米时按米显示，达到 1000 米后换算成公里并保留一位小数。',\n\n  'legend.uv.title': '紫外线指数',\n  'legend.uv.unit': '无量纲',\n  'legend.uv.body': '当天的紫外线指数最大值（uv_index_max），是个无量纲指数。五档与对应建议取自本应用既有的换算表：',\n  'legend.uv.row': '{min}–{max} · {name} · {advice}',\n  'legend.uv.rowLast': '{min} 及以上 · {name} · {advice}',\n\n  'legend.sun.title': '日出与日落',\n  'legend.sun.unit': '本地时刻',\n  'legend.sun.body': '由数据源按当地时区给出（daily.sunrise / sunset）。数据源没给时，改用本机内置的 NOAA 算法推算。',\n\n  'legend.dayLength.title': '昼长',\n  'legend.dayLength.unit': '时 · 分',\n  'legend.dayLength.body': '日落减日出，即白昼时长。极昼或极夜时数据源可能给不出这两个时刻，那一刻显示占位符「—」。',\n\n  'legend.today.title': '今日最高 / 最低',\n  'legend.today.unit': '°C',\n  'legend.today.body': '数据源给出的当日最高温与最低温（temperature_2m_max / _min）。这是**全天预报值**，不是此刻的实测值。',\n\n  'legend.wmo.title': '天气现象',\n  'legend.wmo.unit': 'WMO 码',\n  'legend.wmo.body': '图标与描述由 WMO 天气码翻译而来（0–99，例如 0 是晴、61 是小雨）。取不到码、或码非法时显示「未知天气」—— 不会把「没数据」误报成晴天。',\n\n  'legend.observedAt.title': '观测时刻',\n  'legend.observedAt.unit': '本地时刻',\n  'legend.observedAt.body': '数据源给出的当前数据时次，已按当地时间偏移换算成本地时间显示。',\n\n  'legend.aqi.title': '欧洲 AQI',\n  'legend.aqi.unit': '无量纲',\n  'legend.aqi.body': '数据源直接给出的欧洲 AQI（european_aqi）：把多种污染物折算成一个数，越小越好。本应用只负责把它分成六档，档位与建议如下：',\n  'legend.aqi.row': '{min}–{max} · {name} · {advice}',\n  'legend.aqi.rowLast': '{min} 及以上 · {name} · {advice}',\n\n  'legend.pollutants.title': 'PM2.5 / PM10 / O₃ / NO₂',\n  'legend.pollutants.unit': 'µg/m³',\n  'legend.pollutants.body': '四种污染物浓度，单位微克每立方米。本应用不对单项污染物分级 —— 分级只针对上面那个欧洲 AQI，这四项只是构成它的原料，所以这里也就不给档位。',\n\n  'legend.elevation.title': '海拔',\n  'legend.elevation.unit': 'm',\n  'legend.elevation.body': '所在地点的海拔（Open-Meteo Elevation），单位米。取不到时显示占位符「—」。',\n\n  'legend.coord.title': '坐标',\n  'legend.coord.unit': '度（WGS84）',\n  'legend.coord.body': 'WGS84 经纬度，保留四位小数（约 11 米精度）。收藏与跨页跳转都以这两个数作为地点的身份。',\n\n  'legend.tz.title': '时区偏移',\n  'legend.tz.unit': '秒',\n  'legend.tz.body': '数据源返回的「当地时区相对 UTC 的偏移」（utc_offset_seconds）。日出日落与观测时刻都是按它换算的 —— 它一变，这几个时刻会跟着变。',\n\n  // ---------- WMO 天气码 ----------\n  // core/wmo.js 的 wmo(code) 只返回 `{ key, shortKey, icon }`，**不给中文串** ——\n  // core 层不许读 locale 表。这 28 组 key 由 UI 层 t() 之后才变成人话。\n  // 分 full / short 两档：short 用在窄处（英雄区副行、对比页），full 用在图例与表格。\n  'wmo.0': '晴',\n  'wmo.0.short': '晴',\n  'wmo.1': '大部晴朗',\n  'wmo.1.short': '晴间少云',\n  'wmo.2': '局部多云',\n  'wmo.2.short': '多云',\n  'wmo.3': '阴',\n  'wmo.3.short': '阴',\n  'wmo.45': '雾',\n  'wmo.45.short': '雾',\n  'wmo.48': '沉积雾凇雾',\n  'wmo.48.short': '雾凇',\n  'wmo.51': '小毛毛雨',\n  'wmo.51.short': '毛毛雨',\n  'wmo.53': '中毛毛雨',\n  'wmo.53.short': '毛毛雨',\n  'wmo.55': '大毛毛雨',\n  'wmo.55.short': '毛毛雨',\n  'wmo.56': '冻毛毛雨（弱）',\n  'wmo.56.short': '冻毛毛雨',\n  'wmo.57': '冻毛毛雨（强）',\n  'wmo.57.short': '冻毛毛雨',\n  'wmo.61': '小雨',\n  'wmo.61.short': '小雨',\n  'wmo.63': '中雨',\n  'wmo.63.short': '中雨',\n  'wmo.65': '大雨',\n  'wmo.65.short': '大雨',\n  'wmo.66': '冻雨（弱）',\n  'wmo.66.short': '冻雨',\n  'wmo.67': '冻雨（强）',\n  'wmo.67.short': '冻雨',\n  'wmo.71': '小雪',\n  'wmo.71.short': '小雪',\n  'wmo.73': '中雪',\n  'wmo.73.short': '中雪',\n  'wmo.75': '大雪',\n  'wmo.75.short': '大雪',\n  'wmo.77': '米雪',\n  'wmo.77.short': '米雪',\n  'wmo.80': '小阵雨',\n  'wmo.80.short': '阵雨',\n  'wmo.81': '中阵雨',\n  'wmo.81.short': '阵雨',\n  'wmo.82': '强阵雨',\n  'wmo.82.short': '暴雨',\n  'wmo.85': '小阵雪',\n  'wmo.85.short': '阵雪',\n  'wmo.86': '大阵雪',\n  'wmo.86.short': '阵雪',\n  'wmo.95': '雷阵雨',\n  'wmo.95.short': '雷阵雨',\n  'wmo.96': '雷阵雨伴小冰雹',\n  'wmo.96.short': '雷暴冰雹',\n  'wmo.99': '雷阵雨伴大冰雹',\n  'wmo.99.short': '强雷暴冰雹',\n  // 未知码兜底：★必须与「取不到数据」同义，不能是「晴」。\n  'wmo.unknown': '未知天气',\n  'wmo.unknown.short': '未知',\n\n  // ---------- 蒲福风级 0–12 ----------\n  'bf.0': '无风',\n  'bf.1': '软风',\n  'bf.2': '轻风',\n  'bf.3': '微风',\n  'bf.4': '和风',\n  'bf.5': '清风',\n  'bf.6': '强风',\n  'bf.7': '疾风',\n  'bf.8': '大风',\n  'bf.9': '烈风',\n  'bf.10': '狂风',\n  'bf.11': '暴风',\n  'bf.12': '飓风',\n\n  // ---------- 风向 16 方位 ----------\n  // full 用在图例（要写全名），abbr 用在此刻页那个数字后面（要短）。\n  // 中文两档同值 —— 中文没有「缩写更短」的习惯，硬造一个反而不如原名清楚。\n  'dir.0': '北',\n  'dir.0.abbr': '北',\n  'dir.1': '东北偏北',\n  'dir.1.abbr': '东北偏北',\n  'dir.2': '东北',\n  'dir.2.abbr': '东北',\n  'dir.3': '东北偏东',\n  'dir.3.abbr': '东北偏东',\n  'dir.4': '东',\n  'dir.4.abbr': '东',\n  'dir.5': '东南偏东',\n  'dir.5.abbr': '东南偏东',\n  'dir.6': '东南',\n  'dir.6.abbr': '东南',\n  'dir.7': '东南偏南',\n  'dir.7.abbr': '东南偏南',\n  'dir.8': '南',\n  'dir.8.abbr': '南',\n  'dir.9': '西南偏南',\n  'dir.9.abbr': '西南偏南',\n  'dir.10': '西南',\n  'dir.10.abbr': '西南',\n  'dir.11': '西南偏西',\n  'dir.11.abbr': '西南偏西',\n  'dir.12': '西',\n  'dir.12.abbr': '西',\n  'dir.13': '西北偏西',\n  'dir.13.abbr': '西北偏西',\n  'dir.14': '西北',\n  'dir.14.abbr': '西北',\n  'dir.15': '西北偏北',\n  'dir.15.abbr': '西北偏北',\n  // 风向是**来向**。中文靠后缀「风」、英文靠介词 from，两种语言语序不同 ——\n  // 所以整句作为一条模板翻译，只插方位名，不拼片段。\n  'w.windFrom': '{dir}风',\n\n  // ---------- 分档名（欧洲 AQI 六档 / UV 五档） ----------\n  'level.aqi.good': '优',\n  'level.aqi.fair': '良',\n  'level.aqi.moderate': '中',\n  'level.aqi.poor': '差',\n  'level.aqi.very-poor': '很差',\n  'level.aqi.extreme': '极差',\n  'level.uv.low': '低',\n  'level.uv.moderate': '中',\n  'level.uv.high': '高',\n  'level.uv.very-high': '很高',\n  'level.uv.extreme': '极高',\n\n  // ---------- 时长 / 相对时间 / 陈旧时长 ----------\n  // core/format.js 那三个函数只产出 { unit, value } 这样的**结构化量**，\n  // 整句在这里翻译 —— 中英文语序不同（「10 小时 32 分」 vs \"10h 32m\"、\n  // 「3 分钟前」 vs \"3 min ago\"），拼片段必错，只能整句插值。\n  'fmt.duration.hm': '{h} 小时 {m} 分',\n  'fmt.duration.m': '{m} 分',\n  'fmt.ago.now': '刚刚',\n  'fmt.ago.minute': '{n} 分钟前',\n  'fmt.ago.hour': '{n} 小时前',\n  'fmt.ago.day': '{n} 天前',\n  'fmt.ago.month': '{n} 个月前',\n  'fmt.stale.second': '{n} 秒',\n  'fmt.stale.minute': '{n} 分钟',\n  'fmt.stale.hour': '{n} 小时',\n  'fmt.stale.day': '{n} 天',\n\n  // ---------- 默认地点名 ----------\n  // core/geo.js 与 core/store.js 里的默认地点只存经纬度 + 一个**稳定标记名**，\n  // 显示名由这里给 —— core 不许读 locale 表，但「北京 · 天安门」是个地名，\n  // 英文界面下必须写成 \"Beijing · Tian'anmen\"。\n  'place.default': '北京 · 天安门',\n\n  // ---------- 各页 <meta> 与读屏标签 ----------\n  // HTML 外壳里那些**没有子元素**的位置（meta description / iOS 主屏名）与\n  // 读屏软件念的 aria-label，同样看得见（只是有的用耳朵看），所以也走 i18n。\n  'app.shortName': '地候',\n  'app.description': '地候 GeoScope —— 自用地理气象速览，此刻此地的一屏数据。',\n  'desc.selfcheck': '地候 GeoScope —— 数据源自检：逐源取样，看清哪一路通、哪一路不通。',\n  'desc.compass': '地候 GeoScope —— 磁偏角与真/磁方位换算，本机 WMM2025 计算，不联网。',\n  'desc.settings': '地候 GeoScope —— 备份导出与导入、主题切换，数据只留本机，不联网。',\n  'desc.compare': '地候 GeoScope —— 多地点对比：把收藏地点的同一批指标并排列出来。',\n  // ★地理页（compass.html）：地点（海拔 / 坐标 / 地名）+ 底图 + 方位·磁偏角 + 完整罗盘。\n  //   2026-10-17 导航重构：方位页升级为「地理」主 tab，页面描述随之从「方位·磁偏角」\n  //   扩到整页内容 —— 罗盘那部分仍在本页，只是不再是唯一的主题。\n  'desc.geo': '地候 GeoScope —— 地理：海拔、坐标与地名，配底图、方位·磁偏角与完整罗盘。',\n  'a11y.mainNav': '主导航',\n  'a11y.checkParams': '自检参数',\n  'a11y.located': '位置已更新：{place}',\n  'a11y.weather': '天气已更新：{temp}，{desc}',\n  // ---------- 界面语言 ----------\n  // 切换器在「我的」页。★两档的显示名一律用**各自语言自己的写法**\n  // （中文界面写「English」而不是「英文」）—— 用户看不懂当前界面语言时，\n  // 唯一能救他的正是那个用他母语写着的选项名。\n  'settings.langTitle': '语言',\n  'settings.langHint': '切换全站文案语言。地点名与数值不受影响，它们本来就是数据源给的原文。',\n  'settings.lang.zh': '中文',\n  'settings.lang.en': 'English',\n  'settings.langDone': '语言已切换为「{name}」',\n\n  // ---------- 数据源署名 ----------\n  // 署名是许可条款要求的原文，服务商名与协议名（CC-BY 4.0 / ODbL）一律不译；\n  // 只有「基于」这类说明词跟着界面语言走。★括号用各语言自己的全角/半角习惯。\n  'attr.openmeteo': 'Open-Meteo.com（CC-BY 4.0）',\n  'attr.photon': 'Photon by Komoot（基于 OpenStreetMap，ODbL）',\n  'attr.tile': 'Esri ArcGIS Online World Tile Service',\n\n  // ---------- 备份导入失败原因 ----------\n  // core/backup.js 只回 reasonKey / reasonParams（core 不许 import i18n），\n  // 由 UI 层拼进 settings.importFail 的 {reason} 里上屏。\n  'backup.badJson': '不是合法 JSON',\n  'backup.notObject': '备份内容不是 JSON 对象',\n  'backup.badSchema': '备份格式版本不支持（schema={schema}）',\n  'backup.notGeoscope': '不是地候的备份文件',\n  'backup.noPrefs': '缺少 prefs',\n  'backup.badDefaultPlace': 'defaultPlace 坐标非法（lat/lon 必须是有限数字，纬度 ±90、经度 ±180 内）',\n  'backup.planNoDefaultPlace': '导入计划里没有合法的 defaultPlace（请先调用 inspectBackup）',\n  'backup.planNoFavorites': '导入计划里没有 favorites 数组（请先调用 inspectBackup）',\n  'backup.writeFailed': '写入本机状态失败：{msg}',\n\n  // ---------- 瓦片坐标非法 ----------\n  // data 层可以 import i18n（只有 core 不行），所以这里直接在抛出点翻译。\n  'tile.badCoord': '瓦片坐标非法（z={z}, x={x}, y={y}），未发起请求',\n};\n",
  "src/i18n/en.js": "/**\n * 英文文案表（i18n 的一份表，不是入口）\n *\n * ★与 src/i18n/zh.js **逐键同构**：tools/check.mjs 第 14 节双向校验两张表的 key 集合\n *   完全相等 —— 多一个、少一个都报红。新增 key 必须两张表一起加。\n *\n * 翻译纪律（不是机翻，改文案前请读）：\n *   1) **整句翻译，不拼片段**。中英语序不同（「体感 26°」 vs \"Feels like 26°\"、\n *      「3 分钟前」 vs \"3 min ago\"），占位符只用来插数字 / 地名 / 方位名这类**值**，\n *      绝不把一句话拆成几段再拼回去。\n *   2) **单位与数值口径不变**：界面一律公制（°C / m/s / hPa / km），英文版同样用公制 ——\n *      数据源给的就是公制，换成英里只会引入换算错误。\n *   3) **如实，不夸大**。中文版写着「本应用没有对这项设分档」的地方，英文版一样要写；\n *      中文版区分「失败」与「没有这个地方」的地方，英文版也必须分成两句。\n *   4) 地名、数据源名、缩写（WMO / AQI / UV / WGS84 / PM2.5）保留原样，不翻译。\n */\n\n/** 英文文案表：扁平 key → 字符串。 */\nexport const EN = {\n  // ---------- General ----------\n  'app.name': 'GeoScope',\n  'app.tagline': 'Here · Now',\n  'app.loading': 'Loading…',\n  'app.retry': 'Retry',\n  'app.refresh': 'Refresh',\n  'app.unknown': 'Unknown',\n  'app.dash': '—',\n  'app.na': 'None yet',\n  'app.about': 'About & limits',\n  'app.copy': 'Copy',\n\n  // ---------- Tabs ----------\n  'tab.now': 'Now',\n  'tab.selfcheck': 'Check',\n  'tab.compass': 'Bearing',\n  'tab.settings': 'Me',\n  'tab.geo': 'Geo',\n  'tab.climate': 'Climate',\n\n  // ---------- Data sources ----------\n  'source.weather': 'Weather (Open-Meteo Forecast)',\n  'source.air': 'Air quality (Open-Meteo Air Quality)',\n  'source.geocode': 'Place search (Open-Meteo Geocoding)',\n  'source.elevation': 'Elevation (Open-Meteo Elevation)',\n  'source.reverse': 'Reverse geocoding (Photon)',\n  'source.tile': 'Basemap tiles (ArcGIS Online)',\n  // Climate averages: ERA5 1991–2020 daily reanalysis, aggregated locally by calendar month.\n  'source.climate': 'Climate averages (Open-Meteo ERA5 archive)',\n\n  // ---------- Climate averages (1991–2020 monthly / annual) ----------\n  // ★Red line: `climate.entryNote` must be rendered as the whole sentence — never\n  //   shortened to \"climate normals\". These are self-computed ERA5 reanalysis averages.\n  'climate.title': 'Climate averages (1991–2020)',\n  'climate.entryNote': 'Self-computed monthly averages from the ERA5 reanalysis, 1991–2020 · not an official climate normal',\n  // Whole-sentence template, numbers only (English word order differs — never concatenate\n  // fragments). {lat}/{lon} is the ERA5 0.25° grid cell centre, {km} its distance from the\n  // queried point; if any of them is missing the whole line is hidden (see renderClimateCard).\n  'climate.gridNote': 'Values come from the ERA5 grid cell at {lat}, {lon}, about {km} km from the point you looked up',\n  'climate.loadBtn': 'Show monthly averages',\n  'climate.loading': 'Fetching 30 years of reanalysis data…',\n  'climate.colMonth': 'Month',\n  'climate.colHigh': 'Avg high',\n  'climate.colLow': 'Avg low',\n  'climate.colPrecip': 'Precip.',\n  'climate.annual': 'Annual',\n  'climate.annualHigh': 'Annual avg high',\n  'climate.annualLow': 'Annual avg low',\n  'climate.annualPrecip': 'Annual precip. total',\n  'climate.sample': 'Based on {n} days · {years} years',\n  'climate.m1': 'Jan',\n  'climate.m2': 'Feb',\n  'climate.m3': 'Mar',\n  'climate.m4': 'Apr',\n  'climate.m5': 'May',\n  'climate.m6': 'Jun',\n  'climate.m7': 'Jul',\n  'climate.m8': 'Aug',\n  'climate.m9': 'Sep',\n  'climate.m10': 'Oct',\n  'climate.m11': 'Nov',\n  'climate.m12': 'Dec',\n  'climate.err': 'Could not load the climate averages',\n  'climate.retry': 'Retry',\n\n  // ---------- Status words ----------\n  'status.idle': 'Not requested',\n  'status.ok': 'OK',\n  'status.stale': 'Stale',\n  'status.degraded': 'Degraded',\n  'status.failed': 'Failed',\n  'status.offline': 'Offline',\n  'status.running': 'Running',\n\n  // ---------- Error codes ----------\n  'error.OFFLINE': 'Device is offline, no request was made',\n  'error.TIMEOUT': 'Request timed out (no response within {ms} ms)',\n  'error.HTTP': 'Data source returned HTTP {status}',\n  'error.NETWORK': 'Network unreachable, request could not complete',\n  'error.PARSE': 'Failed to parse the response (unexpected data format)',\n  'error.ABORT': 'Request was cancelled',\n  'error.EMPTY': 'Empty response (the source returned nothing)',\n  'error.UNSUPPORTED': 'Unregistered source or unsupported capability',\n\n  // ---------- Overall degraded modes ----------\n  'mode.live': 'Live data',\n  'mode.stale': 'Some data is stale, showing the last usable result',\n  'mode.partial': 'Some sources are unavailable, the rest is fine',\n  'mode.offline': 'Device is offline, showing on-device cache',\n  'mode.no-map': 'Basemap unavailable, switched to coordinates-only mode',\n  // grid only ever appears in the banner: all five APIs are fine, it is just that a few\n  // tiles are missing and the basemap fell back to a grid. Must NOT reuse mode.partial —\n  // \"the rest is fine\" would be a lie here (the data is fine, the basemap is what broke),\n  // and it would make the reader think weather / air broke too.\n  'mode.grid': 'Some tiles missing · fell back to grid',\n  'mode.empty': 'No data available',\n\n  // ---------- Now screen ----------\n  'now.title': 'Now',\n  'now.defaultPlaceNotice': 'No location fix, showing the default place',\n  'now.locating': 'Getting your location…',\n  'now.gpsOk': 'Location acquired',\n  'now.updatedAt': 'Updated {time}',\n  'now.staleNote': 'Data from {ago}, it may be out of date',\n  'now.observeAt': 'Observed at {time}',\n\n  'card.weather': 'Weather',\n  // The curve covers **today 00:00–23:00 local** (the upstream hourly series starts at local\n  // midnight, see slice(0,24) in openmeteo.js) — not a rolling 24 h window. The title has to\n  // say \"today\", otherwise at 20:00 the chart reads as if it ran into tomorrow.\n  'card.hourly': 'Hourly today',\n  'hourly.hint': 'Tap the curve to inspect an hour',\n  'hourly.empty': 'Hourly data unavailable',\n  'hourly.at': '{hour}:00',\n  'hourly.nowLabel': 'Now',\n  'hourly.a11y': 'Hourly temperature today, high {max}, low {min}',\n  // Share poster: button and result announcements only — the stat labels inside the\n
