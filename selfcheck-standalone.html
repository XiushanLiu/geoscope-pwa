'';\n  if (typeof search === 'string') raw = search;\n  else if (typeof location !== 'undefined' && location && typeof location.search === 'string') raw = location.search;\n\n  let params = null;\n  try {\n    params = new URLSearchParams(raw.replace(/^\\?/, ''));\n  } catch (err) {\n    return null;\n  }\n\n  const rawLat = params.get('lat');\n  const rawLon = params.get('lon');\n  // 缺任一参数 → null（「只有 lat 没有 lon」是非法，不是「lon 取 0」）\n  if (rawLat === null || rawLon === null) return null;\n  const sLat = String(rawLat).trim();\n  const sLon = String(rawLon).trim();\n  // 先卡字面量形态，再 Number()：空串 / 空白 / 十六进制（0x10）/ Infinity / NaN /\n  // 科学计数法（1e2）/ 前导 '+' / 省略整数位的 '.5' / 尾随小数点的 '31.' 全部拦下\n  // （见上方 JSDoc 与 DECIMAL_LITERAL_RE 的取舍说明）。\n  // ★但 '0' 与 '-0' 必须放行：0,0（几内亚湾）是个真实地点，不能因为「像空值」被误杀。\n  if (!DECIMAL_LITERAL_RE.test(sLat) || !DECIMAL_LITERAL_RE.test(sLon)) return null;\n  const lat = Number(sLat);\n  const lon = Number(sLon);\n  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;\n  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;\n\n  // name 可有可无；中文名由 encodeURIComponent 编过，解不出来（乱码）也只是名字难看，\n  // 坐标与天气照常工作 —— 所以这里退化成空串，绝不因为它抛异常。\n  let name = '';\n  try {\n    name = String(params.get('name') || '');\n  } catch (err) {\n    name = '';\n  }\n  return { lat, lon, name, source: 'explicit' };\n}\n\n/**\n * 由 coord 解析出 base 坐标与「是否默认地点」。\n *\n * ★`isDefaultPlace` 只认 `source === 'default'`（真正走了本模块的定位兜底），\n * 不能写成 `base.source !== 'gps'`：收藏跳转与搜索结果带的是 `source:'explicit'`，\n * 按旧写法会被判成「默认地点」，于是用户明明点的是自己收藏的上海或刚搜到的北京，\n * 界面却写着「未取得定位，正在显示默认地点」—— 一句彻头彻尾的假话。\n * 抽成函数是为了让这条语义能被单测直接钉死（见 tests/favorites.test.mjs）。\n *\n * ★默认地点的名字是**地名**，界面上跟着语言走（英文界面写 \"Beijing · Tian'anmen\"）。\n *   core/geo.js 存的是中文那一版原文（要写进备份），翻译由 `ui/locale.js` 的\n *   `placeDisplayName()` 在这一层补 —— 所以调用方必须把它们作为 `opts` 传进来\n *   （core 层不许 import `src/i18n/`，也不许 import `ui/locale.js`；\n *    也不许 import `core/store.js` 去读「用户改过的默认地点」——\n *    那是 UI 的策略，不是坐标算法的职责）。\n *\n * ★2026-10-17 导航重构：本函数从 `src/ui/app.js` 迁来（理由同 parsePlaceParam）。\n *   迁移时把两处**外部依赖**改成入参，行为由调用方决定，不是由 core 层替它决定：\n *   - `opts.defaultPlace`：兜底地点。app.js 传 `store.getDefaultPlace()`\n *     （用户在「我的」页改过的那份），不传则退回本模块的出厂 `DEFAULT_PLACE`；\n *   - `opts.displayName`：地名翻译函数（`ui/locale.js` 的 `placeDisplayName`）。\n *\n * @param {{lat:number, lon:number, source:string, name?:string|null}} coord 定位结果。\n * @param {{defaultPlace?:{lat:number, lon:number, name?:string|null}|null,\n *          displayName?:(name:string|null) => string}} [opts] 选项（见上）。\n * @returns {{base:{lat:number, lon:number, source:string, name?:string|null}, isDefaultPlace:boolean}} 解析结果。\n */\nexport function resolveCoord(coord, opts = {}) {\n  const src = coord && typeof coord === 'object' ? coord : {};\n  const fallback = src.source === 'default' ? opts.defaultPlace || DEFAULT_PLACE : null;\n  const nameOf = typeof opts.displayName === 'function' ? opts.displayName : (n) => n;\n  const base = src.source === 'default' && fallback\n    ? { lat: fallback.lat, lon: fallback.lon, source: 'default', name: nameOf(fallback.name) }\n    : src;\n  return { base, isDefaultPlace: base.source === 'default' };\n}\n",
  "src/core/format.js": "/**\n * 格式化工具（纯函数，无副作用、无网络）\n *\n * 职责：把「存储层的原始数值」转成「上屏的人类可读字符串」。单位换算只发生在展示层，\n * 存储与接口层固定使用：温度 °C / 风速 m·s⁻¹ / 风向 deg / 气压 hPa / 能见度 m /\n * 降水量 mm / 海拔 m / 污染物 µg·m⁻³ / 时延 ms / 字节 byte。\n *\n * 约束：所有函数对 null / undefined / NaN 一律返回占位符（'—'），绝不抛异常。\n */\n\n/** 占位符：数值缺失时统一展示。 */\nexport const DASH = '—';\n\n/**\n * 安全取数：非有限数字返回 null，便于上层决定显示占位符。\n *\n * @param {*} v 任意值。\n * @returns {number|null} 有限数字或 null。\n */\nfunction _num(v) {\n  // 硬规则：缺失绝不显示成 0。必须显式拦截的几类「看起来有值其实是空」的入参：\n  //   - null / undefined：Number(null) === 0，不拦截就会把「没数据」渲染成 0°；\n  //   - 布尔：true → 1、false → 0，同样是伪装成数值的空值；\n  //   - 纯空白串 '' / ' ' / '\\t' / '\\n'：Number('') 与 Number(' ') 都是 0，必须先 trim 再判空；\n  //   - 数组（含 [] 与 [0]）：Number([]) === 0、Number([0]) === 0，而数组从来不是标量温度。\n  // 数字字符串（'23'）走正常解析，不能被误判成缺失。\n  if (v === null || v === undefined) return null;\n  if (typeof v === 'boolean') return null;\n  if (Array.isArray(v)) return null;\n  if (typeof v === 'string' && v.trim() === '') return null;\n  const n = typeof v === 'number' ? v : Number(v);\n  return Number.isFinite(n) ? n : null;\n}\n\n/**\n * 固定小数位格式化。\n *\n * @param {*} v 数值。\n * @param {number} [digits=0] 小数位数。\n * @param {string} [unit=''] 追加单位。\n * @returns {string} 形如 '23.4 °C'；缺失时返回 '—'。\n */\nexport function num(v, digits = 0, unit = '') {\n  const n = _num(v);\n  if (n === null) return DASH;\n  const s = n.toFixed(digits);\n  return unit ? `${s} ${unit}` : s;\n}\n\n/** 温度：'23°'（展示层可不带 °C，单位另由标签给出）。 */\nexport function tempC(v, digits = 0) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(digits)}°`;\n}\n\n/** 体感温度：'体感 26°' 里的数值部分。 */\nexport function feelsC(v, digits = 0) {\n  return tempC(v, digits);\n}\n\n/** 湿度：'48%'。 */\nexport function humidity(pct) {\n  const n = _num(pct);\n  if (n === null) return DASH;\n  return `${Math.round(n)}%`;\n}\n\n/**\n * 通用百分比：'30%'；缺失时返回 '—'。\n *\n * 为什么单独给一个而不复用 humidity()：两者此刻的算法恰好一样（取整 + '%'），\n * 但 humidity 的语义是「相对湿度」，降水概率若借它的函数名，将来任一方改了取整\n * 口径（比如湿度保留一位小数）都会连带改错另一方 —— 语义不同就该各自有名。\n *\n * @param {*} v 百分比数值。\n * @param {number} [digits=0] 小数位数。\n * @returns {string} '30%' 或 '—'。\n */\nexport function percent(v, digits = 0) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(digits)}%`;\n}\n\n/** 降水：'0.4 mm'；0 显示为 '0 mm'。 */\nexport function precipMm(v) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(1)} mm`;\n}\n\n/** 风：'3.2 m/s · 11.5 km/h'。 */\nexport function wind(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  const kmh = n * 3.6;\n  return `${n.toFixed(1)} m/s · ${kmh.toFixed(1)} km/h`;\n}\n\n/** 气压：'1013 hPa'。 */\nexport function pressure(hpa) {\n  const n = _num(hpa);\n  if (n === null) return DASH;\n  return `${Math.round(n)} hPa`;\n}\n\n/** 能见度：≥1000 m 转 km，否则保留 m。 */\nexport function visibility(m) {\n  const n = _num(m);\n  if (n === null) return DASH;\n  if (n >= 1000) return `${(n / 1000).toFixed(1)} km`;\n  return `${Math.round(n)} m`;\n}\n\n/** 海拔：'43 m'。 */\nexport function elevationM(m) {\n  const n = _num(m);\n  if (n === null) return DASH;\n  return `${Math.round(n)} m`;\n}\n\n/** 污染物浓度：'12.3 µg/m³'。 */\nexport function pollutant(v) {\n  const n = _num(v);\n  if (n === null) return DASH;\n  return `${n.toFixed(1)} µg/m³`;\n}\n\n/** 时延：'123 ms'；≥1000 时保留整数毫秒。 */\nexport function latency(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  return `${Math.round(n)} ms`;\n}\n\n/** 字节：'12.3 KB'。 */\nexport function bytes(n) {\n  const v = _num(n);\n  if (v === null) return DASH;\n  if (v < 1024) return `${v} B`;\n  if (v < 1024 * 1024) return `${(v / 1024).toFixed(1)} KB`;\n  return `${(v / 1024 / 1024).toFixed(2)} MB`;\n}\n\n/** 补零两位。 */\nexport function pad2(n) {\n  const v = _num(n);\n  if (v === null) return '00';\n  return String(Math.floor(v)).padStart(2, '0');\n}\n\n/**\n * 毫秒 epoch → 'HH:MM'（按给定时区偏移）。\n *\n * @param {number|null} atMs 毫秒 epoch。\n * @param {number} [offsetSec=0] 目标时区相对 UTC 的偏移秒数（东为正）。\n * @returns {string} '07:12' 或 '—'。\n */\nexport function hhmm(atMs, offsetSec = 0) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  const d = new Date(n + offsetSec * 1000);\n  return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;\n}\n\n/**\n * 毫秒 epoch → 'MM-DD HH:MM'。\n *\n * @param {number|null} atMs 毫秒 epoch。\n * @param {number} [offsetSec=0] 时区偏移秒数。\n * @returns {string} '01-05 07:12' 或 '—'。\n */\nexport function mdHm(atMs, offsetSec = 0) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  const d = new Date(n + offsetSec * 1000);\n  return `${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;\n}\n\n/**\n * 昼长毫秒 → **结构化时长量**（不是字符串）。\n *\n * ★为什么不再直接返回 '10 小时 32 分'：本模块在 core 层，不许 import i18n（core 读\n *   locale 状态 = 最底层反向依赖上层）。而时长的**语序是语言相关的** —— 中文\n *   「10 小时 32 分」、英文 \"10h 32m\"，把「小时」「分」两个词翻出来再拼回去必然拼错\n *   （英文根本不是「10 hours 32 minutes」的写法）。所以整句作为一条模板留在文案表里，\n *   这里只产出 `{ key, params }`，由 UI 层 `tr()` 翻译。\n *\n * @param {*} ms 毫秒数。\n * @returns {{key:string, params:Object}|string} 结构化量；缺失时返回 DASH（'—'，它本身就是文本，tr() 会原样透传）。\n */\nexport function duration(ms) {\n  const n = _num(ms);\n  if (n === null) return DASH;\n  const totalMin = Math.round(n / 60000);\n  const h = Math.floor(totalMin / 60);\n  const m = totalMin % 60;\n  if (h <= 0) return { key: 'fmt.duration.m', params: { m } };\n  return { key: 'fmt.duration.hm', params: { h, m } };\n}\n\n/**\n * 坐标 → '39.9087°N, 116.3975°E'（WGS84，四位小数 ≈ 11 m）。\n *\n * @param {number|null} lat 纬度。\n * @param {number|null} lon 经度。\n * @returns {string} 坐标文本或 '—'。\n */\nexport function coord(lat, lon) {\n  const la = _num(lat);\n  const lo = _num(lon);\n  if (la === null || lo === null) return DASH;\n  const ns = la >= 0 ? 'N' : 'S';\n  const ew = lo >= 0 ? 'E' : 'W';\n  return `${Math.abs(la).toFixed(4)}°${ns}, ${Math.abs(lo).toFixed(4)}°${ew}`;\n}\n\n/**\n * 相对时间 → **结构化量**（'刚刚' / '3 分钟前' / '2 小时前' / '3 天前' 的骨架）。\n *\n * 与 duration() 同一条理由：'3 分钟前' 在英文里是 \"3 min ago\"，**语序与词序都不同**，\n * 拼片段必错。这里只决定「用哪个时间单位 + 数字是多少」，话怎么说是文案表的事。\n *\n * @param {number|null} atMs 过去时刻（ms epoch）。\n * @param {number} [nowMs=Date.now()] 参照时刻。\n * @returns {{key:string, params:Object}|string} 结构化量；缺失时返回 DASH。\n */\nexport function relativeTime(atMs, nowMs = Date.now()) {\n  const n = _num(atMs);\n  if (n === null) return DASH;\n  // 未来时刻（时钟漂移 / 服务端时间偏快）也按「刚刚」处理，避免出现「-3 分钟前」\n  const diff = nowMs - n;\n  if (diff < 60000) return { key: 'fmt.ago.now', params: {} };\n  const min = Math.floor(diff / 60000);\n  if (min < 60) return { key: 'fmt.ago.minute', params: { n: min } };\n  const hour = Math.floor(min / 60);\n  if (hour < 24) return { key: 'fmt.ago.hour', params: { n: hour } };\n  const day = Math.floor(hour / 24);\n  if (day < 30) return { key: 'fmt.ago.day', params: { n: day } };\n  const month = Math.floor(day / 30);\n  return { key: 'fmt.ago.month', params: { n: month } };\n}\n\n/**\n * 陈旧时长（供降级提示使用，与 relativeTime 同义但语义更明确）→ **结构化量**。\n *\n * @param {number} staleMs 陈旧毫秒数。\n * @returns {{key:string, params:Object}|string} 结构化量；缺失时返回 DASH。\n */\nexport function staleFor(staleMs) {\n  const n = _num(staleMs);\n  if (n === null) return DASH;\n  if (n < 60000) return { key: 'fmt.stale.second', params: { n: Math.max(1, Math.round(n / 1000)) } };\n  const min = Math.floor(n / 60000);\n  if (min < 60) return { key: 'fmt.stale.minute', params: { n: min } };\n  const hour = Math.floor(min / 60);\n  if (hour < 24) return { key: 'fmt.stale.hour', params: { n: hour } };\n  return { key: 'fmt.stale.day', params: { n: Math.floor(hour / 24) } };\n}\n\n/**\n * 生成导出文件名时间戳 'YYYYMMDD-HHmm'（本地时区）。\n *\n * @param {number} [atMs=Date.now()] 时刻。\n * @returns {string} 形如 '20250105-1423'。\n */\nexport function stamp(atMs = Date.now()) {\n  const d = new Date(atMs);\n  const y = d.getFullYear();\n  const mo = pad2(d.getMonth() + 1);\n  const da = pad2(d.getDate());\n  const h = pad2(d.getHours());\n  const mi = pad2(d.getMinutes());\n  return `${y}${mo}${da}-${h}${mi}`;\n}\n\n/**\n * 页头地名标题的排版加固：间隔号「·」永不落在行首。\n *\n * 背景（2026-11 真机截图确认）：数据层（photon.js）把地名拼成**单个字符串**\n * （'林溪别墅社区 · 百善镇 · 北京市 · 中国'），整串交给 `h1.hd-place` 的一个文本\n * 节点。中文字符之间处处是断点，窄屏折行时浏览器可能正好断在间隔号前，第二行\n * 以「·」开头 —— 中文标点禁则（行首禁则字）不允许。\n *\n * 做法：把每处 `' · '`（普通空格 + 间隔号 + 普通空格）替换成 `'\\u00A0· '`\n * （**不换行空格** + 间隔号 + 普通空格）。断点被挤到间隔号**之后**：\n *   - 「·」永远不会出现在行首，只会落在上一行行末；\n *   - 行末的普通空格在换行时被折叠掉，下一行直接从「北京市」开始。\n *\n * ★为什么不用 `<span style=\"white-space:nowrap\">` 把「· 北京市」整体钉住：\n *   `.hd-place` 是页头左列（实测上限约 142px），一个地名分段（如\n *   「圣安东尼奥德洛斯巴尼奥斯」）整体 nowrap 会直接溢出，比行首标点更糟。\n *   NBSP 只多钉住 2 个字符，且 `.hd-place` 本来就有 `overflow-wrap: anywhere`\n *   作为超长片段的兜底。\n *\n * ★幂等：替换后每处间隔号前已是 NBSP（不再是普通空格），模式 `' · '` 不再命中，\n *   重复调用逐字节等价（不会出现 `\\u00A0\\u00A0`）。替换是 1:1 的（3 字符 → 3 字符），\n *   结果长度与入参相同。\n *\n * 约束：调用方是**首屏渲染路径**，本函数永不抛异常 —— null / undefined 返回 ''，\n * 非字符串先 String() 再处理，空串原样返回。数据层保持干净（仍是普通空格拼接），\n * 这是纯渲染层的排版职责。\n *\n * @param {*} text 原始地名串（通常是 photon.js 拼好的多级地名）。\n * @returns {string} 排版加固后的标题文本；间隔号前必为 NBSP。\n */\nexport function placeTitle(text) {\n  if (text === null || text === undefined) return '';\n  return String(text).replace(/ · /g, '\\u00A0· ');\n}\n",
  "src/core/sun.js": "/**\n * 日出日落本地算法（NOAA 近似，纯函数、离线可用）\n *\n * 职责：在无网络或上游 daily 缺失时兜底计算 sunrise / sunset / solarNoon / dayLength。\n * 纯函数、零依赖、零网络：不读时钟以外任何全局（Date.now() 仅由调用方传入 dateUTC 决定）。\n *\n * 算法：NOAA Solar Calculator（太阳天顶角 90.833°，含大气折射与日面半径修正）。\n * 返回均为 **ms epoch（UTC 语义）**；显示层按 utc_offset_seconds 转本地时间。\n * 极区可能出现 cosH 越界：cosH > 1 → 极夜，cosH < -1 → 极昼，此时 sunrise/sunset 为 null。\n */\n\nconst RAD = Math.PI / 180;\nconst DEG = 180 / Math.PI;\nconst DAY_MS = 86400000;\n\n/**\n * 归一化到 [0, 360)。\n *\n * @param {number} deg 角度。\n * @returns {number} 归一化角度。\n */\nfunction _norm360(deg) {\n  let d = deg % 360;\n  if (d < 0) d += 360;\n  return d;\n}\n\n/**\n * 归一化到 [0, 24)。\n *\n * @param {number} h 小时。\n * @returns {number} 归一化小时。\n */\nfunction _norm24(h) {\n  let v = h % 24;\n  if (v < 0) v += 24;\n  return v;\n}\n\n/**\n * 把 dateUTC 入参归一化成 ms epoch。\n *\n * 接受三种形态：ms epoch 数字、Date 实例、可被 Date.parse 解析的字符串（如 ISO 8601）。\n * 直接 Number('2025-06-21T00:00:00Z') 会得到 NaN，从而把「格式不同」误判成「算不出来」，\n * 所以字符串必须走 Date.parse；解析失败返回 NaN，由调用方的有限性校验统一降级为 null。\n *\n * @param {*} v 入参。\n * @returns {number} ms epoch；无法解析时为 NaN。\n */\nfunction _toMs(v) {\n  if (v === null || v === undefined || v === '') return NaN;\n  if (v instanceof Date) return v.getTime();\n  if (typeof v === 'number') return v;\n  if (typeof v === 'string') return Date.parse(v);\n  return NaN;\n}\n\n/**\n * 取 UTC 年内的第几天（1 月 1 日 = 1）。\n *\n * @param {Date} d UTC 日期对象。\n * @returns {number} 天序号。\n */\nfunction _dayOfYear(d) {\n  const start = Date.UTC(d.getUTCFullYear(), 0, 1);\n  const today = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());\n  return Math.floor((today - start) / DAY_MS) + 1;\n}\n\n/**\n * 计算日出日落。\n *\n * @param {{lat:number, lon:number, dateUTC:number, zenith?:number}} args 入参。\n *   lat 纬度（-90..90）；lon 经度（-180..180）；\n *   dateUTC 基准时刻，支持 ms epoch / Date / ISO 字符串三种形态（无法解析则整体降级为 null）；\n *   zenith 太阳天顶角（默认 90.833；显式传 0 生效，非数字 / 未提供回落默认值）；\n * @returns {{sunriseAt:number|null, sunsetAt:number|null, solarNoonAt:number, dayLengthMs:number|null,\n *            polar:'none'|'polar-day'|'polar-night'}} 结果（ms epoch，UTC 语义）。\n */\nexport function sunriseSunset(args) {\n  const lat = Number(args && args.lat);\n  const lon = Number(args && args.lon);\n  // ★显式传 0 必须生效：旧写法 `Number(...) || 90.833` 会把 0 当成「未提供」。\n  //   但也不能直接换成 `??` —— Number(undefined) 是 NaN，而 NaN **不是** nullish，\n  //   那样「没传」反而不回落默认值，静默把整条计算送进 NaN。所以两步分开：\n  //   ① 先判「未提供」（null / undefined / 空串）→ 用默认值；\n  //   ② 再把非数字（含 NaN、Infinity）也挡回默认值，保留原来 `||` 的容错。\n  const zenithRaw = args && args.zenith;\n  const zenithNum = (zenithRaw === null || zenithRaw === undefined || zenithRaw === '')\n    ? 90.833\n    : Number(zenithRaw);\n  const zenith = Number.isFinite(zenithNum) ? zenithNum : 90.833;\n  // dateUTC 三种形态一视同仁：ms epoch / Date / ISO 字符串；解析不出时间就降级为 NaN，\n  // 由下面的有限性校验统一返回 null（绝不抛异常，调用方是首屏渲染路径）。\n  const dateUTC = _toMs(args && args.dateUTC);\n\n  if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(dateUTC)) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: NaN, dayLengthMs: null, polar: 'none' };\n  }\n\n  const d = new Date(dateUTC);\n  const N = _dayOfYear(d);\n  const midnightUtc = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());\n  const lngHour = lon / 15;\n\n  // 太阳平近点角与时间角参数（日出用 6h、日落用 18h）\n  const tRise = N + (6 - lngHour) / 24;\n  const tSet = N + (18 - lngHour) / 24;\n\n  const M = (0.9856 * tRise) - 3.289;\n\n  // 太阳真黄经\n  let L = M + (1.916 * Math.sin(M * RAD)) + (0.020 * Math.sin(2 * M * RAD)) + 282.634;\n  L = _norm360(L);\n\n  // 太阳赤经（与 L 同象限）后折算为小时\n  let RA = Math.atan(0.91764 * Math.tan(L * RAD)) * DEG;\n  RA = _norm360(RA);\n  const LQ = Math.floor(L / 90) * 90;\n  const RAQ = Math.floor(RA / 90) * 90;\n  RA = (RA + (LQ - RAQ)) / 15;\n\n  // 太阳赤纬\n  const sinDec = 0.39782 * Math.sin(L * RAD);\n  const cosDec = Math.cos(Math.asin(sinDec));\n\n  // 时角余弦\n  const cosH =\n    (Math.cos(zenith * RAD) - sinDec * Math.sin(lat * RAD)) / (cosDec * Math.cos(lat * RAD));\n\n  // 极昼 / 极夜\n  if (cosH > 1) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: midnightUtc + 12 * 3600000, dayLengthMs: 0, polar: 'polar-night' };\n  }\n  if (cosH < -1) {\n    return { sunriseAt: null, sunsetAt: null, solarNoonAt: midnightUtc + 12 * 3600000, dayLengthMs: DAY_MS, polar: 'polar-day' };\n  }\n\n  const H = Math.acos(cosH) * DEG;\n  const hRise = (360 - H) / 15;\n  const hSet = H / 15;\n\n  const tRiseUtc = _norm24(hRise + RA - 0.06571 * tRise - 6.622 - lngHour);\n  const tSetUtc = _norm24(hSet + RA - 0.06571 * tSet - 6.622 - lngHour);\n\n  const sunriseAt = midnightUtc + tRiseUtc * 3600000;\n  const sunsetAt = midnightUtc + tSetUtc * 3600000;\n  let dayLengthMs = sunsetAt - sunriseAt;\n  if (dayLengthMs < 0) dayLengthMs += DAY_MS;\n  const solarNoonAt = sunriseAt + dayLengthMs / 2;\n\n  return { sunriseAt, sunsetAt, solarNoonAt, dayLengthMs, polar: 'none' };\n}\n\n/**\n * 正午（太阳中天）时刻。\n *\n * @param {{lat:number, lon:number, dateUTC:number}} args 入参。\n * @returns {number} ms epoch。\n */\nexport function solarNoon(args) {\n  const r = sunriseSunset(args);\n  return Number.isFinite(r.solarNoonAt) ? r.solarNoonAt : Number(args && args.dateUTC);\n}\n\n/**\n * 指定时刻是否白昼。\n *\n * @param {number} atMs 待判时刻（ms epoch）。\n * @param {{lat:number, lon:number}} pos 位置。\n * @returns {boolean} true = 白昼。\n */\nexport function isDaylight(atMs, pos) {\n  const r = sunriseSunset({ lat: pos.lat, lon: pos.lon, dateUTC: Number(atMs) });\n  if (r.polar === 'polar-day') return true;\n  if (r.polar === 'polar-night') return false;\n  if (r.sunriseAt === null || r.sunsetAt === null) return true;\n  if (r.sunsetAt >= r.sunriseAt) {\n    return atMs >= r.sunriseAt && atMs < r.sunsetAt;\n  }\n  // 跨日情况（高纬）：日落时刻在次日\n  return atMs >= r.sunriseAt || atMs < r.sunsetAt;\n}\n",
  "src/core/store.js": "/**\n * 本机状态（Store）\n *\n * 职责：保存本机偏好与最近状态 —— 默认地点、单位制、最近一次快照、debug 开关、\n * 网络类型标记、收藏（阶段二启用，本阶段仅占位 schema）。所有持久化**必须**经 core/cache.js，\n * 本模块不直接触碰 localStorage。\n *\n * 设计：内存态 + 持久化双写；读优先内存，冷启动从缓存反序列化。\n * 日志：对外只暴露 log()，debug 关闭时完全静默，禁止 elsewhere 直写 console.log。\n */\n\nimport { get, set, makeKey } from './cache.js';\nimport { DEFAULT_PLACE_NAME } from './geo.js';\n\n/**\n * **应用标识（文件格式用，不是品牌名）** —— 全称 'geoscope'。\n *\n * ★与品牌名 `APP_NAME`（i18n/index.js，现在是 'GeoScope'）是**两回事，不许混用**：\n *   · APP_ID   —— 写进导出文件、参与导入校验（`data.app !== APP_ID` 直接拒绝）。\n *                 **品牌改名时绝不许改它**，改了用户已有的备份 / 行程文件全部导不进来。\n *   · APP_NAME —— 界面上给人看的品牌名，改名时随品牌一起改。\n *   · 文件命名（备份 `geoscope-backup-*`、CSV `geoscope-now-*`、自检\n *     `geoscope-selfcheck-*`）一律派生自 APP_ID，因此改名不影响文件名。\n *\n * ★为什么住在这里而不是 backup.js：backup.js 不在单文件产物的模块闭包里\n *   （build-standalone 的 ORDER 只收录 selfcheck 闭包），而 store.js **在**。\n *   自检页要拿这个常量时，从 store 取不会给产物引入新依赖。\n *   （backup.js 本来就 import store.js，store.js 不 import backup.js —— 无循环。）\n */\nexport const APP_ID = 'geoscope';\n\n/** 持久化键（store 视作一个伪 sourceId）。 */\nconst KEY_PREFS = makeKey('store', 'prefs');\nconst KEY_SNAPSHOT = makeKey('store', 'snapshot');\n// ★首屏分段耗时是**测量记录**，不是偏好：不进 _state、不进备份、resetStore 也不动它\n//   （它是「这台机器上一次首屏到底多慢」的事实，清偏好不该顺手抹掉证据）。\nconst KEY_BOOT = makeKey('store', 'boot');\n// 地理页一次性安装提示的「已看过」标记：不是偏好，不进 _state / 备份 / resetStore\nconst KEY_INSTALL_HINT = makeKey('store', 'installHint');\n\n/** store 条目 TTL：十年（等同长期有效；读用 get() 不做三态判定，故 TTL 无实际影响）。 */\nconst PREFS_TTL_MS = 10 * 365 * 24 * 3600 * 1000;\n\n/** 主题模式之一：跟随系统（等价于不设 data-theme，由 CSS 的 prefers-color-scheme 决定）。 */\nconst THEME_SYSTEM = 'system';\n\n/** 默认状态。 */\nconst DEFAULT_STATE = {\n  /** @type {{lat:number, lon:number, name:string}} 定位失败时的默认地点（北京天安门）。 */\n  defaultPlace: { lat: 39.9087, lon: 116.3975, name: DEFAULT_PLACE_NAME },\n  /** @type {'metric'|'imperial'} 单位制（阶段一只有 metric 生效）。 */\n  unitSystem: 'metric',\n  /**\n   * @type {'system'|'light'|'dark'} 主题模式。\n   *\n   * 默认必须是 'system'：CSS 侧（styles/tokens.css）「不设 data-theme」这条路径本就等于\n   * 跟随系统偏好（prefers-color-scheme）。默认值若写成 'light' 或 'dark'，会出现\n   * 「store 说 dark、CSS 实际浅色」的错位 —— 用户第一次进设置页，看到的选中项与眼中\n   * 画面不一致。\n   */\n  themeMode: 'system',\n  /**\n   * @type {'normal'|'large'|'xlarge'} 无障碍字号档位。\n   *\n   * 默认 'normal'：CSS 侧（styles/tokens.css）默认档就是「`<html>` 上没有 data-fs」这条\n   * 路径（--fs-scale: 1）。默认值若写成 'large'/'xlarge'，会出现「store 说放大、\n   * 页面首帧却是默认字号」的错位 —— 与上面 themeMode 必须默认 'system' 是同一条道理。\n   *\n   * ★它和 themeMode 一样**不进备份**（见 core/backup.js 的 exportBackup：prefs 只有\n   * 5 个字段），理由是「这台机器屏幕多大、用户眼睛舒不舒服」是本机属性，不是可搬家的\n   * 用户数据 —— 从一台开了特大的旧手机导入备份，不该把新手机的字号也顶到特大。\n   */\n  fontScale: 'normal',\n  /**\n   * @type {'zh'|'en'} 界面语言。\n   *\n   * 默认 'zh'（中文界面为主，用户拍板）。与 themeMode / fontScale **同形状、同处理**：\n   * 白名单钳位、读侧也钳、且**不进备份**（见 core/backup.js 的 exportBackup：prefs 只有\n   * 5 个字段）—— 语言是这台机器前一个人的属性，不是可搬家的用户数据。\n   *\n   * ★store 只存 **'zh' / 'en' 这两个标记**，一个中文串都不存：翻译表住在\n   * src/i18n/，core 不许读它（core ← data ← ui ← html 单向依赖）。把「当前界面说哪国话」\n   * 落到 i18n 的是 ui/locale.js 的 applyLocale()。\n   */\n  locale: 'zh',\n  /** @type {'wifi'|'cellular'|'unknown'} 网络类型（手动点选，默认未知）。 */\n  networkType: 'unknown',\n  /** @type {boolean} 调试开关。 */\n  debug: false,\n  /** @type {Array<{lat:number, lon:number, name:string}>} 收藏（阶段二启用）。 */\n  favorites: [],\n};\n\n/** @type {Object} 内存态。 */\nlet _state = { ...DEFAULT_STATE };\n\n/** @type {boolean} 是否已从缓存载入。 */\nlet _loaded = false;\n\n/**\n * 从缓存载入偏好（幂等）。\n *\n * @returns {void}\n */\nfunction _load() {\n  if (_loaded) return;\n  _loaded = true;\n  const entry = get(KEY_PREFS);\n  if (entry && entry.value && typeof entry.value === 'object') {\n    _state = { ...DEFAULT_STATE, ...entry.value };\n    // 数组字段做一次防御性归一，避免坏数据导致渲染崩溃\n    if (!Array.isArray(_state.favorites)) _state.favorites = [];\n  }\n  // URL 参数 ?debug=1 优先级最高\n  try {\n    const search = typeof location !== 'undefined' && location ? String(location.search || '') : '';\n    if (search.indexOf('debug=1') !== -1) _state.debug = true;\n  } catch (err) {\n    /* 非浏览器环境忽略 */\n  }\n}\n\n/**\n * 持久化偏好（失败静默）。\n *\n * @returns {void}\n */\nfunction _persist() {\n  set(KEY_PREFS, _state, PREFS_TTL_MS);\n}\n\n/**\n * 读取整份状态（副本）。\n *\n * @returns {Object} 状态副本。\n */\nexport function getState() {\n  _load();\n  return { ..._state, favorites: [..._state.favorites] };\n}\n\n/**\n * 归一地点对象（内部用）。\n *\n * 只认识五个字段里的 defaultPlace 形状；坐标必须是**有限数字**且在经纬度范围内，\n * 否则回落默认地点。为什么不做 Number() 宽容解析：`Number(null)` / `Number('')`\n * 都是 0，那会把「坏数据」静默变成「几内亚湾 0,0」这个真实存在的地点。\n * 名称长度不做截断 —— 截断规则归 core/backup.js 的 MAX_NAME_LEN 一处管。\n *\n * @param {*} p 任意值。\n * @returns {{lat:number, lon:number, name:string}} 归一后的地点。\n */\nfunction _normPlace(p) {\n  const d = DEFAULT_STATE.defaultPlace;\n  if (!p || typeof p !== 'object') return { ...d };\n  const lat = p.lat;\n  const lon = p.lon;\n  if (typeof lat !== 'number' || typeof lon !== 'number') return { ...d };\n  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return { ...d };\n  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return { ...d };\n  return { lat, lon, name: String(p.name === null || p.name === undefined ? '' : p.name) };\n}\n\n/**\n * 整体替换状态（供 core/backup.js 导入备份使用）。\n *\n * 为什么需要它：导入备份如果逐字段 set，中途失败会留下「改了一半」的状态\n * （defaultPlace 已经换了、favorites 还是旧的）。调用方（backup.js）先把完整的\n * next state 算完并校验通过，再由本函数**一次性**写入内存 + 持久化，保证原子性。\n *\n * 本函数只做**形状归一**（store 自身不变量：绝不把坏地点 / 非数组收藏写进内存态），\n * 不做业务级「非法就整体拒绝」—— 那是 backup.js 的职责。两者是同一把尺子的两道防线：\n * backup.js 负责拒绝，本函数保证就算被绕过了，内存态也不会存进不可用的值。\n *\n * 不改变任何既有 API 的语义，也不删除任何既有导出。\n *\n * ⚠️ `themeMode` 与 `fontScale` 的特殊处理（漏了这条就会把用户的主题 / 字号抹回去）：\n * 本函数整体重建 `_state`，而**备份里没有这两个字段**（它们都是这台机器的属性，不是\n * 用户数据，理由同 backup.js 里「debug 不从备份带入」那条）。若照其它字段一律读\n * `src.themeMode`，那么 `src` 里根本没有这个字段 → 一律回落 'system' → 导入一次备份\n * 就把用户手选的主题静默清掉了。字号同理：从一台开了「特大」的旧手机导入备份，不该把\n * 新手机的字号也顶到「特大」。所以这两个字段都走「有明确值就用它，否则保持当前值」。\n *\n * @param {Object} next 新状态（{ defaultPlace, unitSystem, networkType, debug, favorites,\n *                             themeMode?, fontScale? }）。\n * @returns {Object} 实际落地的状态副本（与 getState() 同形状）。\n */\nexport function replaceState(next) {\n  _load();\n  const src = next && typeof next === 'object' ? next : {};\n  _state = {\n    defaultPlace: _normPlace(src.defaultPlace),\n    unitSystem: src.unitSystem === 'imperial' ? 'imperial' : DEFAULT_STATE.unitSystem,\n    networkType: src.networkType === 'wifi' || src.networkType === 'cellular' ? src.networkType : DEFAULT_STATE.networkType,\n    debug: !!src.debug,\n    // themeMode 不在备份里（见本函数 JSDoc）：src 没带就保持当前值，不许回落默认。\n    themeMode: src.themeMode === 'light' || src.themeMode === 'dark' ? src.themeMode : _state.themeMode,\n    // fontScale 与 themeMode 同理（同为本机属性、不进备份）：src 没带就保持当前值。\n    fontScale: src.fontScale === 'large' || src.fontScale === 'xlarge' ? src.fontScale : _state.fontScale,\n    // locale 与上面两个同理（本机属性、不进备份）：src 没带就保持当前值 ——\n    // 从一台用英文界面的旧手机导入备份，不该把新手机的界面也顶成英文。\n    locale: src.locale === 'en' ? 'en' : _state.locale,\n    favorites: (Array.isArray(src.favorites) ? src.favorites : [])\n      .filter((f) => f && typeof f === 'object' && typeof f.lat === 'number' && Number.isFinite(f.lat) && typeof f.lon === 'number' && Number.isFinite(f.lon))\n      .map((f) => ({ lat: f.lat, lon: f.lon, name: String(f.name === null || f.name === undefined ? '' : f.name) })),\n  };\n  _persist();\n  return getState();\n}\n\n/**\n * 设置默认地点。\n *\n * @param {{lat:number, lon:number, name:string}} place 地点对象。\n * @returns {void}\n */\nexport function setDefaultPlace(place) {\n  _load();\n  _state.defaultPlace = {\n    lat: Number(place.lat),\n    lon: Number(place.lon),\n    name: String(place.name || ''),\n  };\n  _persist();\n}\n\n/**\n * 取默认地点（含 source 标记，便于上游直接当 coord 用）。\n *\n * @returns {{lat:number, lon:number, name:string, source:'default'}} 默认地点。\n */\nexport function getDefaultPlace() {\n  _load();\n  const p = _state.defaultPlace;\n  return { lat: p.lat, lon: p.lon, name: p.name, source: 'default' };\n}\n\n/**\n * 设置单位制。\n *\n * @param {'metric'|'imperial'} unit 单位制。\n * @returns {void}\n */\nexport function setUnitSystem(unit) {\n  _load();\n  _state.unitSystem = unit === 'imperial' ? 'imperial' : 'metric';\n  _persist();\n}\n\n/** @returns {'metric'|'imperial'} 当前单位制。 */\nexport function getUnitSystem() {\n  _load();\n  return _state.unitSystem;\n}\n\n/**\n * 设置主题模式。\n *\n * 白名单钳位：只认 'light' / 'dark'，其它任何值（含 undefined / 拼错的字符串）一律\n * 回落 'system' —— 宁可跟随系统，也不把一个 UI 认不出来的值写进 <html data-theme>。\n *\n * @param {'system'|'light'|'dark'} mode 主题模式。\n * @returns {void}\n */\nexport function setThemeMode(mode) {\n  _load();\n  _state.themeMode = mode === 'light' || mode === 'dark' ? mode : THEME_SYSTEM;\n  _persist();\n}\n\n/** @returns {'system'|'light'|'dark'} 当前主题模式。 */\nexport function getThemeMode() {\n  _load();\n  return _state.themeMode;\n}\n\n/**\n * 设置无障碍字号档位。\n *\n * 白名单钳位：只认 'large' / 'xlarge'，其它任何值（含 undefined / 拼错的字符串）一律\n * 回落 'normal' —— 宁可回到默认字号，也不把一个 UI 认不出来的值写进 <html data-fs>。\n * 与 setThemeMode() 同构：两者都是「写全站属性 + 白名单钳位」这一件事的两个实例。\n *\n * @param {'normal'|'large'|'xlarge'} scale 字号档位。\n * @returns {void}\n */\nexport function setFontScale(scale) {\n  _load();\n  _state.fontScale = scale === 'large' || scale === 'xlarge' ? scale : 'normal';\n  _persist();\n}\n\n/**\n * @returns {'normal'|'large'|'xlarge'} 当前字号档位。\n *\n * 读侧同样钳位（不直接返回 _state.fontScale）：内存态可能来自一份被外力改坏的缓存，\n * 一旦出去一个 '超大' 这样的值，ui/theme.js 会把它当 'normal' 处理，于是界面显示\n * 「默认」而设置页显示「特大」—— 两个页面各说各话。在这里收口，全站只会看到三档之一。\n */\nexport function getFontScale() {\n  _load();\n  const v = _state.fontScale;\n  return v === 'large' || v === 'xlarge' ? v : 'normal';\n}\n\n/**\n * 设置界面语言。\n *\n * 白名单钳位：只认 'en'，其它任何值（含 undefined / 拼错的字符串）一律回落 'zh'\n * —— 与 setThemeMode() / setFontScale() 同构，三者都是「写一个全站属性 + 白名单钳位」。\n *\n * ★本函数只落**标记**，不碰文案：真正切语言的是 ui/locale.js 的 applyLocale()\n * （它会拿这里的值去调 i18n 的 setLocale）。这样 store（core 层）不需要知道\n * src/i18n/ 的存在，i18n 也不需要 import store，两边都不破坏单向依赖。\n *\n * @param {'zh'|'en'} locale 语言标记。\n * @returns {void}\n */\nexport function setLocale(locale) {\n  _load();\n  _state.locale = locale === 'en' ? 'en' : 'zh';\n  _persist();\n}\n\n/**\n * @returns {'zh'|'en'} 当前界面语言标记。\n *\n * 读侧同样钳位（不直接返回 _state.locale）：内存态可能来自一份被外力改坏的缓存，\n * 一旦出去一个 'jp' 这样的值，i18n 会整站返回原始 key（界面变成一串键名）。\n * 与 getFontScale() 同一条理由，在这里收口，全站只会看到两档之一。\n */\nexport function getLocale() {\n  _load();\n  const v = _state.locale;\n  return v === 'en' ? 'en' : 'zh';\n}\n\n/**\n * 设置网络类型（自检页手动点选）。\n *\n * @param {'wifi'|'cellular'|'unknown'} t 网络类型。\n * @returns {void}\n */\nexport function setNetworkType(t) {\n  _load();\n  _state.networkType = t === 'wifi' || t === 'cellular' ? t : 'unknown';\n  _persist();\n}\n\n/** @returns {'wifi'|'cellular'|'unknown'} 网络类型。 */\nexport function getNetworkType() {\n  _load();\n  return _state.networkType;\n}\n\n/**\n * 写入最近一次快照（离线冷启动的降级底座）。\n *\n * @param {Object} snapshot NowSnapshot。\n * @returns {void}\n */\nexport function setLastSnapshot(snapshot) {\n  _load();\n  set(KEY_SNAPSHOT, snapshot, PREFS_TTL_MS);\n}\n\n/**\n * 读取最近一次快照。\n *\n * @returns {Object|null} NowSnapshot 或 null。\n */\nexport function getLastSnapshot() {\n  const entry = get(KEY_SNAPSHOT);\n  return entry && entry.value ? entry.value : null;\n}\n\n/** 首屏分段耗时的六个字段（与 ui/app.js 的 _blankTimings() 同构）。 */\nconst BOOT_KEYS = ['geo', 'weather', 'air', 'elevation', 'background', 'total'];\n\n/**\n * 持久化上一轮首屏分段耗时（供自检页导出回传，见 README 9.1 第 4 条）。\n *\n * ★只收**跑完整轮**的记录：total 不是有限数就整条丢弃。半个轮次的残缺表落盘后，\n *   下次导出会被当成「那一轮的真实读数」，比没有更坏。\n * ★缺段存 null 而不是 0：0 会把「这一段没跑」说成「这一段耗时 0 ms」，与 bootTimings() 同一条纪律。\n *\n * @param {Object} timings 六段耗时表（允许字段缺失 / 为 null）。\n * @returns {boolean} 是否落盘。\n */\nexport function setBootTimings(timings) {\n  if (!timings || typeof timings !== 'object') return false;\n  const out = {};\n  for (const k of BOOT_KEYS) {\n    const v = Number(timings[k]);\n    out[k] = timings[k] !== null && timings[k] !== undefined && Number.isFinite(v) && v >= 0 ? v : null;\n  }\n  if (out.total === null) return false; // 没跑完整轮：不落盘\n  set(KEY_BOOT, { atMs: Date.now(), timings: out }, PREFS_TTL_MS);\n  return true;\n}\n\n/**\n * 读取上一轮首屏分段耗时（副本）。\n *\n * @returns {{atMs:number|null, timings:Object}|null} 记录或 null（从未跑完整轮）。\n */\nexport function getBootTimings() {\n  const entry = get(KEY_BOOT);\n  const v = entry && entry.value;\n  if (!v || typeof v !== 'object' || !v.timings || typeof v.timings !== 'object') return null;\n  const timings = {};\n  for (const k of BOOT_KEYS) {\n    const n = Number(v.timings[k]);\n    timings[k] = v.timings[k] !== null && Number.isFinite(n) ? n : null;\n  }\n  const atMs = Number(v.atMs);\n  return { atMs: Number.isFinite(atMs) ? atMs : null, timings };\n}\n\n/** @returns {boolean} debug 是否开启。 */\nexport function isDebug() {\n  _load();\n  return !!_state.debug;\n}\n\n/**\n * 设置 debug 开关（同时写入缓存，等价于 localStorage['gs:v1:debug']='1' 的效果）。\n *\n * @param {boolean} on 是否开启。\n * @returns {void}\n */\nexport function setDebug(on) {\n  _load();\n  _state.debug = !!on;\n  _persist();\n}\n\n/**\n * 调试日志：debug 关闭时完全静默（禁止 elsewhere 直写 console.log）。\n *\n * @param {...*} args 日志内容。\n * @returns {void}\n */\nexport function log(...args) {\n  if (!isDebug()) return;\n  try {\n    console.log('[GeoScope]', ...args);\n  } catch (err) {\n    /* 环境无 console 时静默 */\n  }\n}\n\n/** @returns {Array<{lat:number, lon:number, name:string}>} 收藏列表副本（阶段二启用）。 */\nexport function getFavorites() {\n  _load();\n  return [..._state.favorites];\n}\n\n/**\n * 追加收藏。\n *\n * @param {{lat:number, lon:number, name:string}} place 地点。\n * @returns {void}\n */\nexport function addFavorite(place) {\n  _load();\n  const lat = Number(place.lat);\n  const lon = Number(place.lon);\n  if (_state.favorites.some((f) => f.lat === lat && f.lon === lon)) return;\n  _state.favorites.push({ lat, lon, name: String(place.name || '') });\n  _persist();\n}\n\n/**\n * 判断某个坐标是否已收藏（口径与 addFavorite 的去重一致：lat + lon 精确相等）。\n *\n * 为什么单独给一个：now.js 的收藏按钮每次渲染都要问一次「现在是不是已收藏」，\n * 让 UI 层自己 `getFavorites().some(...)` 等于把去重口径抄一份到界面层 ——\n * 哪天去重规则从「精确相等」改成「四舍五入到 4 位」，界面就会和 store 判出两种结论。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {boolean} 是否已收藏。\n */\nexport function isFavorite(lat, lon) {\n  _load();\n  const la = Number(lat);\n  const lo = Number(lon);\n  return _state.favorites.some((f) => f.lat === la && f.lon === lo);\n}\n\n/**\n * 删除收藏（按 lat + lon 精确匹配，口径与 addFavorite 的去重一致）。\n *\n * 返回值必须区分「删掉了」和「本来就没有」：UI 要用它区分成功反馈与无效点击，\n * 若一律返回 undefined，取消收藏按钮在「条目已被另一处删掉」时会假报成功。\n *\n * 未命中时**不写盘**：无意义的 _persist() 会给 localStorage 增加一次写入，\n * 在配额紧张的 iOS 上是不必要的消耗。\n *\n * @param {number} lat 纬度。\n * @param {number} lon 经度。\n * @returns {boolean} 是否真的删掉了（false = 本来就没有这一条）。\n */\nexport function removeFavorite(lat, lon) {\n  _load();\n  const la = Number(lat);\n  const lo = Number(lon);\n  const before = _state.favorites.length;\n  const next = _state.favorites.filter((f) => !(f.lat === la && f.lon === lo));\n  if (next.length === before) return false;\n  _state.favorites = next;\n  _persist();\n  return true;\n}\n\n/**\n * 地理页的「去设置页安装」提示是否已经看过（只看本机标记，不做网络判断）。\n *\n * @returns {boolean} 已看过 / 已关闭 / 已点过链接则为 true。\n */\nexport function getInstallHintSeen() {\n  const entry = get(KEY_INSTALL_HINT);\n  return !!(entry && entry.value && entry.value.seen === true);\n}\n\n/**\n * 记下「安装提示已看过」：同一次安装周期内不再出现。\n *\n * @returns {void}\n */\nexport function markInstallHintSeen() {\n  set(KEY_INSTALL_HINT, { seen: true, atMs: Date.now() }, PREFS_TTL_MS);\n}\n\n/**\n * 重置本机状态（仅供自检/排障使用）。\n *\n * @returns {void}\n */\nexport function resetStore() {\n  _loaded = true;\n  _state = { ...DEFAULT_STATE, favorites: [] };\n  _persist();\n}\n",
  "src/core/wmo.js": "/**\n * 气象映射表（WMO / 欧洲 AQI / UV / 风向 / 蒲福风级）\n *\n * 职责：把数值编码翻译成**色彩令牌 + 文案键**，供展示层直接消费。纯数据 + 纯函数，零网络。\n *\n * ★本模块不产出任何人类语言 —— 一律产出 **i18n key**（如 `{ key: 'wmo.61' }`），\n *   由 UI 层 t() 之后才变成「小雨」/ \"Slight rain\"。\n *\n *   为什么：本模块在 core 层。四层单向依赖 `core ← data ← ui ← html` 规定 core 不得\n *   反向 import 上层（tools/check.mjs 第 8 节与 tests/static.test.mjs 都有硬断言），\n *   而 i18n 的 **locale 状态**（当前是哪一国界面）住在 src/i18n/index.js —— core 一旦\n *   import 它，就等于让最底层去读一个全局可变的「现在该说哪国话」，分层倒置且不可测。\n *   所以这里只给键，UI 层负责翻。\n *\n *   为什么不用「core 自己 import 文案表、按 locale 选」：那仍要 import i18n，同样破分层；\n *   为什么不用「core 接受一个翻译回调、默认走中文」：默认中文会让「英文表少一个 key」\n *   这种错误**静默降级成中文**，正好是 tools/check.mjs 第 14 节那道同构守卫要抓的东西 ——\n *   有默认兜底，守卫就被架空了。返回 key 则没有兜底：少一个 key 界面就显示 `wmo.61`，\n *   而提交前守卫必定报红。\n *\n * 口径：\n *   - WMO 天气码：Open-Meteo 使用的 weather_code（0..99）；\n *   - 欧洲 AQI：0–20 优 / 21–40 良 / 41–60 中 / 61–80 差 / 81–100 很差 / >100 极差；\n *   - UV：0–2 低 / 3–5 中 / 6–7 高 / 8–10 很高 / 11+ 极高；\n *   - 风向：16 方位；蒲福风级：0–12 级。\n *\n * 依赖：零 import（纯常量 + 纯函数）。\n */\n\n/**\n * WMO 天气码表（Open-Meteo 口径）。\n *\n * key 完整描述键 / shortKey 短描述键 / icon 单字符符号（内联字符，非外链图标）。\n * 键名前缀 `wmo.`，未知码落到 `wmo.unknown`。\n */\nconst WMO_TABLE = {\n  0: { key: 'wmo.0', shortKey: 'wmo.0.short', icon: '☀' },\n  1: { key: 'wmo.1', shortKey: 'wmo.1.short', icon: '🌤' },\n  2: { key: 'wmo.2', shortKey: 'wmo.2.short', icon: '⛅' },\n  3: { key: 'wmo.3', shortKey: 'wmo.3.short', icon: '☁' },\n  45: { key: 'wmo.45', shortKey: 'wmo.45.short', icon: '🌫' },\n  48: { key: 'wmo.48', shortKey: 'wmo.48.short', icon: '🌫' },\n  51: { key: 'wmo.51', shortKey: 'wmo.51.short', icon: '🌦' },\n  53: { key: 'wmo.53', shortKey: 'wmo.53.short', icon: '🌦' },\n  55: { key: 'wmo.55', shortKey: 'wmo.55.short', icon: '🌦' },\n  56: { key: 'wmo.56', shortKey: 'wmo.56.short', icon: '🌧' },\n  57: { key: 'wmo.57', shortKey: 'wmo.57.short', icon: '🌧' },\n  61: { key: 'wmo.61', shortKey: 'wmo.61.short', icon: '🌧' },\n  63: { key: 'wmo.63', shortKey: 'wmo.63.short', icon: '🌧' },\n  65: { key: 'wmo.65', shortKey: 'wmo.65.short', icon: '🌧' },\n  66: { key: 'wmo.66', shortKey: 'wmo.66.short', icon: '🌨' },\n  67: { key: 'wmo.67', shortKey: 'wmo.67.short', icon: '🌨' },\n  71: { key: 'wmo.71', shortKey: 'wmo.71.short', icon: '🌨' },\n  73: { key: 'wmo.73', shortKey: 'wmo.73.short', icon: '🌨' },\n  75: { key: 'wmo.75', shortKey: 'wmo.75.short', icon: '❄' },\n  77: { key: 'wmo.77', shortKey: 'wmo.77.short', icon: '❄' },\n  80: { key: 'wmo.80', shortKey: 'wmo.80.short', icon: '🌦' },\n  81: { key: 'wmo.81', shortKey: 'wmo.81.short', icon: '🌧' },\n  82: { key: 'wmo.82', shortKey: 'wmo.82.short', icon: '⛈' },\n  85: { key: 'wmo.85', shortKey: 'wmo.85.short', icon: '🌨' },\n  86: { key: 'wmo.86', shortKey: 'wmo.86.short', icon: '❄' },\n  95: { key: 'wmo.95', shortKey: 'wmo.95.short', icon: '⛈' },\n  96: { key: 'wmo.96', shortKey: 'wmo.96.short', icon: '⛈' },\n  99: { key: 'wmo.99', shortKey: 'wmo.99.short', icon: '⛈' },\n};\n\n/** 未知天气码兜底。 */\nconst WMO_UNKNOWN = { key: 'wmo.unknown', shortKey: 'wmo.unknown.short', icon: '·' };\n\n/**\n * WMO 天气码 → 描述（**文案键**，不是文字）。\n *\n * @param {number} code WMO 天气码。\n * @param {boolean} [isDay=true] 是否白昼（预留昼夜图标切换，本阶段文案一致）。\n * @returns {{code:number, key:string, shortKey:string, icon:string, day:boolean}} 描述对象。\n */\nexport function wmo(code, isDay = true) {\n  // 【致命兜底】天气码缺失（null / '' / undefined）或非法（NaN / 'abc' / {} / []）一律落到「未知天气」。\n  // 原因：Number(null)===0、Number('')===0、Number([])===0 —— 若直接 Number() 会把「没数据」\n  // 误判成 WMO 0「晴」，界面显示「☀ 晴」。这是**误导性天气显示**，比显示「未知」更糟。\n  // 因此这里只对「number」和「非空字符串」做数值化，其余全部归一为 code = -1 的未知档。\n  let n = NaN;\n  if (typeof code === 'number') {\n    n = code;\n  } else if (typeof code === 'string' && code.trim() !== '') {\n    n = Number(code);\n  }\n  if (!Number.isFinite(n)) {\n    return {\n      code: -1,\n      key: WMO_UNKNOWN.key,\n      shortKey: WMO_UNKNOWN.shortKey,\n      icon: WMO_UNKNOWN.icon,\n      day: !!isDay,\n    };\n  }\n  const c = Math.trunc(n);\n  const base = WMO_TABLE[c] || WMO_UNKNOWN;\n  return { code: c, key: base.key, shortKey: base.shortKey, icon: base.icon, day: !!isDay };\n}\n\n/** 欧洲 AQI 六档定义（zh 字段已换成 levelKey，文案由 UI 翻译）。 */\nconst AQI_LEVELS = [\n  { max: 20, level: 'good', levelKey: 'level.aqi.good', token: '--c-ok', adviceKey: 'aqi.good.advice' },\n  { max: 40, level: 'fair', levelKey: 'level.aqi.fair', token: '--c-ok', adviceKey: 'aqi.fair.advice' },\n  { max: 60, level: 'moderate', levelKey: 'level.aqi.moderate', token: '--c-warn', adviceKey: 'aqi.moderate.advice' },\n  { max: 80, level: 'poor', levelKey: 'level.aqi.poor', token: '--c-warn', adviceKey: 'aqi.poor.advice' },\n  { max: 100, level: 'very-poor', levelKey: 'level.aqi.very-poor', token: '--c-alert', adviceKey: 'aqi.very-poor.advice' },\n  { max: Infinity, level: 'extreme', levelKey: 'level.aqi.extreme', token: '--c-alert', adviceKey: 'aqi.extreme.advice' },\n];\n\n/**\n * 欧洲 AQI 分级。\n *\n * 说明：`value` 保留原始测量值（含负值，便于排查上游异常）；`displayValue` 是钳制到 [0, +∞)\n * 之后的展示值，界面一律用 displayValue，避免出现「优 · AQI -10」这种自相矛盾的文案。\n * 非有限入参（undefined / null / 'x' / NaN / {}）一律兜底为 0 / good。\n *\n * ★`levelKey` / `adviceKey` 是**键**，不是文字（理由见文件头）。UI 层要显示就用\n * `t(info.levelKey)` / `t(info.adviceKey)`；本模块的旧字段 `zh` / `advice` 已移除 ——\n * 留着它们等于留一条「不切语言也能显示」的捷径，那条捷径正是英文包漏翻的温床。\n *\n * @param {number} europeanAqi 欧洲 AQI 值。\n * @returns {{value:number, displayValue:number, level:string, levelKey:string,\n *            colorToken:string, adviceKey:string}} 分级结果。\n */\nexport function aqi(europeanAqi) {\n  const v = Number(europeanAqi);\n  const value = Number.isFinite(v) ? Math.round(v) : 0;\n  const hit = AQI_LEVELS.find((l) => value <= l.max) || AQI_LEVELS[AQI_LEVELS.length - 1];\n  return {\n    value,\n    displayValue: Math.max(0, value),\n    level: hit.level,\n    levelKey: hit.levelKey,\n    colorToken: hit.token,\n    adviceKey: hit.adviceKey,\n  };\n}\n\n/** UV 五档定义。 */\nconst UV_LEVELS = [\n  { max: 2, level: 'low', levelKey: 'level.uv.low', token: '--c-ok', adviceKey: 'uv.low.advice' },\n  { max: 5, level: 'moderate', levelKey: 'level.uv.moderate', token: '--c-warn', adviceKey: 'uv.moderate.advice' },\n  { max: 7, level: 'high', levelKey: 'level.uv.high', token: '--c-warn', adviceKey: 'uv.high.advice' },\n  { max: 10, level: 'very-high', levelKey: 'level.uv.very-high', token: '--c-alert', adviceKey: 'uv.very-high.advice' },\n  { max: Infinity, level: 'extreme', levelKey: 'level.uv.extreme', token: '--c-alert', adviceKey: 'uv.extreme.advice' },\n];\n\n/**\n * 紫外线指数分级。\n *\n * 说明：同 aqi() —— `value` 保留原始值，`displayValue` 钳制到 [0, +∞) 供界面使用。\n * 非有限入参与负值一律兜底为 low 档。\n *\n * @param {number} index UV 指数。\n * @returns {{value:number, displayValue:number, level:string, levelKey:string,\n *            colorToken:string, adviceKey:string}} 分级结果。\n */\nexport function uv(index) {\n  const v = Number(index);\n  const value = Number.isFinite(v) ? Math.round(v) : 0;\n  const hit = UV_LEVELS.find((l) => value <= l.max) || UV_LEVELS[UV_LEVELS.length - 1];\n  return {\n    value,\n    displayValue: Math.max(0, value),\n    level: hit.level,\n    levelKey: hit.levelKey,\n    colorToken: hit.token,\n    adviceKey: hit.adviceKey,\n  };\n}\n\n/**\n * 16 方位的**文案键**（顺时针，0 = 北）。\n *\n * `dir.N` 是全名（图例用），`dir.N.abbr` 是缩写（此刻页那个数字后面用）。\n * 中文两档同值，英文缩写更短（'North-northeast' → 'NNE'）—— 所以必须分两档存。\n */\nconst DIR16_KEYS = [\n  'dir.0', 'dir.1', 'dir.2', 'dir.3',\n  'dir.4', 'dir.5', 'dir.6', 'dir.7',\n  'dir.8', 'dir.9', 'dir.10', 'dir.11',\n  'dir.12', 'dir.13', 'dir.14', 'dir.15',\n];\n\n/**\n * 风向 16 方位。\n *\n * ★只返回**键**。方位名带「风」后缀那个动作（中文「西北偏北风」/ 英文 \"wind from NNW\"）\n * 由 UI 层用 `t('w.windFrom', { dir: t(dir.abbrKey) })` 完成 —— 中英文那句话的**语序不同**\n * （后缀 vs 介词），core 拼不出两种语言都对的字符串。\n *\n * @param {number} deg 风向角度（0 = 北，顺时针）。\n * @returns {{deg:number, key:string, abbrKey:string}} 方位对象。\n */\nexport function windDir16(deg) {\n  const d = Number(deg);\n  const normalized = Number.isFinite(d) ? ((d % 360) + 360) % 360 : 0;\n  const idx = Math.round(normalized / 22.5) % 16;\n  return { deg: normalized, key: DIR16_KEYS[idx], abbrKey: `${DIR16_KEYS[idx]}.abbr` };\n}\n\n/** 蒲福风级上限（m/s）。 */\nconst BEAUFORT = [0.3, 1.6, 3.4, 5.5, 8.0, 10.8, 13.9, 17.2, 20.8, 24.5, 28.5, 32.7, Infinity];\n/** 蒲福风级的文案键（0–12 级 → 'bf.0' … 'bf.12'）。 */\nconst BEAUFORT_KEYS = BEAUFORT.map((_, level) => `bf.${level}`);\n\n/**\n * 蒲福风级。\n *\n * @param {number} ms 风速（m/s）。\n * @returns {{level:number, key:string}} 风级对象（key 形如 'bf.4'，UI 层 t() 得「和风」/ \"Moderate breeze\"）。\n */\nexport function beaufort(ms) {\n  const v = Number(ms);\n  const speed = Number.isFinite(v) && v > 0 ? v : 0;\n  let level = 0;\n  while (level < BEAUFORT.length - 1 && speed >= BEAUFORT[level]) level += 1;\n  return { level, key: BEAUFORT_KEYS[level] };\n}\n\n/* ------------------------------------------------------------------ */\n/* 分级表的只读视图（供「指标释义」图例直接消费）                        */\n/* ------------------------------------------------------------------ */\n/*\n * 为什么要有这几个访问器：图例要把「清风（4 级）」解释成一张档位表，而阈值必须来自\n * **既有实现** —— 若在 legend.js 里另抄一份数字，就等于新造一套标准，将来改了换算表\n * 图例会静默说谎。这里只把上面那几张常量表原样吐出去（不新增、不改写任何数值），\n * legend.js 拿到的永远是界面真正用的那一份。\n *\n * 返回的是**副本**：调用方改不动模块内的常量表。\n * 返回的 `key` / `levelKey` / `adviceKey` 是文案键，由 UI 层翻译（理由见文件头）。\n */\n\n/**\n * 蒲福风级全表（0–12 级）。\n *\n * `maxMs` 是该级的**上限（不含）**：`speed < maxMs` 且 `speed >= 上一级的 maxMs` 即本级。\n * 最高级（12 级）的 maxMs 为 Infinity。\n *\n * @returns {Array<{level:number, key:string, maxMs:number}>} 13 级全表副本。\n */\nexport function beaufortScale() {\n  return BEAUFORT.map((maxMs, level) => ({ level, key: BEAUFORT_KEYS[level], maxMs }));\n}\n\n/**\n * 欧洲 AQI 六档全表。\n *\n * @returns {Array<{level:string, levelKey:string, max:number, adviceKey:string}>} 六档副本。\n */\nexport function aqiScale() {\n  return AQI_LEVELS.map((l) => ({\n    level: l.level,\n    levelKey: l.levelKey,\n    max: l.max,\n    adviceKey: l.adviceKey,\n  }));\n}\n\n/**\n * UV 五档全表。\n *\n * @returns {Array<{level:string, levelKey:string, max:number, adviceKey:string}>} 五档副本。\n */\nexport function uvScale() {\n  return UV_LEVELS.map((l) => ({\n    level: l.level,\n    levelKey: l.levelKey,\n    max: l.max,\n    adviceKey: l.adviceKey,\n  }));\n}\n\n/**\n * 风向 16 方位的**文案键**（顺时针，0 = 北）。\n *\n * 返回的是全名键（'dir.0' … 'dir.15'）；界面上「西北偏北风」那个「风」字由 UI 层\n * 用 `t('w.windFrom', { dir })` 补上，理由见 windDir16()。\n *\n * @returns {string[]} 16 个方位键副本。\n */\nexport function windRose16() {\n  return [...DIR16_KEYS];\n}\n",
  "src/core/http.js": "/**\n * 请求内核（HTTP）\n *\n * 职责：全应用**唯一**的网络出口。所有 fetch 必须经此模块，内置：\n *   1) 全局串行队列（并发恒为 1）——避免多源抢带宽，真机弱网下更稳；\n *   2) AbortController 超时中断（源只声明 timeoutMs，不自己 fetch）；\n *   3) 固定重试（仅在 error.retriable === true 时发生，且重试前不额外退避）；\n *   4) 缓存三态短路（fresh 命中不发请求）；\n *   5) 离线短路（navigator.onLine === false 且非 force 时直接返回 OFFLINE，不入队）；\n *   6) 统一 SourceResult / SourceError 形状，禁止裸抛 Error 穿越模块边界。\n *\n * 分层：core 层不允许 import data 层，因此源注册表通过 setSourceResolver() 注入\n * （由 data/sources.js 在模块加载时自行注册），保证依赖方向单向。\n */\n\nimport { getWithState, set } from './cache.js';\nimport { log } from './store.js';\n\n/* ------------------------------------------------------------------ */\n/* 串行队列                                                             */\n/* ------------------------------------------------------------------ */\n\n/** @type {Promise<unknown>} 队列尾指针。 */\nlet _chain = Promise.resolve();\n/** @type {number} 队列中（含正在执行）的任务数。 */\nlet _pending = 0;\n\n/**\n * 入队执行（全局并发 1）。\n *\n * @template T\n * @param {() => Promise<T>|T} fn 任务函数。\n * @param {{name?:string}} [opts] 任务名（仅用于调试日志）。\n * @returns {Promise<T>} 任务结果（异常原样向上抛）。\n */\nexport function enqueue(fn, opts = {}) {\n  const name = (opts && opts.name) || 'task';\n  _pending += 1;\n  log(`enqueue:${name}`, 'pending=' + _pending);\n\n  const task = _chain.then(() => fn());\n  // 队列本身不因单个任务失败而断裂\n  _chain = task.then(\n    () => undefined,\n    () => undefined\n  );\n\n  return task.then(\n    (value) => {\n      _pending -= 1;\n      return value;\n    },\n    (err) => {\n      _pending -= 1;\n      throw err;\n    }\n  );\n}\n\n/** @returns {number} 队列中（含执行中）的任务数。 */\nexport function queueLength() {\n  return _pending;\n}\n\n/**\n * 重置队列（自检页开始新一轮取样前调用）。\n *\n * @returns {void}\n */\nexport function resetQueue() {\n  _chain = Promise.resolve();\n  _pending = 0;\n}\n\n/* ------------------------------------------------------------------ */\n/* 源注册表注入                                                         */\n/* ------------------------------------------------------------------ */\n\n/** @type {null|((id:string)=>Object|null)} 源解析器。 */\nlet _resolver = null;\n\n/**\n * 注入源解析器（由 data/sources.js 调用）。\n *\n * @param {(id:string)=>Object|null} fn 解析器。\n * @returns {void}\n */\nexport function setSourceResolver(fn) {\n  _resolver = typeof fn === 'function' ? fn : null;\n}\n\n/** @returns {null|((id:string)=>Object|null)} 当前解析器。 */\nexport function getSourceResolver() {\n  return _resolver;\n}\n\n/* ------------------------------------------------------------------ */\n/* 错误与结果构造                                                       */\n/* ------------------------------------------------------------------ */\n\n/**\n * 构造统一 SourceError。\n *\n * ★不给 `message`（人类语言），只给 `messageKey` + `messageParams`。\n *   理由与 core/wmo.js、core/csv.js 完全相同：本模块在 core 层，不许 import i18n ——\n *   「当前界面说哪国话」是上层状态，core 去读它就是分层倒置。错误文案一律由 UI 层\n *   `tr({ key: err.messageKey, params: err.messageParams })` 翻出来。\n *   刻意**不保留**一个已成文本的 `message` 字段：留着它等于留一条「不切语言也能显示」\n *   的捷径，那条捷径会让英文包漏翻时静默显示中文。\n *\n * @param {'OFFLINE'|'TIMEOUT'|'HTTP'|'NETWORK'|'PARSE'|'ABORT'|'EMPTY'|'UNSUPPORTED'} code 错误码。\n * @param {string} sourceId 源 id。\n * @param {{httpStatus?:number|null, params?:Object}} [extra] 附加信息。\n * @returns {{code:string, messageKey:string, messageParams:Object,\n *            httpStatus:number|null, sourceId:string, retriable:boolean}} SourceError。\n */\nexport function makeError(code, sourceId, extra = {}) {\n  const httpStatus = extra.httpStatus === undefined ? null : extra.httpStatus;\n  const params = extra.params || {};\n  // 可重试：超时 / 网络 / 5xx / 429；其余一律不可重试\n  let retriable = false;\n  if (code === 'TIMEOUT' || code === 'NETWORK') retriable = true;\n  if (code === 'HTTP' && typeof httpStatus === 'number' && (httpStatus >= 500 || httpStatus === 429)) {\n    retriable = true;\n  }\n  return {\n    code,\n    messageKey: `error.${code}`,\n    messageParams: { ms: params.timeoutMs, status: httpStatus },\n    httpStatus,\n    sourceId,\n    retriable,\n  };\n}\n\n/**\n * 构造一个**自带文案键**的 SourceError。\n *\n * 为什么需要它：`makeError()` 的 messageKey 恒为 `error.<code>`，只能表达「传输层出了\n * 什么错」。可有一类失败是 **HTTP 200 包着业务失败**（当年自驾模块接的那个国内 POI 源\n * 就是：`{\"status\":\"0\",\"info\":\"INVALID_USER_KEY\",\"infocode\":\"10001\"}`），此时\n * 「超时 / HTTP / 解析失败」这些码一个都不适用，真正要上屏的是「Key 无效」「配额用尽」\n * 这类**业务桶**。\n * data 层的 `parse()` 于是抛一个带 `messageKey` 的错误，由本模块的 parse 兜底分支\n * （见 `request()`）把它原样提升成 SourceError —— 否则业务桶会被压成一句 `error.PARSE`，\n * 用户只能看到「解析失败」，而真正的原因（配额没了）被吞掉。\n *\n * ★这类错误 `retriable` 恒为 false：业务态失败重试只会再消耗一次配额 / 再触发一次\n *   限频，重试带来的唯一效果是让用户的处境更糟。\n *\n * @param {string} code 错误码（业务桶建议用 'BUSINESS'；未配置凭据用 'NOKEY'）。\n * @param {string} sourceId 源 id。\n * @param {string} messageKey 要上屏的文案键（业务桶那一类，形如 `<prefix>.invalidKey`；\n *   ★2026-10-17：原本写在注释里的那个具体示例所属模块已下线，现在**没有**调用方在用\n *   本函数的业务桶分支 —— 保留它是因为契约属于 core 层，将来接任何\n *   「HTTP 200 包业务失败」的源都要走这一条）。\n * @param {{httpStatus?:number|null, params?:Object}} [extra] 附加信息。\n * @returns {{code:string, messageKey:string, messageParams:Object,\n *            httpStatus:number|null, sourceId:string, retriable:boolean}} SourceError。\n */\nexport function makeErrorWithKey(code, sourceId, messageKey, extra = {}) {\n  const httpStatus = extra.httpStatus === undefined ? null : extra.httpStatus;\n  const params = extra.params || {};\n  return {\n    code: code || 'PARSE',\n    messageKey: String(messageKey),\n    messageParams: params,\n    httpStatus,\n    sourceId,\n    retriable: false,\n  };\n}\n\n/**\n * 构造统一 SourceResult。\n *\n * 显式携带 `stale` 字段的原因：`ok === false` 时 `data` 可能是**陈旧兜底值**（上游失败但有旧缓存），\n * 调用方不能只看 `ok` 就把 `data` 当成功数据用。判定规则统一为 `meta.cacheState === 'stale'`。\n *\n * @param {boolean} ok 是否成功。\n * @param {string} sourceId 源 id。\n * @param {*} data 数据（失败时可能是陈旧兜底值）。\n * @param {Object|null} error SourceError。\n * @param {Object} meta ResultMeta。\n * @returns {{ok:boolean, sourceId:string, data:*, error:Object|null, meta:Object, stale:boolean}} SourceResult。\n */\nfunction _result(ok, sourceId, data, error, meta) {\n  return {\n    ok: !!ok,\n    sourceId,\n    data: data === undefined ? null : data,\n    error: error || null,\n    meta,\n    stale: meta.cacheState === 'stale',\n  };\n}\n\n/**\n * 构造统一 ResultMeta。\n *\n * @returns {{attempts:number, latencyMs:number, queuedMs:number, startedAt:number, finishedAt:number,\n *            fromCache:boolean, cacheState:'fresh'|'stale'|'miss'|'n/a', staleAgeMs:number,\n *            cacheAgeMs:number, requestUrl:string, httpStatus:number|null, bytes:number|null}} ResultMeta。\n */\nfunction _blankMeta() {\n  const now = Date.now();\n  return {\n    attempts: 0,\n    latencyMs: 0,\n    queuedMs: 0,\n    startedAt: now,\n    finishedAt: now,\n    fromCache: false,\n    cacheState: 'miss',\n    staleAgeMs: 0,\n    // 缓存条目自身的年龄（命中 fresh / stale / 离线兜底时写入）；未命中保持 0\n    cacheAgeMs: 0,\n    requestUrl: '',\n    httpStatus: null,\n    bytes: null,\n  };\n}\n\n/**\n * 取 navigator.onLine（非浏览器环境视为在线）。\n *\n * @returns {boolean} 是否在线。\n */\nexport function isOnline() {\n  if (typeof navigator === 'undefined' || navigator === null) return true;\n  return navigator.onLine !== false;\n}\n\n/**\n * 拼接最终 URL（params 为空或 url 已带 '?' 时按既定规则处理）。\n *\n * @param {{url:string, params?:Object<string,string|number>}} req RequestSpec。\n * @returns {string} 最终 URL。\n */\nexport function buildUrl(req) {\n  const url = String((req && req.url) || '');\n  const params = (req && req.params) || null;\n  if (!params) return url;\n  const keys = Object.keys(params);\n  if (keys.length === 0) return url;\n  const qs = keys\n    .map((k) => `${encodeURIComponent(k)}=${encodeURIComponent(String(params[k]))}`)\n    .join('&');\n  return url.indexOf('?') === -1 ? `${url}?${qs}` : `${url}&${qs}`;\n}\n\n/**\n * 估算文本字节数（用于 meta.bytes，容忍无 Blob 环境）。\n *\n * @param {string} text 文本。\n * @returns {number} 字节数。\n */\nfunction _textBytes(text) {\n  if (typeof Blob !== 'undefined') {\n    try {\n      return new Blob([text]).size;\n    } catch (err) {\n      /* 退化到字符数 */\n    }\n  }\n  return text.length;\n}\n\n/**\n * 取响应 Content-Type（容忍 mock）。\n *\n * @param {Object} res 响应对象。\n * @returns {string|null} MIME 或 null。\n */\nfunction _contentType(res) {\n  try {\n    if (res && res.headers && typeof res.headers.get === 'function') {\n      return res.headers.get('content-type') || null;\n    }\n  } catch (err) {\n    /* ignore */\n  }\n  return null;\n}\n\n/**\n * 单次尝试（不含重试与排队）。\n *\n * @param {string} url 最终 URL。\n * @param {number} timeoutMs 超时毫秒。\n * @param {'json'|'bytes'} responseType 响应类型。\n * @returns {Promise<{ok:boolean, json?:*, data?:ArrayBuffer, latencyMs:number,\n *            httpStatus:number|null, bytes:number|null, contentType:string|null, error?:Object}>} 尝试结果。\n */\nasync function _attempt(url, timeoutMs, responseType) {\n  const t0 = Date.now();\n  const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;\n  let timer = null;\n  let abortedByTimeout = false;\n\n  if (controller) {\n    timer = setTimeout(() => {\n      abortedByTimeout = true;\n      try {\n        controller.abort();\n      } catch (err) {\n        /* ignore */\n      }\n    }, timeoutMs);\n  }\n\n  try {\n    const fetchFn = typeof globalThis !== 'undefined' ? globalThis.fetch : undefined;\n    if (typeof fetchFn !== 'function') {\n      return {\n        ok: false,\n        latencyMs: Date.now() - t0,\n        httpStatus: null,\n        bytes: null,\n        contentType: null,\n        error: makeError('NETWORK', 'raw'),\n      };\n    }\n\n    const init = {\n      method: 'GET',\n      headers: { Accept: responseType === 'bytes' ? 'image/*,*/*' : 'application/json' },\n      credentials: 'omit', // 不携带任何凭据，避免向数据源泄漏身份\n      cache: 'no-store',\n    };\n    if (controller) init.signal = controller.signal;\n\n    const res = await fetchFn(url, init);\n    const status = typeof res.status === 'number' ? res.status : 0;\n\n    if (status < 200 || status >= 300) { rn exec();\n  return enqueue(exec, { name: sourceId });\n}\n\n/**\n * 原始请求（自检页 / 瓦片探测专用）：不走缓存、不做源解析，但仍走全局串行队列。\n *\n * @param {{url:string, params?:Object, responseType?:'json'|'bytes', sourceId?:string}|string} spec RequestSpec 或裸 URL。\n * @param {{timeoutMs?:number, retry?:number, responseType?:'json'|'bytes', force?:boolean}} [opts] 参数。\n *   force=true 跳过离线短路（仅需要在离线时验证真实链路的调用方使用）。\n * @returns {Promise<{ok:boolean, sourceId:string, data:*, error:Object|null, meta:Object, stale:boolean}>} SourceResult。\n */\nexport async function requestRaw(spec, opts = {}) {\n  const isString = typeof spec === 'string';\n  const url = isString ? spec : buildUrl(spec);\n  const responseType = (opts && opts.responseType) || (!isString && spec.responseType) || 'json';\n  const timeoutMs = Number(opts && opts.timeoutMs) || 6000;\n  const retry = Number.isFinite(Number(opts && opts.retry)) ? Number(opts.retry) : 0;\n  const sourceId = (!isString && spec && spec.sourceId) || 'raw';\n\n  const meta = _blankMeta();\n  meta.requestUrl = url;\n  meta.cacheState = 'n/a';\n\n  // ★离线短路与 request() 同一口径（契约：离线禁止发请求）。\n  //   本函数不碰缓存，没有旧值可兜，故直接回 OFFLINE；也不占串行队列，\n  //   否则断网时瓦片探测会白占 3 个队列槽位、把后续请求全堵在后面。\n  if (!(opts && opts.force) && !isOnline()) {\n    meta.finishedAt = Date.now();\n    log('offline-shortcircuit-raw', sourceId);\n    return _result(false, sourceId, null, makeError('OFFLINE', sourceId), meta);\n  }\n\n  const enqueuedAt = Date.now();\n  return enqueue(async () => {\n    const startedAt = Date.now();\n    meta.queuedMs = startedAt - enqueuedAt;\n    meta.startedAt = startedAt;\n\n    const res = await _tryWithRetry(url, timeoutMs, retry, responseType, sourceId);\n    meta.attempts = res.attempts;\n    meta.latencyMs = res.latencyMs || 0;\n    meta.httpStatus = res.httpStatus === undefined ? null : res.httpStatus;\n    meta.bytes = res.bytes === undefined ? null : res.bytes;\n    meta.finishedAt = Date.now();\n\n    if (res.ok) {\n      return _result(true, sourceId, res.json !==   "src/core/pinyin.js": "/**\n * 拼音 → 中文地名映射（高频县/镇/村/城市）\n *\n * 1) 上游（Open-Meteo / GeoNames）**本身就支持拼音查询** —— 2026-11-07 实测\n *    `wuzhen`→乌镇、`beijing`→北京、`shaoxing`→绍兴市、`huaxicun`→华西村。\n *    （v95 的首版注释写的是「上游对拼音输入 0 条」，那是错的，已实测推翻。）\n * 2) 所以本表不是「拼音查不到时的唯一出路」，而是**精度与容错**：\n *    · 拼音同名多国（`dali` 可能先命中境外同名地）时，映射回中文能锚定中国地名；\n *    · 带空格/连字符的分词拼音（`heng dian`）上游查不到，本表能归一后命中。\n * 3) 仍只收实测过的：没验证过的拼音不放 —— 错映射比不映射更糟。\n * 4) 拼音带行政后缀照样 0 条（实测 `wuzhenzhen` 空、「乌镇镇」空），所以反查会先去后缀。\n * ★键必须是「小写、无空格、无声调」的归一形态 —— 查表前会把空格/连字符/下划线\n *   全部去掉，写成 `'heng dian'` 的键永远命中不了（v95 就踩过这个坑）。\n *\n * 覆盖原则：\n *   ① 知名县/镇/村（上游有中文条目，但拼音 0 条）\n *   ② 热门城市（上游有，但拼音输入方便）\n *   ③ 不造生僻词——没实测的不放\n */\n\nconst PINYIN_TABLE = {\n  // —— 县/镇/村（上游有中文，拼音 0 条）——\n  'wuzhen': '乌镇',\n  'huaxicun': '华西村',\n  'hengdian': '横店',\n  'hengdianzhen': '横店镇',\n  'zhouzhuang': '周庄',\n  'tongli': '同里',\n  'xidi': '西递',\n  'hongcun': '宏村',\n  'fenghuang': '凤凰',\n  'lijiang': '丽江',\n  'dali': '大理',\n  'yangshuo': '阳朔',\n  'pingyao': '平遥',\n  'wuyuan': '婺源',\n  'wuyishan': '武夷山',\n  'zhangjiajie': '张家界',\n  'jiuzhaigou': '九寨沟',\n  'huangshan': '黄山',\n  'guilin': '桂林',\n  'sanya': '三亚',\n\n  // —— 城市（上游有，但拼音输入高频）——\n  'beijing': '北京',\n  'shanghai': '上海',\n  'guangzhou': '广州',\n  'shenzhen': '深圳',\n  'hangzhou': '杭州',\n  'nanjing': '南京',\n  'chengdu': '成都',\n  'chongqing': '重庆',\n  'wuhan': '武汉',\n  'xian': '西安',\n  'tianjin': '天津',\n  'suzhou': '苏州',\n  'xiamen': '厦门',\n  'qingdao': '青岛',\n  'dalian': '大连',\n  'kunming': '昆明',\n  'changsha': '长沙',\n  'zhengzhou': '郑州',\n  'jinan': '济南',\n  'fuzhou': '福州',\n  'hefei': '合肥',\n  'nanchang': '南昌',\n  'guiyang': '贵阳',\n  'nanning': '南宁',\n  'haikou': '海口',\n  'taiyuan': '太原',\n  'shijiazhuang': '石家庄',\n  'harbin': '哈尔滨',\n  'changchun': '长春',\n  'shenyang': '沈阳',\n  'hohhot': '呼和浩特',\n  'yinchuan': '银川',\n  'xining': '西宁',\n  'urumqi': '乌鲁木齐',\n  'lhasa': '拉萨',\n  'lanzhou': '兰州',\n};\n\n/**\n * 归一化：trim + 小写 + 去掉空格/连字符/下划线。\n *\n * @param {string} s 原始输入。\n * @returns {string} 归一后的键。\n */\nfunction _norm(s) {\n  return String(s).trim().toLowerCase().replace(/[\\s\\-_]+/g, '');\n}\n\n/** 反向索引（中文 → 拼音），惰性构建：避免每次反查都遍历全表。 */\nlet _reverse = null;\n\n/**\n * @returns {Map<string,string>} 中文 → 拼音。\n */\nfunction _reverseTable() {\n  if (!_reverse) {\n    _reverse = new Map();\n    // 同一个中文若有多个拼音键，保留先登记的（表内顺序即优先级）\n    for (const [py, zh] of Object.entries(PINYIN_TABLE)) {\n      if (!_reverse.has(zh)) _reverse.set(zh, py);\n    }\n  }\n  return _reverse;\n}\n\n/**\n * 拼音转中文地名。\n *\n * @param {string} input 输入（任意大小写、可含空格/连字符）。\n * @returns {string|null} 中文地名；无映射时 null。\n */\nexport function pinyinToChinese(input) {\n  if (!input || typeof input !== 'string') return null;\n  return PINYIN_TABLE[_norm(input)] || null;\n}\n\n/**\n * 中文地名转拼音（用于兜底查询：用户输入中文，同时发拼音版本给上游）。\n *\n * ★带行政后缀的词先按原词查，查不到再去后缀重查（乌镇镇 → 乌镇 → wuzhen），\n *   否则「XX镇」「XX村」这类最需要拼音兜底的地名恰恰拿不到兜底词。\n *\n * @param {string} chinese 中文地名。\n * @returns {string|null} 拼音（小写、无空格）；无映射时 null。\n */\nexport function chineseToPinyin(chinese) {\n  if (!chinese || typeof chinese !== 'string') return null;\n  const rev = _reverseTable();\n  const key = chinese.trim();\n  if (rev.has(key)) return rev.get(key);\n  const bare = key.replace(/(市|区|县|镇|乡|村)$/, '');\n  if (bare !== key && bare.length >= 2 && rev.has(bare)) return rev.get(bare);\n  return null;\n}\n\n/**\n * 判断输入是否像拼音：纯 ASCII 字母，或「两段字母 + 一个空格/连字符」的分词拼音\n * （如 `heng dian`）。每段至少 2 个字母。\n *\n * @param {string} input 输入。\n * @returns {boolean} 是否像拼音。\n */\nexport function looksLikePinyin(input) {\n  if (!input || typeof input !== 'string') return false;\n  const s = input.trim();\n  return /^[a-zA-Z]{2,}$/.test(s) || /^[a-zA-Z]{2,}[\\s-][a-zA-Z]{2,}$/.test(s);\n}\n",
  "src/data/tiles.js": "/**\n * 底图瓦片（ArcGIS Online）\n *\n * 职责：构造三种样式的瓦片 URL、探测可用性、计算字节指纹、做「多瓦片去重判定」，\n * 并对整批失败做三态降级（map → grid → no-map，不重试、不转圈）。\n *\n * 瓦片缓存（2026-10-11 四轮真机实测后新增）：全瓦片 31 个采样点中位 693 ms、\n * 范围 247–3198 ms，波动 13 倍，已占 6 s 超时的 53%；而同一 z/x/y 的字节数与指纹**跨四轮完全一致**，\n * 说明瓦片内容确定不变，缓存不会拿到脏数据。故按 URL 做**纯内存** LRU 缓存（不落 localStorage：\n * 瓦片平均 20 KB，持久化会迅速撑爆配额，而收益主要在页面内的缩放平移）。\n *\n * ⚠️ 写缓存的唯一前提是该样式已被**授信**（`isStyleTrusted(styleId) === true`）：\n * 单块瓦片的指纹无法自证真假（占位图同样有指纹），必须「同一样式 + 多个位置」比对判为 real 之后才可信。\n * 授信入口只有自检页 —— 真机验明是真瓦片，日常使用才允许走缓存（详见 src/ui/selfcheck.js）。\n *\n * 指纹说明：Web Crypto 摘要算法里没有 128 位消息摘要，故用 **SHA-256 前 16 位 hex** 作指纹\n * （截短后去重语义等价）。导出 JSON 用 fpAlgo 字段标明算法；界面文案统一称「指纹 fp」。\n * 安全上下文缺失（crypto.subtle 不可用）时降级为「字节长度 + 首 64 字节 hex」（algo='size-head'）。\n *\n * 坐标系（2026-10-11 实测三个服务的 `?f=json` 取证，勿凭印象改）：\n * 三者 `spatialReference` 均为 **wkid 102100 / latestWkid 3857**，即 WGS_1984_Web_Mercator_\n * Auxiliary_Sphere（Web Mercator）；瓦片 256×256，lods 0–23。故内部 WGS84 坐标**直接**\n * 做 Web Mercator 换算即可，**不做 GCJ-02 纠偏** —— 先转 GCJ-02 反而与瓦片错位。\n *\n * ⚠️ 未确认点（只登记、不猜；本阶段**不实现**纠偏）：street 服务的 `serviceDescription`\n *   写有 \"NGCC data for China\"。瓦片金字塔是 WGS84 Web Mercator 无疑，但**中国境内矢量\n *   要素是否按 GCJ-02 生产**没有官方声明，未确认。若真机发现落点与路网错开数百米，\n *   再启用 `core/geo.js` 的 `wgs84ToGcj02()` 占位函数 —— 现在不要实现纠偏。\n *\n * 按样式的缩放上限（2026-10-31 实测 → 写成 `TILE_STYLES[*].maxZoom`，见该文件里的注释）：\n *   Esri 在中国境内并不是每个缩放层级都有真瓦片，没覆盖到的层级返回的是一张**占位图**，\n *   而它是 **HTTP 200 + 合法 JPEG** —— 探测与渲染都判「成功」，界面不会有任何提示，\n *   用户放大后看到的就是一张英文灰图（灰底白字 \"Map data not yet available\"）。\n *   实测方法：同一层级取北京 / 上海 / 成都三张瓦片，**三者字节完全相同**即判为占位图\n *   （正常地图三地瓦片不可能逐字节一样）。北京的结果：\n *     street  → z10–z13 真瓦片，**z14–z20 占位图**\n *     dark    → z10–z16 真瓦片，z17+ 占位图\n *     imagery → z10–**z19** 真瓦片，z20 占位图\n *   对照组（证明是区域覆盖问题、不是服务故障）：street 在东京 / 纽约 / 伦敦的\n *   z12–z18 全部是真瓦片。\n *   占位图实体：2521 B 的 JPEG。\n *   ⚠️ 当初识别它用的那份一次性取数脚本与摘要值（含算法名与十六进制结果）**没有抄进本文件** ——\n *       第 8 节禁止本文件出现那个算法的字样（防的是「又有人把它引进代码」），\n *      完整记录写在本笔提交的 message 里。这里保留的是**判据本身**（三地字节全同）与结论。\n *\n *   处理方式：**按样式卡住 zoom 上限**（`maxZoomOf()`），让用户根本上不去到占位图的层级。\n *   ★本次**不**做占位图内容识别（不比摘要、不比字节数）：「real / fake」的判定依旧\n *     只发生在自检页的多样本比对里（见 `dedupeTiles()`），日常渲染不去猜字节 ——\n *     靠内容识别要先把那张图请求回来，而那次请求本身就是我们想省掉的。\n *   ⚠️ 这三个数字是**今天在北京**实测的结果：底图源会补数据也会撤数据，重测之前\n *     别把它当永久真理；改数字要先重跑一次同法实测，不许推算。\n *\n * 服务条款（同样来自实测响应，改动前先重读）：\n *   1) **必须署名**：每个服务都返回 `copyrightText`，且 Esri 要求同时显示\n *      \"Powered by Esri\"（见 `TILE_CREDITS` / `TILE_POWERED_BY` / `tileAttribution()`）。\n *      这是条款硬要求，不是可选项；地图卡上的署名必须随样式切换。\n *   2) 不得用 robots / 自动批量拉取 ArcGIS Online 地图。\n *      本项目的 3×3 探测与按需拉瓦片属正常浏览，合规；不得改成批量爬取。\n *   3) 三个服务的 `exportTilesAllowed` 均为 **false** —— 不许做离线批量导出 / MBTiles。\n *\n * 已被实测剔除、禁止再引用的源：nominatim.openstreetmap.org、basemaps.cartocdn.com、\n * tile.openstreetmap.org、overpass（本阶段不实现 POI）。\n */\n\nimport { requestRaw } from '../core/http.js';\nimport { makeKey, get as cacheGet, set as cacheSet, clearPrefix as cacheClearPrefix } from '../core/cache.js';\n// log() 供 probeTileBatch() 写「预算耗尽」诊断（2026-10-17 随该函数从 ui/app.js 迁来）。\nimport { log } from '../core/store.js';\nimport { t } from '../i18n/index.js';\n\n/** 瓦片基址（三种样式共用）。 */\nexport const TILE_BASE = 'https://server.arcgisonline.com/ArcGIS/rest/services/';\n\n/**\n * 三种样式定义。注意 dark 的路径层级不同（Canvas/World_Dark_Gray_Base/...），不可照抄 street。\n *\n * `maxZoom` 是**各样式自己的**缩放上限，数字来自 2026-10-31 在北京的逐样本比对实测\n * （方法与对照组见文件头「按样式的缩放上限」那段），改动前先去那里读一遍：\n *   - street  = 13：z14 起就是占位图 —— 这是把默认样式换成 imagery 的全部理由；\n *   - imagery = 19：三个样式里唯一能到 z19 的，也决定了自己自用的默认样式；\n *   - dark    = 16：z17 起占位图（旧代码里那个「全局上限 16」其实是这一路的数字，\n *                   被当成通用值用在了所有样式上 —— 见 `MAX_ZOOM` 的注释）。\n *\n * ★不要把这组的任何一个数字删掉或改成「看起来更保险」的值：\n *   调高 → 用户又看到那张 \"Map data not yet available\" 灰图；\n *   调低 → 明明有数据却不让放大，同样是谎。\n */\nexport const TILE_STYLES = {\n  street: {\n    id: 'street',\n    labelKey: 'tile.street',\n    path: 'World_Street_Map/MapServer/tile/{z}/{y}/{x}',\n    fmt: 'jpeg',\n    maxZoom: 13,\n  },\n  imagery: {\n    id: 'imagery',\n    labelKey: 'tile.imagery',\n    path: 'World_Imagery/MapServer/tile/{z}/{y}/{x}',\n    fmt: 'jpeg',\n    maxZoom: 19,\n  },\n  dark: {\n    id: 'dark',\n    labelKey: 'tile.dark',\n    path: 'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',\n    fmt: 'png',\n    maxZoom: 16,\n  },\n};\n\n/** 许可署名（源级，不随样式变化；用于溯源气泡等「只标服务名」的场景）。 */\n/**\n * 瓦片许可署名的**文案键**（不是成品串）。\n *\n * ★存键不存串的原因见 data/openmeteo.js 同名注释：SOURCES 在模块求值期构造，\n * 写死 `t()` 会让「存了英文偏好、界面仍中文」成为必然。取用时才翻译才是对的。\n */\nexport const TILE_ATTRIBUTION_KEY = 'attr.tile';\n\n/**\n * 各样式的**实测** `copyrightText`（2026-10-11 取自三个服务 `?f=json` 的返回，勿手改）。\n *\n * 这是条款硬要求：显示了哪一路底图，就必须把那一路的数据提供方名字显示出来。\n */\nexport const TILE_CREDITS = {\n  street:\n    'Sources: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, Esri Japan, METI, ' +\n    'Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, (c) OpenStreetMap contributors, ' +\n    'and the GIS User Community',\n  imagery: 'Source: Esri, Vantor, Earthstar Geographics, and the GIS User Community',\n  dark: 'Esri, HERE, Garmin, (c) OpenStreetMap contributors, and the GIS User Community',\n};\n\n/** Esri 技术署名（与数据署名并列显示，同为条款要求）。 */\nexport const TILE_POWERED_BY = 'Powered by Esri';\n\n/**\n * 取某样式的完整署名串（数据提供方 + Esri 技术署名）。\n *\n * @param {string} styleId 样式 id。\n * @returns {string} 署名串；未知样式回落到 street。\n */\nexport function tileAttribution(styleId) {\n  const credit = TILE_CREDITS[styleId] || TILE_CREDITS.street;\n  return `${credit} · ${TILE_POWERED_BY}`;\n}\n\n/** 瓦片像素尺寸（三个服务的 tileInfo 均为 256×256）。 */\nexport const TILE_SIZE = 256;\n\n/** 缩放层级下限（z10：城市级视野）。三个样式在 z10 都有真瓦片，故这是**全局**的。 */\nexport const MIN_ZOOM = 10;\n\n/**\n * 所有样式里**最大的**那个缩放上限（今天 = 19，来自 imagery）。\n *\n * ★它只是「全仓 zoom 的边界上界」，**不是任何单个样式的可用上限**。决定用户能放到\n *   几级，一律取 `maxZoomOf(当前样式)`（`ui/map.js` 的 clamp 与按钮禁用态都走它）。\n *   ★用 `MAX_ZOOM` 去 clamp 会怎样：street 会被一路放到 z14–z20，而那正是 Esri\n *   占位图层级 —— 用户放大两档就看到满屏 \"Map data not yet available\"（2026-10-31\n *   实测，见文件头）。历史上那个写死的 16 其实是 **dark** 一路的上限，被当成通用值\n *   套在了所有样式上，这在中国是错的。\n *\n * ★为什么保留这个导出而不是删掉：它是既有测试与调用方引用过的形状（“请求层级不得超过\n *   MAX_ZOOM”这种**上界**断言）。留着的正当用法只有「上界」这一种；任何要说「这个样式\n *   能到几级」的地方都必须换成 `maxZoomOf()`。\n *\n * ★为什么写成 `Math.max(...)` 而不是写死 19：新样式进来、或某个样式重测后上限变大，\n *   它自己跟着变，不会留下第二个需要人手动同步、然后悄悄漂移的数字。\n */\nexport const MAX_ZOOM = Math.max(...Object.values(TILE_STYLES).map((s) => s.maxZoom));\n\n/**\n * 取某个样式的**实测**缩放上限。\n *\n * clamp 的唯一来源：`ui/map.js` 用它算 `_view.zoom` 的上界，也用它决定「放大」按钮\n * 是否禁用、以及是否要在状态区解释「为什么加号灰了」。\n *\n * 未知样式 id 一律返回 `MIN_ZOOM`（= 只能待在最低层级，放不大）：没有任何实测数据能\n * 支撑它到更高的层级，宁可保守，也不让一个没验过的样式去请求可能全是占位图的层级。\n * 同理，某个样式的 `maxZoom` 配坏（缺字段 / 非数字 / 低于全局下界）时也退回 `MIN_ZOOM`。\n *\n * @param {string} styleId 样式 id。\n * @returns {number} 该样式的缩放上限（≥ `MIN_ZOOM` 的整数）。\n */\nexport function maxZoomOf(styleId) {\n  const style = TILE_STYLES[styleId];\n  if (!style) return MIN_ZOOM;\n  const z = Number(style.maxZoom);\n  return Number.isFinite(z) ? Math.max(MIN_ZOOM, Math.round(z)) : MIN_ZOOM;\n}\n\n/**\n * 首屏默认样式：**影像**（imagery）。\n *\n * 理由（2026-10-31 实测，见文件头）：street 在北京 **z14 起就是占位图**，\n * 用户随便放大两档就满屏 \"Map data not yet available\"；imagery 一直到 **z19**\n * 都是真瓦片，是国内三个样式里唯一能一路放大到 z19 的那个。\n * ★默认选的**不是最好看的那个**，而是「在国内真能放大」的那个 —— 而 z12 三个样式\n *   都有数据，所以 `DEFAULT_ZOOM = 12` 不用跟着改。\n *\n * ★不要因此删掉 `street`：小比例尺下它有路名标注（影像没有），用户仍可手动切回去 ——\n *   只是它不再适合当默认。\n */\nexport const DEFAULT_STYLE_ID = 'imagery';\n\n/** 起手缩放层级（z12）。三个样式在 z12 都有真瓦片。 */\nexport const DEFAULT_ZOOM = 12;\n\n/** 瓦片探测超时（毫秒），retry 恒为 0。 */\nexport const TILE_TIMEOUT_MS = 6000;\n\n/** 瓦片缓存 TTL：7 天（毫秒）。 */\nexport const TILE_CACHE_TTL_MS = 604800000;\n\n/** 瓦片缓存 LRU 上限：96 条（96 × 约 20 KB ≈ 2 MB，是移动端可接受的上界）。 */\nexport const TILE_CACHE_MAX = 96;\n\n/**\n * 样式授信的有效期：30 天。\n *\n * 授信是「这台机器验过它是真瓦片」的结论，不是永久真理 —— 底图源会换、CDN 会切，\n * 30 天后回到未授信，逼下一次自检重新验一遍。\n */\nexport const TILE_TRUST_TTL_MS = 2592000000;\n\n/**\n * 地图三态。\n *\n * - `map`：底图可用；\n * - `grid`：部分瓦片失败 —— 仅画网格 + 坐标，**先不宣布无地图**，给后续静默重试留余地；\n * - `no-map`：整批全部失败 —— 纯坐标模式。\n */\nexport const MAP_MODE = { MAP: 'map', GRID: 'grid', NO_MAP: 'no-map' };\n\n/** @type {string} 当前地图模式（三态的唯一状态源在 tiles.js）。 */\nlet _mapMode = MAP_MODE.MAP;\n\n/**\n * 瓦片缓存：key = 瓦片 URL，value = 缓存条目。\n * 纯内存，页面刷新即失效；不落 localStorage（理由见文件头）。\n *\n * @type {Map<string, {styleId:string, bytes:ArrayBuffer, length:number, fp:string,\n *                     fpAlgo:string, contentType:string|null, httpStatus:number|null,\n *                     latencyMs:number, storedAt:number, lastUsed:number}>}\n */\nconst _tileCache = new Map();\n\n/**\n * 样式授信表（内存镜像）：只有被判为 real（真瓦片）的样式才允许写缓存。\n * 默认「没有任何记录」= 未授信 —— 未经真机自检，一律不缓存，宁可每次都走网络。\n *\n * 授信要跨会话有效（否则用户关掉 App 再打开就不授信了，而没人会每次开 App 先跑一遍自检，\n * 缓存等于永不生效），故同时落 localStorage，键 `gs:v1:tile-trust:<styleId>`，值 `{ trusted, at }`。\n * localStorage 不可用（隐私模式 / 配额满 / 抛异常）时**静默降级为纯内存**，\n * 绝不能因为授信存不下就影响瓦片请求本身。\n *\n * @type {Map<string, {trusted:boolean, at:number}>}\n */\nconst _trusted = new Map();\n\n/**\n * 构造瓦片 URL。\n *\n * @param {string} styleId 'street' | 'imagery' | 'dark'。\n * @param {number} z 缩放层级。\n * @param {number} x 瓦片列号。\n * @param {number} y 瓦片行号（ArcGIS 为 {z}/{y}/{x} 顺序）。\n * @returns {string} 完整 URL。\n */\nexport function tileUrl(styleId, z, x, y) {\n  const style = TILE_STYLES[styleId] || TILE_STYLES.street;\n  const path = style.path.replace('{z}', String(z)).replace('{y}', String(y)).replace('{x}', String(x));\n  return `${TILE_BASE}${path}`;\n}\n\n/**\n * 取样式中文名。\n *\n * @param {string} styleId 样式 id。\n * @returns {string} 中文名。\n */\nexport function styleLabel(styleId) {\n  const style = TILE_STYLES[styleId];\n  return style ? t(style.labelKey) : String(styleId);\n}\n\n/**\n * Uint8Array → hex 串。\n *\n * @param {Uint8Array} u8 字节数组。\n * @returns {string} 十六进制串。\n */\nfunction _hex(u8) {\n  let out = '';\n  for (let i = 0; i < u8.length; i += 1) {\n    out += u8[i].toString(16).padStart(2, '0');\n  }\n  return out;\n}\n\n/**\n * 计算瓦片字节指纹。\n *\n * @param {ArrayBuffer|Uint8Array} bytes 瓦片字节。\n * @returns {Promise<{fp:string, algo:'sha256-16'|'size-head'}>} 指纹与算法标识。\n */\nexport async function fingerprint(bytes) {\n  const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes || new ArrayBuffer(0));\n  const subtle =\n    typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.subtle\n      ? globalThis.crypto.subtle\n      : null;\n\n  if (subtle && typeof subtle.digest === 'function' && typeof u8.buffer !== 'undefined') {\n    try {\n      // 只取 u8 的真实视图做摘要，避免整块底层 buffer 参与\n      const view = new Uint8Array(u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength));\n      const digest = await subtle.digest('SHA-256', view);\n      return { fp: _hex(new Uint8Array(digest)).slice(0, 16), algo: 'sha256-16' };\n    } catch (err) {\n      /* 摘要失败时走降级分支 */\n    }\n  }\n\n  // 降级指纹：字节长度 + 首 64 字节 hex（非安全上下文 / crypto 不可用）\n  const head = u8.slice(0, Math.min(64, u8.length));\n  return { fp: `${u8.length}:${_hex(head)}`, algo: 'size-head' };\n}\n\n/* ------------------------------------------------------------------ */\n/* 瓦片缓存（纯内存 LRU + TTL）                                        */\n/* ------------------------------------------------------------------ */\n\n/**\n * 取缓存条目（命中则刷新 lastUsed，过期则删除并返回 null）。\n *\n * @param {string} url 瓦片 URL（缓存键）。\n * @returns {Object|null} 缓存条目；未命中或已过期时 null。\n */\nfunction _cacheGet(url) {\n  const hit = _tileCache.get(url);\n  if (!hit) return null;\n  const now = Date.now();\n  if (now - hit.storedAt >= TILE_CACHE_TTL_MS) {\n    _tileCache.delete(url);\n    return null;\n  }\n  hit.lastUsed = now;\n  return hit;\n}\n\n/**\n * 写入缓存并维护 LRU 上限（超限时淘汰 lastUsed 最久的条目）。\n *\n * @param {string} url 瓦片 URL（缓存键）。\n * @param {Object} entry 缓存条目（不含 storedAt/lastUsed，由本函数补齐）。\n * @returns {void}\n */\nfunction _cacheSet(url, entry) {\n  const now = Date.now();\n  _tileCache.set(url, { ...entry, storedAt: now, lastUsed: now });\n  if (_tileCache.size <= TILE_CACHE_MAX) return;\n  // 淘汰 lastUsed 最久的：Map 保持插入序，但 lastUsed 会被命中刷新，故必须真比一遍\n  let oldestKey = null;\n  let oldestAt = Infinity;\n  for (const [k, v] of _tileCache) {\n    if (v.lastUsed < oldestAt) {\n      oldestAt = v.lastUsed;\n      oldestKey = k;\n    }\n  }\n  if (oldestKey !== null) _tileCache.delete(oldestKey);\n}\n\n/**\n * 清空瓦片缓存（自检页「强制刷新」与测试用）。\n *\n * @returns {void}\n */\nexport function clearTileCache() {\n  _tileCache.clear();\n}\n\n/**\n * 取缓存里的瓦片**字节**（渲染层用）。\n *\n * 只暴露给 `ui/map.js` 拼 Blob URL：命中缓存就不必再走网络、也不必再等一次 6 s 超时。\n * 读侧**不判授信**是刻意的：能进缓存的条目必然是该样式授信后写入的（写侧判据见\n * `probeTile()`），而撤销授信时 `markStyleTrusted()` 已把该样式的缓存清空 ——\n * 读侧再判一次是重复劳动，还会在「刚授信」的边界上产生假阴性。\n *\n * @param {string} url 瓦片 URL（缓存键）。\n * @returns {{bytes:ArrayBuffer|Uint8Array, contentType:string|null, fp:string,\n *            httpStatus:number|null}|null} 缓存条目；未命中或已过期时 null。\n */\nexport function tileCachedBytes(url) {\n  const hit = _cacheGet(url);\n  if (!hit) return null;\n  return {\n    bytes: hit.bytes,\n    contentType: hit.contentType,\n    fp: hit.fp,\n    httpStatus: hit.httpStatus,\n  };\n}\n\n/**\n * 当前缓存条目数（测试与调试用）。\n *\n * @returns {number} 条目数。\n */\nexport function tileCacheSize() {\n  return _tileCache.size;\n}\n\n/**\n * 授信记录的缓存键。\n *\n * @param {string} id 样式 id。\n * @returns {string} 'gs:v1:tile-trust:<styleId>'。\n */\nfunction _trustKey(id) {\n  return makeKey('tile-trust', id);\n}\n\n/**\n * 把授信结论落 localStorage（失败即静默降级为纯内存，绝不抛到调用方）。\n *\n * @param {string} id 样式 id。\n * @param {{trusted:boolean, at:number}} rec 授信记录。\n * @returns {boolean} 是否写盘成功。\n */\nfunction _persistTrust(id, rec) {\n  try {\n    return cacheSet(_trustKey(id), rec, TILE_TRUST_TTL_MS);\n  } catch (err) {\n    return false; // 隐私模式 / 配额满：本次会话仍按内存态工作\n  }\n}\n\n/**\n * 从 localStorage 读授信记录（跨会话）。\n *\n * @param {string} id 样式 id。\n * @returns {{trusted:boolean, at:number}|null} 记录；不存在 / 已过期 / 读失败时 null。\n */\nfunction _loadTrust(id) {\n  let entry = null;\n  try {\n    entry = cacheGet(_trustKey(id));\n  } catch (err) {\n    return null;\n  }\n  if (!entry) return null;\n  const v = entry.value;\n  if (!v || typeof v !== 'object') return null;\n  const at = Number(v.at) || entry.storedAt || 0;\n  if (!Number.isFinite(at) || at <= 0) return null;\n  // 过期即视为未授信，并顺手清掉过期记录\n  if (Date.now() - at >= TILE_TRUST_TTL_MS) {\n    try {\n      cacheClearPrefix(_trustKey(id));\n    } catch (err) {\n      /* 清理失败无所谓，读侧已判为过期 */\n    }\n    return null;\n  }\n  return { trusted: v.trusted === true, at };\n}\n\n/**\n * 标记某样式是否被授信（真瓦片）。\n *\n * 授信后才允许写缓存；**撤销授信会连带清空该样式的缓存**（否则旧缓存会绕过「占位图不得缓存」这道门）。\n * 授信依据只能是「同一样式 + 多个位置」的指纹比对判为 real，单块瓦片的指纹无法自证真假。\n *\n * @param {string} styleId 样式 id。\n * @param {boolean} trusted 是否授信。\n * @returns {void}\n */\nexport function markStyleTrusted(styleId, trusted) {\n  const id = String(styleId);\n  const rec = { trusted: !!trusted, at: Date.now() };\n  _trusted.set(id, rec);\n  _persistTrust(id, rec); // 写盘失败不影响本次会话的内存态\n  if (!rec.trusted) {\n    // 撤销即清除：把该样式已缓存的字节全部丢掉，并抹掉持久化记录\n    for (const [url, entry] of _tileCache) {\n      if (entry.styleId === id) _tileCache.delete(url);\n    }\n    try {\n      cacheClearPrefix(_trustKey(id));\n    } catch (err) {\n      /* 静默 */\n    }\n  }\n}\n\n/**\n * 某样式是否已被授信（允许写缓存）。\n *\n * 先查内存镜像；没有记录再查 localStorage（冷启动路径）。两处都没有 → 未授信。\n *\n * @param {string} styleId 样式 id。\n * @returns {boolean} 已授信且在有效期内 true。\n */\nexport function isStyleTrusted(styleId) {\n  const id = String(styleId);\n  const mem = _trusted.get(id);\n  if (mem) {\n    return mem.trusted === true && Date.now() - mem.at < TILE_TRUST_TTL_MS;\n  }\n  const disk = _loadTrust(id);\n  if (!disk) return false;\n  _trusted.set(id, disk); // 只在读到有效记录时才回填内存，避免负缓存盖住后续写入\n  return disk.trusted === true;\n}\n\n/**\n * 探测单个瓦片（经 http.requestRaw，retry = 0）。\n *\n * 入参校验：z / x / y 必须是有限整数，否则**直接返回失败、不发请求** ——\n * 避免把 undefined / NaN 拼进 URL 形成 `.../tile/undefined/undefined/undefined` 这类畸形请求\n * （既污染数据源，也会把「调用方传错参」伪装成「底图不可用」）。\n *\n * 成功时**复位**地图模式到 MAP：断网一次进入降级后，网络恢复且探测成功必须退出降级，\n * 否则横幅会一直谎称底图不可用。**失败分支不置位** —— 单块的成败不能决定全局模式，\n * 模式由调用方在整批探测结束后调 `degradeMapMode(probes)` 统一裁决（见该函数注释）。\n *\n * 缓存：默认读缓存（`opts.useCache !== false`）。能进缓存的条目必然是该样式已授信后写入的，\n * 所以读侧不需要再判授信；撤销授信时 `markStyleTrusted()` 会把该样式的缓存清空。\n *\n * @param {string} styleId 样式 id。\n * @param {{z:number, x:number, y:number}} tile 瓦片坐标。\n * @param {{useCache?:boolean, timeoutMs?:number}} [opts] 选项；`useCache:false` 表示强制走真实网络\n *   （自检页必须用，否则测的是缓存而不是链路质量，那一轮数据就白测了）。注意：该开关只管「读」，\n *   写仍受样式授信约束。`timeoutMs` 用于**收紧**单块超时（整批时间预算靠它落地），\n *   取值会被 `Math.min(timeoutMs, TILE_TIMEOUT_MS)` 钳住 —— 只能更短，不能更长。\n * @returns {Promise<Object>} TileProbe（命中缓存时 `fromCache:true`、`latencyMs:0`）。\n */\nexport async function probeTile(styleId, tile, opts = {}) {\n  const z = Number(tile && tile.z);\n  const x = Number(tile && tile.x);\n  const y = Number(tile && tile.y);\n  const useCache = !opts || opts.useCache !== false;\n  // 单块超时：默认 TILE_TIMEOUT_MS，调用方可用 opts.timeoutMs **收紧**（整批时间预算靠它落地）。\n  // ★只允许收紧、不允许放松：注册表里声明的源超时是契约上限，调用方无权加长，\n  //   否则「某个页面自己把超时调到 30 s」会把全局串行队列占死。\n  const timeoutOverride = Number(opts && opts.timeoutMs);\n  const timeoutMs =\n    Number.isFinite(timeoutOverride) && timeoutOverride > 0\n      ? Math.min(timeoutOverride, TILE_TIMEOUT_MS)\n      : TILE_TIMEOUT_MS;\n\n  // 非法坐标：零请求失败，错误码 PARSE（不可重试），明确指向「调用方入参有问题」。\n  // ★url 一律给 null：拼接出来的会是 `.../tile/NaN/NaN/NaN` 这种脏串，它不对应任何真实请求，\n  //   却会写进自检导出的 JSON —— 用户看到会以为真请求过，将来若有人拿 probe.url 去发请求就是事故。\n  //   坐标非法这件事已由 error.code/message 完整表达，信息不丢。\n  if (!Number.isFinite(z) || !Number.isFinite(x) || !Number.isFinite(y)) {\n    return {\n      styleId,\n      label: styleLabel(styleId),\n      url: null,\n      z: Number.isFinite(z) ? z : null,\n      x: Number.isFinite(x) ? x : null,\n      y: Number.isFinite(y) ? y : null,\n      ok: false,\n      httpStatus: null,\n      latencyMs: 0,\n      bytes: null,\n      contentType: null,\n      fp: null,\n      fpAlgo: null,\n      fromCache: false,\n      cachedAt: null,\n      error: {\n        code: 'PARSE',\n        message: t('tile.ba
