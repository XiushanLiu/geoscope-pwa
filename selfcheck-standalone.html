<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="" data-i18n-attr="content" data-i18n-key="desc.selfcheck" />
  <title data-i18n="sc.title">数据源自检</title>

  <meta name="theme-color" content="#1E9C8C" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="地候" data-i18n-attr="content" data-i18n-key="app.shortName" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='96'%20fill='%231E9C8C'/%3E%3Ccircle%20cx='256'%20cy='256'%20r='120'%20fill='none'%20stroke='%23ffffff'%20stroke-width='24'/%3E%3Cpath%20d='M256%2096v320M96%20256h320'%20stroke='%23ffffff'%20stroke-width='16'%20opacity='.85'/%3E%3C/svg%3E" />
  <style>
/**
 * 设计令牌（Design Tokens）
 *
 * 职责：集中定义「地候 GeoScope」的视觉基线 —— 品牌色、屏渐变、文本层级、8pt 栅格、
 * 字号阶梯、圆角、阴影、玻璃材质。深浅双主题在此成对定义，业务样式一律只引用变量，
 * 不允许在 app.css 里再写死颜色。
 *
 * 命名：'--c-*' 颜色 / '--sp-*' 间距 / '--fs-*' 字号 / '--r-*' 圆角 / '--sh-*' 阴影。
 * 字体：只允许 font-family 声明，禁止任何字体外链（隐私红线：不向字体 CDN 发请求）。
 */

:root {
  /* ---------- 品牌 ---------- */
  --c-brand: #1e9c8c;          /* 晨曦青（亮态） */
  --c-brand-dark: #2bb6a3;     /* 晨曦青（暗态） */
  /* 实心填充专用：--c-brand 压白字只有 3.39:1（深浅同值，见 contrast-audit），撑不住
     「实心底 + 白字」的场景。--c-brand 本身不动（它还承担描边、图标、8% 浅填充），
     实心按钮/当前 Tab 一律改用这个更深的变体：白字实测 4.94:1。 */
  --c-brand-solid: #167e70;
  --c-hot: #e08a3c;            /* 温度高 */
  --c-cold: #4a93b8;           /* 温度低 */
  --c-alert: #c9584b;          /* 告警红 */
  --c-ok: var(--c-brand);
  --c-warn: #e0a13c;

  /* ---------- 字体 ---------- */
  --ff-sans: 'Noto Sans SC', 'Geist', system-ui, -apple-system, 'Segoe UI', 'PingFang SC',
    'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  --ff-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;

  /* ---------- 字号阶梯 ---------- */
  /* ★无障碍字号三档（v15）★
     全站字号的**唯一放大开关**就是 --fs-scale，八个 --fs-* 一律写成
     `calc(<基准 px> × 乘数)`，基准 px 原值留在行末注释里备查。

     为什么是「乘数」而不是改 `html { font-size }`：Web 上最常见的那套做法（根字号 +
     rem）在本仓库**完全无效** —— styles/app.css 的 72 处 font-size 里 69 处是
     `var(--fs-*)`，全是裸 px，全站零 rem，`html` / `:root` / `body` 也都没设过
     font-size（跟着浏览器默认 16px）。改根字号对这 69 处一个都不生效，改了等于没改。

     默认 1：**默认档下每个 --fs-* 的计算值必须与加这份开关前一模一样**，一个像素都不许变。
     档位选择器见本文件末尾「无障碍字号档位」一节。 */
  --fs-scale: 1;

  /* 英雄温度（--fs-hero / --fs-hero-sm）走**单独一个乘数**，且默认恒为 1。
     理由：56px 已经是正文（14px）的 4 倍，再按 1.3 放大到 72.8px 时，「−12」这串等宽
     数字按 0.6em 估宽约 131px，加上 °C 单位与卡内边距，在 320px 窄屏上会把右侧那列
     天气描述挤到不足 80px —— 放大「已经够大的字」换来的可读性本来就比正文小，
     所以英雄区放得比正文慢。1.1 / 1.15 这两个取值是 tools/check.mjs 第 13 节按
     320px 视口机器算出来的，实测三档（温度 0.6em×3 字 + 单位 1.1em + gap 16px +
     描述列下限 2.25em）：
        默认   hero 56.0px → 共需 176.8px / 卡内容宽 248px → 余量 71.2px
        large  hero 61.6px → 共需 195.6px / 卡内容宽 248px → 余量 52.4px
        xlarge hero 64.4px → 共需 209.3px / 卡内容宽 248px → 余量 38.7px
     xlarge 下描述列实得 248 − 115.9 − 30.6 − 16 = 85.5px，仍高于「☀ 晴」那一行的
     下限 46.8px。
     ⚠️ 将来新增放大档时必须**显式**给 --fs-hero-scale 一个更小的值；忘了给的档位
     英雄区不放大（宁可不长，也不要撑破布局）。第 13 节会断言每个档位块都定义了它。 */
  --fs-hero-scale: 1;

  --fs-xs: calc(11px * var(--fs-scale));
  --fs-sm: calc(12px * var(--fs-scale));
  --fs-md: calc(14px * var(--fs-scale));
  --fs-lg: calc(16px * var(--fs-scale));
  --fs-xl: calc(20px * var(--fs-scale));
  --fs-2xl: calc(26px * var(--fs-scale));
  --fs-hero: calc(56px * var(--fs-hero-scale));   /* 此刻温度（基准 56px） */
  --fs-hero-sm: calc(40px * var(--fs-hero-scale)); /* 窄屏英雄温度（基准 40px） */

  /* ---------- 8pt 栅格 ---------- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ---------- 圆角 ---------- */
  --r-card: 20px;    /* 卡片 18–20 */
  --r-card-sm: 18px;
  --r-pill: 36px;    /* 胶囊 */
  --r-chip: 12px;

  /* ---------- 触达 ---------- */
  --touch-min: 44px;

  /* ---------- 玻璃材质 ---------- */
  --glass-fill: rgba(255, 255, 255, 0.07);
  --glass-stroke: rgba(255, 255, 255, 0.1);

  /* ---------- 深色屏（默认） ---------- */
  --c-screen-a: #0a0f17;
  --c-screen-b: #0f262e;
  --c-text-1: #ffffff;   /* 标题 */
  --c-text-2: #e6edf0;   /* 正文 */
  /* 次要。⚠️ 4.41 / 3.51 是**旧值 #8a9aa3 的历史数字**（深·卡片表面最差端 / 浅·纯白卡），
     已在 v13 被下面这个压深过的值取代；现值 #a5b3bb 实测 5.95 / 5.36，两档都过 AA。
     之所以把旧数字留在这里：它是「为什么必须压深」的唯一依据，删了下一个人会改回去。
     之所以加这句警告：已经有人扫到这两个数就当成当前结论报了一次 —— 别再误读。 */
  --c-text-3: #a5b3bb;
  --c-card-fill: rgba(255, 255, 255, 0.07);
  --c-card-stroke: rgba(255, 255, 255, 0.1);
  --c-divider: rgba(255, 255, 255, 0.08);

  --sh-card: 0 8px 28px rgba(0, 0, 0, 0.32);
  --sh-pill: 0 6px 20px rgba(0, 0, 0, 0.36);

  color-scheme: dark light;
}

/* ---------- 无障碍字号档位 ---------- */
/* 三档**只改乘数**：不动任何色值、不动 --sp-* 间距、也不动默认档 —— 默认档就是
   「`<html>` 上没有 data-fs、上面那两个乘数保持原值」这条路径。两档放大幅度取：
     · 1.15 —— 常见的「大」档，正文 14 → 16.1px，不触发任何布局重排；
     · 1.30 —— 常见的「特大」档，正文 14 → 18.2px，接近 WCAG 建议的 200% 放大上限。
   `<html data-fs>` 由 src/ui/theme.js 的 applyFontScale() 在**四个入口的模块顶层**写入
   （与 data-theme 同一时机、同一手法），并由每个 HTML `<head>` 里的同步脚本在首帧之前
   预置一次，避免「先按默认字号画一帧、再跳到放大档」。
   布局安全性（line-height: 1 的那几处、固定高度容器、英雄区宽度）由 tools/check.mjs
   第 13 节机器核算，改这里的数字必须重跑那一节。 */
:root[data-fs='large'] {
  --fs-scale: 1.15;
  --fs-hero-scale: 1.1;
}
:root[data-fs='xlarge'] {
  --fs-scale: 1.3;
  --fs-hero-scale: 1.15;
}

/* ---------- 浅色屏 ---------- */
:root[data-theme='light'],
body[data-theme='light'] {
  --c-screen-a: #f7fafa;
  --c-screen-b: #e3eff2;
  --c-text-1: #0f181d;   /* 标题 */
  /* ⚠️ 4.72 / 2.99 是**旧值** #5a6b74 + #7c8b94 的历史数字，下面两个是压深后的现值。
     正文 / 次要：旧值在浅色屏渐变暗端（#e3eff2）只有 4.72 / 2.99，
     且两档之间塞不进「第三级」—— 见 §9 v13 的死结推导。压深两档后：
     屏暗端 7.44 / 4.57、纯白卡 8.74 / 5.37，三档梯度 2.057 / 1.628（更均匀）。
     次要色特意多压一档（#5e6e77 → #5d6d76）：前者在屏暗端实测 4.504，只高出 4.5
     线 0.004，是全清单唯一贴线项，将来任何微调（哪怕只动一下屏渐变）都会把它挤下
     线。多压一档换 0.073 余量，代价只是梯度少 0.025 —— 划算。 */
  --c-text-2: #3f4d55;   /* 正文 */
  --c-text-3: #5d6d76;   /* 次要 */
  --c-card-fill: #ffffff;
  --c-card-stroke: rgba(15, 24, 29, 0.09);
  --c-divider: rgba(15, 24, 29, 0.08);

  /* 状态色解耦后的浅色值（见文末注释：字面色必须在两个浅色块里各写一遍） */
  --c-state-offline: #7c8b94;
  --c-state-idle: #7c8b94;

  --glass-fill: #ffffff;
  --glass-stroke: rgba(15, 24, 29, 0.09);

  --sh-card: 0 6px 20px rgba(15, 24, 29, 0.08);
  --sh-pill: 0 4px 16px rgba(15, 24, 29, 0.12);
}

/* 系统浅色偏好时同步切换（可在设置里被 data-theme 覆盖） */
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --c-screen-a: #f7fafa;
    --c-screen-b: #e3eff2;
    --c-text-1: #0f181d;
    --c-text-2: #3f4d55;   /* 与上面 [data-theme='light'] 块同值，改一处必须改两处 */
    --c-text-3: #5d6d76;
    --c-card-fill: #ffffff;
    --c-card-stroke: rgba(15, 24, 29, 0.09);
    --c-divider: rgba(15, 24, 29, 0.08);
    /* 状态色解耦后的浅色值（字面色必须在两个浅色块里各写一遍，漏一处只在一半路径生效） */
    --c-state-offline: #7c8b94;
    --c-state-idle: #7c8b94;
    --glass-fill: #ffffff;
    --glass-stroke: rgba(15, 24, 29, 0.09);
    --sh-card: 0 6px 20px rgba(15, 24, 29, 0.08);
    --sh-pill: 0 4px 16px rgba(15, 24, 29, 0.12);
  }
}

/* ---------- 状态色 ---------- */
/* offline / idle 原先是 `var(--c-text-3)` 的别名 —— 状态色复用文字层级色是偷懒：
   chip 的填充会跟着「次要文字」的调整一起动，而这两件事的诉求完全不同
   （文字要的是**与底色的对比度**，chip 填充要的是**与基础 chip 底的区分度**）。
   v14 起写死为字面色值，chip 填充从此脱离 --c-text-3 独立演化。
   数值取解耦那一刻的实际取值（深色 #8a9aa3 / 浅色 #7c8b94），画面零变化。
   注意：因为是字面色，浅色值必须在下面两个浅色块里各写一遍
   （[data-theme='light'] 与 prefers-color-scheme 媒体块），漏一处就只在半条路径上生效。 */
:root {
  --c-state-ok: var(--c-brand);
  --c-state-stale: var(--c-warn);
  --c-state-failed: var(--c-alert);
  --c-state-offline: #8a9aa3;
  --c-state-idle: #8a9aa3;
}

/**
 * 全局与组件样式
 *
 * 职责：把 tokens.css 的令牌落成真实组件 —— 屏渐变背景、玻璃卡、胶囊 Tab、状态徽标、
 * 溯源气泡、降级横幅、自检页表格与分段控件。所有颜色/间距/圆角均取自 CSS 变量。
 *
 * 约束：
 *   - 交互元素最小 44×44（--touch-min）；
 *   - 手机 390 宽为基准，容器最大 640 居中；
 *   - 无任何外链资源（字体/图标/背景图一律不用 URL）。
 */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: var(--ff-sans);
  font-size: var(--fs-md);
  color: var(--c-text-2);
  background:
    radial-gradient(120% 80% at 50% 0%, var(--c-screen-b) 0%, var(--c-screen-a) 62%) fixed,
    var(--c-screen-a);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* 底部 Tab 高度 + 安全区 */
  padding-bottom: calc(var(--sp-12) + var(--sp-6) + env(safe-area-inset-bottom, 0px));
}

/* 对比页没有底部 tabbar：body 那条「给 tab 留位」的下内边距要撤掉，否则页面
   底部会白留一大块空地（那块地的高度正好是一个 tabbar + 安全区）。
   只新增这一条 padding 覆盖，不动 --sp-* 的定义值、也不动其它页面。 */
body[data-page="compare"] {
  padding-bottom: var(--sp-6);
}

/* 数字与拉丁走 Geist，等宽数字走 Geist Mono（缺失时回退系统字体，不外链） */
.num { font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }

/* ---------------- 布局容器 ---------------- */

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-4) var(--sp-6);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.skeleton-note {
  color: var(--c-text-3);
  font-size: var(--fs-sm);
  padding: var(--sp-6) 0;
  text-align: center;
}

/* ---------------- 顶部标题 ---------------- */

.hd {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-1) var(--sp-1);
}

.hd-place {
  font-size: var(--fs-lg);
  color: var(--c-text-1);
  font-weight: 600;
  margin: 0;
  line-height: 1.3;
}

.hd-coord {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  margin: var(--sp-1) 0 0;
}

.hd-time {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  text-align: right;
  white-space: nowrap;
}

/* 收藏按钮：两态的**配色**复用既有 .btn（未收藏）与 .btn--primary（已收藏），
   这两条规则的底色/文字组合已经过 tools/contrast-audit.mjs；这里只补排版，
   不新增任何 color: 声明 —— 新增色值等于新增一笔要审计的债。 */
.hd-fav {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
  flex-wrap: wrap;
}

.hd-fav .btn {
  min-height: 36px;
  min-width: 0;
  padding: 0 var(--sp-3);
  font-size: var(--fs-sm);
}

.hd-hint {
  font-size: var(--fs-xs);
}

/* ---------------- 地点搜索（此刻页） ---------------- */
/* 入口是一颗放大镜按钮，点开才内联展开面板 —— 标题那一排已经有地名 / 坐标 / 观测时刻 /
   收藏按钮，把输入框常驻进去会挤到断行。
   配色全部复用既有 token，不新增任何色值：每一条 `color:` 都会自动进入
   tools/contrast-audit.mjs 的全量扫描（深浅两套主题、门槛 4.5:1），新色值等于新债。 */

.hd-place-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* 不写 color：继承 .btn 的 --c-text-1（已过审计）；这里只把它压成一颗图标按钮的尺寸 */
.hd-search-btn {
  min-height: 36px;
  min-width: 36px;
  padding: 0 var(--sp-2);
  font-size: var(--fs-md);
  line-height: 1;
}

.search-panel {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
}

.search-field {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.search-input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--touch-min);
  padding: 0 var(--sp-3);
  border-radius: var(--r-chip);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-family: inherit;
  font-size: var(--fs-md);
}

.search-status {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

.search-list {
  display: flex;
  flex-direction: column;
}

/* 结果项：主行地名，次行 `admin1 · country`（同名多地全靠次行分开） */
.search-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--sp-2) 0;
  border: none;
  border-top: 1px solid var(--c-divider);
  /* 用 --c-card-fill 而不是 transparent / none：按钮的 UA 底色（buttonface）要盖掉，
     而 contrast-audit 的取色器不认 `none` / `transparent` 这两个关键字（会直接抛错）。
     与面板同色，视觉上就是一条分隔线下的纯文字行。 */
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.search-item:first-child {
  border-top: none;
}

.search-item-name {
  font-size: var(--fs-md);
  color: var(--c-text-1);
}

.search-item-sub {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

/* ---------------- 收藏列表（我的页） ---------------- */

.fav-list {
  display: flex;
  flex-direction: column;
  margin: var(--sp-2) 0 0;
}

.fav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-top: 1px solid var(--c-divider);
}

.fav-item:first-child { border-top: none; }

.fav-link {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1 1 auto;
  min-width: 0;
  text-decoration: none;
  color: var(--c-text-2);
}

.fav-name {
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--c-text-1);
}

.fav-coord {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.fav-item .btn {
  min-height: 36px;
  min-width: 0;
  padding: 0 var(--sp-3);
  font-size: var(--fs-sm);
  flex: 0 0 auto;
}

/* ---------------- 卡片 ---------------- */

.card {
  background: var(--c-card-fill);
  border: 1px solid var(--c-card-stroke);
  border-radius: var(--r-card);
  box-shadow: var(--sh-card);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.card--hero {
  padding: var(--sp-5);
  gap: var(--sp-3);
}

.card-title {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  margin: 0;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.card--row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}

/* 天气英雄区 */
.hero {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
}

.hero-temp {
  font-family: var(--ff-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-hero);
  line-height: 1;
  color: var(--c-text-1);
  font-weight: 500;
}

.hero-temp .unit {
  font-size: var(--fs-xl);
  color: var(--c-text-3);
  margin-left: 2px;
}

.hero-desc {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.hero-wmo {
  font-size: var(--fs-lg);
  color: var(--c-text-1);
  font-weight: 500;
}

.hero-sub {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

/* 键值网格 */
.kv {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-2) var(--sp-3);
}

.kv-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.kv-k {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.kv-v {
  font-family: var(--ff-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-md);
  color: var(--c-text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 冷热色同样不作文字色（与上面 .kv-v--alert 同一条规矩：数据色只走填充与边框）。
   旧写法 --c-hot 浅色 2.67:1、--c-cold 深浅双破 3.75/3.41，均低于 4.5:1。
   文字统一 --c-text-1（深色 12.80:1 / 浅色 17.97:1），冷热语义改由**值下方那条
   2px 色线**承载 —— 区分度不丢，且不靠文字颜色差。
   注：本条当前同样无调用方（_kv() 的 mod 参数全项目无人传），改它不影响任何画面；
   将来若接上，请沿用「色线/底纹承载语义」这条路，不要改回彩色文字。 */
.kv-v--hot { color: var(--c-text-1); border-bottom: 2px solid var(--c-hot); }
.kv-v--cold { color: var(--c-text-1); border-bottom: 2px solid var(--c-cold); }
/* 告警红不作文字色，只作底纹与边框：红字压深底实测仅 3.04:1（浅色 4.22:1），
   双双低于 WCAG 4.5:1 小字门槛 —— 越需要被看见的颜色越看不清，传达效果是负的。
   改走 --c-text-1（随主题翻转）后：深色 12.80:1 / 浅色 17.97:1。
   注：本条当前无调用方（_kv() 从未传过 'alert'），改它不影响任何画面；
   将来若接上，告警语义请用红色底纹承载，不要改回红字。 */
.kv-v--alert { color: var(--c-text-1); }

/* ---------------- 徽标 / 胶囊 ---------------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  min-height: 24px;
  padding: 2px var(--sp-2);
  border-radius: var(--r-chip);
  background: var(--c-card-stroke);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
  white-space: nowrap;
}

/* 状态色只做填充与徽点，**不做文字色**。
   旧写法把状态色同时当文字色，实测（基底口径：chip 坐在**卡片表面**上，不是直接叠在屏渐变上）
   全部低于 WCAG 4.5:1 小字门槛 —— ok 2.82/2.65、stale 3.86/1.90、degraded 3.86/1.90、
   offline 3.14/2.79、failed 2.50/3.18（深色/浅色）。
   文字统一改 --c-text-1（随主题翻转）后最低 7.06:1（.chip--idle），且不新增 token、
   不需要按主题分别取值。
   注：v14 起 --c-state-offline / --c-state-idle 已不再复用 --c-text-3（改写字面色值），
   chip 填充从此不随文字层级调整而变 —— 这两个数值是解耦后的稳定值。
   告警语义不丢：填充仍是 22% 状态色，此刻屏的 chip 内还有一颗同色徽点。 */
.chip--ok { background: color-mix(in srgb, var(--c-state-ok) 22%, transparent); color: var(--c-text-1); }
.chip--stale { background: color-mix(in srgb, var(--c-state-stale) 22%, transparent); color: var(--c-text-1); }
/* 告警红不作文字色，只留在填充上：红字压 22% 红纹实测仅 2.50:1（浅色 3.18:1），
   远低于 4.5:1。文字改走 --c-text-1 后：深色 10.55:1 / 浅色 13.57:1。
   告警语义不丢 —— 填充仍是 22% 告警红，chip 内还有一颗 --c-state-failed 的徽点。 */
.chip--failed { background: color-mix(in srgb, var(--c-state-failed) 22%, transparent); color: var(--c-text-1); }
.chip--offline { background: color-mix(in srgb, var(--c-state-offline) 22%, transparent); color: var(--c-text-1); }
.chip--degraded { background: color-mix(in srgb, var(--c-warn) 22%, transparent); color: var(--c-text-1); }

/* .chip--idle：**先补信号，再改文字色**（顺序不能反，反过来会把语义抹掉）。
   旧状态的病根：填充 --c-card-stroke 与基础 .chip 的底色完全同色（实测两底只差 1.03:1、
   通道差 3，肉眼分不开），而自检页渲染 chip 时根本不插徽点 —— 于是文字色是它唯一的语义信号。
   第一步补信号：填充换成 38% 的 --c-state-idle（**v14 起是字面色值，不再复用 --c-text-3**），
   与基础 chip 底拉开到 1.33:1（通道差 19，浅色 Δ28），视觉上分得开。
   第二步才改文字：--c-text-1，实测深色 7.06:1 / 浅色 11.88:1（旧值 3.23:1 / 2.92:1）。
   不补 .badge--idle：自检页那四处根本不插徽点，补了是死规则。
   基础 .chip 没有 border，所以不涉及「边框同步加深」。 */
.chip--idle { background: color-mix(in srgb, var(--c-state-idle) 38%, transparent); color: var(--c-text-1); }

.badge {
  display: inline-block;
  min-width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--c-state-idle);
}
.badge--ok { background: var(--c-state-ok); }
.badge--stale { background: var(--c-state-stale); }
.badge--failed { background: var(--c-state-failed); }
.badge--offline { background: var(--c-state-offline); }
.badge--degraded { background: var(--c-state-stale); }

/* ---------------- 降级横幅 ---------------- */

.banner {
  max-width: 640px;
  margin: var(--sp-3) auto 0;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-2);
  font-size: var(--fs-sm);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.banner--stale { border-color: color-mix(in srgb, var(--c-warn) 40%, transparent); }
.banner--offline { border-color: color-mix(in srgb, var(--c-text-3) 40%, transparent); }
.banner--failed { border-color: color-mix(in srgb, var(--c-alert) 45%, transparent); }
.banner--no-map { border-color: color-mix(in srgb, var(--c-text-3) 30%, transparent); }

/* grid：底图半残（部分瓦片没取到，已降为网格）——琥珀色，与徽点 --c-state-stale 同源。
   不能只描一圈边框：底色也要带一点琥珀，否则和「数据源失败」的 partial 撞脸。
   填充比例压得很低（14%），是为了不抢五张数据卡的视觉权重 —— 底图只是少了瓦片。 */
.banner--grid {
  border-color: color-mix(in srgb, var(--c-warn) 55%, transparent);
  background: color-mix(in srgb, var(--c-warn) 14%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* partial：非关键 API 源失败（数据本身缺一块）。
   比 grid 轻（填充 7%）、比基础横幅强（正文升到 --c-text-1），边框偏中性带一点琥珀：
   它说的是「数据不全」，不是「底图不全」，不该和 grid 用同一个色阶。 */
.banner--partial {
  border-color: color-mix(in srgb, var(--c-warn) 28%, var(--c-card-stroke));
  background: color-mix(in srgb, var(--c-warn) 7%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* empty：关键源全部彻底失败且无缓存 —— 一个数据都没有，是最重的一档。
   红系告警色 --c-alert（#c9584b，深浅同值），填充 20% 压过 grid 的 14% 与 partial 的 7%。
   文字一律用 --c-text-1：它本身随主题翻转（深色 #fff / 浅色 #0f181d），
   告警红只做低透明度底纹，绝不当文字色 —— 否则深色屏下红字压深底会掉到 4.5:1 以下。
   实测对比度：深色屏最差 10.76:1、浅色屏 13.93:1（fill 20%，叠在屏渐变两端各算一次）。 */
.banner--empty {
  border-color: color-mix(in srgb, var(--c-alert) 60%, transparent);
  background: color-mix(in srgb, var(--c-alert) 20%, var(--c-card-fill));
  color: var(--c-text-1);
}

/* ---------------- 溯源气泡 ---------------- */

.prov {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
}

.prov-item {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  min-height: 28px;
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--r-pill);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.prov-item:hover .prov-url,
.prov-item:focus-within .prov-url { color: var(--c-text-2); }

.prov-url {
  font-family: var(--ff-mono);
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------------- 关于 ---------------- */

.about {
  max-width: 640px;
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-5) var(--sp-6);
  color: var(--c-text-3);
  font-size: var(--fs-sm);
}

.about-title {
  font-size: var(--fs-md);
  color: var(--c-text-2);
  margin: 0 0 var(--sp-2);
  font-weight: 600;
}

.about-list {
  margin: 0;
  padding-left: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.about-list strong { color: var(--c-text-2); }

.about-note {
  margin: var(--sp-3) 0 0;
  line-height: 1.6;
}

/* ---------------- 底部胶囊 Tab ---------------- */

.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--sp-3) + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: var(--sp-1);
  padding: var(--sp-1);
  border-radius: var(--r-pill);
  border: 1px solid var(--glass-stroke);
  background: var(--glass-fill);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--sh-pill);
  z-index: 20;
}

/* 四个 Tab 一行排布。下面是这一组属性被反复改动的历史与最终定案，**改前请读**。
   ── 真机截图暴露的 bug：四个 tab 文字全断成两行（「此/刻」「自/检」「方/位」「我/的」）。
      引入于 a0dde93（加第 4 个 tab 时把 `.tab` 从 `min-width: 88px` 改成 `flex: 1 1 0`
      + `min-width: 64px`）。当时的纸面推算是「4×68 + 3×4 + 2×4 = 294px < 320px，不溢出」
      —— 算错了，而且**算的不是换行这件事**。

   ── 根因：`.tabbar` 是 `position: fixed` 且**没有设 `width`**。
      fixed + 无 width → 宽度是 shrink-to-fit，即**由内容决定**，不是占满 390px。
      于是 `flex: 1 1 0` 里的 `flex-basis: 0` 在一个 shrink-to-fit 容器里分不到「剩余空间」
      （本来就没有剩余空间可分），每个 tab 实际拿到 ≈ (max-content 总宽) / 4 ≈ 70px。
      再减去 `padding: 0 var(--sp-5)` 的左右共 40px，**内容区只剩约 30px** ——
      而「此刻」两个汉字在 `--fs-md`(14px) 下正好约 28–30px。**卡在临界点**，
      真机字体渲染与桌面稍有差异就换行。

   ── 定案（三条，各管一件事）：
      1. `padding: 0 var(--sp-3)`（12px，原 `--sp-5` 20px）：内容区从 ~30px 提到 46px，
         留出明显余量，不再贴着两字临界点。
      2. `white-space: nowrap`：即使将来再挤，也宁可横向挤压也**不断行**。
         断行会让 tab 变高、把上方内容顶掉，危害远大于横向挤一点。
      3. `flex: 0 0 auto`（原 `1 1 0`）：`tabbar` 是 shrink-to-fit 容器，`flex-basis: 0`
         在这里的行为难以预测（正是踩的坑）；改成按内容宽度排布，配合 `min-width: 64px`
         完全可预测。四个 tab 文字都是两字，宽度天然相同，观感与「均分」一致。

   ── 保留：`min-width: 64px`（宽度下限，窄屏）、`min-height: var(--touch-min)`（触控下限）。
   ── 不要把 `--sp-*` 或 `--fs-*` 改成别的值来「腾空间」：那是全局栅格/字号阶梯，一动影响全站。
      宽度够不够现在由 `tools/check.mjs` 第 12 节机器计算，不再靠纸面估算。 */
.tab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  min-width: 64px;
  min-height: var(--touch-min);
  padding: 0 var(--sp-3);
  border-radius: var(--r-pill);
  color: var(--c-text-3);
  font-size: var(--fs-md);
  text-decoration: none;
  white-space: nowrap;
}

/* 实心底改用 --c-brand-solid：白字压 --c-brand 实测只有 3.39:1（深浅同值），
   压 --c-brand-solid #167e70 为 4.94:1。--c-brand 本身不动，仍用于描边与浅填充。 */
.tab--active {
  background: var(--c-brand-solid);
  color: #ffffff;
  font-weight: 600;
}

/* ---------------- 按钮 / 分段控件 ---------------- */

.btn {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 0 var(--sp-5);
  border-radius: var(--r-pill);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-family: inherit;
  font-size: var(--fs-md);
  cursor: pointer;
}

.btn:disabled { opacity: 0.45; cursor: default; }

/* 同 .tab--active：实心底走 --c-brand-solid，白字 4.94:1（--c-brand 仅 3.39:1） */
.btn--primary {
  background: var(--c-brand-solid);
  border-color: transparent;
  color: #ffffff;
  font-weight: 600;
}

.seg {
  display: inline-flex;
  gap: var(--sp-1);
  padding: var(--sp-1);
  border-radius: var(--r-pill);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
}

.seg-btn {
  min-height: 36px;
  min-width: var(--touch-min);
  padding: 0 var(--sp-3);
  border: none;
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--c-text-3);
  font-family: inherit;
  font-size: var(--fs-sm);
  cursor: pointer;
}

/* 同 .tab--active：实心底走 --c-brand-solid，白字 4.94:1（--c-brand 仅 3.39:1） */
.seg-btn--active {
  background: var(--c-brand-solid);
  color: #ffffff;
  font-weight: 600;
}

/* ---------------- 自检页 ---------------- */

.sc-head {
  max-width: 640px;
  margin: 0 auto;
  padding: var(--sp-6) var(--sp-5) var(--sp-2);
}

.sc-title {
  margin: 0;
  font-size: var(--fs-xl);
  color: var(--c-text-1);
  font-weight: 600;
}

.sc-sub {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  line-height: 1.6;
}

.panel {
  max-width: 640px;
  margin: 0 auto var(--sp-4);
  padding: var(--sp-4);
  border-radius: var(--r-card);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  flex-wrap: wrap;
}

.field--row { gap: var(--sp-2); }

.field-label {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

.sc-section {
  max-width: 640px;
  margin: 0 auto var(--sp-5);
  padding: 0 var(--sp-4);
}

.sc-h2 {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-md);
  color: var(--c-text-2);
  font-weight: 600;
}

.sc-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.sc-row {
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.sc-row-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
}

.sc-row-name {
  color: var(--c-text-1);
  font-size: var(--fs-md);
  font-weight: 500;
}

.sc-row-metrics {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-3);
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.sc-row-url {
  font-family: var(--ff-mono);
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  word-break: break-all;
  line-height: 1.5;
}

.sc-summary {
  max-width: 640px;
  margin: 0 auto var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-size: var(--fs-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  flex-wrap: wrap;
}

.sc-dedupe {
  margin-top: var(--sp-2);
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  line-height: 1.7;
  word-break: break-all;
}

.sc-log {
  margin: 0;
  padding: var(--sp-3);
  border-radius: var(--r-card-sm);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  font-family: var(--ff-mono);
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 260px;
  overflow: auto;
}

/* ---------------- 空态 / 骨架 ---------------- */

.empty {
  border-radius: var(--r-card);
  border: 1px dashed var(--c-card-stroke);
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--c-text-3);
  font-size: var(--fs-sm);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  align-items: center;
}

.sk {
  border-radius: var(--r-card);
  border: 1px solid var(--c-card-stroke);
  background: linear-gradient(90deg, var(--c-card-fill) 25%, var(--c-divider) 50%, var(--c-card-fill) 75%);
  background-size: 200% 100%;
  animation: sk-sweep 1.4s ease-in-out infinite;
  height: 96px;
}

@keyframes sk-sweep {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@media (prefers-reduced-motion: reduce) {
  .sk { animation: none; }
}

/* ---------------- 方位屏（磁偏角 / 罗盘） ---------------- */

/* 卡内补充说明：与 .card-title 同级（次一级文字），不抢数值的视觉权重 */
.card-note {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  margin: 0;
  line-height: 1.5;
}

/* 超期/告警态：数值**照常显示**（用户仍需要一个近似值），只把信任等级降下来。
   红只描边框、不进文字也不铺底 —— 状态色作文字色会掉到 4.5:1 以下（见 chip 那条注释），
   铺底又会盖住卡片本身，这里一层红边框 + 卡内那枚 .chip--failed 已足够传达。 */
.card--alert {
  border-color: color-mix(in srgb, var(--c-alert) 45%, transparent);
  color: var(--c-text-1);
}

/* 磁偏角读法：大号是「西偏 7.49°」，小号跟一个原始有符号值，方向信息不丢 */
.compass-hero {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.compass-hero-num {
  font-size: var(--fs-2xl);
  font-weight: 600;
  color: var(--c-text-1);
  line-height: 1.2;
}
.compass-hero-signed {
  font-size: var(--fs-sm);
  color: var(--c-text-3);
}

.compass-heading {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  margin: 0;
}

/* 罗盘盘面：盘面整体转 −heading，真北针再相对磁北针转一个磁偏角 */
.compass-dial {
  position: relative;
  width: 176px;
  height: 176px;
  margin: var(--sp-2) auto;
  border-radius: 999px;
  border: 1px solid var(--c-card-stroke);
  background: color-mix(in srgb, var(--c-brand) 8%, var(--c-card-fill));
}

/* N/E/S/W 是罗盘唯一的方位锚点，不能按装饰处理；它压在盘面（8% 品牌色 + 卡片填色）上，
   比同色文字在纯卡片表面上还低一档 —— --c-text-3 实测仅 3.26/3.22，是全局最差的一处。
   这里单独升到 --c-text-2：深色 8.00:1 / 浅色 5.07:1。 */
.compass-mark {
  position: absolute;
  font-size: var(--fs-xs);
  color: var(--c-text-2);
}
.compass-mark--n { top: 8px; left: 50%; transform: translateX(-50%); }
.compass-mark--s { bottom: 8px; left: 50%; transform: translateX(-50%); }
.compass-mark--w { left: 8px; top: 50%; transform: translateY(-50%); }
.compass-mark--e { right: 8px; top: 50%; transform: translateY(-50%); }

.compass-rose {
  position: absolute;
  inset: 0;
  transition: transform 120ms linear;
}

.compass-needle {
  position: absolute;
  left: 50%;
  bottom: 50%;
  width: 3px;
  height: 40%;
  margin-left: -1.5px;
  border-radius: 2px;
  transform-origin: 50% 100%;
}
/* 磁北针红、真北针青：两支针都在盘面上，颜色差是唯一的区分手段。
   红只作填充（不是文字色），符合「状态色只做填充与徽点」的红线。 */
.compass-needle--mag { background: var(--c-state-failed); }
.compass-needle--true { background: var(--c-brand); }

/* 真/磁方位换算：手动输入，双向，不依赖传感器 */
.compass-row {
  gap: var(--sp-2);
  align-items: center;
}

.compass-input {
  min-height: var(--touch-min);
  width: 128px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-chip);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-size: var(--fs-md);
}

.compass-out {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  min-width: 64px;
}

.compass-arrow {
  color: var(--c-text-3);
}

@media (prefers-reduced-motion: reduce) {
  .compass-rose { transition: none; }
}

/* ---------------- 底图卡（S57 街道样式 / S58 GRID 降级） ---------------- */

/* 副标题 + 状态标记（S57 `17:7` / `17:4`）：同一行，状态右对齐 */
.map-sub {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.map-sub-t { font-size: var(--fs-sm); color: var(--c-text-3); }
.map-status {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* 样式切换 chip（S57 `17:36/38/40`）—— 状态色只做填充，文字一律 --c-text-1 */
.map-chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.map-chip {
  min-height: 32px;
  padding: 0 var(--sp-4);
  border-radius: var(--r-pill);
  border: 1px solid var(--c-card-stroke);
  background: var(--c-card-fill);
  color: var(--c-text-1);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.map-chip--active {
  background: color-mix(in srgb, var(--c-brand) 18%, transparent);
  border-color: color-mix(in srgb, var(--c-brand) 45%, transparent);
}

/* 视口：瓦片在此绝对定位叠放，落点恒在正中。
   max-width:100% 而不是写死宽度 —— 窄屏靠它收缩，瓦片按设计基准裁切（本阶段不做重排）。 */
.map-viewport {
  position: relative;
  overflow: hidden;
  margin-inline: auto;
  max-width: 100%;
  border-radius: var(--r-card-sm);
  background: color-mix(in srgb, var(--c-text-3) 12%, transparent);
}

/* 单块瓦片：骨架 → 字节 → 或失败留白（S58 的「空洞瓦片」） */
.map-cell { position: absolute; overflow: hidden; }
.map-cell--loading { background: var(--c-card-fill); }
.map-cell--fail {
  background: var(--c-card-fill);
  box-shadow: inset 0 0 0 1px var(--c-divider);
}
.map-cell-img { display: block; width: 100%; height: 100%; }
.map-cell-x {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 基准 24px（瓦片缺块时盖在瓦片上的「×」）。原来是裸 px —— 切到放大档时它纹丝不动，
     会和四周跟着放大的文字/图标对不齐，所以同样挂上 --fs-scale。 */
  font-size: calc(24px * var(--fs-scale));
  line-height: 1;
  color: var(--c-text-3);
}

/* 落点（S57 `17:29`–`17:34`）：光环 48×48（品牌青 18% 填充 + 50% 描边）、
   实心点 8×8、四向准星。位置恒在视口正中 —— 网格按落点对齐铺，不做平移。 */
.map-pin {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48px;
  height: 48px;
  margin: -24px 0 0 -24px;
  pointer-events: none;
}
.map-pin-halo {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: color-mix(in srgb, var(--c-brand) 18%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-brand) 50%, transparent);
}
.map-pin-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--c-brand);
}
.map-pin-tick { position: absolute; background: var(--c-brand); }
.map-pin-tick--up { left: 23px; top: -14px; width: 2px; height: 14px; }
.map-pin-tick--down { left: 23px; bottom: -14px; width: 2px; height: 14px; }
.map-pin-tick--left { top: 23px; left: -14px; width: 14px; height: 2px; }
.map-pin-tick--right { top: 23px; right: -14px; width: 14px; height: 2px; }

/* 缩放控件（S57 `17:45`，48×64，视口右下） */
.map-zoom {
  position: absolute;
  right: var(--sp-3);
  bottom: var(--sp-3);
  width: 48px;
  border-radius: 14px;
  overflow: hidden;
  background: var(--c-card-fill);
  box-shadow: inset 0 0 0 1px var(--c-card-stroke);
}
.map-zoom-btn {
  display: block;
  width: 100%;
  height: 32px;
  border: 0;
  background: transparent;
  color: var(--c-text-1);
  font-size: var(--fs-lg);
  line-height: 1;
  cursor: pointer;
}
.map-zoom-btn:disabled { color: var(--c-text-3); cursor: default; }
.map-zoom-sep { display: block; height: 1px; background: var(--c-divider); }

/* 纯坐标模式（S58 的 no-map 语义）：一块都不请求，明确告诉用户数值不受影响 */
.map-viewport--nomap {
  display: flex;
  align-items: center;
  justify-content: center;
}
.map-nomap { display: flex; flex-direction: column; gap: var(--sp-1); text-align: center; padding: var(--sp-4); }
.map-nomap-t { font-size: var(--fs-md); color: var(--c-text-1); }
.map-nomap-d { font-size: var(--fs-xs); color: var(--c-text-3); }

/* 骨架视口 */
.map-viewport--sk { display: flex; align-items: center; justify-content: center; }
.map-sk-note { font-size: var(--fs-sm); color: var(--c-text-3); }

/* 坐标行（S57 `17:42`–`17:44`）：坐标用等宽字体，明细次要色 */
.map-coord {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  flex-wrap: wrap;
}
.map-coord-v {
  font-family: var(--ff-mono);
  font-size: var(--fs-sm);
  color: var(--c-text-1);
  font-variant-numeric: tabular-nums;
}
.map-coord-d { font-size: var(--fs-xs); color: var(--c-text-3); }

/* 署名（Esri 条款硬要求，设计稿漏画的一行）—— 必须始终可见、不被遮挡 */
.map-credit {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
  line-height: 1.5;
}

.map-foot {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

@media (prefers-reduced-motion: reduce) {
  .map-chip { transition: none; }
}

/* ---------------- 小屏微调 ---------------- */

@media (max-width: 360px) {
  .hero-temp { font-size: var(--fs-hero-sm); }
  .kv { grid-template-columns: 1fr; }
}

/* ---------------- 指标释义（图例） ---------------- */

/* 类名一律 .legend- 前缀，与上面任何既有规则零重叠、零覆盖。
   颜色只取 --c-text-1 / -2 / -3 三档，全部已经过 tools/contrast-audit.mjs 的
   深浅双主题全量扫描；这里**不新增任何色值** —— 每多一条 color: 就多一笔要审计的债。
   唯一带底色的那条（风向胶囊 .legend-scale--wrap .legend-scale-row）用 --c-text-2 而不是
   --c-text-3：胶囊底是 --c-card-stroke，浅色屏下 --c-text-3 压它实测 4.46:1（差 0.04 不达标），
   --c-text-2 是 7.26:1（深色 7.93:1）。 */

.legend-panel {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.legend-note {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-3);
  line-height: 1.6;
}

.legend-group {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.legend-group-title {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-2);
  font-weight: 600;
}

.legend-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

/* 条目分隔线画在**顶部**而不是底部：最后一条下面不该拖一条多余的线 */
.legend-item {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  padding-top: var(--sp-2);
  border-top: 1px solid var(--c-divider);
}

.legend-item:first-child {
  border-top: none;
  padding-top: 0;
}

.legend-item-head {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  flex-wrap: wrap;
}

.legend-item-name {
  font-size: var(--fs-md);
  color: var(--c-text-1);
  font-weight: 600;
}

.legend-item-unit {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

.legend-item-body {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-2);
  line-height: 1.6;
}

/* 档位表：竖排（蒲福 / AQI / UV） */
.legend-scale {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.legend-scale-row {
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

/* 档位表：横排换行（风向 16 方位，竖排会拉出一条 16 行的长条） */
.legend-scale--wrap {
  flex-direction: row;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-2);
}

/* 方位胶囊：底色 --c-card-stroke，文字 --c-text-2（取值理由见本节开头注释） */
.legend-scale--wrap .legend-scale-row {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-chip);
  background: var(--c-card-stroke);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
}

.legend-none {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--c-text-3);
}

/* ==========================================================================
   Pad 横屏（≥ 768px）
   --------------------------------------------------------------------------
   纯 CSS：这一个媒体块是**追加**在文件末尾的，上面任何一条既有规则都没被改动；
   不新增 JS、不改 HTML 结构、不改 tokens.css 的色值、不改 --sp-* / --fs-*
   （那是全局栅格与字号阶梯，一动影响全站）。需要放大字号时这里一律给具体 px 值。

   改了什么（逐条理由）：
     1) .app → 两列栅格 + 960 上限居中：横屏下原来 390 的单列会被拉成一条很窄的长条，
        两列才用得上横向空间；上限 960 是为了不让正文拉成 1000px 一行的长句。
     2) 天气卡 / 空气卡并排（原先上下堆叠）；底图卡独占一行以便放大。
        行号写死而不是靠自动排布：DOM 顺序是固定的（search → weather → air →
        place → map → prov → legend），显式给 grid-row 比依赖自动排布可预测。
     3) .map-viewport → zoom 1.8：底图 350×260 → 630×468（★为什么是 zoom 而不是
        width/height，见下面该条注释 —— 直接改宽高会把地图搞歪）。
     4) .tab 放大到 96px / 15px：平板该有的触控尺寸。**不动 .tabbar 的居中方式**。
   ========================================================================== */

@media (min-width: 768px) {
  /* 1) 内容区：两列栅格 + 上限居中 */
  .app {
    max-width: 960px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: var(--sp-4);
  }

  /* 行位显式给定：DOM 顺序固定，写死比自动排布可预测（见本节开头） */
  .app > .hd { grid-column: 1 / -1; grid-row: 1; }
  #card-search { grid-column: 1 / -1; grid-row: 2; }
  #card-weather { grid-column: 1 / 2; grid-row: 3; }
  #card-air { grid-column: 2 / 3; grid-row: 3; }
  #card-place { grid-column: 1 / -1; grid-row: 4; }
  #card-map { grid-column: 1 / -1; grid-row: 5; }
  #card-prov { grid-column: 1 / -1; grid-row: 6; }
  #card-legend { grid-column: 1 / -1; grid-row: 7; }

  /* 并排的这两张卡等高：让卡填满它那一格（只针对这一对，不波及其它槽位 ——
     #card-prov 里是「标题 + 气泡」两个兄弟，套同样的规则会把它们拉成左右两半） */
  #card-weather, #card-air { display: flex; }
  #card-weather > .card, #card-air > .card { flex: 1 1 auto; min-width: 0; }

  /* 2) 顶部横幅与内容区同宽（原本 640，横屏下比内容区窄一截，看着像没对齐） */
  .banner { max-width: 960px; }

  /* 3) 英雄温度放大：--fs-hero 是 56px，横屏下 64px（给具体值，不改变量）。
        挂 --fs-hero-scale 而不是 --fs-scale：与竖屏那套英雄区口径保持一致
        （见 tokens.css 里 --fs-hero-scale 那条注释 —— 大号字放得比正文慢）。 */
  .hero-temp { font-size: calc(64px * var(--fs-hero-scale)); }

  /* 4) 底图：350×260 → 630×468
     ★为什么用 zoom 而不是 width/height：视口宽高是 JS 写在 inline style 上的
       （src/ui/map.js 的 VIEW_W / VIEW_H），而瓦片是**按这两个常量算出来的像素坐标**
       绝对定位的（_layTiles 的 left0/top0 = VIEW_W/2 − …），落点又是 50%/50%。
       若只把容器改成 520×390，瓦片仍按 350×260 的中心铺，落点却跑到新中心 ——
       地图整体偏移、右下留白，落点和地图对不上。
       zoom 是**整体缩放**：瓦片、落点、缩放控件一起放大，相对关系原样保留，
       不需要任何补偿数字，也不会因为将来改 VIEW_W 而失配。
       不支持 zoom 的浏览器（Firefox 126 之前）就保持 350×260 —— 优雅降级，不会裂。 */
  .map-viewport { zoom: 1.8; }

  /* 5) 底部 tab：只放大 tab 本身，**不改 .tabbar 的居中方式**
       —— .tabbar 是 position: fixed 且**没有设 width**（shrink-to-fit，宽度由内容决定）。
       给它加 width 或改成靠边，会重演真机上「四个 tab 文字断成两行」那个 bug
       （commit fa1ec49，根因见上面 .tab 那一大段注释）。横屏左右余量充足，
       把 tab 放大到 96px 也不会挤压：4×96 + 3×4 + 2×4 = 404px，远小于 768px。 */
  .tab { min-width: 96px; padding: 0 var(--sp-4); font-size: calc(15px * var(--fs-scale)); }

  /* 6) 图例：横屏下两列排布 —— 单列会变成又窄又长的两三条，短行更好读。
       两列时每行的第一条不该带分隔线，所以把 :first-child 的例外扩到 :nth-child(2)。 */
  .legend-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--sp-3) var(--sp-4);
  }
  .legend-list > .legend-item:nth-child(2) { border-top: none; padding-top: 0; }
}

</style>

  <!-- 无障碍字号档位预置（防跳档）
       ES module 是 defer 的：等 src/ui/*.js 跑起来才去写 <html data-fs>，浏览器很可能
       已经按默认字号画过一帧 —— 用户会看到整页文字「先小后大」地跳一下。这段同步脚本在
       <head> 里直接读本机偏好把属性设上，比模块早那么一瞬间。
       ★键 'gs:v1:store:prefs' = core/cache.js 的 NS('gs:v1:') + store 的 prefs 键，
         tools/check.mjs 第 13 节会断言它与源码一致 —— 改命名空间必须连这里一起改。
       读不到 / 解析失败 / 值非法就**什么都不做**（模块顶层还会再应用一次），绝不抛异常。
       放大乘数全在 styles/tokens.css，这里不存任何数字。 -->
  <script>
    try {

out.title': '关于与边界',\r\n  'about.noCommercial': '不商业化：自用工具，无广告、无第三方统计、无账号登录、无后端。',\r\n  'about.noE2ee': '不做端到端加密同步：数据只存本机 localStorage，搬家靠导出 JSON。',\r\n  'about.noAlert': '预警不采购数据源：本阶段不实现预警推送。',\r\n  'about.privacy': '除六路数据源之外，本应用不向任何域名发起请求；你的坐标不会被上传到数据源以外的地方。',\r\n\r\n  // ---------- 收藏 ----------\r\n  // 收藏是「地点」，不是天气快照：只存 名称 + 经纬度，不存任何取回来的数据。\r\n  // 空态必须把「收藏 → 备份」这条关系讲明白 —— 这是收藏这个功能存在的理由：\r\n  // 数据只在本机，iOS 会清 PWA 存储，收藏唯一的退路就是跟着备份导出走。\r\n  'fav.title': '收藏地点',\r\n  'fav.count': '共 {count} 条',\r\n  'fav.hint': '收藏只存本机，不上传；导出备份时会一起带走，导入备份时会一起回来。',\r\n  'fav.empty': '还没有收藏地点。到「此刻」页点标题下的收藏按钮，把当前地点存到这里 —— 收藏会随备份一起导出，换手机时导入那份 JSON 就能原样恢复。',\r\n  // 按钮两态（☆ / ★ 是图标，文案本身走 i18n）\r\n  'fav.add': '收藏此地',\r\n  'fav.added': '已收藏',\r\n  // 点完的短暂反馈：add 那条顺手把「备份时会带上」说清楚，替空态文案再讲一次\r\n  'fav.addedHint': '已收藏 · 导出备份时会带上它',\r\n  'fav.removedHint': '已取消收藏',\r\n  'fav.delete': '删除',\r\n  'fav.deleteOf': '删除收藏：{name}',\r\n  'fav.go': '查看此刻天气',\r\n  'fav.unnamed': '未命名地点',\r\n\r\n  // ---------- 多地点对比 ----------\r\n  // 对比页从「我的」页进（不进底部 tabbar：tabbar 在 320px 屏上已经贴着临界点，\r\n  // 再加一项会把四个 tab 挤到换行 —— 那是个真机上真实发生过的 bug）。\r\n  // 口径规矩：每个地点**单独**取一次数（网络一次只发一个请求），取不到的那个\r\n  // 单独标失败、指标留占位符「—」，绝不拿别处的数据填进来。\r\n  'compare.title': '多地点对比',\r\n  'compare.subtitle': '把收藏地点的同一批指标逐个列出来，一个地点一张卡，同一行的指标可以直接对读',\r\n  'compare.entry': '对比收藏地点',\r\n  'compare.entryBtn': '开始对比',\r\n  'compare.hint': '每个地点要单独取一次数，而网络一次只发一个请求 —— 收藏越多，等得越久。',\r\n  'compare.current': '当前收藏 {count} 条',\r\n  'compare.needFav': '先收藏地点：到「此刻」页点标题下的收藏按钮，把想对比的地方存起来，再回来。',\r\n  'compare.maxNote': '收藏超过 {max} 条，本次只对比前 {max} 条。想对比别的，先到上面把不看的删掉。',\r\n  'compare.summary': '共 {total} 个地点 · 已取到 {ok} 个 · 失败 {failed} 个',\r\n  'compare.summaryRunning': '共 {total} 个地点 · 正在取第 {done} 个…',\r\n  'compare.offline': '设备离线，未发起请求',\r\n  'compare.allFailed': '这 {total} 个地点一个都没取到数据。可能是网络不通或数据源暂时不可用 —— 不是这些地点没有天气。',\r\n  'compare.rowFailed': '这个地点没取到数据：{reason}',\r\n  'compare.loading': '正在取数…',\r\n  'compare.refresh': '刷新',\r\n  'compare.back': '返回「我的」',\r\n\r\n  // ---------- 设置 / 我的 ----------\r\n  'settings.title': '我的 · 设置',\r\n  'settings.subtitle': '备份搬家与外观：整机数据不出设备，导出与导入都在本机完成。',\r\n\r\n  'settings.exportTitle': '备份导出',\r\n  'settings.exportBtn': '导出备份文件',\r\n  'settings.exportCurrent': '当前可导出：默认地点 {place} · 收藏 {count} 条 · 天气快照 {snapshot}',\r\n  'settings.snapshotYes': '已保存',\r\n  'settings.snapshotNo': '暂无',\r\n  'settings.exportDone': '已导出 {name}',\r\n  'settings.exportFail': '导出失败：本机浏览器不支持文件下载',\r\n  // exportBackup() 的 JSDoc 明确要求：导出前必须告知用户这份文件含位置信息。\r\n  // 这句话常驻在按钮下方，不是点完才闪一下的提示 —— 用户要在按之前就知道。\r\n  //\r\n  // 有快照 / 无快照必须分开说，不能用同一句含糊带过：快照里嵌着**最近一次定位坐标**\r\n  // （经纬度，能精确到社区）以及四条同样含经纬度的数据源请求链接 —— 这比 defaultPlace\r\n  // 敏感一个量级（defaultPlace 通常是出厂默认值「北京·天安门」，根本不是用户的真实位置）。\r\n  // 2026-10-12 用真机导出的第一份备份核对后发现原文案只说「最近一次天气快照」，\r\n  // 把最敏感的一项藏在了最不起眼的四个字里。\r\n  'settings.backupPrivacy': '这份文件含你的位置信息：默认地点、{count} 个收藏地点，以及最近一次定位坐标（经纬度，能精确到社区）和当时取到的天气、空气数据 —— 数据源链接里也嵌着同一串经纬度。导出不联网、不上传，文件只存到你选择的位置；别把它随手发给别人。',\r\n  'settings.backupPrivacyNoSnap': '这份文件含你的位置信息：默认地点与 {count} 个收藏地点。本次没有天气快照，所以不含定位坐标。导出不联网、不上传，文件只存到你选择的位置；别把它随手发给别人。',\r\n\r\n  'settings.importTitle': '备份导入',\r\n  'settings.importHint': '选择 geoscope-backup-*.json。先看清楚内容再决定 —— 确认后会覆盖本机的默认地点、收藏与最近一次定位坐标。',\r\n  'settings.importPick': '选择备份文件',\r\n  'settings.importReady': '已读取 {name}，内容如下。本机数据此刻还没动。',\r\n  'settings.pickFirst': '请先选择一个备份文件。',\r\n  'settings.previewTitle': '这份备份的内容',\r\n  'settings.previewExportedAt': '导出时间：{time}',\r\n  'settings.previewPlace': '默认地点：{name}',\r\n  'settings.previewFavorites': '收藏地点：{count} 条',\r\n  'settings.previewDropped': '其中 {count} 条不会被导入：坐标非法、与前面的重复，或超出 200 条上限。',\r\n  'settings.previewNoPlace': '未命名地点',\r\n  'settings.confirmBtn': '确认导入',\r\n  'settings.confirmHint': '这一步才会写入本机，并把上面的内容覆盖到当前数据。',\r\n  'settings.importOk': '导入完成：默认地点 {name} · 收藏 {count} 条',\r\n  'settings.importFail': '导入失败：{reason}',\r\n  'settings.readFail': '读取文件失败：{message}',\r\n  'settings.readEmpty': '文件内容是空的，可能不是文本格式的备份文件。',\r\n\r\n  'settings.themeTitle': '主题',\r\n  'settings.themeHint': '跟随系统＝由系统的深浅色设置决定；手动指定后会一直保持，直到你改回来。',\r\n  'settings.theme.system': '跟随系统',\r\n  'settings.theme.light': '浅色',\r\n  'settings.theme.dark': '深色',\r\n  'settings.themeDone': '主题已切换为「{mode}」',\r\n\r\n  // ---------- 无障碍字号三档 ----------\r\n  // 三档只改「乘数」（styles/tokens.css 的 --fs-scale），不动任何色值、不动 --sp-* 间距。\r\n  // 英雄区那个大温度刻意放得比正文慢（--fs-hero-scale）—— 它本来就是正文的 4 倍，\r\n  // 再按 1.3 放大会把窄屏挤坏。这句话要如实讲给用户听，别含糊成「放大全部文字」。\r\n  'settings.fontTitle': '字号',\r\n  'settings.fontHint': '三档放大全站文字。那个大号温度放得慢一些：它本来就是正文的四倍，跟着一起放大会把窄屏挤坏。',\r\n  'settings.font.normal': '默认',\r\n  'settings.font.large': '大',\r\n  'settings.font.xlarge': '特大',\r\n  'settings.fontDone': '字号已切换为「{mode}」',\r\n\r\n  // ---------- 导出 CSV ----------\r\n  // 口径（与备份 JSON 那条隐私说明同一套规矩）：导出前就说清楚导的是什么、缺的项怎么表示。\r\n  // 特别注意「缺的项留空，不填 0」—— 本项目界面上缺失一律显示占位符「—」，但 CSV 里写\r\n  // 「—」会让 Excel 把整列判成文本列，数字列就废了；留空才是表格里「没有数据」的语义。\r\n  'settings.csvTitle': '导出 CSV',\r\n  'settings.csvHint': '把最近一次「此刻」数据导出成表格。UTF-8 带 BOM，Excel 直接打开不乱码；每一行一个时刻，缺的项留空（不填 0）。',\r\n  'settings.csvBtn': '导出 CSV 文件',\r\n  'settings.csvCurrent': '当前可导出：{time} · {place}',\r\n  'settings.csvNone': '当前可导出：暂无数据',\r\n  'settings.csvEmpty': '还没有可导出的数据 —— 先去「此刻」页取一次，它会自动存一份到本机。',\r\n  'settings.csvDone': '已导出 {name}',\r\n  'settings.csvFail': '导出失败：本机浏览器不支持文件下载',\r\n  'settings.csvNoSnapshot': '暂无快照可导出',\r\n\r\n  // CSV 表头（core/csv.js 消费）：每一列都对应界面上一个数字，不许出现界面上没有的量。\r\n  // 时间两列特意标出时区：导出时间跟文件名一样是设备本地时间，观测时刻是被查询\r\n  // 地点的当地时间。查异地时这两列本来就不一样，不明写会被当成 bug。\r\n  'csv.h.exportedAt': '导出时间（本机）',\r\n  'csv.h.observedAt': '观测时刻（当地）',\r\n  'csv.h.place': '地点',\r\n  'csv.h.lat': '纬度（度）',\r\n  'csv.h.lon': '经度（度）',\r\n  'csv.h.elevation': '海拔（m）',\r\n  'csv.h.temp': '气温（°C）',\r\n  'csv.h.feels': '体感（°C）',\r\n  'csv.h.humidity': '湿度（%）',\r\n  'csv.h.precip': '降水（mm）',\r\n  'csv.h.windSpeed': '风速（m/s）',\r\n  'csv.h.windDir': '风向',\r\n  'csv.h.beaufort': '蒲福风级',\r\n  'csv.h.pressure': '气压（hPa）',\r\n  'csv.h.visibility': '能见度（m）',\r\n  'csv.h.weather': '天气现象',\r\n  'csv.h.wmoCode': '天气码',\r\n  'csv.h.sunrise': '日出',\r\n  'csv.h.sunset': '日落',\r\n  'csv.h.dayLength': '昼长（分）',\r\n  'csv.h.uv': '紫外线指数',\r\n  'csv.h.uvLevel': '紫外线档位',\r\n  'csv.h.todayMax': '今日最高（°C）',\r\n  'csv.h.todayMin': '今日最低（°C）',\r\n  'csv.h.aqi': '欧洲 AQI',\r\n  'csv.h.aqiLevel': 'AQI 档位',\r\n  'csv.h.pm10': 'PM10（µg/m³）',\r\n  'csv.h.pm25': 'PM2.5（µg/m³）',\r\n  'csv.h.ozone': '臭氧（µg/m³）',\r\n  'csv.h.no2': '二氧化氮（µg/m³）',\r\n  'csv.h.declination': '磁偏角（度，东偏为正）',\r\n  'csv.h.sources': '数据来源',\r\n\r\n  // ---------- 图例与指标释义 ----------\r\n  // 「指标释义」是此刻页底部一个可展开的面板，把界面上那些专业数字讲成人话。\r\n  // ★阈值纪律（改这段文案前必须知道）：下面凡是出现**分档数字**的，全部由\r\n  //   src/ui/legend.js 从 src/core/wmo.js 的既有换算表**读出来**再拼进占位符，\r\n  //   这里一个阈值都不写死 —— 抄死数字等于将来改了换算表图例还在说谎。\r\n  //   代码里找不到现成分档的指标（气温 / 湿度 / 气压 / 能见度 / 污染物浓度 / 海拔 /\r\n  //   坐标 / 时区），一律只写「是什么 + 单位」，并如实标注 legend.noScale。\r\n  'legend.title': '指标释义',\r\n  'legend.open': '展开指标释义',\r\n  'legend.close': '收起指标释义',\r\n  'legend.note': '下面每一条对应界面上一个数字。分档只列本应用「已经实现」的那几套（蒲福风级、欧洲 AQI、UV 五档、风向 16 方位）；其余指标只说明含义与单位，不另立标准。',\r\n  'legend.noScale': '本应用没有对这项设分档，只显示数值与单位。',\r\n\r\n  'legend.group.weather': '天气',\r\n  'legend.group.air': '空气',\r\n  'legend.group.place': '位置与时间',\r\n\r\n  'legend.temp.title': '气温',\r\n  'legend.temp.unit': '°C',\r\n  'legend.temp.body': '离地 2 米高处的气温，取自数据源的 temperature_2m。',\r\n\r\n  'legend.feels.title': '体感温度',\r\n  'legend.feels.unit': '°C',\r\n  'legend.feels.body': '数据源给出的体感温度（apparent_temperature）：在气温之外还把风与湿度的影响算了进去。它是算出来的，不是另测一个数 —— 夏天比气温高、冬天比气温低都属正常。',\r\n\r\n  'legend.humidity.title': '相对湿度',\r\n  'legend.humidity.unit': '%',\r\n  'legend.humidity.body': '空气中实际水汽压与同温度下饱和水汽压之比（relative_humidity_2m）。100% 表示已饱和，此时容易起雾或结露。',\r\n\r\n  'legend.precip.title': '降水量',\r\n  'legend.precip.unit': 'mm',\r\n  'legend.precip.body': '当前时次累计的降水量（precipitation），单位毫米。这是「下了多少」，不是「会不会下」—— 会不会下看下面那条降水概率。',\r\n\r\n  'legend.pop.title': '降水概率',\r\n  'legend.pop.unit': '%',\r\n  'legend.pop.body': '当前这一小时出现降水的概率（precipitation_probability），单位百分比。它是**逐时**量，界面显示的是与「观测时刻」对上的那一小时。取不到时显示占位符「—」，不按 0% 显示 —— 0% 是「确定不下」，与「不知道」不是一回事。',\r\n\r\n  'legend.wind.title': '风速',\r\n  'legend.wind.unit': 'm/s',\r\n  'legend.wind.body': '离地 10 米处的风速（wind_speed_10m），单位米每秒；界面同时给出公里每小时换算（1 m/s = 3.6 km/h）。',\r\n\r\n  'legend.beaufort.title': '蒲福风级',\r\n  'legend.beaufort.unit': '级',\r\n  'legend.beaufort.body': '把风速分成 0–12 级，界面上「清风（4 级）」就是这么来的。级名与阈值取自本应用的换算表：',\r\n  'legend.beaufort.row': '{level} 级 · {name} · 小于 {max} m/s',\r\n  'legend.beaufort.rowLast': '{level} 级 · {name} · {min} m/s 及以上',\r\n\r\n  'legend.winddir.title': '风向',\r\n  'legend.winddir.unit': '°',\r\n  'legend.winddir.body': '风的**来向**（wind_direction_10m），按每 22.5° 一段切成 16 个方位。「西北偏北风」说的是风从西北偏北吹来，不是吹向那边：',\r\n  'legend.winddir.row': '{dir}',\r\n\r\n  'legend.pressure.title': '气压',\r\n  'legend.pressure.unit': 'hPa',\r\n  'legend.pressure.body': '地面气压（surface_pressure），单位百帕。数值随海拔与天气系统起伏，单看一个绝对值意义不大。',\r\n\r\n  'legend.visibility.title': '能见度',\r\n  'legend.visibility.unit': 'm / km',\r\n  'legend.visibility.body': '水平方向能看清的最远距离（visibility）。不足 1000 米时按米显示，达到 1000 米后换算成公里并保留一位小数。',\r\n\r\n  'legend.uv.title': '紫外线指数',\r\n  'legend.uv.unit': '无量纲',\r\n  'legend.uv.body': '当天的紫外线指数最大值（uv_index_max），是个无量纲指数。五档与对应建议取自本应用既有的换算表：',\r\n  'legend.uv.row': '{min}–{max} · {name} · {advice}',\r\n  'legend.uv.rowLast': '{min} 及以上 · {name} · {advice}',\r\n\r\n  'legend.sun.title': '日出与日落',\r\n  'legend.sun.unit': '本地时刻',\r\n  'legend.sun.body': '由数据源按当地时区给出（daily.sunrise / sunset）。数据源没给时，改用本机内置的 NOAA 算法推算。',\r\n\r\n  'legend.dayLength.title': '昼长',\r\n  'legend.dayLength.unit': '时 · 分',\r\n  'legend.dayLength.body': '日落减日出，即白昼时长。极昼或极夜时数据源可能给不出这两个时刻，那一刻显示占位符「—」。',\r\n\r\n  'legend.today.title': '今日最高 / 最低',\r\n  'legend.today.unit': '°C',\r\n  'legend.today.body': '数据源给出的当日最高温与最低温（temperature_2m_max / _min）。这是**全天预报值**，不是此刻的实测值。',\r\n\r\n  'legend.wmo.title': '天气现象',\r\n  'legend.wmo.unit': 'WMO 码',\r\n  'legend.wmo.body': '图标与描述由 WMO 天气码翻译而来（0–99，例如 0 是晴、61 是小雨）。取不到码、或码非法时显示「未知天气」—— 不会把「没数据」误报成晴天。',\r\n\r\n  'legend.observedAt.title': '观测时刻',\r\n  'legend.observedAt.unit': '本地时刻',\r\n  'legend.observedAt.body': '数据源给出的当前数据时次，已按当地时间偏移换算成本地时间显示。',\r\n\r\n  'legend.aqi.title': '欧洲 AQI',\r\n  'legend.aqi.unit': '无量纲',\r\n  'legend.aqi.body': '数据源直接给出的欧洲 AQI（european_aqi）：把多种污染物折算成一个数，越小越好。本应用只负责把它分成六档，档位与建议如下：',\r\n  'legend.aqi.row': '{min}–{max} · {name} · {advice}',\r\n  'legend.aqi.rowLast': '{min} 及以上 · {name} · {advice}',\r\n\r\n  'legend.pollutants.title': 'PM2.5 / PM10 / O₃ / NO₂',\r\n  'legend.pollutants.unit': 'µg/m³',\r\n  'legend.pollutants.body': '四种污染物浓度，单位微克每立方米。本应用不对单项污染物分级 —— 分级只针对上面那个欧洲 AQI，这四项只是构成它的原料，所以这里也就不给档位。',\r\n\r\n  'legend.elevation.title': '海拔',\r\n  'legend.elevation.unit': 'm',\r\n  'legend.elevation.body': '所在地点的海拔（Open-Meteo Elevation），单位米。取不到时显示占位符「—」。',\r\n\r\n  'legend.coord.title': '坐标',\r\n  'legend.coord.unit': '度（WGS84）',\r\n  'legend.coord.body': 'WGS84 经纬度，保留四位小数（约 11 米精度）。收藏与跨页跳转都以这两个数作为地点的身份。',\r\n\r\n  'legend.tz.title': '时区偏移',\r\n  'legend.tz.unit': '秒',\r\n  'legend.tz.body': '数据源返回的「当地时区相对 UTC 的偏移」（utc_offset_seconds）。日出日落与观测时刻都是按它换算的 —— 它一变，这几个时刻会跟着变。',\r\n\r\n  // ---------- WMO 天气码 ----------\r\n  // core/wmo.js 的 wmo(code) 只返回 `{ key, shortKey, icon }`，**不给中文串** ——\r\n  // core 层不许读 locale 表。这 28 组 key 由 UI 层 t() 之后才变成人话。\r\n  // 分 full / short 两档：short 用在窄处（英雄区副行、对比页），full 用在图例与表格。\r\n  'wmo.0': '晴',\r\n  'wmo.0.short': '晴',\r\n  'wmo.1': '大部晴朗',\r\n  'wmo.1.short': '晴间少云',\r\n  'wmo.2': '局部多云',\r\n  'wmo.2.short': '多云',\r\n  'wmo.3': '阴',\r\n  'wmo.3.short': '阴',\r\n  'wmo.45': '雾',\r\n  'wmo.45.short': '雾',\r\n  'wmo.48': '沉积雾凇雾',\r\n  'wmo.48.short': '雾凇',\r\n  'wmo.51': '小毛毛雨',\r\n  'wmo.51.short': '毛毛雨',\r\n  'wmo.53': '中毛毛雨',\r\n  'wmo.53.short': '毛毛雨',\r\n  'wmo.55': '大毛毛雨',\r\n  'wmo.55.short': '毛毛雨',\r\n  'wmo.56': '冻毛毛雨（弱）',\r\n  'wmo.56.short': '冻毛毛雨',\r\n  'wmo.57': '冻毛毛雨（强）',\r\n  'wmo.57.short': '冻毛毛雨',\r\n  'wmo.61': '小雨',\r\n  'wmo.61.short': '小雨',   "src/i18n/en.js": "/**\r\n * 英文文案表（i18n 的一份表，不是入口）\r\n *\r\n * ★与 src/i18n/zh.js **逐键同构**：tools/check.mjs 第 14 节双向校验两张表的 key 集合\r\n *   完全相等 —— 多一个、少一个都报红。新增 key 必须两张表一起加。\r\n *\r\n * 翻译纪律（不是机翻，改文案前请读）：\r\n *   1) **整句翻译，不拼片段**。中英语序不同（「体感 26°」 vs \"Feels like 26°\"、\r\n *      「3 分钟前」 vs \"3 min ago\"），占位符只用来插数字 / 地名 / 方位名这类**值**，\r\n *      绝不把一句话拆成几段再拼回去。\r\n *   2) **单位与数值口径不变**：界面一律公制（°C / m/s / hPa / km），英文版同样用公制 ——\r\n *      数据源给的就是公制，换成英里只会引入换算错误。\r\n *   3) **如实，不夸大**。中文版写着「本应用没有对这项设分档」的地方，英文版一样要写；\r\n *      中文版区分「失败」与「没有这个地方」的地方，英文版也必须分成两句。\r\n *   4) 地名、数据源名、缩写（WMO / AQI / UV / WGS84 / PM2.5）保留原样，不翻译。\r\n */\r\n\r\n/** 英文文案表：扁平 key → 字符串。 */\r\nexport const EN = {\r\n  // ---------- General ----------\r\n  'app.name': 'GeoScope',\r\n  'app.tagline': 'Here · Now',\r\n  'app.loading': 'Loading…',\r\n  'app.retry': 'Retry',\r\n  'app.refresh': 'Refresh',\r\n  'app.unknown': 'Unknown',\r\n  'app.dash': '—',\r\n  'app.na': 'None yet',\r\n  'app.about': 'About & limits',\r\n  'app.copy': 'Copy',\r\n\r\n  // ---------- Tabs ----------\r\n  'tab.now': 'Now',\r\n  'tab.selfcheck': 'Check',\r\n  'tab.compass': 'Bearing',\r\n  'tab.settings': 'Me',\r\n\r\n  // ---------- Data sources ----------\r\n  'source.weather': 'Weather (Open-Meteo Forecast)',\r\n  'source.air': 'Air quality (Open-Meteo Air Quality)',\r\n  'source.geocode': 'Place search (Open-Meteo Geocoding)',\r\n  'source.elevation': 'Elevation (Open-Meteo Elevation)',\r\n  'source.reverse': 'Reverse geocoding (Photon)',\r\n  'source.tile': 'Basemap tiles (ArcGIS Online)',\r\n\r\n  // ---------- Status words ----------\r\n  'status.idle': 'Not requested',\r\n  'status.ok': 'OK',\r\n  'status.stale': 'Stale',\r\n  'status.degraded': 'Degraded',\r\n  'status.failed': 'Failed',\r\n  'status.offline': 'Offline',\r\n  'status.running': 'Running',\r\n\r\n  // ---------- Error codes ----------\r\n  'error.OFFLINE': 'Device is offline, no request was made',\r\n  'error.TIMEOUT': 'Request timed out (no response within {ms} ms)',\r\n  'error.HTTP': 'Data source returned HTTP {status}',\r\n  'error.NETWORK': 'Network unreachable, request could not complete',\r\n  'error.PARSE': 'Failed to parse the response (unexpected data format)',\r\n  'error.ABORT': 'Request was cancelled',\r\n  'error.EMPTY': 'Empty response (the source returned nothing)',\r\n  'error.UNSUPPORTED': 'Unregistered source or unsupported capability',\r\n\r\n  // ---------- Overall degraded modes ----------\r\n  'mode.live': 'Live data',\r\n  'mode.stale': 'Some data is stale, showing the last usable result',\r\n  'mode.partial': 'Some sources are unavailable, the rest is fine',\r\n  'mode.offline': 'Device is offline, showing on-device cache',\r\n  'mode.no-map': 'Basemap unavailable, switched to coordinates-only mode',\r\n  // grid only ever appears in the banner: all five APIs are fine, it is just that a few\r\n  // tiles are missing and the basemap fell back to a grid. Must NOT reuse mode.partial —\r\n  // \"the rest is fine\" would be a lie here (the data is fine, the basemap is what broke),\r\n  // and it would make the reader think weather / air broke too.\r\n  'mode.grid': 'Some tiles missing · fell back to grid',\r\n  'mode.empty': 'No data available',\r\n\r\n  // ---------- Now screen ----------\r\n  'now.title': 'Now',\r\n  'now.defaultPlaceNotice': 'No location fix, showing the default place',\r\n  'now.locating': 'Getting your location…',\r\n  'now.gpsOk': 'Location acquired',\r\n  'now.updatedAt': 'Updated {time}',\r\n  'now.staleNote': 'Data from {ago}, it may be out of date',\r\n  'now.observeAt': 'Observed at {time}',\r\n\r\n  'card.weather': 'Weather',\r\n  'card.air': 'Air',\r\n  'card.place': 'Place',\r\n  'card.provenance': 'Sources',\r\n  'card.forecast': 'Today & next days',\r\n\r\n  'w.temp': 'Temperature',\r\n  'w.feels': 'Feels like',\r\n  'w.humidity': 'Humidity',\r\n  // ★\"Precipitation\" and \"Chance of rain\" are two different quantities and the two labels\r\n  // must each say so: one is millimetres, the other a percentage. Writing both as \"Rain\"\r\n  // makes the reader think it is one number phrased two ways.\r\n  'w.precip': 'Precipitation',\r\n  'w.pop': 'Chance of rain',\r\n  'w.wind': 'Wind',\r\n  'w.pressure': 'Pressure',\r\n  'w.visibility': 'Visibility',\r\n  'w.sunrise': 'Sunrise',\r\n  'w.sunset': 'Sunset',\r\n  'w.dayLength': 'Day length',\r\n  'w.uv': 'UV index',\r\n  'w.elevation': 'Elevation',\r\n  'w.coord': 'Coordinates (WGS84)',\r\n  'w.air': 'European AQI',\r\n  'w.pm10': 'PM10',\r\n  'w.pm25': 'PM2.5',\r\n  'w.ozone': 'Ozone O₃',\r\n  'w.no2': 'Nitrogen dioxide NO₂',\r\n  'w.latency': 'Latency',\r\n  'w.beaufortLevel': '{name} (force {level})',\r\n  'w.unitC': '°C',\r\n  'w.aqiAdvice': '{level} · {advice}',\r\n  'w.noMap': 'Map off, coordinates-only mode',\r\n  'w.todayMax': \"Today's high\",\r\n  'w.todayMin': \"Today's low\",\r\n  'w.daylight': 'Daylight',\r\n  'w.night': 'Night',\r\n\r\n  // ---------- UV / AQI advice ----------\r\n  'uv.low.advice': 'No protection needed',\r\n  'uv.moderate.advice': 'Wear a hat if you stay out long',\r\n  'uv.high.advice': 'Use sunscreen and seek shade',\r\n  'uv.very-high.advice': 'Avoid being outdoors at midday',\r\n  'uv.extreme.advice': 'Full protection essential',\r\n  'aqi.good.advice': 'Air quality is satisfactory',\r\n  'aqi.fair.advice': 'Normal activity is fine',\r\n  'aqi.moderate.advice': 'Sensitive groups should cut back on intense outdoor exercise',\r\n  'aqi.poor.advice': 'Consider reducing time outdoors',\r\n  'aqi.very-poor.advice': 'Sensitive groups should stay indoors',\r\n  'aqi.extreme.advice': 'Avoid going out; wear a mask if you must',\r\n\r\n  // ---------- Place search ----------\r\n  // Search is the only way to \"look somewhere else\": without it the user can only see\r\n  // where they stand (GPS) or places already favourited.\r\n  // ★'search.failed' and 'search.empty' must stay TWO DIFFERENT sentences: collapsing them\r\n  // into one \"not found\" disguises a timeout / offline state as \"this place doesn't exist\".\r\n  'search.open': 'Search places',\r\n  'search.close': 'Close search',\r\n  'search.placeholder': 'Type a city or place',\r\n  'search.minChars': 'Type at least {n} characters',\r\n  'search.loading': 'Searching…',\r\n  'search.empty': 'No such place found',\r\n  'search.failed': 'Search failed — this is not \"no such place\"',\r\n  'search.unnamed': '(unnamed)',\r\n\r\n  // ---------- Self-check ----------\r\n  'sc.title': 'Source self-check',\r\n  'sc.subtitle': 'On-device re-check: samples each source serially, tiles judged by fingerprint de-duplication',\r\n  'sc.networkType': 'Network type',\r\n  'sc.networkType.hint': 'Browsers do not expose the real network type, pick one manually',\r\n  'sc.net.wifi': 'WiFi',\r\n  'sc.net.cellular': 'Cellular',\r\n  'sc.net.unknown': 'Unknown',\r\n  'sc.samples': 'Samples',\r\n  'sc.run': 'Start check',\r\n  'sc.running': 'Check running…',\r\n  'sc.export': 'Export JSON',\r\n  'sc.copy': 'Copy result',\r\n  'sc.copyOk': 'Copied to clipboard, ready to paste',\r\n  'sc.copyFail': 'Copy failed; the JSON is shown in the log area, long-press to select all',\r\n  'sc.copyCompact': 'Copy compact',\r\n  'sc.copyCompactOk': 'Copied compact version (~1.5 KB, long URLs and UA stripped), ready to paste',\r\n  'sc.copyCompactFail': 'Copy failed; the compact JSON is shown in the log area, long-press to select all',\r\n  'sc.sources': 'Sources',\r\n  'sc.tiles': 'Tile fingerprints',\r\n  'sc.log': 'Log',\r\n  'sc.summary.pass': '{pass}/{total} passed',\r\n  'sc.verdict.all-ok': 'All sources available',\r\n  'sc.verdict.partial': 'Some sources unavailable',\r\n  'sc.verdict.offline': 'Device is offline, no request was made',\r\n  'sc.ms': '{ms} ms',\r\n  'sc.latencyRange': 'Latency {min}–{max} ms',\r\n  'sc.latencyP50': 'P50 {ms} ms',\r\n  'sc.latencyAvg': 'Avg {ms} ms',\r\n  'sc.httpStatus': 'HTTP {status}',\r\n  'sc.bytes': '{bytes} B',\r\n  'sc.fp': 'Fingerprint fp',\r\n  'sc.fpShort': 'fp',\r\n  'sc.fpAlgo': 'Algorithm {algo}',\r\n  'sc.dedupeReal': 'Verdict: real ({styles} basemap styles each have distinct fingerprints — genuine tiles)',\r\n  'sc.dedupeFake': 'Verdict: fake (within each of the {styles} styles the fingerprints are all identical — likely placeholders)',\r\n  'sc.dedupeUnknown': 'Verdict: unknown (styles disagree or too few samples, {unique}/{total})',\r\n  'sc.dedupeByStyle': '{label}: {unique}/{total} → {verdict}',\r\n  'sc.mapMode': 'Basemap mode: {mode}',\r\n  'sc.mapMode.map': 'Basemap available',\r\n  'sc.mapMode.grid': 'Grid + coordinates only (some tiles failed, has not declared \"no map\")',\r\n  'sc.mapMode.no-map': 'Coordinates only (basemap unavailable)',\r\n  'sc.warmup': '1 warm-up sample (not counted)',\r\n  'sc.sampleDone': 'Sample {i}/{n} done',\r\n  'sc.exportName': 'geoscope-selfcheck-{stamp}.json',\r\n  'sc.exportFail': 'Export failed: this browser does not support file download',\r\n  'sc.offlineSkip': 'Device is offline, the check made no requests',\r\n  'sc.tileOk': '{label} · {ms} ms · {bytes} B',\r\n  'sc.tileFail': '{label} · failed · {message}',\r\n  'sc.effectiveType': 'effectiveType: {value}',\r\n  'sc.downlink': 'downlink: {value} Mb/s',\r\n  'sc.userAgent': 'UA: {value}',\r\n\r\n  // ---------- Bearing screen (WMM2025 declination + compass) ----------\r\n  // Wording rule: state \"the value the model computes\" and \"the model's validity window\",\r\n  // and NOTHING about accuracy. The WMM COF carries no error model and this module exports\r\n  // no uncertainty field, so \"±X° error\" would be invented.\r\n  'compass.title': 'Bearing · Magnetic declination',\r\n  'compass.subtitle': 'Computed on device: WMM2025 geomagnetic model, no network',\r\n  'compass.na': 'Not available',\r\n  'compass.unavailable': 'Declination not available ({reason})',\r\n  'compass.defaultPlaceNotice': 'No location fix, showing the default place',\r\n  'compass.altitudeUnknown': 'Elevation unknown, using ne',\r\n  'map.credit': 'Basemap attribution',\r\n  'map.skeletonNote': 'Tiles not in yet · skeleton first',\r\n\r\n  // ---------- About & limits ----------\r\n  'about.title': 'About & limits',\r\n  'about.noCommercial': 'Not commercial: a personal tool. No ads, no third-party tracking, no accounts, no backend.',\r\n  'about.noE2ee': 'No end-to-end encrypted sync: data lives only in this device\\'s localStorage; moving it means exporting JSON.',\r\n  'about.noAlert': 'No alerting data source bought: push alerts are out of scope for this stage.',\r\n  'about.privacy': 'Apart from the six data sources, this app contacts no other domain; your coordinates are not uploaded anywhere beyond those sources.',\r\n\r\n  // ---------- Favorites ----------\r\n  // A favourite is a PLACE, not a weather snapshot: it stores a name + lat/lon only.\r\n  // The empty state must spell out the \"favourite → backup\" link — that link is the reason\r\n  // favourites exist at all: data is local only, iOS can wipe PWA storage, and the backup\r\n  // export is the one way out.\r\n  'fav.title': 'Saved places',\r\n  'fav.count': '{count} saved',\r\n  'fav.hint': 'Saved places stay on this device and are never uploaded; they travel with a backup export and come back with an import.',\r\n  'fav.empty': 'No saved places yet. On the Now screen, tap the star under the title to save the place you are looking at — saved places go out with your backup, and importing that JSON on a new phone restores them as they were.',\r\n  // Button states (☆ / ★ are icons; the words themselves go through i18n)\r\n  'fav.add': 'Save this place',\r\n  'fav.added': 'Saved',\r\n  // Short feedback after the tap; the \"add\" one repeats that a backup will carry it.\r\n  'fav.addedHint': 'Saved · it will be included in your backup export',\r\n  'fav.removedHint': 'Removed from saved places',\r\n  'fav.delete': 'Delete',\r\n  'fav.deleteOf': 'Delete saved place: {name}',\r\n  'fav.go': 'See weather now',\r\n  'fav.unnamed': 'Unnamed place',\r\n\r\n  // ---------- Multi-place compare ----------\r\n  // Entered from the Me screen (it is not a tab: the bottom bar is already at its limit on a\r\n  // 320 px screen, a fifth item would push the four tabs onto two lines — a real bug seen on\r\n  // a real device).\r\n  // Rule: each place is fetched SEPARATELY (one request at a time). A place that fails is\r\n  // marked failed on its own with \"—\" placeholders; data from elsewhere is never substituted.\r\n  'compare.title': 'Compare places',\r\n  'compare.subtitle': 'The same set of readings for each saved place, one card per place — read across a row to compare',\r\n  'compare.entry': 'Compare saved places',\r\n  'compare.entryBtn': 'Start comparison',\r\n  'compare.hint': 'Every place needs its own request, and only one request goes out at a time — the more places you save, the longer you wait.',\r\n  'compare.current': '{count} saved now',\r\n  'compare.needFav': 'Save some places first: on the Now screen tap the star under the title, store the places you want to compare, then come back.',\r\n  'compare.maxNote': 'You have more than {max} saved places; only the first {max} are compared. To compare others, delete the ones you do not need above.',\r\n  'compare.summary': '{total} places · {ok} fetched · {failed} failed',\r\n  'compare.summaryRunning': '{total} places · fetching number {done}…',\r\n  'compare.offline': 'Device is offline, no request was made',\r\n  'compare.allFailed': 'Not one of these {total} places returned data. The network may be down or a source may be temporarily unavailable — it does not mean these places have no weather.',\r\n  'compare.rowFailed': 'No data for this place: {reason}',\r\n  'compare.loading': 'Fetching…',\r\n  'compare.refresh': 'Refresh',\r\n  'compare.back': 'Back to Me',\r\n\r\n  // ---------- Settings / Me ----------\r\n  'settings.title': 'Me · Settings',\r\n  'settings.subtitle': 'Backup and appearance: nothing leaves this device, both export and import happen locally.',\r\n\r\n  'settings.exportTitle': 'Export backup',\r\n  'settings.exportBtn': 'Export backup file',\r\n  'settings.exportCurrent': 'Ready to export: default place {place} · {count} saved places · weather snapshot {snapshot}',\r\n  'settings.snapshotYes': 'Saved',\r\n  'settings.snapshotNo': 'None',\r\n  'settings.exportDone': 'Exported {name}',\r\n  'settings.exportFail': 'Export failed: this browser does not support file download',\r\n  // exportBackup()'s JSDoc requires telling the user up front that the file carries location.\r\n  // This line sits under the button permanently, it is not a toast that flashes after the tap —\r\n  // the user must know before pressing.\r\n  //\r\n  // \"With snapshot\" and \"without snapshot\" must be two different sentences: the snapshot\r\n  // embeds the LAST KNOWN COORDINATES (lat/lon, precise to a neighbourhood) plus four source\r\n  // request URLs that carry the same coordinates — an order of magnitude more sensitive than\r\n  // defaultPlace (which is usually the factory default and not the user's real location).\r\n  // Checked against a real exported backup on 2026-10-12: the old wording buried the most\r\n  // sensitive item inside four inconspicuous words.\r\n  'settings.backupPrivacy': 'This file contains your location: the default place, {count} saved places, and the last known coordinates (latitude/longitude, precise enough to identify a neighbourhood) plus the weather and air data fetched at that time — the source links carry that same pair of coordinates. Exporting is offline and uploads nothing; the file goes only where you choose to save it. Do not send it to people casually.',\r\n  'settings.backupPrivacyNoSnap': 'This file contains your location: the default place and {count} saved places. There is no weather snapshot this time, so it carries no coordinates. Exporting is offline and uploads nothing; the file goes only where you choose to save it. Do not send it to people casually.',\r\n\r\n  'settings.importTitle': 'Import backup',\r\n  'settings.importHint': 'Pick a geoscope-backup-*.json. Read what is inside before you decide — confirming overwrites this device\\'s default place, saved places and last known coordinates.',\r\n  'settings.importPick': 'Choose a backup file',\r\n  'settings.importReady': 'Read {name}, contents below. Nothing on this device has changed yet.',\r\n  'settings.pickFirst': 'Choose a backup file first.',\r\n  'settings.previewTitle': 'What this backup holds',\r\n  'settings.previewExportedAt': 'Exported at: {time}',\r\n  'settings.previewPlace': 'Default place: {name}',\r\n  'settings.previewFavorites': 'Saved places: {count}',\r\n  'settings.previewDropped': '{count} of them will not be imported: invalid coordinates, duplicates, or beyond the 200-place cap.',\r\n  'settings.previewNoPlace': 'Unnamed place',\r\n  'settings.confirmBtn': 'Confirm import',\r\n  'settings.confirmHint': 'This is the step that writes to this device and overwrites current data with what you see above.',\r\n  'settings.importOk': 'Import done: default place {name} · {count} saved places',\r\n  'settings.importFail': 'Import failed: {reason}',\r\n  'settings.readFail': 'Could not read the file: {message}',\r\n  'settings.readEmpty': 'The file is empty; it may not be a text-format backup.',\r\n\r\n  'settings.themeTitle': 'Theme',\r\n  'settings.themeHint': 'Follow system means your device\\'s light/dark setting decides; once you pick one manually it sticks until you change it back.',\r\n  'settings.theme.system': 'Follow system',\r\n  'settings.theme.light': 'Light',\r\n  'settings.theme.dark': 'Dark',\r\n  'settings.themeDone': 'Theme set to {mode}',\r\n\r\n  // ---------- Accessibility font scale ----------\r\n  // The three tiers only change a multiplier (--fs-scale in styles/tokens.css); no colour\r\n  // values and no --sp-* spacing are touched.\r\n  // The hero temperature deliberately scales more slowly (--fs-hero-scale): it is already\r\n  // four times body text, and scaling it equally breaks narrow screens. Say so honestly\r\n  // rather than vaguely promising \"enlarge everything\".\r\n  'settings.fontTitle': 'Text size',\r\n  'settings.fontHint': 'Three tiers enlarge text across the app. That big temperature grows more slowly: it is already four times body text, and scaling it equally would break narrow screens.',\r\n  'settings.font.normal': 'Default',\r\n  'settings.font.large': 'Large',\r\n  'settings.font.xlarge': 'Largest',\r\n  'settings.fontDone': 'Text size set to {mode}',\r\n\r\n  // ---------- Export CSV ----------\r\n  // Same rule as the backup JSON privacy note: say up front what is exported and how\r\n  // missing values are represented.\r\n  // Note in particular \"missing is blank, never 0\" — the UI shows a placeholder \"—\" but in a\r\n  // CSV that makes Excel treat the whole column as text, which kills the numeric columns;\r\n  // blank is the spreadsheet way of saying \"no data here\".\r\n  'settings.csvTitle': 'Export CSV',\r\n  'settings.csvHint': 'Export the latest Now reading as a spreadsheet. UTF-8 with BOM so Excel opens it without mojibake; one row per observation, missing values left blank (not 0).',\r\n  'settings.csvBtn': 'Export CSV file',\r\n  'settings.csvCurrent': 'Ready to export: {time} · {place}',\r\n  'settings.csvNone': 'Ready to export: no data yet',\r\n  'settings.csvEmpty': 'Nothing to export yet — open the Now screen once and it will save a snapshot to this device.',\r\n  'settings.csvDone': 'Exported {name}',\r\n  'settings.csvFail': 'Export failed: this browser does not support file download',\r\n  'settings.csvNoSnapshot': 'No snapshot to export',\r\n\r\n  // CSV headers (consumed by core/csv.js): every column maps to a number you can see on\r\n  // screen; no column may hold a quantity that is not on screen.\r\n  // The two time columns state their timezone on purpose: export time is device-local like\r\n  // the filename, observation time is local to the queried place. When you look up somewhere\r\n  // else these two legitimately differ; not saying so reads as a bug.\r\n  'csv.h.exportedAt': 'Exported at (device)',\r\n  'csv.h.observedAt': 'Observed at (local)',\r\n  'csv.h.place': 'Place',\r\n  'csv.h.lat': 'Latitude (deg)',\r\n  'csv.h.lon': 'Longitude (deg)',\r\n  'csv.h.elevation': 'Elevation (m)',\r\n  'csv.h.temp': 'Temperature (°C)',\r\n  'csv.h.feels': 'Feels like (°C)',\r\n  'csv.h.humidity': 'Humidity (%)',\r\n  'csv.h.precip': 'Precipitation (mm)',\r\n  'csv.h.windSpeed': 'Wind speed (m/s)',\r\n  'csv.h.windDir': 'Wind direction',\r\n  'csv.h.beaufort': 'Beaufort force',\r\n  'csv.h.pressure': 'Pressure (hPa)',\r\n  'csv.h.visibility': 'Visibility (m)',\r\n  'csv.h.weather': 'Conditions',\r\n  'csv.h.wmoCode': 'WMO code',\r\n  'csv.h.sunrise': 'Sunrise',\r\n  'csv.h.sunset': 'Sunset',\r\n  'csv.h.dayLength': 'Day length (min)',\r\n  'csv.h.uv': 'UV index',\r\n  'csv.h.uvLevel': 'UV band',\r\n  'csv.h.todayMax': \"Today's high (°C)\",\r\n  'csv.h.todayMin': \"Today's low (°C)\",\r\n  'csv.h.aqi': 'European AQI',\r\n  'csv.h.aqiLevel': 'AQI band',\r\n  'csv.h.pm10': 'PM10 (µg/m³)',\r\n  'csv.h.pm25': 'PM2.5 (µg/m³)',\r\n  'csv.h.ozone': 'Ozone (µg/m³)',\r\n  'csv.h.no2': 'NO₂ (µg/m³)',\r\n  'csv.h.declination': 'Declination (deg, east positive)',\r\n  'csv.h.sources': 'Data sources',\r\n\r\n  // ---------- Legend / what the numbers mean ----------\r\n  // \"What the numbers mean\" is a collapsible panel at the bottom of the Now screen that\r\n  // explains the specialist figures in plain language.\r\n  // ★Threshold discipline (read before editing): wherever a BAND NUMBER appears below it is\r\n  //   READ OUT of src/core/wmo.js's existing tables by src/ui/legend.js — no threshold is\r\n  //   hard-coded here. Copying numbers in would mean the legend silently lies the day the\r\n  //   table changes.\r\n  //   Metrics with no band in the code (temperature / humidity / pressure / visibility /\r\n  //   pollutant concentration / elevation / coordinates / timezone) state \"what it is + unit\"\r\n  //   only and are honestly marked with legend.noScale.\r\n  'legend.title': 'What the numbers mean',\r\n  'legend.open': 'Show explanations',\r\n  'legend.close': 'Hide explanations',\r\n  'legend.note': 'Each entry below matches a number on screen. Bands are listed only for the scales this app actually implements (Beaufort force, European AQI, the five UV bands, the 16-point wind rose); the rest get a description and a unit, no invented standard.',\r\n  'legend.noScale': 'This app sets no bands for this one, it shows the value and unit only.',\r\n\r\n  'legend.group.weather': 'Weather',\r\n  'legend.group.air': 'Air',\r\n  'legend.group.place': 'Place and time',\r\n\r\n  'legend.temp.title': 'Temperature',\r\n  'legend.temp.unit': '°C',\r\n  'legend.temp.body': 'Air temperature 2 m above ground, from the source\\'s temperature_2m.',\r\n\r\n  'legend.feels.title': 'Feels like',\r\n  'legend.feels.unit': '°C',\r\n  'legend.feels.body': 'The apparent temperature the source reports (apparent_temperature): it folds wind and humidity into the air temperature. It is computed, not a second measurement — higher than the air temperature in summer and lower in winter is both normal.',\r\n\r\n  'legend.humidity.title': 'Relative humidity',\r\n  'legend.humidity.unit': '%',\r\n  'legend.humidity.body': 'Actual vapour pressure as a share of the saturation vapour pressure at the same temperature (relative_humidity_2m). 100% means saturated, at which point fog or dew becomes likely.',\r\n\r\n  'legend.precip.title': 'Precipitation',\r\n  'legend.precip.unit': 'mm',\r\n  'legend.precip.body': 'Precipitation accumulated in the current hour (precipitation), in millimetres. This is how much has fallen, not whether it will — for that see the next entry.',\r\n\r\n  'legend.pop.title': 'Chance of rain',\r\n  'legend.pop.unit': '%',\r\n  'legend.pop.body': 'The probability of precipitation in the current hour (precipitation_probability), as a percentage. It is an HOURLY figure; the screen shows the hour that lines up with \"Observed at\". When it cannot be fetched the placeholder \"—\" is shown, never 0% — 0% means \"it will definitely not rain\", which is not the same as \"we do not know\".',\r\n\r\n  'legend.wind.title': 'Wind speed',\r\n  'legend.wind.unit': 'm/s',\r\n  'legend.wind.body': 'Wind speed at 10 m above ground (wind_speed_10m) in metres per second; the screen also shows the km/h conversion (1 m/s = 3.6 km/h).',\r\n\r\n  'legend.beaufort.title': 'Beaufort force',\r\n  'legend.beaufort.unit': 'force',\r\n  'legend.beaufort.body': 'Wind speed split into forces 0–12; this is where \"Moderate breeze (force 4)\" on screen comes from. Names and thresholds are read from this app\\'s own conversion table:',\r\n  'legend.beaufort.row': 'Force {level} · {name} · under {max} m/s',\r\n  'legend.beaufort.rowLast': 'Force {level} · {name} · {min} m/s and above',\r\n\r\n  'legend.winddir.title': 'Wind direction',\r\n  'legend.winddir.unit': '°',\r\n  'legend.winddir.body': 'The direction the wind comes FROM (wind_direction_10m), cut into 16 points of 22.5° each. \"North-northwest wind\" means it blows from the north-northwest, not towards it:',\r\n  'legend.winddir.row': '{dir}',\r\n\r\n  'legend.pressure.title': 'Pressure',\r\n  'legend.pressure.unit': 'hPa',\r\n  'legend.pressure.body': 'Surface pressure (surface_pressure) in hectopascals. It moves with elevation and weather systems; a single absolute value means little on its own.',\r\n\r\n  'legend.visibility.title': 'Visibility',\r\n  'legend.visibility.unit': 'm / km',\r\n  'legend.visibility.body': 'The furthest distance you can see horizontally (visibility). Below 1000 m it is shown in metres; from 1000 m up it is converted to kilometres with one decimal.',\r\n\r\n  'legend.uv.title': 'UV index',\r\n  'legend.uv.unit': 'no unit',\r\n  'legend.uv.body': 'The day\\'s maximum UV index (uv_
